let aktiverTab = "uebersicht";
// Aufgeklappte Zeilen der Eintragsliste (nur solange die App geöffnet ist)
const offeneGruppen = new Set();
let erledigteMaengelOffen = false;

const TITEL = { uebersicht: "Übersicht", wartung: "Wartung", statistik: "Statistik", vorlagen: "Vorlagen", einstellungen: "Einstellungen" };

function zeichnen() {
  document.getElementById("seitentitel").textContent = TITEL[aktiverTab];
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("aktiv", b.dataset.tab === aktiverTab));
  const bildschirme = { uebersicht: bildUebersicht, wartung: bildWartung, statistik: bildStatistik, vorlagen: bildVorlagen, einstellungen: bildEinstellungen };
  let html = ladeFehler ? '<div class="hinweis fehler">' + esc(ladeFehler) + '</div>' : "";
  if (neueVersion) {
    html += '<div class="hinweis info"><strong>Neue Version verfügbar</strong><br>Deine Daten bleiben dabei unverändert.' +
      '<br><button type="button" class="primaer" data-action="neu-laden">Neu laden</button></div>';
  }
  html += bildschirme[aktiverTab]();
  document.getElementById("inhalt").innerHTML = html;
}

// Aufklapp-Pfeil; dreht sich über aria-expanded der Schaltfläche (siehe CSS)
const CHEVRON = '<svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';

// Detailansicht (nur lesen): Liste aus [Bezeichnung, HTML-Wert]; leere Werte entfallen
function detailListe(felder) {
  return '<dl class="details">' + felder.filter(f => f[1] !== "" && f[1] !== null && f[1] !== undefined)
    .map(f => '<dt>' + f[0] + '</dt><dd>' + f[1] + '</dd>').join("") + '</dl>';
}

/* ---------- Übersicht ---------- */
function bildUebersicht() {
  const h = heute();
  let html = "";

  if (!daten.fahrrad) {
    html += '<div class="hinweis info"><strong>Willkommen!</strong><br>Bitte lege zuerst dein Fahrrad mit Startdatum und Start-Kilometerstand an.' +
      '<br><button type="button" class="primaer" data-action="fahrrad-aendern">Fahrrad anlegen</button></div>';
  }

  // Erinnerung an die Datensicherung
  const le = letzterExport();
  const exportAlter = le ? tageZwischen(le, h) : null;
  if (daten.fahrrad && (le === null || exportAlter > EXPORT_ERINNERUNG_TAGE)) {
    html += '<div class="hinweis warn"><strong>⚠️ Datensicherung fällig</strong><br>' +
      (le === null ? "Du hast noch nie gesichert." : "Letzte Sicherung vor " + tageText(exportAlter) + " (" + datumText(le) + ").") +
      ' Die Daten liegen nur auf diesem Gerät.<br><button type="button" class="primaer" data-action="sichern">Jetzt sichern</button></div>';
  }

  // Kilometerstand, nächste Wartung und offene Mängel
  html += '<div class="karte"><div class="klein">' + esc(daten.fahrrad ? daten.fahrrad.name : "Kilometerstand") + '</div>' +
    '<div class="stand-zahl">' + kmText(aktuellerKmStand()) + ' km</div>';
  const nw = naechsteWartung(h);
  if (nw) {
    html += '<div style="margin-top:8px">🔧 ' + esc(nw.art.name) + ': <span class="' + nw.klasse + '">' + esc(nw.text) + '</span>' +
      (nw.erwartet ? ' <span class="klein">(' + caKm(nw.erwartet.km) + ')</span>' : "") + '</div>';
  } else {
    html += '<div class="klein" style="margin-top:8px">🔧 Keine Wartung fällig</div>';
  }
  const anzahlMaengel = offeneMaengel().length;
  if (anzahlMaengel) {
    html += '<div class="status-orange" style="margin-top:4px">⚠️ ' + maengelText(anzahlMaengel) + '</div>';
  }
  html += '</div>';

  html += lueckenHinweis(h);

  // Schnellerfassung
  const eHeute = eintragAm(h);
  html += '<h2>Heute erfassen</h2>';
  if (eHeute) {
    html += '<div class="hinweis info">✓ Heute erfasst: <strong>' + (eHeute.km === 0 ? "keine Fahrt" : kmText(eHeute.km) + ' km') + '</strong>' +
      (eHeute.vorlage ? " (" + esc(eHeute.vorlage) + ")" : "") +
      '<br><button type="button" data-action="eintrag-ansehen" data-id="' + eHeute.id + '">Anzeigen</button></div>';
  }
  html += '<div class="schnell">';
  daten.vorlagen.forEach(v => {
    html += '<button type="button" class="primaer" data-action="vorlage-erfassen" data-id="' + v.id + '">' +
      '<span>' + esc(v.name) + '</span><span class="km">' + kmText(v.km) + ' km</span></button>';
  });
  html += '<button type="button" data-action="eintrag-neu"><span>Andere km</span><span class="km">frei eingeben</span></button>';
  html += '</div>';
  if (!daten.vorlagen.length) {
    html += '<p class="klein">Tipp: Lege unter „Vorlagen“ deine Standard-Strecken an, dann erfasst du einen Tag mit zwei Klicks.</p>';
  }

  // Summen
  const montag = montagDerWoche(h), sonntag = plusTage(montag, 6);
  html += '<h2>Summen</h2><div class="summen">' +
    kachel("Heute", summe(e => e.datum === h)) +
    kachel("Woche", summe(e => e.datum >= montag && e.datum <= sonntag)) +
    kachel("Monat", summe(e => e.datum.slice(0, 7) === h.slice(0, 7))) +
    kachel("Jahr", summe(e => e.datum.slice(0, 4) === h.slice(0, 4))) +
    '</div>';

  if (daten.fahrrad) html += jahresKarte(h);
  html += '<h2>Datensicherung</h2>' + sicherungsKarte(h);

  // Liste der Einträge, abgeschlossene Zeiträume zusammengefasst
  html += '<h2>Einträge <span class="klein">(' + daten.eintraege.length + ')</span></h2><div class="liste">';
  if (!daten.eintraege.length) html += '<div class="leer">Noch keine Einträge.</div>';
  html += zeilenHtml(gruppieren(daten.eintraege, h), 0);
  html += '</div>';
  return html;
}

// Eingestellte Fahrtage der letzten 14 Tage ohne Eintrag, je mit "Nachtragen" und "Keine Fahrt"
function lueckenHinweis(h) {
  const tage = fehlendeFahrtage(h);
  if (!tage.length) return "";
  const kurz = d => wochentag(d) + " " + kurzDatum(d);
  return '<div class="hinweis info"><strong>' + (tage.length === 1 ? "1 Fahrtag" : tage.length + " Fahrtage") + ' ohne Eintrag:</strong> ' +
    tage.map(kurz).join(", ") +
    tage.map(d => '<div class="luecke"><span>' + kurz(d) + '</span>' +
      '<button type="button" data-action="nachtragen" data-datum="' + d + '">Nachtragen</button>' +
      '<button type="button" data-action="keine-fahrt" data-datum="' + d + '">Keine Fahrt</button></div>').join("") +
    '</div>';
}
// "Keine Fahrt": Eintrag mit 0 km mit einem Tipper (mit "Rückgängig")
function keineFahrt(datum) {
  if (!istGueltigesDatum(datum) || eintragAm(datum)) return;
  mitRueckgaengig(() => daten.eintraege.push({ id: neueId(), datum, km: 0, vorlage: null, notiz: "", typ: "tag", arbeitsweg: false }),
    "Keine Fahrt am " + wochentag(datum) + " " + kurzDatum(datum));
}

function kachel(titel, km) {
  return '<div class="summe"><div class="wert">' + kmText(km) + '</div><div class="titel">' + titel + ' (km)</div></div>';
}

// Grundlage der Prognosen in einem Satz
function grundlageText(g) {
  return '<div class="klein">Grundlage: Ø ' + kmText(g.rate) + ' km pro Tag (' + datumText(g.von) + '–' + datumText(g.bis) + ')</div>';
}
function zuWenigeTageText() {
  return "Für eine Prognose sind noch zu wenige Tage erfasst (möglich ab dem " + datumText(plusTage(daten.fahrrad.startdatum, PROGNOSE_MIN_TAGE)) + ").";
}

// Laufendes Jahr: Jahresziel mit zeitanteiligem Soll, Jahresprognose
function jahresKarte(h) {
  const z = jahreszielStand(h);
  const prognose = jahresPrognose(h);
  let html = '<h2>Jahr ' + z.jahr + '</h2><div class="karte">';
  if (z.ziel) {
    const v = rund10(z.vorsprung);
    html += '<div><strong>' + kmText(z.ist) + '</strong> von ' + kmText(z.ziel) + ' km · ' + Math.round(z.anteil * 100) + ' %</div>' +
      '<div class="balken" role="progressbar" aria-label="Jahresziel" aria-valuemin="0" aria-valuemax="' + z.ziel + '" aria-valuenow="' + runden(z.ist) + '">' +
      '<div class="balken-ist" style="width:' + Math.min(100, z.anteil * 100) + '%"></div>' +
      '<div class="balken-soll" style="left:' + Math.min(100, z.soll / z.ziel * 100) + '%"></div></div>' +
      '<div class="' + (v >= 0 ? "status-gruen" : "status-orange") + '">' +
      (v > 0 ? "ca. " + kmText(v) + " km voraus" : v < 0 ? "ca. " + kmText(-v) + " km im Rückstand" : "genau im Soll") + '</div>' +
      '<div class="klein">Zeitanteiliges Soll bis heute: ' + caKm(z.soll) + '</div>';
  }
  html += '<div style="margin-top:' + (z.ziel ? 10 : 0) + 'px">';
  if (prognose === null) {
    html += '<span class="klein">Jahresprognose: ' + zuWenigeTageText() + '</span>';
  } else {
    html += 'Jahresprognose: <strong>' + caKm(prognose) + '</strong>';
    if (z.ziel) {
      const d = rund10(prognose - z.ziel);
      html += '<div class="klein">' + (d > 0 ? "ca. " + kmText(d) + " km über dem Ziel" : d < 0 ? "ca. " + kmText(-d) + " km unter dem Ziel" : "entspricht dem Ziel") + '</div>';
    }
    html += grundlageText(prognoseGrundlage(h));
  }
  html += '</div><div class="knopfreihe"><button type="button" data-action="prognose">Kilometerstand für ein Datum …</button>' +
    (z.ziel ? "" : '<button type="button" data-action="jahresziel-neu" data-jahr="' + z.jahr + '">Jahresziel festlegen</button>') +
    '</div></div>';
  return html;
}

// Kilometerstand-Prognose für ein frei wählbares Datum
function prognoseFenster() {
  fensterOeffnen('<h2>Kilometerstand für ein Datum</h2>' +
    '<label for="pg-datum">Datum</label>' +
    '<input type="date" id="pg-datum" value="' + heute().slice(0, 4) + '-12-31" data-change="prognose-datum" data-input="prognose-datum">' +
    '<div id="pg-ergebnis" style="margin-top:14px"></div>' +
    '<div class="knopfreihe"><button type="button" data-action="fenster-zu">Schließen</button></div>');
  prognoseAnzeigen();
}
function prognoseAnzeigen() {
  document.getElementById("pg-ergebnis").innerHTML = prognoseErgebnis(wert("pg-datum"), heute());
}
function prognoseErgebnis(d, h) {
  const f = daten.fahrrad;
  if (!f) return "Bitte zuerst das Fahrrad anlegen.";
  if (!istGueltigesDatum(d)) return "Bitte ein Datum wählen.";
  if (d < f.startdatum) return "Das Datum liegt vor dem Startdatum (" + datumText(f.startdatum) + ").";
  if (d <= h) {
    return '<div class="stand-zahl">' + kmText(kmStandAm(d)) + ' km</div>' +
      '<div class="klein">Tatsächlicher Kilometerstand am Ende des ' + datumText(d) + '</div>';
  }
  const g = prognoseGrundlage(h);
  if (!g) return zuWenigeTageText();
  return '<div class="stand-zahl">' + caKm(kmPrognose(d, h)) + '</div>' +
    '<div class="klein">Erwarteter Kilometerstand am Ende des ' + datumText(d) + '</div>' + grundlageText(g);
}

// "heute", "gestern" bzw. "vor 5 Tagen"
function vorText(iso, h) {
  const t = tageZwischen(iso, h);
  return t <= 0 ? "heute" : t === 1 ? "gestern" : "vor " + tageText(t);
}

// Datensicherung (Startseite und Einstellungen)
function sicherungsKarte(h) {
  const le = letzterExport();
  return '<div class="karte"><div>Letzte Sicherung: ' + (le ? datumText(le) + " (" + vorText(le, h) + ")" : "noch nie") + '</div>' +
    sicherungsErgebnisHtml() +
    '<div class="knopfreihe"><button type="button" class="primaer" data-action="sichern">Jetzt sichern</button></div></div>';
}
// Nach einer erfolgreichen Sicherung: Ergebnis und Prüfung der gespeicherten Datei
function sicherungsErgebnisHtml() {
  if (!sicherungsErgebnis) return "";
  return '<div class="hinweis info" style="margin:10px 0 0">✓ <strong>Sicherung ' + sicherungsErgebnis.wie + '</strong> – Inhalt geprüft: ' +
    inhaltText(sicherungsErgebnis.kurzinfo) +
    '<br><span class="klein">Wähle die gespeicherte Datei aus, um sie zu prüfen. Dabei wird nichts überschrieben.</span>' +
    '<br><button type="button" data-action="sicherung-pruefen">Gespeicherte Sicherung jetzt prüfen</button></div>';
}

// Zeilen der Eintragsliste; aufgeklappte Gruppen zeigen ihre Kinder eingerückt darunter
function zeilenHtml(zeilen, tiefe) {
  const einzug = ' style="padding-left:' + (16 + tiefe * 16) + 'px"';
  return zeilen.map(z => {
    if (z.art === "eintrag") return eintragsZeile(z.eintrag, einzug);
    const offen = offeneGruppen.has(z.schluessel);
    const zeitraum = z.art === "woche" ? kurzDatum(z.von) + "–" + kurzDatum(z.bis) : "";
    const unten = [zeitraum, z.anzahl === 1 ? "1 Eintrag" : z.anzahl + " Einträge"].filter(Boolean).join(" · ");
    return '<div class="zeile gruppe">' +
      '<button type="button" class="inhalt" data-action="gruppe" data-key="' + esc(z.schluessel) + '" aria-expanded="' + offen + '"' + einzug + '>' +
      CHEVRON +
      '<div class="text"><div class="titel">' + esc(z.titel) + '</div><div class="klein">' + unten + '</div></div>' +
      '<span class="zahl" style="padding-right:16px">' + kmText(z.km) + ' km</span></button></div>' +
      (offen ? zeilenHtml(z.kinder, tiefe + 1) : "");
  }).join("");
}

function eintragsZeile(e, einzug) {
  const vorStart = daten.fahrrad && e.datum < daten.fahrrad.startdatum;
  const unten = [e.vorlage, e.notiz].filter(Boolean).map(esc).join(" · ");
  const keine = e.km === 0;
  return '<div class="zeile' + (keine ? " keine-fahrt" : "") + '">' +
    '<button type="button" class="inhalt" data-action="eintrag-ansehen" data-id="' + e.id + '"' + einzug + '>' +
    '<div class="text"><div>' + wochentag(e.datum) + ', ' + datumText(e.datum) +
    (e.typ === "woche" ? '<span class="abzeichen">Woche</span>' : "") + '</div>' +
    (unten ? '<div class="klein">' + unten + '</div>' : "") +
    (vorStart ? '<div class="klein">vor dem Startdatum – zählt nicht zum Kilometerstand</div>' : "") +
    '</div><span class="zahl" style="padding-right:16px">' + (keine ? "keine Fahrt" : kmText(e.km) + ' km') + '</span></button>' +
    '</div>';
}

function gruppeUmschalten(schluessel) {
  if (offeneGruppen.has(schluessel)) offeneGruppen.delete(schluessel);
  else offeneGruppen.add(schluessel);
  zeichnen();
}

/* ---------- Eintrag: Detailansicht und Formular ---------- */

function eintragAnsicht(id, hinweis) {
  const e = daten.eintraege.find(e => e.id === id);
  if (!e) return;
  const vorStart = daten.fahrrad && e.datum < daten.fahrrad.startdatum;
  const stand = kmStandAm(e.datum);
  fensterOeffnen(
    '<h2>Eintrag' + (e.typ === "woche" ? ' <span class="abzeichen">Woche</span>' : "") + '</h2>' +
    (hinweis ? '<div class="hinweis info">' + esc(hinweis) + '</div>' : "") +
    detailListe([
      ["Datum", wochentag(e.datum) + ", " + datumText(e.datum)],
      ["Kilometer", kmText(e.km) + " km" + (e.km === 0 ? " (keine Fahrt)" : "")],
      ["Art", e.typ === "woche" ? "Importierte Wochensumme (Datum = Montag bzw. erster Fahrtag der Woche)" : "Tages-Eintrag"],
      ["Vorlage", esc(e.vorlage || "")],
      ["Arbeitsweg", e.arbeitsweg ? "ja" : ""],
      ["Notiz", esc(e.notiz)],
      ["Kilometerstand am Ende des Tages", vorStart ? "vor dem Startdatum – zählt nicht zum Kilometerstand" : stand === null ? "" : kmText(stand) + " km"]
    ]) +
    '<div class="knopfreihe"><button type="button" data-action="fenster-zu">Schließen</button>' +
    '<button type="button" class="primaer" data-action="eintrag-aendern" data-id="' + e.id + '">Ändern</button></div>'
  );
}

// Zustand des gerade geöffneten Eintrags-Formulars
let formEintrag = null; // { id | null, typ, ursprungsDatum }

// Neuer Eintrag. Gibt es für das Datum schon einen Eintrag, wird dieser angezeigt.
function eintragNeu(vorgabe) {
  const datum = vorgabe.datum || heute();
  const vorhanden = eintragAm(datum);
  if (vorhanden) {
    eintragAnsicht(vorhanden.id, "Für den " + datumText(datum) + " gibt es bereits einen Eintrag. Mit „Ändern“ kannst du ihn bearbeiten.");
  } else {
    eintragsFormular({ id: null, datum, km: vorgabe.km ?? null, vorlage: vorgabe.vorlage || null, notiz: "", typ: "tag", arbeitsweg: !!vorgabe.arbeitsweg }, "");
  }
}

function eintragsFormular(e, hinweis) {
  formEintrag = { id: e.id, typ: e.typ, ursprungsDatum: e.id ? e.datum : null };
  let optionen = '<option value="">– keine –</option>';
  let gefunden = false;
  daten.vorlagen.forEach(v => {
    const sel = v.name === e.vorlage;
    if (sel) gefunden = true;
    optionen += '<option value="' + esc(v.id) + '"' + (sel ? " selected" : "") + '>' + esc(v.name) + ' (' + kmText(v.km) + ' km)</option>';
  });
  // Vorlage wurde gelöscht oder umbenannt: Namen trotzdem behalten
  if (e.vorlage && !gefunden) {
    optionen += '<option value="__alt__" selected>' + esc(e.vorlage) + ' (Vorlage existiert nicht mehr)</option>';
  }
  formEintrag.alteVorlage = e.vorlage;

  fensterOeffnen(
    '<h2>' + (e.id ? "Eintrag bearbeiten" : "Neuer Eintrag") +
    (e.typ === "woche" ? ' <span class="abzeichen">Woche</span>' : "") + '</h2>' +
    (hinweis ? '<div class="hinweis info">' + esc(hinweis) + '</div>' : "") +
    (e.typ === "woche" ? '<div class="klein">Importierte Wochensumme – das Datum ist der Montag bzw. erste Fahrtag der Woche.</div>' : "") +
    '<label for="f-datum">Datum</label>' +
    '<input type="date" id="f-datum" value="' + e.datum + '" data-change="eintrag-datum">' +
    '<div class="feldhinweis warn" id="f-datum-hinweis"></div>' +
    '<label for="f-vorlage">Vorlage (optional)</label>' +
    '<select id="f-vorlage" data-change="eintrag-vorlage">' + optionen + '</select>' +
    (e.typ === "tag" ? '<label class="haken"><input type="checkbox" id="f-arbeitsweg"' + (e.arbeitsweg ? " checked" : "") + '>' +
      '<span>Arbeitsweg <span class="klein">(Fahrt zur Arbeit)</span></span></label>' : "") +
    '<label for="f-km">Kilometer</label>' +
    '<input type="text" id="f-km" inputmode="decimal" autocomplete="off" placeholder="z. B. 12,5" value="' + kmFeld(e.km) + '">' +
    '<label for="f-notiz">Notiz (optional)</label>' +
    '<input type="text" id="f-notiz" value="' + esc(e.notiz) + '">' +
    '<div class="knopfreihe">' +
    (e.id ? '<button type="button" data-action="eintrag-ansehen" data-id="' + e.id + '">Abbrechen</button>'
          : '<button type="button" data-action="fenster-zu">Abbrechen</button>') +
    '<button type="button" class="primaer" data-action="eintrag-speichern">Speichern</button>' +
    '</div>' +
    (e.id ? '<div class="knopfreihe"><button type="button" class="gefahr voll" data-action="eintrag-loeschen" data-id="' + e.id + '">Eintrag löschen</button></div>' : "")
  );
  datumHinweis();
}

function datumHinweis() {
  const d = wert("f-datum");
  const el = document.getElementById("f-datum-hinweis");
  el.textContent = (daten.fahrrad && d && d < daten.fahrrad.startdatum)
    ? "Dieses Datum liegt vor dem Startdatum (" + datumText(daten.fahrrad.startdatum) + ") und zählt nicht zum Kilometerstand."
    : "";
}

// Datum im Formular geändert: existiert dort schon ein Eintrag, wechseln
function eintragDatumGeaendert() {
  const d = wert("f-datum");
  const vorhanden = istGueltigesDatum(d) ? eintragAm(d) : null;
  if (vorhanden && vorhanden.id !== formEintrag.id) {
    eintragsFormular(vorhanden, "Für den " + datumText(d) + " gibt es bereits einen Eintrag. Du kannst ihn hier bearbeiten.");
    return;
  }
  datumHinweis();
}

function eintragVorlageGeaendert() {
  const v = daten.vorlagen.find(v => v.id === wert("f-vorlage"));
  if (v) {
    document.getElementById("f-km").value = kmFeld(v.km);
    const aw = document.getElementById("f-arbeitsweg");
    if (aw) aw.checked = v.arbeitsweg;
  }
}

async function eintragSpeichern() {
  const datum = wert("f-datum");
  const km = kmLesen(wert("f-km"));
  if (!istGueltigesDatum(datum)) { alert("Bitte ein gültiges Datum wählen."); return; }
  if (km === null) { alert("Bitte die Kilometer als Zahl eingeben, z. B. 12,5."); return; }
  const anderer = eintragAm(datum);
  if (anderer && anderer.id !== formEintrag.id) { alert("Für den " + datumText(datum) + " gibt es bereits einen Eintrag."); return; }

  const vw = wert("f-vorlage");
  const gewaehlt = daten.vorlagen.find(v => v.id === vw) || null;
  const vorlage = vw === "__alt__" ? formEintrag.alteVorlage : (gewaehlt ? gewaehlt.name : null);

  // Warnung: Tages-Eintrag in einer Woche, für die es schon eine Wochensumme gibt
  const neuOderVerschoben = !formEintrag.id || formEintrag.ursprungsDatum !== datum;
  if (formEintrag.typ === "tag" && neuOderVerschoben) {
    const w = wochenEintragInWoche(datum, formEintrag.id);
    if (w) {
      const mo = montagDerWoche(datum);
      const ok = await frage("In der Woche vom " + datumText(mo) + " bis " + datumText(plusTage(mo, 6)) +
        " gibt es bereits einen <strong>Wochen-Eintrag</strong> (" + kmText(w.km) + " km am " + datumText(w.datum) +
        "). Die Kilometer würden dann doppelt zählen.<br><br>Trotzdem speichern?", "Trotzdem speichern", "Abbrechen");
      if (!ok) return;
    }
  }

  const notiz = wert("f-notiz").trim();
  // Das Merkmal "Arbeitsweg" kommt wie km aus der Vorlage und lässt sich ändern
  const aw = document.getElementById("f-arbeitsweg");
  if (formEintrag.id) {
    const e = daten.eintraege.find(e => e.id === formEintrag.id);
    Object.assign(e, { datum, km, vorlage, notiz });
    if (aw) e.arbeitsweg = aw.checked;
  } else {
    daten.eintraege.push({ id: neueId(), datum, km, vorlage, notiz, typ: "tag", arbeitsweg: !!(aw && aw.checked) });
  }
  if (speichern()) {
    fensterSchliessen();
    zeichnen();
    meldung("Gespeichert: " + kmText(km) + " km");
  }
}

async function eintragLoeschen(id) {
  const e = daten.eintraege.find(e => e.id === id);
  if (!e) return;
  const ok = await frage("Eintrag vom " + datumText(e.datum) + " (" + kmText(e.km) + " km) wirklich löschen?", "Löschen", "Abbrechen", true);
  if (!ok) return;
  mitRueckgaengig(() => { daten.eintraege = daten.eintraege.filter(x => x.id !== id); }, "Eintrag gelöscht");
}

/* ---------- Wartung ---------- */
function bildWartung() {
  let html = "";
  wartungsKarten().forEach(st => {
    const art = st.art;
    html += '<div class="karte"><h3>' + esc(art.name) + '</h3>' +
      '<div class="' + st.klasse + '">' + esc(st.text) + '</div>';
    // Einmalige Wartung nach der Durchführung: nur noch "erledigt am"
    if (st.erledigt) { html += '</div>'; return; }
    if (st.erwartet) {
      html += '<div class="klein">Erwarteter Kilometerstand am ' + datumText(st.erwartet.datum) + ': ' + caKm(st.erwartet.km) + '</div>';
    }
    if (st.termin && st.regel.datum) {
      // Bei geplantem Termin zusätzlich die Fälligkeit nach Regel klein zeigen
      html += '<div class="klein">Ohne Termin: ' + esc(st.regel.text) + '</div>';
    }
    if (st.regel.restKm > 0) {
      html += '<div class="klein">' + (rund10(st.regel.restKm) > 0 ? "Noch " + caKm(st.regel.restKm) : "Weniger als 10 km") + ' bis zur km-Grenze</div>';
    }
    if (hatZeitfenster(art)) {
      html += '<div class="klein">Zeitfenster: ' + fensterText(art) + (art.gueltigAbJahr ? ", gültig ab " + art.gueltigAbJahr : "") + '</div>';
    }
    if (st.letzte) {
      html += '<div class="klein">Zuletzt: ' + datumText(st.letzte.datum) +
        (st.letzte.werkstatt ? " bei " + esc(st.letzte.werkstatt) : "") +
        (st.letzte.kmStand !== null ? " · " + kmText(st.letzte.kmStand) + " km" : "") + '</div>' +
        '<div class="klein">Seit letzter Wartung gefahren: ' + kmText(st.seitKm) + ' km</div>';
    } else if (st.regel.abStart) {
      html += '<div class="klein">Noch nicht durchgeführt – gerechnet ab dem Startdatum (' + datumText(daten.fahrrad.startdatum) +
        ', ' + kmText(daten.fahrrad.startKm) + ' km)</div>';
    } else if (!st.nochNie) {
      html += '<div class="klein">Noch nicht durchgeführt</div>';
    }
    html += '<div class="knopfreihe">' +
      '<button type="button" data-action="termin" data-id="' + esc(art.id) + '">' + (st.termin ? "Termin ändern" : "Termin planen") + '</button>' +
      '<button type="button" class="primaer" data-action="wartung-erledigt" data-id="' + esc(art.id) + '">Erledigt eintragen</button>' +
      '</div></div>';
  });

  // Mängel
  const offen = offeneMaengel();
  const erledigt = daten.maengel.filter(m => m.status === "erledigt")
    .sort((a, b) => (b.erledigtAm || b.datum).localeCompare(a.erledigtAm || a.datum));
  html += '<h2>Mängel <span class="klein">(' + offen.length + ' offen)</span></h2><div class="liste">';
  if (!offen.length) html += '<div class="leer">Keine offenen Mängel.</div>';
  offen.forEach(m => { html += mangelZeile(m); });
  html += '</div><div class="knopfreihe"><button type="button" data-action="mangel-neu">+ Mangel erfassen</button></div>';
  if (erledigt.length) {
    html += '<div class="liste" style="margin-top:12px"><div class="zeile gruppe">' +
      '<button type="button" class="inhalt" data-action="maengel-erledigt-umschalten" aria-expanded="' + erledigteMaengelOffen + '">' +
      CHEVRON +
      '<div class="text"><div class="titel">Erledigte Mängel (' + erledigt.length + ')</div></div></button></div>' +
      (erledigteMaengelOffen ? erledigt.map(mangelZeile).join("") : "") + '</div>';
  }

  // Protokoll
  const prot = [...daten.wartungsprotokoll].sort((a, b) => b.datum.localeCompare(a.datum));
  html += '<h2>Wartungsprotokoll</h2><div class="liste">';
  if (!prot.length) html += '<div class="leer">Noch keine Wartung eingetragen.</div>';
  prot.forEach(p => {
    const unten = [p.werkstatt, p.notiz].filter(Boolean).map(esc).join(" · ");
    html += '<div class="zeile">' +
      '<button type="button" class="inhalt" data-action="protokoll-ansehen" data-id="' + p.id + '">' +
      '<div class="text"><div>' + datumText(p.datum) + ' · <strong>' + esc(artName(p.wartungsartId)) + '</strong></div>' +
      (unten ? '<div class="klein">' + unten + '</div>' : "") +
      '</div><span class="zahl" style="padding-right:16px">' + (p.kmStand !== null ? kmText(p.kmStand) + ' km' : "") + '</span></button>' +
      '</div>';
  });
  html += '</div>';

  // Wartungsarten verwalten
  html += '<h2>Wartungsarten</h2><div class="liste">';
  daten.wartungsarten.forEach(a => {
    let regel;
    if (hatZeitfenster(a)) {
      regel = "Zeitfenster: " + fensterText(a) + (a.gueltigAbJahr ? ", ab " + a.gueltigAbJahr : "");
    } else {
      const iv = [a.intervallMonate ? a.intervallMonate + " Monate" : "", a.intervallKm ? kmText(a.intervallKm) + " km" : ""].filter(Boolean).join(" oder ");
      regel = iv ? "Intervall: " + iv : "ohne Intervall";
    }
    if (a.einmalig) regel = "einmalig · " + regel;
    html += '<div class="zeile"><button type="button" class="inhalt" data-action="art-bearbeiten" data-id="' + esc(a.id) + '">' +
      '<div class="text"><div>' + esc(a.name) + '</div><div class="klein">' + regel + '</div></div>' +
      '<span class="klein" style="padding-right:16px">›</span></button></div>';
  });
  html += '</div><div class="knopfreihe"><button type="button" data-action="art-neu">+ Neue Wartungsart</button></div>';
  return html;
}

function mangelZeile(m) {
  const unten = m.status === "erledigt"
    ? "erledigt" + (m.erledigtAm ? " am " + datumText(m.erledigtAm) : "")
    : "festgestellt am " + datumText(m.datum);
  return '<div class="zeile"><button type="button" class="inhalt" data-action="mangel-ansehen" data-id="' + m.id + '">' +
    '<div class="text"><div>' + esc(m.beschreibung) + '</div><div class="klein">' + unten + '</div></div>' +
    '<span class="klein" style="padding-right:16px">›</span></button></div>';
}

// Geplanter Termin
function terminFormular(artId) {
  const art = daten.wartungsarten.find(a => a.id === artId);
  const t = daten.termine.find(t => t.wartungsartId === artId);
  fensterOeffnen(
    '<h2>Termin: ' + esc(art.name) + '</h2>' +
    '<label for="t-datum">Datum</label><input type="date" id="t-datum" value="' + (t ? t.datum : "") + '">' +
    '<label for="t-werkstatt">Werkstatt</label><input type="text" id="t-werkstatt" value="' + esc(t ? t.werkstatt : "") + '">' +
    '<div class="knopfreihe"><button type="button" data-action="fenster-zu">Abbrechen</button>' +
    '<button type="button" class="primaer" data-action="termin-speichern" data-id="' + esc(artId) + '">Speichern</button></div>' +
    (t ? '<div class="knopfreihe"><button type="button" class="gefahr voll" data-action="termin-loeschen" data-id="' + esc(artId) + '">Termin entfernen</button></div>' : "")
  );
}
function terminSpeichern(artId) {
  const datum = wert("t-datum");
  if (!istGueltigesDatum(datum)) { alert("Bitte ein gültiges Datum wählen."); return; }
  daten.termine = daten.termine.filter(t => t.wartungsartId !== artId);
  daten.termine.push({ wartungsartId: artId, datum, werkstatt: wert("t-werkstatt").trim() });
  if (speichern()) { fensterSchliessen(); zeichnen(); meldung("Termin gespeichert"); }
}
async function terminLoeschen(artId) {
  if (!await frage("Geplanten Termin wirklich entfernen?", "Entfernen", "Abbrechen", true)) return;
  daten.termine = daten.termine.filter(t => t.wartungsartId !== artId);
  if (speichern()) { fensterSchliessen(); zeichnen(); }
}

// Mängel, die mit einem Protokoll-Eintrag verknüpft sind
function maengelZuProtokoll(id) { return daten.maengel.filter(m => m.protokollId === id); }

function protokollAnsicht(id) {
  const p = daten.wartungsprotokoll.find(p => p.id === id);
  if (!p) return;
  const maengel = maengelZuProtokoll(p.id);
  fensterOeffnen(
    '<h2>Wartung</h2>' +
    detailListe([
      ["Datum", wochentag(p.datum) + ", " + datumText(p.datum)],
      ["Wartungsart", esc(artName(p.wartungsartId))],
      ["Werkstatt", esc(p.werkstatt)],
      ["Kilometerstand", p.kmStand === null ? "–" : kmText(p.kmStand) + " km" + (p.kmManuell ? " (von Hand eingetragen)" : " (berechnet)")],
      ["Durchgeführte Arbeiten / Notiz", p.notiz ? '<span class="umbrueche">' + esc(p.notiz) + '</span>' : ""],
      ["Erledigte Mängel", maengel.map(m => "✓ " + esc(m.beschreibung)).join("<br>")]
    ]) +
    '<div class="knopfreihe"><button type="button" data-action="fenster-zu">Schließen</button>' +
    '<button type="button" class="primaer" data-action="protokoll-aendern" data-id="' + p.id + '">Ändern</button></div>'
  );
}

// Zustand des Protokoll-Formulars
let formProtokoll = null; // { id | null, manuell, terminUebernommen }

async function wartungErledigt(artId) {
  const t = daten.termine.find(t => t.wartungsartId === artId);
  let vorgabe = { id: null, datum: heute(), wartungsartId: artId, werkstatt: "", kmStand: null, kmManuell: false, notiz: "" };
  let uebernommen = false;
  if (t) {
    uebernommen = await frage("Für <strong>" + esc(artName(artId)) + "</strong> ist ein Termin am " + datumText(t.datum) +
      (t.werkstatt ? " bei " + esc(t.werkstatt) : "") + " geplant. Diesen Termin ins Protokoll übernehmen?",
      "Übernehmen", "Nein, anderes Datum");
    if (uebernommen) { vorgabe.datum = t.datum; vorgabe.werkstatt = t.werkstatt; }
  }
  protokollFormular(vorgabe, uebernommen);
}

function protokollFormular(p, terminUebernommen) {
  formProtokoll = { id: p.id, manuell: p.kmManuell, terminUebernommen: !!terminUebernommen };
  const optionen = daten.wartungsarten.map(a =>
    '<option value="' + esc(a.id) + '"' + (a.id === p.wartungsartId ? " selected" : "") + '>' + esc(a.name) + '</option>').join("");
  // Zum Abhaken: alle offenen Mängel und die schon mit diesem Eintrag verknüpften
  const verknuepft = p.id ? maengelZuProtokoll(p.id) : [];
  const zumAbhaken = [...verknuepft, ...offeneMaengel()];
  const maengelHtml = zumAbhaken.length
    ? '<label>Erledigte Mängel abhaken</label>' + zumAbhaken.map(m =>
        '<label class="haken"><input type="checkbox" name="p-mangel" value="' + m.id + '"' + (m.protokollId === p.id && p.id ? " checked" : "") + '>' +
        '<span>' + esc(m.beschreibung) + ' <span class="klein">(' + datumText(m.datum) + ')</span></span></label>').join("")
    : "";
  fensterOeffnen(
    '<h2>' + (p.id ? "Wartung bearbeiten" : "Wartung eintragen") + '</h2>' +
    (terminUebernommen ? '<div class="hinweis info">Der geplante Termin wird nach dem Speichern entfernt.</div>' : "") +
    '<label for="p-datum">Datum</label><input type="date" id="p-datum" value="' + p.datum + '" data-change="protokoll-datum">' +
    '<label for="p-art">Wartungsart</label><select id="p-art">' + optionen + '</select>' +
    '<label for="p-werkstatt">Werkstatt</label><input type="text" id="p-werkstatt" value="' + esc(p.werkstatt) + '">' +
    '<label for="p-km">Kilometerstand</label>' +
    '<input type="text" id="p-km" inputmode="decimal" autocomplete="off" data-input="protokoll-km">' +
    '<div class="feldhinweis" id="p-km-hinweis"></div>' +
    '<label for="p-notiz">Durchgeführte Arbeiten / Notiz</label><textarea id="p-notiz">' + esc(p.notiz) + '</textarea>' +
    maengelHtml +
    '<div class="knopfreihe">' +
    (p.id ? '<button type="button" data-action="protokoll-ansehen" data-id="' + p.id + '">Abbrechen</button>'
          : '<button type="button" data-action="fenster-zu">Abbrechen</button>') +
    '<button type="button" class="primaer" data-action="protokoll-speichern">Speichern</button></div>' +
    (p.id ? '<div class="knopfreihe"><button type="button" class="gefahr voll" data-action="protokoll-loeschen" data-id="' + p.id + '">Eintrag löschen</button></div>' : "")
  );
  document.getElementById("p-km").value = p.kmManuell ? kmFeld(p.kmStand) : kmFeld(kmStandAm(p.datum));
  protokollKmHinweis();
}

function protokollKmHinweis() {
  const d = wert("p-datum");
  const berechnet = istGueltigesDatum(d) ? kmStandAm(d) : null;
  const el = document.getElementById("p-km-hinweis");
  if (formProtokoll.manuell) {
    el.innerHTML = "Von Hand eingetragen. Berechnet wären: " + kmText(berechnet) + " km " +
      '<button type="button" class="leise" data-action="protokoll-km-neu">Berechneten Wert verwenden</button>';
  } else if (berechnet === null) {
    el.textContent = "Kann nicht berechnet werden (kein Fahrrad angelegt oder Datum vor dem Startdatum). Du kannst den Wert von Hand eintragen.";
  } else {
    el.textContent = "Automatisch berechnet aus den Einträgen bis einschließlich diesem Datum. Du kannst den Wert überschreiben.";
  }
}
function protokollDatumGeaendert() {
  if (!formProtokoll.manuell) {
    const d = wert("p-datum");
    document.getElementById("p-km").value = istGueltigesDatum(d) ? kmFeld(kmStandAm(d)) : "";
  }
  protokollKmHinweis();
}
function protokollKmEingabe() {
  if (!formProtokoll.manuell) { formProtokoll.manuell = true; protokollKmHinweis(); }
}
function protokollKmNeu() {
  formProtokoll.manuell = false;
  protokollDatumGeaendert();
}

// Mangel wieder öffnen (Verknüpfung und Erledigt-Datum entfernen)
function mangelWiederOeffnen(m) { Object.assign(m, { status: "offen", erledigtAm: null, protokollId: null }); }

function protokollSpeichern() {
  const datum = wert("p-datum");
  if (!istGueltigesDatum(datum)) { alert("Bitte ein gültiges Datum wählen."); return; }
  const kmEingabe = wert("p-km").trim();
  let manuell = formProtokoll.manuell && kmEingabe !== "";
  let kmStand = null;
  if (manuell) {
    kmStand = kmLesen(kmEingabe);
    if (kmStand === null) { alert("Bitte den Kilometerstand als Zahl eingeben, z. B. 1234,5."); return; }
  }
  const artId = wert("p-art");
  const satz = { datum, wartungsartId: artId, werkstatt: wert("p-werkstatt").trim(), kmStand, kmManuell: manuell, notiz: wert("p-notiz").trim() };
  let id = formProtokoll.id;
  if (id) {
    Object.assign(daten.wartungsprotokoll.find(p => p.id === id), satz);
  } else {
    id = neueId();
    daten.wartungsprotokoll.push(Object.assign({ id }, satz));
  }
  // Abgehakte Mängel erledigen und verknüpfen; nicht mehr abgehakte wieder öffnen
  const abgehakt = new Set([...document.querySelectorAll('input[name="p-mangel"]:checked')].map(el => el.value));
  daten.maengel.forEach(m => {
    if (abgehakt.has(m.id)) Object.assign(m, { status: "erledigt", erledigtAm: datum, protokollId: id });
    else if (m.protokollId === id) mangelWiederOeffnen(m);
  });
  // Übernommener Termin entfällt; bei einer einmaligen Wartung auch jeder andere
  const art = daten.wartungsarten.find(a => a.id === artId);
  if (formProtokoll.terminUebernommen || (art && art.einmalig)) {
    daten.termine = daten.termine.filter(t => t.wartungsartId !== artId);
  }
  if (speichern()) {
    fensterSchliessen(); zeichnen();
    meldung(abgehakt.size ? "Wartung gespeichert, " + (abgehakt.size === 1 ? "1 Mangel" : abgehakt.size + " Mängel") + " erledigt" : "Wartung gespeichert");
  }
}
async function protokollLoeschen(id) {
  const p = daten.wartungsprotokoll.find(p => p.id === id);
  if (!p) return;
  const verknuepft = maengelZuProtokoll(id);
  const zusatz = verknuepft.length
    ? "<br><br>" + (verknuepft.length === 1 ? "Der verknüpfte Mangel wird" : "Die " + verknuepft.length + " verknüpften Mängel werden") +
      " wieder auf <strong>offen</strong> gesetzt:<br>" + verknuepft.map(m => "• " + esc(m.beschreibung)).join("<br>")
    : "";
  if (!await frage("Wartung „" + esc(artName(p.wartungsartId)) + "“ vom " + datumText(p.datum) + " wirklich löschen?" + zusatz, "Löschen", "Abbrechen", true)) return;
  mitRueckgaengig(() => {
    verknuepft.forEach(mangelWiederOeffnen);
    daten.wartungsprotokoll = daten.wartungsprotokoll.filter(x => x.id !== id);
  }, "Wartung gelöscht");
}

  const name = wert("a-name").trim();

  const von = wert("a-von") ? Number(wert("a-von")) : null;
  const bis = wert("a-bis") ? Number(wert("a-bis")) : null;
  const einmalig = document.getElementById("a-einmalig").checked;
  if ((von === null) !== (bis === null)) { alert("Für das Zeitfenster bitte beide Monate wählen (oder beide leer lassen)."); return; }
  if (einmalig && von !== null) { alert("Eine einmalige Wartung kann kein jährliches Zeitfenster haben. Bitte das Zeitfenster leeren oder „Einmalig“ abwählen."); return; }
  if (von !== null && von > bis) { alert("Das Zeitfenster darf nicht über den Jahreswechsel gehen: „Monat von“ muss vor oder gleich „Monat bis“ sein."); return; }
  let ab = null;
  if (von !== null) {
    const abText = wert("a-ab").trim();
    ab = abText === "" ? null : Number(abText);
    if (ab !== null && !(Number.isInteger(ab) && ab >= 1900 && ab <= 9999)) { alert("„Gültig ab Jahr“ muss eine Jahreszahl sein, z. B. 2027 (oder leer)."); return; }
  }
  const mText = wert("a-monate").trim();
  const monate = mText === "" ? null : Number(mText);
  if (monate !== null && !(Number.isInteger(monate) && monate >= 1)) { alert("Das Intervall in Monaten muss eine ganze Zahl ab 1 sein (oder leer)."); return; }
  const kText = wert("a-km").trim();
  const km = kText === "" ? null : kmLesen(kText);
  if (kText !== "" && !(km > 0)) { alert("Das Intervall in km muss eine Zahl größer 0 sein (oder leer)."); return; }
  const satz = { name, intervallMonate: monate, intervallKm: km, fensterVon: von, fensterBis: bis, gueltigAbJahr: ab, einmalig };
  if (id) {
    Object.assign(daten.wartungsarten.find(a => a.id === id), satz);
  } else {

  }
  if (speichern()) { fensterSchliessen(); zeichnen(); }
}

let statistikMonat = null;

// Säulendiagramm (SVG): km pro Monat im Jahr "jahr" neben dem Vorjahr. Im
// laufenden Jahr bleiben die kommenden Monate leer. Antippen eines Monats
// zeigt seine Werte; die Tabelle darunter enthält alle Werte.
function monatsDiagramm(jahr, h, gewaehlt) {
  const akt = monatsSummen(jahr), vor = monatsSummen(jahr - 1);
  const bis = h.slice(0, 4) === String(jahr) ? Number(h.slice(5, 7)) : 12;
  const werte = [...vor, ...akt.slice(0, bis)];
  const legende = '<div class="legende"><span><span class="farbe jahr"></span>' + jahr + '</span>' +
    '<span><span class="farbe vorjahr"></span>' + (jahr - 1) + '</span></div>';
  if (!werte.some(v => v > 0)) return legende + '<div class="leer">Für ' + (jahr - 1) + ' und ' + jahr + ' gibt es noch keine Einträge.</div>';

  // Achse in runden Schritten (1, 2, 5 × 10ⁿ), etwa drei Gitterlinien
  const max = Math.max(...werte);
  const roh = max / 3, p = Math.pow(10, Math.floor(Math.log10(roh)));
  const schritt = [1, 2, 5, 10].map(f => f * p).find(s => s >= roh);
  const oben = Math.ceil(max / schritt) * schritt;
  // Maße im Koordinatensystem des SVG (wird auf die Kartenbreite skaliert)
  const B = 340, H = 190, L = 34, R = 2, O = 8, U = 22;
  const spalte = (B - L - R) / 12, balken = 9, luecke = 2;
  const r1 = n => Math.round(n * 10) / 10;
  const y = km => r1(O + (H - O - U) * (1 - km / oben));
  // Säule mit 4px-Rundung oben, gerade an der Grundlinie
  const saeule = (x, km, klasse) => {
    if (!(km > 0)) return "";
    const y0 = y(0), y1 = y(km), r = Math.min(4, y0 - y1);
    return '<path class="' + klasse + '" d="M' + r1(x) + ',' + y0 + 'V' + r1(y1 + r) + 'Q' + r1(x) + ',' + y1 + ' ' + r1(x + r) + ',' + y1 +
      'H' + r1(x + balken - r) + 'Q' + r1(x + balken) + ',' + y1 + ' ' + r1(x + balken) + ',' + r1(y1 + r) + 'V' + y0 + 'Z"/>';
  };

  let svg = '<svg class="diagramm" viewBox="0 0 ' + B + ' ' + H + '" role="img" aria-label="km pro Monat ' + jahr + ' und ' + (jahr - 1) + '">';
  svg += '<rect class="gewaehlt" x="' + r1(L + gewaehlt * spalte) + '" y="0" width="' + r1(spalte) + '" height="' + (H - U + 4) + '" rx="4"/>';
  for (let v = 0; v <= oben; v += schritt) {
    svg += '<line class="gitter" x1="' + L + '" x2="' + (B - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>' +
      '<text x="' + (L - 5) + '" y="' + r1(y(v) + 4) + '" text-anchor="end">' + kmText(v) + '</text>';
  }
  for (let i = 0; i < 12; i++) {
    const mitte = L + (i + 0.5) * spalte;
    svg += saeule(mitte - luecke / 2 - balken, vor[i], "vorjahr") + (i < bis ? saeule(mitte + luecke / 2, akt[i], "jahr") : "") +
      '<text x="' + r1(mitte) + '" y="' + (H - 6) + '" text-anchor="middle"' + (i === gewaehlt ? ' style="fill:var(--text);font-weight:700"' : "") + '>' +
      MONATE_KURZ[i] + '</text>' +
      '<rect class="treffer" x="' + r1(L + i * spalte) + '" y="0" width="' + r1(spalte) + '" height="' + H + '" data-action="statistik-monat" data-monat="' + i + '"' +
      ' role="button" aria-label="' + MONATE[i] + '"/>';
  }
  svg += '</svg>';

  // Werte des angetippten Monats: Wert vorn, Jahr dahinter
  const wert = (km, j, klasse) => '<span class="farbe ' + klasse + '"></span> <strong>' + (km === null ? "–" : kmText(km) + " km") + '</strong> ' + j;
  const jetzt = gewaehlt < bis ? akt[gewaehlt] : null;
  const diff = jetzt === null ? "" : runden(jetzt - vor[gewaehlt]);
  const monatswert = '<div class="monatswert"><strong>' + MONATE[gewaehlt] + '</strong><br>' +
    wert(jetzt, jahr, "jahr") + ' · ' + wert(vor[gewaehlt], jahr - 1, "vorjahr") +
    (diff === "" ? "" : ' <span class="klein">(' + (diff > 0 ? "+" : diff < 0 ? "−" : "±") + kmText(Math.abs(diff)) + ' km)</span>') + '</div>';

  // Dieselben Werte als Tabelle (aufklappbar)
  const summe = liste => runden(liste.reduce((s, v) => s + v, 0));
  const tabelle = '<button type="button" class="aufklappen" data-action="statistik-tabelle" aria-expanded="' + statistikTabelleOffen + '">' +
    CHEVRON + 'Werte als Tabelle</button>' +
    (statistikTabelleOffen ? '<table class="tabelle"><thead><tr><th>Monat</th><th>' + jahr + '</th><th>' + (jahr - 1) + '</th></tr></thead><tbody>' +
      MONATE.map((m, i) => '<tr><td>' + m + '</td><td>' + (i < bis ? kmText(akt[i]) : "–") + '</td><td>' + kmText(vor[i]) + '</td></tr>').join("") +
      '<tr class="summe-zeile"><td>Summe</td><td>' + kmText(summe(akt)) + '</td><td>' + kmText(summe(vor)) + '</td></tr></tbody></table>' : "");
  return legende + svg + monatswert + tabelle;
}

async function vorlageSpeichern(id) {
  const name = wert("v-name").trim();
  const km = kmLesen(wert("v-km"));
  const arbeitsweg = document.getElementById("v-arbeitsweg").checked;
  if (!name) { alert("Bitte einen Namen eingeben."); return; }
  if (km === null) { alert("Bitte die Kilometer als Zahl eingeben, z. B. 12,5."); return; }
  // Merkmal "Arbeitsweg" geändert: Auch bisherige Einträge mit dieser Vorlage
  // (gleicher Name wie bisher) anpassen? Ohne Zustimmung bleiben sie unverändert.
  const alt = id ? daten.vorlagen.find(v => v.id === id) : null;
  const bisherName = alt ? alt.name : name;
  const betroffen = (alt ? alt.arbeitsweg !== arbeitsweg : arbeitsweg)
    ? daten.eintraege.filter(e => e.vorlage === bisherName && e.arbeitsweg !== arbeitsweg) : [];
  let auchBisherige = false;
  if (betroffen.length) {
    const n = betroffen.length;
    auchBisherige = await frage((n === 1 ? "Den bisherigen Eintrag" : "Die " + n + " bisherigen Einträge") + " mit der Vorlage „" + esc(bisherName) + "“ " +
      (arbeitsweg ? "ebenfalls als Arbeitsweg zählen?" : "ebenfalls nicht mehr als Arbeitsweg zählen?"),
      n === 1 ? "Ja" : "Ja, alle " + n, "Nein, nur neue Einträge");
  }
  if (alt) Object.assign(alt, { name, km, arbeitsweg });
  else daten.vorlagen.push({ id: neueId(), name, km, arbeitsweg });
  if (auchBisherige) betroffen.forEach(e => { e.arbeitsweg = arbeitsweg; });
  if (speichern()) {
    fensterSchliessen(); zeichnen();
    meldung(auchBisherige ? "Vorlage gespeichert, " + (betroffen.length === 1 ? "1 Eintrag" : betroffen.length + " Einträge") + " angepasst" : "Vorlage gespeichert");
  }
}

   7. DATENSICHERUNG: Export, Prüfung, Import
   Nichts in diesem Abschnitt verändert die Daten der App – außer dem
   Import nach ausdrücklicher Bestätigung. Eine erfolgreiche Sicherung
   setzt nur das Datum der letzten Sicherung (eigener Speicherplatz).

function exportVermerken() {

    wartungen: d.wartungsprotokoll.length,

  };

// "412 Einträge, 7.380,4 km"
function inhaltText(ki) {

}

function exportInhalt(zeitpunkt = new Date().toISOString()) {
  const { version, ...rest } = daten;
  return JSON.stringify(Object.assign({ version: DATEN_VERSION, kurzinfo: kurzinfoFuer(daten, zeitpunkt) }, rest), null, 2);
}

// ---------- Vergleich einer Sicherung mit dem aktuellen Stand ----------

// Gleicher Inhalt, unabhängig von der Reihenfolge der Felder
function kanonisch(x) {
  if (Array.isArray(x)) return x.map(kanonisch);
  if (x && typeof x === "object") return Object.keys(x).sort().reduce((o, k) => { o[k] = kanonisch(x[k]); return o; }, {});
  return x;
}
function gleicherInhalt(a, b) { return JSON.stringify(kanonisch(a)) === JSON.stringify(kanonisch(b)); }

// Je Liste: fehlen = nur im aktuellen Stand (neuer als die Sicherung),
// nurSicherung = nur in der Sicherung, geaendert = in beiden, aber verschieden.
// Einträge werden über das Datum zugeordnet, alles andere über die Kennung.
// Berechnete Kilometerstände im Protokoll zählen nicht als Unterschied.
function datenVergleichen(sicherung, aktuell) {
  const liste = (alt, neu, schluessel, inhalt = x => x) => {
    const a = new Map(alt.map(x => [schluessel(x), x])), n = new Map(neu.map(x => [schluessel(x), x]));
    return {
      fehlen: [...n.keys()].filter(k => !a.has(k)),
      nurSicherung: [...a.keys()].filter(k => !n.has(k)),
      geaendert: [...n.keys()].filter(k => a.has(k) && !gleicherInhalt(inhalt(a.get(k)), inhalt(n.get(k))))
    };
  };
  const nachId = x => x.id;
  const ohneId = ({ id, ...rest }) => rest;
  const ohneBerechnetenKm = p => Object.assign({}, p, { kmStand: p.kmManuell ? p.kmStand : null });
  const gemeinsameReihenfolge = (x, y) => x.map(nachId).filter(id => y.some(v => v.id === id));
  const vorlagen = liste(sicherung.vorlagen, aktuell.vorlagen, nachId);
  vorlagen.reihenfolge = !gleicherInhalt(gemeinsameReihenfolge(sicherung.vorlagen, aktuell.vorlagen), gemeinsameReihenfolge(aktuell.vorlagen, sicherung.vorlagen));
  return {
    eintraege: liste(sicherung.eintraege, aktuell.eintraege, e => e.datum, ohneId),
    vorlagen,
    wartungsarten: liste(sicherung.wartungsarten, aktuell.wartungsarten, nachId),
    wartungsprotokoll: liste(sicherung.wartungsprotokoll, aktuell.wartungsprotokoll, nachId, ohneBerechnetenKm),
    termine: liste(sicherung.termine, aktuell.termine, t => t.wartungsartId),
    maengel: liste(sicherung.maengel, aktuell.maengel, nachId),
    fahrrad: !gleicherInhalt(sicherung.fahrrad, aktuell.fahrrad),
    einstellungen: !gleicherInhalt(sicherung.einstellungen, aktuell.einstellungen)
  };
}

// Datumswerte als kurze Bereiche: "25.–27.10., 30.10.–02.11."; das Jahr nur,
// wenn es nicht das laufende ist. Mehr als "max" Bereiche werden mit "…" gekürzt.
function datumsBereiche(liste, h, max = 4) {
  const bereiche = [];
  [...liste].sort().forEach(d => {
    const b = bereiche[bereiche.length - 1];
    if (b && plusTage(b[1], 1) === d) b[1] = d; else bereiche.push([d, d]);
  });
  const jahr = h.slice(0, 4);
  const text = ([von, bis]) => {
    const mitJahr = von.slice(0, 4) !== jahr || bis.slice(0, 4) !== jahr;
    const t = iso => mitJahr ? datumText(iso) : kurzDatum(iso);
    if (von === bis) return t(von);
    if (von.slice(0, 7) === bis.slice(0, 7)) return von.slice(8) + ".–" + t(bis);
    if (von.slice(0, 4) === bis.slice(0, 4)) return kurzDatum(von) + "–" + t(bis);
    return t(von) + "–" + t(bis);
  };
  const teile = bereiche.slice(0, max).map(text);
  if (bereiche.length > max) teile.push("…");
  return teile.join(", ");
}

const VERGLEICH_BEZEICHNUNG = {
  eintraege: ["Eintrag", "Einträge"],
  wartungsprotokoll: ["Wartung", "Wartungen"],
  maengel: ["Mangel", "Mängel"],
  vorlagen: ["Vorlage", "Vorlagen"],
  wartungsarten: ["Wartungsart", "Wartungsarten"],
  termine: ["geplanter Termin", "geplante Termine"]
};
// Unterschiede als Text: "fehlen" (nur Neues seit der Sicherung) und "sonst"
function unterschiedTexte(v, h) {
  const fehlen = [], sonst = [];
  Object.keys(VERGLEICH_BEZEICHNUNG).forEach(k => {
    const [einzahl, mehrzahl] = VERGLEICH_BEZEICHNUNG[k];
    const anzahl = n => n + " " + (n === 1 ? einzahl : mehrzahl);
    const tage = liste => k === "eintraege" ? " (" + datumsBereiche(liste, h) + ")" : "";
    const x = v[k];
    if (x.fehlen.length) fehlen.push(anzahl(x.fehlen.length) + (x.fehlen.length === 1 ? " fehlt" : " fehlen") + tage(x.fehlen));
    if (x.nurSicherung.length) sonst.push(anzahl(x.nurSicherung.length) + " nur in der Sicherung" + tage(x.nurSicherung));
    if (x.geaendert.length) sonst.push(anzahl(x.geaendert.length) + " geändert" + tage(x.geaendert));
  });
  if (v.vorlagen.reihenfolge) sonst.push("Reihenfolge der Vorlagen geändert");
  if (v.fahrrad) sonst.push("Angaben zum Fahrrad geändert");
  if (v.einstellungen) sonst.push("Einstellungen geändert");
  return { fehlen, sonst };
}

// Wertet den Text einer Sicherung aus: Prüfung mit denselben Regeln wie beim
// Import, Vergleich mit "aktuell" und Abgleich der Kurzinfo. Verändert nichts.
//   status: "identisch" | "aelter" | "abweichend" | "defekt"
//   kurzinfoPasst: true / false, null = Datei ohne Kurzinfo (ältere Sicherung)
//   identischStreng: Inhalt einschließlich aller Kennungen gleich
function sicherungAuswerten(text, aktuell, h = heute()) {
  let gelesen, roh;
  try {
    gelesen = datenEinlesen(text);
    roh = JSON.parse(text);
  } catch (e) {
    return { status: "defekt", titel: "Datei beschädigt bzw. keine Rad-km-Sicherung", details: [e.message], kurzinfo: null, kurzinfoPasst: null, identischStreng: false };
  }
  const ki = roh.kurzinfo && typeof roh.kurzinfo === "object" && !Array.isArray(roh.kurzinfo) ? roh.kurzinfo : null;
  const soll = kurzinfoFuer(gelesen, null);
  const kurzinfoPasst = roh.kurzinfo === undefined ? null
    : !!ki && ["eintraege", "kmSumme", "kmStand", "wartungen", "maengel"].every(k => ki[k] === soll[k]);
  const erg = { gelesen, kurzinfo: ki, kurzinfoPasst, inhalt: soll, details: [], identischStreng: gleicherInhalt(gelesen, aktuell) };
  const u = unterschiedTexte(datenVergleichen(gelesen, aktuell), h);
  if (!u.fehlen.length && !u.sonst.length) {
    erg.status = "identisch"; erg.titel = "Identisch mit dem aktuellen Stand";
  } else if (!u.sonst.length) {
    erg.status = "aelter"; erg.titel = "Sicherung ist älter: " + u.fehlen.join(", ");
  } else {
    erg.status = "abweichend"; erg.titel = "Sicherung weicht vom aktuellen Stand ab"; erg.details = [...u.fehlen, ...u.sonst];
  }
  return erg;
}

// ---------- Sichern ----------

let sicherungLaeuft = false;
// Ergebnis der letzten erfolgreichen Sicherung (nur solange die App geöffnet ist)
let sicherungsErgebnis = null;
// Bereits geprüfte Sicherung, falls das Teilen-Menü einen zweiten Tipper braucht
let geprueftZumTeilen = null;

// "rad-km-2026-10-25-1403.json" – mit Uhrzeit, damit mehrere Sicherungen am selben Tag eindeutig sind
function sicherungsDateiname(jetzt) {
  return "rad-km-" + isoAusDate(jetzt) + "-" + zweistellig(jetzt.getHours()) + zweistellig(jetzt.getMinutes()) + ".json";
}

// Erzeugt die Exportdatei und prüft sie, bevor sie geteilt wird: Die Datei
// wird wieder eingelesen, mit den Import-Regeln geprüft und mit dem aktuellen
// Stand verglichen. Wirft einen Fehler, wenn etwas nicht stimmt.
async function sicherungVorbereiten() {
  const dateiname = sicherungsDateiname(new Date());
  const inhalt = exportInhalt();
  let datei;
  try { datei = new File([inhalt], dateiname, { type: "application/json" }); }
  catch (e) { datei = new Blob([inhalt], { type: "application/json" }); }
  let text;
  try { text = await dateiLesen(datei); }
  catch (e) { throw new Error("Die Exportdatei konnte nicht wieder gelesen werden."); }
  const erg = sicherungAuswerten(text, daten);
  if (erg.status === "defekt") throw new Error("Die Exportdatei ist fehlerhaft: " + erg.details.join(" "));
  if (!erg.identischStreng) {
    const was = erg.status === "aelter" ? [erg.titel] : erg.details;
    throw new Error("Die Exportdatei stimmt nicht mit dem aktuellen Stand überein" + (was.length ? ": " + was.join(", ") + "." : " (interne Kennungen)."));
  }
  if (erg.kurzinfoPasst !== true) throw new Error("Die Kurzinfo der Exportdatei passt nicht zum Inhalt.");
  return { datei, dateiname, inhalt, kurzinfo: erg.kurzinfo };
}

// "Jetzt sichern": prüfen, dann teilen (iPhone) oder herunterladen
async function jetztSichern() {
  if (sicherungLaeuft) return;
  sicherungLaeuft = true;
  try {
    let s;
    try {
      s = await sicherungVorbereiten();
    } catch (e) {
      alert("Die Sicherung wurde nicht erstellt, weil die Prüfung der Exportdatei fehlgeschlagen ist:\n" + e.message +
        "\n\nDeine Daten in der App sind unverändert.");
      return;
    }
    await sicherungTeilen(s);
  } finally {
    sicherungLaeuft = false;
  }
}

// Teilen-Menü bzw. Download einer geprüften Sicherung. Erst nach dem Abschluss
// wird das Datum der letzten Sicherung gesetzt; die Daten bleiben unberührt.
// navigator.share wird ohne vorheriges "await" aufgerufen (iPhone).
async function sicherungTeilen(s) {
  if (navigator.canShare && navigator.canShare({ files: [s.datei] })) {
    try {
      // Nur die Datei: Mit Titel oder Text legt "In Dateien sichern" zusätzlich eine Textdatei an
      await navigator.share({ files: [s.datei] });
    } catch (err) {
      if (err && err.name === "AbortError") { meldung("Sicherung abgebrochen"); return; }
      // Das iPhone öffnet das Teilen-Menü nur direkt nach einem Tipper
      if (err && err.name === "NotAllowedError" && !s.zweiterVersuch) { teilenNachfragen(s); return; }
      herunterladen(s.inhalt, s.dateiname);
      sicherungFertig(s, "heruntergeladen");
      return;
    }
    sicherungFertig(s, "übergeben");
  } else {
    herunterladen(s.inhalt, s.dateiname);
    sicherungFertig(s, "heruntergeladen");
  }
}
function teilenNachfragen(s) {
  geprueftZumTeilen = Object.assign({}, s, { zweiterVersuch: true });
  fensterOeffnen('<h2>Sicherung geprüft</h2>' +
    '<p>Die Exportdatei ist geprüft: ' + inhaltText(s.kurzinfo) + '. Tippe auf „Teilen …“, um sie z. B. in „Dateien“ zu speichern.</p>' +
    '<div class="knopfreihe"><button type="button" data-action="fenster-zu">Abbrechen</button>' +
    '<button type="button" class="primaer" data-action="sicherung-teilen">Teilen …</button></div>');
}
function sicherungFertig(s, wie) {
  exportVermerken();
  sicherungsErgebnis = { wie, kurzinfo: s.kurzinfo };
  zeichnen();
  meldung("Sicherung " + wie + " – Inhalt geprüft: " + inhaltText(s.kurzinfo), { dauer: 4000 });
}
function herunterladen(inhalt, dateiname) {
  const url = URL.createObjectURL(new Blob([inhalt], { type: "application/json" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = dateiname;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

// ---------- Sicherung prüfen (liest nur, überschreibt nichts) ----------

function sicherungPruefenStarten() {
  const eingabe = document.getElementById("pruefdatei");
  eingabe.value = "";
  eingabe.click();
}
async function pruefDateiGewaehlt(datei) {
  if (!datei) return;
  let erg;
  try {
    erg = sicherungAuswerten(await dateiLesen(datei), daten);
  } catch (e) {
    erg = { status: "defekt", titel: "Datei beschädigt bzw. keine Rad-km-Sicherung", details: ["Die Datei konnte nicht gelesen werden."] };
  }
  pruefErgebnisAnzeigen(datei.name, erg);
}
function zeitpunktText(iso) {
  const d = typeof iso === "string" ? new Date(iso) : null;
  if (!d || isNaN(d)) return null;
  return datumText(isoAusDate(d)) + ", " + zweistellig(d.getHours()) + ":" + zweistellig(d.getMinutes()) + " Uhr";
}
function pruefErgebnisAnzeigen(name, erg) {
  const klasse = { identisch: "status-gruen", aelter: "status-orange", abweichend: "status-orange", defekt: "status-rot" }[erg.status];
  const zeichen = { identisch: "✓", aelter: "⚠️", abweichend: "⚠️", defekt: "✗" }[erg.status];
  let html = '<h2>Sicherung prüfen</h2><p class="klein" style="overflow-wrap:anywhere">' + esc(name) + '</p>' +
    '<p class="' + klasse + '">' + zeichen + " " + esc(erg.titel) + '</p>' +
    (erg.details.length ? '<ul>' + erg.details.map(d => '<li>' + esc(d) + '</li>').join("") + '</ul>' : "");
  if (erg.status !== "defekt") {
    const i = erg.inhalt;
    const wann = erg.kurzinfo && zeitpunktText(erg.kurzinfo.zeitpunkt);
    html += detailListe([
      ["Gesichert am", wann ? esc(wann) + (erg.kurzinfo.appVersion ? " (App-Version " + esc(erg.kurzinfo.appVersion) + ")" : "") : "unbekannt (Sicherung ohne Kurzinfo)"],
      ["Inhalt der Sicherung", inhaltText(i) + ", " + (i.wartungen === 1 ? "1 Wartung" : i.wartungen + " Wartungen") + ", " +
        (i.maengel === 1 ? "1 Mangel" : i.maengel + " Mängel") + (i.kmStand !== null ? "<br>Kilometerstand " + kmText(i.kmStand) + " km" : "")]
    ]);
    if (erg.kurzinfoPasst === false) {
      html += '<p class="status-orange">⚠️ Die Kurzinfo passt nicht zum Inhalt – die Datei wurde nachträglich verändert oder ist unvollständig.</p>';
    }
  }
  html += '<p class="klein">Die Datei wurde nur gelesen. In der App wurde nichts verändert.</p>' +
    '<div class="knopfreihe"><button type="button" class="primaer" data-action="fenster-zu">Schließen</button></div>';
  fensterOeffnen(html);
}

// ---------- Import ----------

function importStarten() {
  const eingabe = document.getElementById("importdatei");
  eingabe.value = "";
  eingabe.click();
}
async function importDateiGewaehlt(datei) {
  if (!datei) return;
  let neu, roh;
  try {
    const text = await dateiLesen(datei);
    neu = datenEinlesen(text);
    roh = JSON.parse(text);
  } catch (e) {
    alert("Import nicht möglich:\n" + e.message);
    return;
  }
  const wann = roh.kurzinfo && zeitpunktText(roh.kurzinfo.zeitpunkt);
  const ziele = neu.einstellungen.jahresziele.length;
  const zusammenfassung =
    "<strong>" + esc(datei.name) + "</strong><br>" +
    (wann ? "Gesichert am " + esc(wann) + "<br>" : "") +
    "Fahrrad: " + (neu.fahrrad ? esc(neu.fahrrad.name) : "–") + "<br>" +
    neu.eintraege.length + " Einträge, " + neu.vorlagen.length + " Vorlagen, " +
    neu.wartungsarten.length + " Wartungsarten, " + neu.wartungsprotokoll.length + " Wartungen, " +
    neu.termine.length + " geplante Termine, " + neu.maengel.length + " Mängel" +
    (neu.maengel.length ? " (davon " + neu.maengel.filter(m => m.status === "offen").length + " offen)" : "") +
    (ziele ? ", " + (ziele === 1 ? "1 Jahresziel" : ziele + " Jahresziele") : "") + ".<br><br>" +
    "<strong>Alle vorhandenen Daten in der App werden ersetzt.</strong> Fortfahren?";
  if (!await frage(zusammenfassung, "Importieren und ersetzen", "Abbrechen", true)) return;
  daten = neu;
  ladeFehler = null;
  sicherungsErgebnis = null;
  if (speichern()) { zeichnen(); meldung("Import erfolgreich"); }
}

/* =====================================================================
   8. BEDIENUNG: Klicks und Eingaben den Funktionen zuordnen
   Jede Schaltfläche hat ein Attribut data-action="…", hier steht,
   was dann passiert.
   ===================================================================== */

const AKTIONEN = {
  "tab": el => { aktiverTab = el.dataset.tab; zeichnen(); window.scrollTo(0, 0); },
  "fenster-zu": () => fensterSchliessen(),
  "gruppe": el => gruppeUmschalten(el.dataset.key),

  "vorlage-erfassen": el => {
    const v = daten.vorlagen.find(v => v.id === el.dataset.id);
    eintragNeu({ datum: heute(), km: v.km, vorlage: v.name, arbeitsweg: v.arbeitsweg });
  },
  "eintrag-neu": () => eintragNeu({ datum: heute() }),
  "nachtragen": el => eintragNeu({ datum: el.dataset.datum }),
  "keine-fahrt": el => keineFahrt(el.dataset.datum),
  "eintrag-ansehen": el => eintragAnsicht(el.dataset.id),
  "eintrag-aendern": el => eintragsFormular(daten.eintraege.find(e => e.id === el.dataset.id), ""),
  "eintrag-speichern": () => eintragSpeichern(),
  "eintrag-loeschen": el => eintragLoeschen(el.dataset.id),

  "termin": el => terminFormular(el.dataset.id),
  "termin-speichern": el => terminSpeichern(el.dataset.id),
  "termin-loeschen": el => terminLoeschen(el.dataset.id),
  "wartung-erledigt": el => wartungErledigt(el.dataset.id),
  "protokoll-ansehen": el => protokollAnsicht(el.dataset.id),
  "protokoll-aendern": el => protokollFormular(daten.wartungsprotokoll.find(p => p.id === el.dataset.id), false),
  "protokoll-speichern": () => protokollSpeichern(),
  "protokoll-loeschen": el => protokollLoeschen(el.dataset.id),
  "protokoll-km-neu": () => protokollKmNeu(),
  "mangel-neu": () => mangelFormular(null),
  "mangel-ansehen": el => mangelAnsicht(el.dataset.id),
  "mangel-aendern": el => mangelFormular(el.dataset.id),
  "mangel-speichern": el => mangelSpeichern(el.dataset.id || null),
  "mangel-loeschen": el => mangelLoeschen(el.dataset.id),
  "maengel-erledigt-umschalten": () => { erledigteMaengelOffen = !erledigteMaengelOffen; zeichnen(); },
  "art-neu": () => artFormular(null),
  "art-bearbeiten": el => artFormular(el.dataset.id),
  "art-speichern": el => artSpeichern(el.dataset.id || null),
  "art-loeschen": el => artLoeschen(el.dataset.id),

  "vorlage-neu": () => vorlageFormular(null),
  "vorlage-bearbeiten": el => vorlageFormular(el.dataset.id),
  "vorlage-speichern": el => vorlageSpeichern(el.dataset.id || null),
  "vorlage-loeschen": el => vorlageLoeschen(el.dataset.id),
  "vorlage-hoch": el => vorlageVerschieben(el.dataset.id, -1),
  "vorlage-runter": el => vorlageVerschieben(el.dataset.id, 1),

  "fahrrad-aendern": () => fahrradFormular(),
  "fahrrad-speichern": () => fahrradSpeichern(),
  "jahresziel-neu": el => jahreszielFormular(el.dataset.jahr ? Number(el.dataset.jahr) : null, false),
  "jahresziel-bearbeiten": el => jahreszielFormular(Number(el.dataset.jahr), true),
  "jahresziel-speichern": el => jahreszielSpeichern(el.dataset.jahr ? Number(el.dataset.jahr) : null),
  "jahresziel-loeschen": el => jahreszielLoeschen(Number(el.dataset.jahr)),
  "prognose": () => prognoseFenster(),
  "statistik-monat": el => { statistikMonat = Number(el.dataset.monat); zeichnen(); },
  "statistik-tabelle": () => { statistikTabelleOffen = !statistikTabelleOffen; zeichnen(); },

  "rueckgaengig": () => rueckgaengig(),
  "neu-laden": () => neuLaden(),
  "sichern": () => jetztSichern(),
  "sicherung-teilen": () => {
    const s = geprueftZumTeilen;
    geprueftZumTeilen = null;
    fensterSchliessen();
    if (s) sicherungTeilen(s);
  },
  "sicherung-pruefen": () => sicherungPruefenStarten(),
  "import": () => importStarten()
};
const AENDERUNGEN = {
  "eintrag-datum": () => eintragDatumGeaendert(),
  "eintrag-vorlage": () => eintragVorlageGeaendert(),
  "protokoll-datum": () => protokollDatumGeaendert(),
  "mangel-status": () => mangelStatusGeaendert(),
  "art-fenster": () => artFensterGeaendert(),
  "fahrtag": () => fahrtageGeaendert(),
  "prognose-datum": () => prognoseAnzeigen()
};
const EINGABEN = {
  "protokoll-km": () => protokollKmEingabe(),
  "prognose-datum": () => prognoseAnzeigen()
};

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-action]");
  if (el && !el.disabled) AKTIONEN[el.dataset.action](el);
});
document.addEventListener("change", ev => {
  const name = ev.target.dataset && ev.target.dataset.change;
  if (name) AENDERUNGEN[name]();
});
document.addEventListener("input", ev => {
  const name = ev.target.dataset && ev.target.dataset.input;
  if (name) EINGABEN[name]();
});
document.getElementById("importdatei").addEventListener("change", ev => importDateiGewaehlt(ev.target.files[0]));
document.getElementById("pruefdatei").addEventListener("change", ev => pruefDateiGewaehlt(ev.target.files[0]));

// Tippen neben das Fenster schließt es
fenster.addEventListener("click", ev => { if (ev.target === fenster) fensterSchliessen(); });

// Beim Zurückkehren in die App (z. B. am nächsten Tag) "heute" neu berechnen
// und nach einer neuen Version fragen
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  if (!fenster.open) zeichnen();
  updatePruefen();
});

/* =====================================================================
   9. OFFLINE UND NEUE VERSIONEN
   Der Service Worker (sw.js) hält die App für den Start ohne Netz bereit und
   meldet neue Versionen. Er speichert nur die App, nie die Daten.
   ===================================================================== */

let neueVersion = false;
let letzteUpdatePruefung = 0;
const UPDATE_PRUEFEN_MS = 10 * 60 * 1000;
const swVerfuegbar = () => !TESTMODUS && "serviceWorker" in navigator;

function serviceWorkerStarten() {
  if (!swVerfuegbar()) return;
  navigator.serviceWorker.addEventListener("message", ev => swNachricht(ev.data));
  navigator.serviceWorker.register("sw.js").then(() => updatePruefen(), () => {});
}
// Fragt den Service Worker nach einer neuen Version (beim Start und beim
// Zurückkehren in die App, höchstens alle 10 Minuten)
function updatePruefen() {
  if (!swVerfuegbar() || Date.now() - letzteUpdatePruefung < UPDATE_PRUEFEN_MS) return;
  letzteUpdatePruefung = Date.now();
  navigator.serviceWorker.ready.then(reg => { if (reg.active) reg.active.postMessage({ typ: "update-pruefen" }); });
}
function swNachricht(nachricht) {
  const typ = nachricht && nachricht.typ;
  if (typ === "neue-version" && !neueVersion) { neueVersion = true; zeichnen(); }
  if (typ === "aktiviert") location.reload();
}
// "Neu laden": neue Version übernehmen, dann neu laden. Alle Daten sind
// schon gespeichert, der localStorage bleibt unverändert.
function neuLaden() {
  if (!swVerfuegbar()) { location.reload(); return; }
  navigator.serviceWorker.ready.then(reg => {
    if (reg.active) reg.active.postMessage({ typ: "aktivieren" });
    setTimeout(() => location.reload(), 3000); // falls keine Antwort kommt
  });
}

/* =====================================================================
   10. START
   ===================================================================== */
laden();
zeichnen();
serviceWorkerStarten();
</script>
