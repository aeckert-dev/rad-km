<style>
/* =====================================================================
   AUSSEHEN (CSS)
   Farben stehen als Variablen oben. Für den Dunkelmodus werden nur die
   Variablen ausgetauscht – das Betriebssystem entscheidet, welcher gilt.
   ===================================================================== */
:root {
  --bg: #f2f2f7;
  --karte: #ffffff;
  --text: #1c1c1e;
  --text2: #6e6e73;
  --linie: #d8d8dd;
  --akzent: #16805c;
  --akzent-text: #ffffff;
  --akzent-hell: #e3f3ec;
  --rot: #c62828;
  --rot-hell: #fdecea;
  --orange: #b25e00;
  --orange-hell: #fff3e0;
  --feld: #ffffff;
  --schatten: 0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --karte: #1c1c1e;
    --text: #f2f2f7;
    --text2: #a1a1a6;
    --linie: #3a3a3c;
    --akzent: #34c38f;
    --akzent-text: #04261a;
    --akzent-hell: #12352a;
    --rot: #ff6b6b;
    --rot-hell: #3b1414;
    --orange: #ffb547;
    --orange-hell: #3a2a0f;
    --feld: #2c2c2e;
    --schatten: none;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

header {
  position: sticky; top: 0; z-index: 5;
  background: var(--bg);
  padding: calc(env(safe-area-inset-top) + 10px) 16px 8px;
}
header h1 { margin: 0; font-size: 28px; }

main {
  padding: 0 16px calc(env(safe-area-inset-bottom) + 96px);
  max-width: 640px; margin: 0 auto;
}

h2 { font-size: 20px; margin: 24px 0 8px; }
h3 { font-size: 17px; margin: 0 0 4px; }

.karte {
  background: var(--karte);
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 12px;
  box-shadow: var(--schatten);
}
.klein { font-size: 15px; color: var(--text2); }
.zentriert { text-align: center; }

/* Große Kilometerstand-Anzeige */
.stand-zahl { font-size: 40px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }

/* Hinweise / Warnungen */
.hinweis { border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
.hinweis.warn { background: var(--orange-hell); color: var(--orange); }
.hinweis.fehler { background: var(--rot-hell); color: var(--rot); }
.hinweis.info { background: var(--akzent-hell); color: var(--text); }
.hinweis button { margin-top: 10px; }
.hinweis button:not(.primaer) { background: var(--karte); }

.status-rot { color: var(--rot); font-weight: 600; }
.status-orange { color: var(--orange); font-weight: 600; }
.status-gruen { color: var(--akzent); font-weight: 600; }

/* Schaltflächen */
button, .knopf {
  font: inherit;
  min-height: 48px;
  padding: 10px 16px;
  border-radius: 12px;
  border: none;
  background: var(--akzent-hell);
  color: var(--text);
  font-weight: 600;
  cursor: pointer;
  touch-action: manipulation;
}
button.primaer { background: var(--akzent); color: var(--akzent-text); }
button.gefahr { background: var(--rot-hell); color: var(--rot); }
button.leise { background: transparent; color: var(--akzent); }
button.voll { width: 100%; }
button:active { opacity: .7; }
button:disabled { opacity: .4; }
.knopfreihe { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.knopfreihe > button { flex: 1 1 auto; }

/* Vorlagen-Schnellerfassung */
.schnell { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.schnell button { min-height: 72px; text-align: left; display: flex; flex-direction: column; justify-content: center; }
.schnell .km { font-weight: 400; font-size: 15px; opacity: .85; }

/* Summen-Kacheln */
.summen { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.summe { background: var(--karte); border-radius: 12px; padding: 10px 6px; text-align: center; box-shadow: var(--schatten); }
.summe .wert { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.summe .titel { font-size: 13px; color: var(--text2); }

/* Listen */
.liste { background: var(--karte); border-radius: 14px; overflow: hidden; box-shadow: var(--schatten); }
.zeile { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--linie); }
.zeile:last-child { border-bottom: none; }
.zeile .inhalt {
  flex: 1; min-width: 0;
  background: none; border-radius: 0; text-align: left; font-weight: 400;
  padding: 10px 0 10px 16px; display: flex; gap: 10px; align-items: center;
}
.zeile .inhalt .text { flex: 1; min-width: 0; }
.zeile .inhalt .text > div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.zeile .zahl { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.zeile .symbol { background: none; min-width: 48px; padding: 0; color: var(--text2); font-size: 20px; }
.zeile .pfeile { display: flex; }
.leer { padding: 16px; color: var(--text2); text-align: center; }

.zeile.gruppe .inhalt .pfeil { width: 14px; color: var(--text2); font-size: 13px; flex: none; }
.zeile.gruppe .inhalt .titel { font-weight: 600; }

/* Detailansicht (nur lesen) */
.details { margin: 0; }
.details dt { font-size: 15px; color: var(--text2); margin-top: 12px; }
.details dd { margin: 2px 0 0; overflow-wrap: anywhere; }
.umbrueche { white-space: pre-wrap; }

/* Mängel zum Abhaken im Wartungsformular */
.haken { display: flex; gap: 10px; align-items: flex-start; margin: 8px 0; color: var(--text); font-size: 17px; }
.haken input { width: 24px; min-height: 24px; height: 24px; margin: 0; flex: none; -webkit-appearance: checkbox; appearance: auto; }

.abzeichen {
  display: inline-block; font-size: 12px; font-weight: 700;
  padding: 2px 8px; border-radius: 99px;
  background: var(--orange-hell); color: var(--orange);
  vertical-align: middle; margin-left: 4px;
}

/* Formulare */
label { display: block; font-size: 15px; color: var(--text2); margin: 14px 0 4px; }
input, select, textarea {
  font: inherit; font-size: 17px; /* ≥16px verhindert das automatische Zoomen auf dem iPhone */
  width: 100%;
  min-height: 48px;
  padding: 10px 12px;
  border: 1px solid var(--linie);
  border-radius: 10px;
  background: var(--feld);
  color: var(--text);
  -webkit-appearance: none; appearance: none;
}
input[type="date"] { display: block; }
input::-webkit-date-and-time-value { text-align: left; }
select {
  background-image: linear-gradient(45deg, transparent 50%, var(--text2) 50%), linear-gradient(135deg, var(--text2) 50%, transparent 50%);
  background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%;
  background-size: 6px 6px; background-repeat: no-repeat;
  padding-right: 36px;
}
textarea { min-height: 80px; resize: vertical; }
.feldhinweis { font-size: 14px; color: var(--text2); margin-top: 4px; }
.feldhinweis.warn { color: var(--orange); }

/* Fenster (Dialoge) */
dialog {
  border: none; padding: 0;
  width: calc(100% - 16px); max-width: 560px;
  max-height: calc(100% - env(safe-area-inset-top) - 24px);
  margin: calc(env(safe-area-inset-top) + 12px) auto auto;
  border-radius: 16px;
  background: var(--karte); color: var(--text);
  overflow: auto;
}
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog .fensterinhalt { padding: 18px 16px 16px; }
dialog h2 { margin-top: 0; }

/* Untere Navigationsleiste */
nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: flex;
  background: var(--karte);
  border-top: 1px solid var(--linie);
  padding-bottom: env(safe-area-inset-bottom);
}
nav button {
  flex: 1; background: none; border-radius: 0;
  min-height: 60px; padding: 6px 2px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 12px; font-weight: 500; color: var(--text2);
}
nav button .ico { font-size: 22px; line-height: 1; }
nav button.aktiv { color: var(--akzent); font-weight: 700; }

/* Kurze Bestätigung unten ("Gespeichert") */
#toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom) + 76px);
  background: var(--text); color: var(--bg);
  padding: 10px 18px; border-radius: 99px; font-weight: 600;
  opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20;
  white-space: nowrap;
}
#toast.sichtbar { opacity: .95; }
</style>
</head>
<body>

<header><h1 id="seitentitel">Übersicht</h1></header>
<main id="inhalt"></main>

<nav>
  <button type="button" data-action="tab" data-tab="uebersicht"><span class="ico">🚲</span>Übersicht</button>
  <button type="button" data-action="tab" data-tab="wartung"><span class="ico">🔧</span>Wartung</button>
  <button type="button" data-action="tab" data-tab="vorlagen"><span class="ico">📋</span>Vorlagen</button>
  <button type="button" data-action="tab" data-tab="einstellungen"><span class="ico">⚙️</span>Einstellungen</button>

<script>
"use strict";

/* =====================================================================
   1. GRUNDEINSTELLUNGEN
   ===================================================================== */

// Testmodus (Aufruf mit "?test", nur für tests/test.html): eigene
// Speicherplätze, damit die Tests die echten Daten nie berühren.
const TESTMODUS = new URLSearchParams(location.search).has("test");
// Unter diesem Namen liegen alle Daten im localStorage des Browsers.
const SPEICHER_SCHLUESSEL = TESTMODUS ? "radkm-test-daten" : "radkm-daten";
// Datum des letzten Exports (separat, damit ein Import es nicht verändert).
const EXPORT_SCHLUESSEL = TESTMODUS ? "radkm-test-letzter-export" : "radkm-letzter-export";
// Aktuelle Version des Datenmodells. Bei Änderungen am Aufbau erhöhen
// und unten in MIGRATIONEN eine Umwandlung ergänzen.
const DATEN_VERSION = 2;
const EXPORT_ERINNERUNG_TAGE = 30;

/* =====================================================================
   2. HILFSFUNKTIONEN: Datum, Zahlen, Text
   Datumswerte werden intern immer als Text "JJJJ-MM-TT" gespeichert.
   ===================================================================== */

function zweistellig(n) { return String(n).padStart(2, "0"); }

function isoAusDate(d) {
  return d.getFullYear() + "-" + zweistellig(d.getMonth() + 1) + "-" + zweistellig(d.getDate());
}
function heute() { return isoAusDate(new Date()); }

// "JJJJ-MM-TT" → Date (lokal, 12 Uhr mittags, um Sommerzeit-Probleme zu vermeiden)
function dateAusIso(iso) {
  const [j, m, t] = iso.split("-").map(Number);
  return new Date(j, m - 1, t, 12);
}
function istGueltigesDatum(iso) {
  if (typeof iso !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return false;
  return isoAusDate(dateAusIso(iso)) === iso;
}
// "2026-10-10" → "10.10.2026"
function datumText(iso) {
  if (!iso) return "–";
  const [j, m, t] = iso.split("-");
  return t + "." + m + "." + j;
}
const WOCHENTAGE = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
function wochentag(iso) { return WOCHENTAGE[dateAusIso(iso).getDay()]; }

function plusTage(iso, tage) {
  const d = dateAusIso(iso);
  d.setDate(d.getDate() + tage);
  return isoAusDate(d);
}
// Montag der Woche, in der das Datum liegt
function montagDerWoche(iso) {
  const tag = dateAusIso(iso).getDay(); // 0 = Sonntag
  return plusTage(iso, -((tag + 6) % 7));
}
// Monate addieren; 31.01. + 1 Monat → 28./29.02.
function plusMonate(iso, monate) {
  const [j, m, t] = iso.split("-").map(Number);
  const ziel = new Date(j, m - 1 + monate, 1, 12);
  const letzterTag = new Date(ziel.getFullYear(), ziel.getMonth() + 1, 0).getDate();
  ziel.setDate(Math.min(t, letzterTag));
  return isoAusDate(ziel);
}
// "2026-10-10" → "10.10."
function kurzDatum(iso) { return datumText(iso).slice(0, 6); }
const MONATE = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
// Erster bzw. letzter Tag eines Monats (monat = 1 … 12)
function monatsanfang(jahr, monat) { return jahr + "-" + zweistellig(monat) + "-01"; }
function monatsende(jahr, monat) {
  return jahr + "-" + zweistellig(monat) + "-" + zweistellig(new Date(jahr, monat, 0).getDate());
}
// Kalenderwoche nach ISO 8601: Die Woche gehört zu dem Jahr, in dem ihr Donnerstag liegt.
function kalenderwoche(iso) {
  const donnerstag = plusTage(montagDerWoche(iso), 3);
  return Math.floor(tageZwischen(donnerstag.slice(0, 4) + "-01-01", donnerstag) / 7) + 1;
}

// Anzahl Tage von a nach b (positiv, wenn b später ist)
function tageZwischen(a, b) {
  const [j1, m1, t1] = a.split("-").map(Number);
  const [j2, m2, t2] = b.split("-").map(Number);
  return Math.round((Date.UTC(j2, m2 - 1, t2) - Date.UTC(j1, m1 - 1, t1)) / 86400000);
}
function tageText(n) { return n === 1 ? "1 Tag" : n + " Tagen"; }

// Kilometer runden (2 Nachkommastellen), um Rechenungenauigkeiten zu vermeiden
function runden(n) { return Math.round(n * 100) / 100; }

const zahlFormat = new Intl.NumberFormat("de-DE", { maximumFractionDigits: 2 });
// 1234.5 → "1.234,5"
function kmText(n) { return n === null || n === undefined ? "–" : zahlFormat.format(runden(n)); }
// 12.5 → "12,5" (für Eingabefelder, ohne Tausenderpunkt)
function kmFeld(n) { return n === null || n === undefined ? "" : String(runden(n)).replace(".", ","); }
// Eingabe → Zahl. Erlaubt "12,5" und "12.5"; "1.234,5" wird zu 1234.5.
// Gibt null zurück, wenn die Eingabe keine gültige Zahl ≥ 0 ist.
function kmLesen(text) {
  let s = String(text).trim().replace(/\s/g, "");
  if (s === "") return null;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  if (!/^\d+(\.\d+)?$/.test(s)) return null;
  return runden(Number(s));
}

// Text sicher in HTML einsetzen (verhindert, dass z. B. "<" die Seite zerstört)
function esc(text) {
  return String(text ?? "").replace(/[&<>"']/g, z => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[z]));
}
function neueId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

/* =====================================================================
   3. DATENMODELL: Laden, Prüfen, Umwandeln, Speichern
   ===================================================================== */

// Die Standard-Wartungsarten. Bei einer Neuinstallation (mitFenster) mit
// jährlichem Zeitfenster; ohne für die Umwandlung von Version-1-Daten.
function standardWartungsarten(mitFenster = true) {
  const art = (id, name, intervallMonate, von, bis) => ({
    id, name, intervallMonate, intervallKm: null,
    fensterVon: mitFenster ? von : null, fensterBis: mitFenster ? bis : null, gueltigAbJahr: null
  });
  return [
    art("grosse-inspektion", "Große Inspektion", 12, 10, 11),
    art("kleine-inspektion", "Kleine Inspektion", null, 3, 4),
    art("reparatur", "Reparatur", null, null, null)
  ];
}
function leereDaten() {
  return {
    version: DATEN_VERSION,
    fahrrad: null,
    vorlagen: [],
    eintraege: [],
    wartungsarten: standardWartungsarten(),
    wartungsprotokoll: [],
    termine: [],
    maengel: []
  };
}

// Umwandlungen für ältere Datenversionen. Jede Funktion hebt die Daten um
// genau eine Version an und lässt alle vorhandenen Angaben unverändert.
const MIGRATIONEN = {
  // Version 1 → 2: Rahmennummer und Beschreibung beim Fahrrad, Zeitfenster
  // bei den Wartungsarten (bleiben leer), neue Mängelliste.
  1: alt => {
    const d = Object.assign({}, alt, { version: 2 });
    if (d.fahrrad && typeof d.fahrrad === "object") {
      d.fahrrad = Object.assign({ rahmennummer: "", beschreibung: "" }, d.fahrrad);
    }
    // In Version 1 bedeutete eine fehlende Liste: die Standard-Wartungsarten (ohne Zeitfenster)
    const arten = d.wartungsarten === undefined ? standardWartungsarten(false) : d.wartungsarten;
    d.wartungsarten = Array.isArray(arten)
      ? arten.map(a => a && typeof a === "object" ? Object.assign({ fensterVon: null, fensterBis: null, gueltigAbJahr: null }, a) : a)
      : arten;
    if (d.maengel === undefined) d.maengel = [];
    return d;
  }
};

function migrieren(roh) {
  if (!roh || typeof roh !== "object" || Array.isArray(roh)) throw new Error("Die Datei enthält keine Rad-km-Daten.");
  if (!Number.isInteger(roh.version) || roh.version < 1) throw new Error("Die Versionsnummer („version“) fehlt oder ist ungültig.");
  if (roh.version > DATEN_VERSION) throw new Error("Die Daten stammen aus einer neueren App-Version (" + roh.version + "). Bitte die App aktualisieren.");
  let d = roh;
  while (d.version < DATEN_VERSION) {
    const schritt = MIGRATIONEN[d.version];
    if (!schritt) throw new Error("Keine Umwandlung für Version " + d.version + " vorhanden.");
    d = schritt(d);
  }
  return d;
}

// Prüft die Daten vollständig und gibt eine bereinigte Kopie zurück.
// Bei einem Fehler wird eine verständliche Meldung geworfen.
function pruefen(d) {
  const fehler = msg => { throw new Error(msg); };
  const istText = v => typeof v === "string";
  const istZahl = v => typeof v === "number" && Number.isFinite(v) && v >= 0;
  const optText = (v, wo) => {
    if (v === undefined || v === null) return "";
    if (!istText(v)) fehler(wo + ": muss ein Text sein.");
    return v;
  };
  const liste = (v, name) => {
    if (v === undefined) return [];
    if (!Array.isArray(v)) fehler("„" + name + "“ muss eine Liste sein.");
    return v;
  };
  const objekte = (v, name) => liste(v, name).map((x, i) => {
    if (!x || typeof x !== "object" || Array.isArray(x)) fehler("„" + name + "“ Nr. " + (i + 1) + " ist kein Objekt.");
    return x;
  });

  const erg = { version: DATEN_VERSION };

  // Fahrrad
  if (d.fahrrad === null || d.fahrrad === undefined) {
    erg.fahrrad = null;
  } else {
    const f = d.fahrrad;
    if (typeof f !== "object" || Array.isArray(f)) fehler("Fahrrad: muss ein Objekt oder null sein.");
    if (!istText(f.name) || !f.name.trim()) fehler("Fahrrad: Name fehlt.");
    if (!istGueltigesDatum(f.startdatum)) fehler("Fahrrad: Startdatum ist ungültig (Format JJJJ-MM-TT).");
    if (!istZahl(f.startKm)) fehler("Fahrrad: Start-Kilometerstand muss eine Zahl ≥ 0 sein.");
    erg.fahrrad = {
      name: f.name.trim(),
      startdatum: f.startdatum,
      startKm: runden(f.startKm),
      rahmennummer: optText(f.rahmennummer, "Fahrrad (rahmennummer)").trim(),
      beschreibung: optText(f.beschreibung, "Fahrrad (beschreibung)").trim()
    };
  }

  // Vorlagen
  erg.vorlagen = objekte(d.vorlagen, "vorlagen").map((v, i) => {
    const wo = "Vorlage Nr. " + (i + 1);
    if (!istText(v.name) || !v.name.trim()) fehler(wo + ": Name fehlt.");
    if (!istZahl(v.km)) fehler(wo + " („" + v.name + "“): km muss eine Zahl ≥ 0 sein.");
    return { id: istText(v.id) && v.id ? v.id : neueId(), name: v.name.trim(), km: runden(v.km) };
  });

  // Einträge
  const daten = new Set();
  erg.eintraege = objekte(d.eintraege, "eintraege").map((e, i) => {
    const wo = "Eintrag Nr. " + (i + 1);
    if (!istGueltigesDatum(e.datum)) fehler(wo + ": Datum ist ungültig (Format JJJJ-MM-TT).");
    if (daten.has(e.datum)) fehler("Doppeltes Datum " + datumText(e.datum) + ": pro Tag ist nur ein Eintrag erlaubt.");
    daten.add(e.datum);
    if (!istZahl(e.km)) fehler("Eintrag vom " + datumText(e.datum) + ": km muss eine Zahl ≥ 0 sein.");
    const typ = e.typ === undefined ? "tag" : e.typ;
    if (typ !== "tag" && typ !== "woche") fehler("Eintrag vom " + datumText(e.datum) + ": typ muss „tag“ oder „woche“ sein.");
    const vorlage = optText(e.vorlage, "Eintrag vom " + datumText(e.datum) + " (vorlage)");
    return {
      id: istText(e.id) && e.id ? e.id : neueId(),
      datum: e.datum,
      km: runden(e.km),
      vorlage: vorlage || null,
      notiz: optText(e.notiz, "Eintrag vom " + datumText(e.datum) + " (notiz)"),
      typ: typ
    };
  });

  // Wartungsarten
  const artIds = new Set();
  const istMonat = v => Number.isInteger(v) && v >= 1 && v <= 12;
  erg.wartungsarten = d.wartungsarten === undefined ? standardWartungsarten() : objekte(d.wartungsarten, "wartungsarten").map((a, i) => {
    const wo = "Wartungsart Nr. " + (i + 1);
    if (!istText(a.id) || !a.id) fehler(wo + ": id fehlt.");
    if (artIds.has(a.id)) fehler(wo + ": id „" + a.id + "“ kommt doppelt vor.");
    artIds.add(a.id);
    if (!istText(a.name) || !a.name.trim()) fehler(wo + ": Name fehlt.");
    const wn = wo + " („" + a.name + "“)";
    const im = a.intervallMonate ?? null;
    if (im !== null && !(Number.isInteger(im) && im >= 1)) fehler(wn + ": intervallMonate muss eine ganze Zahl ≥ 1 oder null sein.");
    const ik = a.intervallKm ?? null;
    if (ik !== null && !(istZahl(ik) && ik > 0)) fehler(wn + ": intervallKm muss eine Zahl > 0 oder null sein.");
    const von = a.fensterVon ?? null, bis = a.fensterBis ?? null;
    if ((von === null) !== (bis === null)) fehler(wn + ": fensterVon und fensterBis müssen beide gesetzt oder beide null sein.");
    if (von !== null && !(istMonat(von) && istMonat(bis))) fehler(wn + ": fensterVon und fensterBis müssen Monate von 1 bis 12 sein.");
    if (von !== null && von > bis) fehler(wn + ": Das Zeitfenster darf nicht über den Jahreswechsel gehen (fensterVon ≤ fensterBis).");
    const ab = a.gueltigAbJahr ?? null;
    if (ab !== null && !(Number.isInteger(ab) && ab >= 1900 && ab <= 9999)) fehler(wn + ": gueltigAbJahr muss eine Jahreszahl oder null sein.");
    if (ab !== null && von === null) fehler(wn + ": gueltigAbJahr ist nur mit Zeitfenster erlaubt.");
    return {
      id: a.id, name: a.name.trim(), intervallMonate: im, intervallKm: ik === null ? null : runden(ik),
      fensterVon: von, fensterBis: bis, gueltigAbJahr: ab
    };
  });
  if (d.wartungsarten === undefined) erg.wartungsarten.forEach(a => artIds.add(a.id));

  // Wartungsprotokoll
  const protIds = new Set();
  erg.wartungsprotokoll = objekte(d.wartungsprotokoll, "wartungsprotokoll").map((p, i) => {
    const wo = "Wartungsprotokoll Nr. " + (i + 1);
    if (!istGueltigesDatum(p.datum)) fehler(wo + ": Datum ist ungültig (Format JJJJ-MM-TT).");
    if (!artIds.has(p.wartungsartId)) fehler(wo + " (" + datumText(p.datum) + "): unbekannte wartungsartId „" + p.wartungsartId + "“.");
    const ks = p.kmStand ?? null;
    if (ks !== null && !istZahl(ks)) fehler(wo + " (" + datumText(p.datum) + "): kmStand muss eine Zahl ≥ 0 oder null sein.");
    let manuell = p.kmManuell;
    if (manuell === undefined) manuell = ks !== null; // fehlt die Angabe, gilt ein vorhandener Wert als von Hand eingetragen
    if (typeof manuell !== "boolean") fehler(wo + ": kmManuell muss true oder false sein.");
    const id = istText(p.id) && p.id ? p.id : neueId();
    if (protIds.has(id)) fehler(wo + ": id „" + id + "“ kommt doppelt vor.");
    protIds.add(id);
    return {
      id,
      datum: p.datum,
      wartungsartId: p.wartungsartId,
      werkstatt: optText(p.werkstatt, wo + " (werkstatt)"),
      kmStand: ks === null ? null : runden(ks),
      kmManuell: manuell && ks !== null,
      notiz: optText(p.notiz, wo + " (notiz)")
    };
  });

  // Geplante Termine
  const terminArten = new Set();
  erg.termine = objekte(d.termine, "termine").map((t, i) => {
    const wo = "Termin Nr. " + (i + 1);
    if (!artIds.has(t.wartungsartId)) fehler(wo + ": unbekannte wartungsartId „" + t.wartungsartId + "“.");
    if (terminArten.has(t.wartungsartId)) fehler(wo + ": pro Wartungsart ist nur ein geplanter Termin erlaubt.");
    terminArten.add(t.wartungsartId);
    if (!istGueltigesDatum(t.datum)) fehler(wo + ": Datum ist ungültig (Format JJJJ-MM-TT).");
    return { wartungsartId: t.wartungsartId, datum: t.datum, werkstatt: optText(t.werkstatt, wo + " (werkstatt)") };
  });

  // Mängel
  erg.maengel = objekte(d.maengel, "maengel").map((m, i) => {
    const wo = "Mangel Nr. " + (i + 1);
    if (!istGueltigesDatum(m.datum)) fehler(wo + ": Datum ist ungültig (Format JJJJ-MM-TT).");
    if (!istText(m.beschreibung) || !m.beschreibung.trim()) fehler(wo + " (" + datumText(m.datum) + "): Beschreibung fehlt.");
    const status = m.status === undefined ? "offen" : m.status;
    if (status !== "offen" && status !== "erledigt") fehler(wo + " (" + datumText(m.datum) + "): status muss „offen“ oder „erledigt“ sein.");
    const am = m.erledigtAm ?? null;
    if (am !== null && !istGueltigesDatum(am)) fehler(wo + " (" + datumText(m.datum) + "): erledigtAm ist ungültig (Format JJJJ-MM-TT).");
    const pid = m.protokollId ?? null;
    if (pid !== null && !protIds.has(pid)) fehler(wo + " (" + datumText(m.datum) + "): unbekannte protokollId „" + pid + "“.");
    const erledigt = status === "erledigt";
    return {
      id: istText(m.id) && m.id ? m.id : neueId(),
      datum: m.datum,
      beschreibung: m.beschreibung.trim(),
      status,
      // Bei offenen Mängeln gibt es weder Erledigt-Datum noch Verknüpfung
      erledigtAm: erledigt ? am : null,
      protokollId: erledigt ? pid : null
    };
  });

  return erg;
}

// JSON-Text (aus dem Speicher oder einer Datei) → geprüfte Daten der aktuellen Version
function datenEinlesen(text) {
  let roh;
  try { roh = JSON.parse(text); } catch (e) { throw new Error("Die Datei ist keine gültige JSON-Datei."); }
  return pruefen(migrieren(roh));
}

// Die Daten der App – alles, was angezeigt wird, kommt von hier.
let daten = leereDaten();
let ladeFehler = null;

function laden() {
  let text;
  try {
    text = localStorage.getItem(SPEICHER_SCHLUESSEL);
  } catch (e) {
    ladeFehler = "Der Speicher des Browsers ist nicht verfügbar (privater Modus?). Daten können nicht gespeichert werden.";
    return;
  }
  if (!text) return; // erster Start
  try {
    daten = datenEinlesen(text);
  } catch (e) {
    // Defekte Daten nicht überschreiben, sondern beiseitelegen
    try { localStorage.setItem(SPEICHER_SCHLUESSEL + "-defekt-" + Date.now(), text); } catch (_) {}
    ladeFehler = "Die gespeicherten Daten konnten nicht gelesen werden (" + e.message + "). Eine Kopie wurde beiseitegelegt. Bitte eine Sicherung importieren.";
    daten = leereDaten();
  }
}

function speichern() {
  aktualisiereProtokollKm();
  try {
    localStorage.setItem(SPEICHER_SCHLUESSEL, JSON.stringify(daten));
    return true;
  } catch (e) {
    alert("Speichern fehlgeschlagen: " + e.message);
    return false;
  }
}

function letzterExport() {
  try { return localStorage.getItem(EXPORT_SCHLUESSEL); } catch (e) { return null; }
}

/* =====================================================================
   4. BERECHNUNGEN
   ===================================================================== */

function eintragAm(iso) { return daten.eintraege.find(e => e.datum === iso) || null; }

function summe(filter) {
  return runden(daten.eintraege.filter(filter).reduce((s, e) => s + e.km, 0));
}

// Kilometerstand am Ende des Tages "iso". null, wenn kein Fahrrad angelegt
// ist oder das Datum vor dem Startdatum liegt.
function kmStandAm(iso) {
  const f = daten.fahrrad;
  if (!f || iso < f.startdatum) return null;
  return runden(f.startKm + summe(e => e.datum >= f.startdatum && e.datum <= iso));
}

// Aktueller Kilometerstand = Start + alle Einträge ab dem Startdatum
function aktuellerKmStand() {
  const f = daten.fahrrad;
  if (!f) return null;
  return runden(f.startKm + summe(e => e.datum >= f.startdatum));
}

// Nicht von Hand überschriebene Kilometerstände im Protokoll neu berechnen
function aktualisiereProtokollKm() {
  daten.wartungsprotokoll.forEach(p => {
    if (!p.kmManuell) p.kmStand = kmStandAm(p.datum);
  });
}

function wochenEintragInWoche(iso, ausserId) {
  const montag = montagDerWoche(iso);
  return daten.eintraege.find(e => e.typ === "woche" && e.id !== ausserId && montagDerWoche(e.datum) === montag) || null;
}

function artName(id) {
  const a = daten.wartungsarten.find(a => a.id === id);
  return a ? a.name : "(unbekannt)";
}

function hatZeitfenster(art) { return art.fensterVon !== null && art.fensterVon !== undefined; }
// Erster bzw. letzter Tag des Zeitfensters einer Wartungsart im Jahr "jahr"
function fensterBeginn(art, jahr) { return monatsanfang(jahr, art.fensterVon); }
function fensterEnde(art, jahr) { return monatsende(jahr, art.fensterBis); }
// "Oktober–November" bzw. "Mai"
function fensterText(art) {
  return art.fensterVon === art.fensterBis ? MONATE[art.fensterVon - 1] : MONATE[art.fensterVon - 1] + "–" + MONATE[art.fensterBis - 1];
}

// Fälligkeit einer Wartungsart mit jährlichem Zeitfenster.
//   durchfuehrungen: Datumswerte aus dem Wartungsprotokoll für diese Art
//   startdatum: Startdatum des Fahrrads oder null
//   h: Stichtag ("heute")
// Regeln: Pro Jahr ist die Wartung im Fenster fällig. Zählt ein Fenster und
// gibt es ab seinem Beginn keine Durchführung, ist die Wartung ab dem Tag nach
// dem Fensterende überfällig – auch über den Jahreswechsel, bis sie
// durchgeführt wird. Eine Durchführung nach dem Fensterende ist eine
// Nachholung. Eine Durchführung vor dem Fenster zählt nicht für dieses Fenster.
// Ein Fenster zählt ab "gueltigAbJahr" und nur, wenn es nicht vor dem
// Startdatum des Fahrrads endet (ohne Fahrrad: ab dem laufenden Jahr).
function saisonStatus(art, durchfuehrungen, startdatum, h) {
  const jahr = Number(h.slice(0, 4));
  const ab = art.gueltigAbJahr ?? null;
  if (ab !== null && jahr < ab) {
    return { text: "noch nicht fällig (gültig ab " + ab + ")", klasse: "", datum: null };
  }
  const bisher = durchfuehrungen.filter(d => d <= h).sort();
  const letzte = bisher.length ? bisher[bisher.length - 1] : null;
  const zaehlt = j => (ab === null || j >= ab) && (startdatum ? fensterEnde(art, j) >= startdatum : j >= jahr);
  const imFenster = j => bisher.some(d => d >= fensterBeginn(art, j) && d <= fensterEnde(art, j));

  // Ältestes versäumtes Fenster suchen
  const erstesJahr = ab !== null ? ab : startdatum ? Number(startdatum.slice(0, 4)) : jahr;
  for (let j = erstesJahr; j <= jahr; j++) {
    const ende = fensterEnde(art, j);
    if (zaehlt(j) && ende < h && (letzte === null || letzte < fensterBeginn(art, j))) {
      return { text: "überfällig seit " + datumText(ende), klasse: "status-rot", datum: ende };
    }
  }

  const beginn = fensterBeginn(art, jahr), ende = fensterEnde(art, jahr), naechster = fensterBeginn(art, jahr + 1);
  if (h < beginn) {
    // Vor dem Fenster: Wurde das Vorjahr erst nach dem Fenster nachgeholt, das anzeigen
    if (letzte && zaehlt(jahr - 1) && letzte > fensterEnde(art, jahr - 1) && !imFenster(jahr - 1)) {
      return { text: "erledigt (nachgeholt), nächste ab " + datumText(beginn), klasse: "status-gruen", datum: beginn };
    }
    return { text: "fällig ab " + kurzDatum(beginn), klasse: tageZwischen(h, beginn) <= 30 ? "status-orange" : "status-gruen", datum: beginn };
  }
  if (letzte && letzte >= beginn) {
    return { text: (imFenster(jahr) ? "erledigt" : "erledigt (nachgeholt)") + ", nächste ab " + datumText(naechster), klasse: "status-gruen", datum: naechster };
  }
  if (h <= ende) return { text: "fällig bis " + kurzDatum(ende), klasse: "status-orange", datum: ende };
  // Fenster dieses Jahres zählt nicht (z. B. Fahrrad erst danach angelegt)
  return { text: "fällig ab " + datumText(naechster), klasse: "status-gruen", datum: naechster };
}

// Fälligkeit einer Wartungsart mit Intervall in Monaten (ohne Zeitfenster)
function intervallStatus(art, letzte, h) {
  if (!art.intervallMonate) return { text: "ohne Intervall", klasse: "", datum: null, nochNie: false };
  if (!letzte) return { text: "noch nicht durchgeführt", klasse: "status-orange", datum: null, nochNie: true };
  const faellig = plusMonate(letzte.datum, art.intervallMonate);
  const t = tageZwischen(h, faellig);
  if (t > 0) return { text: "fällig in " + tageText(t) + " (" + datumText(faellig) + ")", klasse: t <= 30 ? "status-orange" : "status-gruen", datum: faellig };
  if (t === 0) return { text: "heute fällig", klasse: "status-rot", datum: faellig };
  return { text: "überfällig seit " + tageText(-t) + " (" + datumText(faellig) + ")", klasse: "status-rot", datum: faellig };
}

// Status einer Wartungsart: letzte Durchführung, Termin, Fälligkeit, Anzeigetext.
// "regel" ist die Fälligkeit ohne Berücksichtigung eines geplanten Termins.
function wartungsStatus(art, h = heute()) {
  const durchfuehrungen = daten.wartungsprotokoll
    .filter(p => p.wartungsartId === art.id)
    .sort((a, b) => b.datum.localeCompare(a.datum));
  const letzte = durchfuehrungen[0] || null;
  const termin = daten.termine.find(t => t.wartungsartId === art.id) || null;

  let seitKm = null;
  if (letzte) {
    const aktuell = aktuellerKmStand();
    seitKm = (letzte.kmStand !== null && aktuell !== null)
      ? runden(aktuell - letzte.kmStand)
      : summe(e => e.datum > letzte.datum);
  }

  const regel = hatZeitfenster(art)
    ? Object.assign({ nochNie: false }, saisonStatus(art, durchfuehrungen.map(p => p.datum), daten.fahrrad ? daten.fahrrad.startdatum : null, h))
    : intervallStatus(art, letzte, h);
  const st = { art, letzte, termin, seitKm, regel, datum: regel.datum, text: regel.text, klasse: regel.klasse, nochNie: regel.nochNie };

  // Ein geplanter Termin hat Vorrang in der Anzeige
  if (termin) {
    const t = tageZwischen(h, termin.datum);
    st.datum = termin.datum;
    st.text = "Termin am " + datumText(termin.datum) + (termin.werkstatt ? " bei " + termin.werkstatt : "") +
      (t > 0 ? " (in " + tageText(t) + ")" : t === 0 ? " (heute)" : " (vor " + tageText(-t) + ", noch nicht als erledigt eingetragen)");
    st.klasse = t < 0 ? "status-orange" : "status-gruen";
    st.nochNie = false;
  }
  return st;
}

// Nächste fällige Wartung für die Startseite
function naechsteWartung() {
  const alle = daten.wartungsarten.map(a => wartungsStatus(a));
  const mitDatum = alle.filter(s => s.datum).sort((a, b) => a.datum.localeCompare(b.datum));
  if (mitDatum.length) return mitDatum[0];
  return alle.find(s => s.nochNie) || null;
}

function offeneMaengel() {
  return daten.maengel.filter(m => m.status === "offen").sort((a, b) => b.datum.localeCompare(a.datum));
}
function maengelText(n) { return n === 1 ? "1 offener Mangel" : n + " offene Mängel"; }

// ---------- Zusammenfassung der Einträge (nur Anzeige) ----------
// Eine Woche (Mo–So) ist ab dem folgenden Montag abgeschlossen. Ein Monat bzw.
// ein Jahr ist abgeschlossen, wenn die Woche abgeschlossen ist, die seinen
// letzten Tag enthält. Summen zählen nach Kalenderdatum; eine Woche über
// einen Monatswechsel erscheint in jedem Monat als Teilwoche.
function abgeschlossenBis(letzterTag, stichtag) {
  return stichtag >= plusTage(montagDerWoche(letzterTag), 7);
}

// Liefert die Zeilen der obersten Ebene, neueste zuerst. Jede Gruppe hat
//   { art: "jahr" | "monat" | "woche", schluessel, titel, von, bis, km, anzahl, kinder }
// und jede Eintragszeile { art: "eintrag", schluessel, eintrag }.
function gruppieren(eintraege, stichtag) {
  const absteigend = (a, b) => b.localeCompare(a);
  const nachSchluessel = (liste, f) => {
    const m = new Map();
    liste.forEach(e => { const k = f(e); if (!m.has(k)) m.set(k, []); m.get(k).push(e); });
    return [...m.keys()].sort(absteigend).map(k => [k, m.get(k)]);
  };
  const eintragsZeilen = liste => [...liste].sort((a, b) => absteigend(a.datum, b.datum))
    .map(e => ({ art: "eintrag", schluessel: "e" + e.id, eintrag: e }));
  const gruppe = (art, schluessel, titel, von, bis, liste, kinder) => ({
    art, schluessel, titel, von, bis, kinder,
    km: runden(liste.reduce((s, e) => s + e.km, 0)), anzahl: liste.length
  });

  // Wochen innerhalb eines Monats (am Monatsrand als Teilwoche)
  const wochenDesMonats = (ym, liste) => {
    const [j, m] = ym.split("-").map(Number);
    const anfang = monatsanfang(j, m), ende = monatsende(j, m);
    return nachSchluessel(liste, e => montagDerWoche(e.datum)).map(([montag, wl]) => {
      const sonntag = plusTage(montag, 6);
      const teil = montag < anfang || sonntag > ende;
      const von = montag < anfang ? anfang : montag, bis = sonntag > ende ? ende : sonntag;
      return { montag, liste: wl, knoten: () => gruppe("woche", "w" + ym + "|" + montag,
        "KW " + kalenderwoche(montag) + (teil ? " (Teil)" : ""), von, bis, wl, eintragsZeilen(wl)) };
    });
  };
  const monatsKnoten = (ym, liste) => {
    const [j, m] = ym.split("-").map(Number);
    return gruppe("monat", "m" + ym, MONATE[m - 1] + " " + j, monatsanfang(j, m), monatsende(j, m), liste,
      wochenDesMonats(ym, liste).map(w => w.knoten()));
  };

  const zeilen = [];
  nachSchluessel(eintraege, e => e.datum.slice(0, 4)).forEach(([jahr, jl]) => {
    const monate = nachSchluessel(jl, e => e.datum.slice(0, 7));
    if (abgeschlossenBis(jahr + "-12-31", stichtag)) {
      zeilen.push(gruppe("jahr", "j" + jahr, jahr, jahr + "-01-01", jahr + "-12-31", jl, monate.map(([ym, ml]) => monatsKnoten(ym, ml))));
      return;
    }
    monate.forEach(([ym, ml]) => {
      const [j, m] = ym.split("-").map(Number);
      if (abgeschlossenBis(monatsende(j, m), stichtag)) { zeilen.push(monatsKnoten(ym, ml)); return; }
      wochenDesMonats(ym, ml).forEach(w => {
        if (abgeschlossenBis(plusTage(w.montag, 6), stichtag)) zeilen.push(w.knoten());
        else zeilen.push(...eintragsZeilen(w.liste));
      });
    });
  });
  return zeilen;
}

/* =====================================================================
   5. KLEINE BAUSTEINE DER OBERFLÄCHE: Fenster, Rückfrage, Meldung
   ===================================================================== */

const fenster = document.getElementById("fenster");
const fensterInhalt = document.getElementById("fensterinhalt");

function fensterOeffnen(html) {
  fensterInhalt.innerHTML = html;
  if (!fenster.open) fenster.showModal();
  fenster.scrollTop = 0;
}
function fensterSchliessen() { if (fenster.open) fenster.close(); }

// Rückfrage mit zwei Schaltflächen. Liefert true (Ja) oder false (Nein/Abbrechen).
function frage(text, jaText = "OK", neinText = "Abbrechen", gefaehrlich = false) {
  const dlg = document.getElementById("frage");
  document.getElementById("frageinhalt").innerHTML =
    '<p style="margin-top:0">' + text + '</p>' +
    '<div class="knopfreihe">' +
    '<button type="button" data-antwort="nein">' + esc(neinText) + '</button>' +
    '<button type="button" data-antwort="ja" class="' + (gefaehrlich ? "gefahr" : "primaer") + '">' + esc(jaText) + '</button>' +
    '</div>';
  return new Promise(fertig => {
    const klick = ev => {
      const b = ev.target.closest("[data-antwort]");
      if (!b) return;
      dlg.removeEventListener("click", klick);
      dlg.close();
      fertig(b.dataset.antwort === "ja");
    };
    dlg.addEventListener("click", klick);
    dlg.addEventListener("cancel", () => { dlg.removeEventListener("click", klick); fertig(false); }, { once: true });
    dlg.showModal();
  });
}

let toastTimer;
function meldung(text) {
  const t = document.getElementById("toast");
  t.textContent = text;
  t.classList.add("sichtbar");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("sichtbar"), 1800);
}

function wert(id) { return document.getElementById(id).value; }

/* =====================================================================
   6. BILDSCHIRME
   Jeder Bildschirm ist eine Funktion, die HTML-Text erzeugt.
   Nach jeder Änderung wird der aktuelle Bildschirm neu gezeichnet.
   ===================================================================== */

let aktiverTab = "uebersicht";
// Aufgeklappte Zeilen der Eintragsliste (nur solange die App geöffnet ist)
const offeneGruppen = new Set();
let erledigteMaengelOffen = false;

const TITEL = { uebersicht: "Übersicht", wartung: "Wartung", vorlagen: "Vorlagen", einstellungen: "Einstellungen" };

function zeichnen() {
  document.getElementById("seitentitel").textContent = TITEL[aktiverTab];
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("aktiv", b.dataset.tab === aktiverTab));
  const bildschirme = { uebersicht: bildUebersicht, wartung: bildWartung, vorlagen: bildVorlagen, einstellungen: bildEinstellungen };
  let html = ladeFehler ? '<div class="hinweis fehler">' + esc(ladeFehler) + '</div>' : "";
  html += bildschirme[aktiverTab]();
  document.getElementById("inhalt").innerHTML = html;
}

// Detailansicht (nur lesen): Liste aus [Bezeichnung, HTML-Wert]; leere Werte entfallen
function detailListe(felder) {
  return '<dl class="details">' + felder.filter(f => f[1] !== "" && f[1] !== null && f[1] !== undefined)
    .map(f => '<dt>' + f[0] + '</dt><dd>' + f[1] + '</dd>').join("") + '</dl>';
}

/* ---------- Übersicht ---------- */
function bildUebersicht() {
  const h = heute();
  let html = "";

  if (!daten.fahrrad) {
    html += '<div class="hinweis info"><strong>Willkommen!</strong><br>Bitte lege zuerst dein Fahrrad mit Startdatum und Start-Kilometerstand an.' +
      '<br><button type="button" class="primaer" data-action="fahrrad-aendern">Fahrrad anlegen</button></div>';
  }

  // Erinnerung an die Datensicherung
  const le = letzterExport();
  const exportAlter = le ? tageZwischen(le, h) : null;
  if (daten.fahrrad && (le === null || exportAlter > EXPORT_ERINNERUNG_TAGE)) {
    html += '<div class="hinweis warn"><strong>⚠️ Datensicherung fällig</strong><br>' +
      (le === null ? "Du hast noch nie exportiert." : "Letzter Export vor " + tageText(exportAlter) + " (" + datumText(le) + ").") +
      ' Die Daten liegen nur auf diesem Gerät.<br><button type="button" class="primaer" data-action="export">Jetzt exportieren</button></div>';
  }

  // Kilometerstand, nächste Wartung und offene Mängel
  html += '<div class="karte"><div class="klein">' + esc(daten.fahrrad ? daten.fahrrad.name : "Kilometerstand") + '</div>' +
    '<div class="stand-zahl">' + kmText(aktuellerKmStand()) + ' km</div>';
  const nw = naechsteWartung();
  if (nw) {
    html += '<div style="margin-top:8px">🔧 ' + esc(nw.art.name) + ': <span class="' + nw.klasse + '">' + esc(nw.text) + '</span></div>';
  } else {
    html += '<div class="klein" style="margin-top:8px">🔧 Keine Wartung fällig</div>';
  }
  const anzahlMaengel = offeneMaengel().length;
  if (anzahlMaengel) {
    html += '<div class="status-orange" style="margin-top:4px">⚠️ ' + maengelText(anzahlMaengel) + '</div>';
  }
  html += '</div>';

  // Schnellerfassung
  const eHeute = eintragAm(h);
  html += '<h2>Heute erfassen</h2>';
  if (eHeute) {
    html += '<div class="hinweis info">✓ Heute erfasst: <strong>' + kmText(eHeute.km) + ' km</strong>' +
      (eHeute.vorlage ? " (" + esc(eHeute.vorlage) + ")" : "") +
      '<br><button type="button" data-action="eintrag-ansehen" data-id="' + eHeute.id + '">Anzeigen</button></div>';
  }
  html += '<div class="schnell">';
  daten.vorlagen.forEach(v => {
    html += '<button type="button" class="primaer" data-action="vorlage-erfassen" data-id="' + v.id + '">' +
      '<span>' + esc(v.name) + '</span><span class="km">' + kmText(v.km) + ' km</span></button>';
  });
  html += '<button type="button" data-action="eintrag-neu"><span>Andere km</span><span class="km">frei eingeben</span></button>';
  html += '</div>';
  if (!daten.vorlagen.length) {
    html += '<p class="klein">Tipp: Lege unter „Vorlagen“ deine Standard-Strecken an, dann erfasst du einen Tag mit zwei Klicks.</p>';
  }

  // Summen
  const montag = montagDerWoche(h), sonntag = plusTage(montag, 6);
  html += '<h2>Summen</h2><div class="summen">' +
    kachel("Heute", summe(e => e.datum === h)) +
    kachel("Woche", summe(e => e.datum >= montag && e.datum <= sonntag)) +
    kachel("Monat", summe(e => e.datum.slice(0, 7) === h.slice(0, 7))) +
    kachel("Jahr", summe(e => e.datum.slice(0, 4) === h.slice(0, 4))) +
    '</div>';

  // Liste der Einträge, abgeschlossene Zeiträume zusammengefasst
  html += '<h2>Einträge <span class="klein">(' + daten.eintraege.length + ')</span></h2><div class="liste">';
  if (!daten.eintraege.length) html += '<div class="leer">Noch keine Einträge.</div>';
  html += zeilenHtml(gruppieren(daten.eintraege, h), 0);
  html += '</div>';
  return html;
}

function kachel(titel, km) {
  return '<div class="summe"><div class="wert">' + kmText(km) + '</div><div class="titel">' + titel + ' (km)</div></div>';
}

// Zeilen der Eintragsliste; aufgeklappte Gruppen zeigen ihre Kinder eingerückt darunter
function zeilenHtml(zeilen, tiefe) {
  const einzug = ' style="padding-left:' + (16 + tiefe * 16) + 'px"';
  return zeilen.map(z => {
    if (z.art === "eintrag") return eintragsZeile(z.eintrag, einzug);
    const offen = offeneGruppen.has(z.schluessel);
    const zeitraum = z.art === "woche" ? kurzDatum(z.von) + "–" + kurzDatum(z.bis) : "";
    const unten = [zeitraum, z.anzahl === 1 ? "1 Eintrag" : z.anzahl + " Einträge"].filter(Boolean).join(" · ");
    return '<div class="zeile gruppe">' +
      '<button type="button" class="inhalt" data-action="gruppe" data-key="' + esc(z.schluessel) + '" aria-expanded="' + offen + '"' + einzug + '>' +
      '<span class="pfeil">' + (offen ? "▾" : "▸") + '</span>' +
      '<div class="text"><div class="titel">' + esc(z.titel) + '</div><div class="klein">' + unten + '</div></div>' +
      '<span class="zahl" style="padding-right:16px">' + kmText(z.km) + ' km</span></button></div>' +
      (offen ? zeilenHtml(z.kinder, tiefe + 1) : "");
  }).join("");
}

function eintragsZeile(e, einzug) {
  const vorStart = daten.fahrrad && e.datum < daten.fahrrad.startdatum;
  const unten = [e.vorlage, e.notiz].filter(Boolean).map(esc).join(" · ");
  return '<div class="zeile">' +
    '<button type="button" class="inhalt" data-action="eintrag-ansehen" data-id="' + e.id + '"' + einzug + '>' +
    '<div class="text"><div>' + wochentag(e.datum) + ', ' + datumText(e.datum) +
    (e.typ === "woche" ? '<span class="abzeichen">Woche</span>' : "") + '</div>' +
    (unten ? '<div class="klein">' + unten + '</div>' : "") +
    (vorStart ? '<div class="klein">vor dem Startdatum – zählt nicht zum Kilometerstand</div>' : "") +
    '</div><span class="zahl" style="padding-right:16px">' + kmText(e.km) + ' km</span></button>' +
    '</div>';
}

function gruppeUmschalten(schluessel) {
  if (offeneGruppen.has(schluessel)) offeneGruppen.delete(schluessel);
  else offeneGruppen.add(schluessel);
  zeichnen();
}

/* ---------- Eintrag: Detailansicht und Formular ---------- */

function eintragAnsicht(id, hinweis) {
  const e = daten.eintraege.find(e => e.id === id);
  if (!e) return;
  const vorStart = daten.fahrrad && e.datum < daten.fahrrad.startdatum;
  const stand = kmStandAm(e.datum);
  fensterOeffnen(
    '<h2>Eintrag' + (e.typ === "woche" ? ' <span class="abzeichen">Woche</span>' : "") + '</h2>' +
    (hinweis ? '<div class="hinweis info">' + esc(hinweis) + '</div>' : "") +
    detailListe([
      ["Datum", wochentag(e.datum) + ", " + datumText(e.datum)],
      ["Kilometer", kmText(e.km) + " km"],
      ["Art", e.typ === "woche" ? "Importierte Wochensumme (Datum = Montag bzw. erster Fahrtag der Woche)" : "Tages-Eintrag"],
      ["Vorlage", esc(e.vorlage || "")],
      ["Notiz", esc(e.notiz)],
      ["Kilometerstand am Ende des Tages", vorStart ? "vor dem Startdatum – zählt nicht zum Kilometerstand" : stand === null ? "" : kmText(stand) + " km"]
    ]) +
    '<div class="knopfreihe"><button type="button" data-action="fenster-zu">Schließen</button>' +
    '<button type="button" class="primaer" data-action="eintrag-aendern" data-id="' + e.id + '">Ändern</button></div>'
  );
}

// Zustand des gerade geöffneten Eintrags-Formulars
let formEintrag = null; // { id | null, typ, ursprungsDatum }

// Neuer Eintrag. Gibt es für das Datum schon einen Eintrag, wird dieser angezeigt.
function eintragNeu(vorgabe) {
  const datum = vorgabe.datum || heute();
  const vorhanden = eintragAm(datum);
  if (vorhanden) {
    eintragAnsicht(vorhanden.id, "Für den " + datumText(datum) + " gibt es bereits einen Eintrag. Mit „Ändern“ kannst du ihn bearbeiten.");
  } else {
    eintragsFormular({ id: null, datum, km: vorgabe.km ?? null, vorlage: vorgabe.vorlage || null, notiz: "", typ: "tag" }, "");
  }
}

function eintragsFormular(e, hinweis) {
  formEintrag = { id: e.id, typ: e.typ, ursprungsDatum: e.id ? e.datum : null };
  let optionen = '<option value="">– keine –</option>';
  let gefunden = false;
  daten.vorlagen.forEach(v => {
    const sel = v.name === e.vorlage;
    if (sel) gefunden = true;
    optionen += '<option value="' + esc(v.id) + '"' + (sel ? " selected" : "") + '>' + esc(v.name) + ' (' + kmText(v.km) + ' km)</option>';
  });
  // Vorlage wurde gelöscht oder umbenannt: Namen trotzdem behalten
  if (e.vorlage && !gefunden) {
    optionen += '<option value="__alt__" selected>' + esc(e.vorlage) + ' (Vorlage existiert nicht mehr)</option>';
  }
  formEintrag.alteVorlage = e.vorlage;

  fensterOeffnen(
    '<h2>' + (e.id ? "Eintrag bearbeiten" : "Neuer Eintrag") +
    (e.typ === "woche" ? ' <span class="abzeichen">Woche</span>' : "") + '</h2>' +
    (hinweis ? '<div class="hinweis info">' + esc(hinweis) + '</div>' : "") +
    (e.typ === "woche" ? '<div class="klein">Importierte Wochensumme – das Datum ist der Montag bzw. erste Fahrtag der Woche.</div>' : "") +
    '<label for="f-datum">Datum</label>' +
    '<input type="date" id="f-datum" value="' + e.datum + '" data-change="eintrag-datum">' +
    '<div class="feldhinweis warn" id="f-datum-hinweis"></div>' +
    '<label for="f-vorlage">Vorlage (optional)</label>' +
    '<select id="f-vorlage" data-change="eintrag-vorlage">' + optionen + '</select>' +
    '<label for="f-km">Kilometer</label>' +
    '<input type="text" id="f-km" inputmode="decimal" autocomplete="off" placeholder="z. B. 12,5" value="' + kmFeld(e.km) + '">' +
    '<label for="f-notiz">Notiz (optional)</label>' +
    '<input type="text" id="f-notiz" value="' + esc(e.notiz) + '">' +
    '<div class="knopfreihe">' +
    (e.id ? '<button type="button" data-action="eintrag-ansehen" data-id="' + e.id + '">Abbrechen</button>'
          : '<button type="button" data-action="fenster-zu">Abbrechen</button>') +
    '<button type="button" class="primaer" data-action="eintrag-speichern">Speichern</button>' +
    '</div>' +
    (e.id ? '<div class="knopfreihe"><button type="button" class="gefahr voll" data-action="eintrag-loeschen" data-id="' + e.id + '">Eintrag löschen</button></div>' : "")
  );
  datumHinweis();
}

function datumHinweis() {
  const d = wert("f-datum");
  const el = document.getElementById("f-datum-hinweis");
  el.textContent = (daten.fahrrad && d && d < daten.fahrrad.startdatum)
    ? "Dieses Datum liegt vor dem Startdatum (" + datumText(daten.fahrrad.startdatum) + ") und zählt nicht zum Kilometerstand."
    : "";
}

// Datum im Formular geändert: existiert dort schon ein Eintrag, wechseln
function eintragDatumGeaendert() {
  const d = wert("f-datum");
  const vorhanden = istGueltigesDatum(d) ? eintragAm(d) : null;
  if (vorhanden && vorhanden.id !== formEintrag.id) {
    eintragsFormular(vorhanden, "Für den " + datumText(d) + " gibt es bereits einen Eintrag. Du kannst ihn hier bearbeiten.");
    return;
  }
  datumHinweis();
}

function eintragVorlageGeaendert() {
  const v = daten.vorlagen.find(v => v.id === wert("f-vorlage"));
  if (v) document.getElementById("f-km").value = kmFeld(v.km);
}

async function eintragSpeichern() {
  const datum = wert("f-datum");
  const km = kmLesen(wert("f-km"));
  if (!istGueltigesDatum(datum)) { alert("Bitte ein gültiges Datum wählen."); return; }
  if (km === null) { alert("Bitte die Kilometer als Zahl eingeben, z. B. 12,5."); return; }
  const anderer = eintragAm(datum);
  if (anderer && anderer.id !== formEintrag.id) { alert("Für den " + datumText(datum) + " gibt es bereits einen Eintrag."); return; }

  const vw = wert("f-vorlage");
  const vorlage = vw === "__alt__" ? formEintrag.alteVorlage : (daten.vorlagen.find(v => v.id === vw)?.name || null);

  // Warnung: Tages-Eintrag in einer Woche, für die es schon eine Wochensumme gibt
  const neuOderVerschoben = !formEintrag.id || formEintrag.ursprungsDatum !== datum;
  if (formEintrag.typ === "tag" && neuOderVerschoben) {
    const w = wochenEintragInWoche(datum, formEintrag.id);
    if (w) {
      const mo = montagDerWoche(datum);
      const ok = await frage("In der Woche vom " + datumText(mo) + " bis " + datumText(plusTage(mo, 6)) +
        " gibt es bereits einen <strong>Wochen-Eintrag</strong> (" + kmText(w.km) + " km am " + datumText(w.datum) +
        "). Die Kilometer würden dann doppelt zählen.<br><br>Trotzdem speichern?", "Trotzdem speichern", "Abbrechen");
      if (!ok) return;
    }
  }

  const notiz = wert("f-notiz").trim();
  if (formEintrag.id) {
    const e = daten.eintraege.find(e => e.id === formEintrag.id);
    Object.assign(e, { datum, km, vorlage, notiz });
  } else {
    daten.eintraege.push({ id: neueId(), datum, km, vorlage, notiz, typ: "tag" });
  }
  if (speichern()) {
    fensterSchliessen();
    zeichnen();
    meldung("Gespeichert: " + kmText(km) + " km");
  }
}

async function eintragLoeschen(id) {
  const e = daten.eintraege.find(e => e.id === id);
  if (!e) return;
  const ok = await frage("Eintrag vom " + datumText(e.datum) + " (" + kmText(e.km) + " km) wirklich löschen?", "Löschen", "Abbrechen", true);
  if (!ok) return;
  daten.eintraege = daten.eintraege.filter(x => x.id !== id);
  if (speichern()) { fensterSchliessen(); zeichnen(); meldung("Eintrag gelöscht"); }
}

/* ---------- Wartung ---------- */
function bildWartung() {
  let html = "";
  daten.wartungsarten.forEach(art => {
    const st = wartungsStatus(art);
    html += '<div class="karte"><h3>' + esc(art.name) + '</h3>' +
      '<div class="' + st.klasse + '">' + esc(st.text) + '</div>';
    if (st.termin && st.regel.datum) {
      // Bei geplantem Termin zusätzlich die Fälligkeit nach Regel klein zeigen
      html += '<div class="klein">Ohne Termin: ' + esc(st.regel.text) + '</div>';
    }
    if (hatZeitfenster(art)) {
      html += '<div class="klein">Zeitfenster: ' + fensterText(art) + (art.gueltigAbJahr ? ", gültig ab " + art.gueltigAbJahr : "") + '</div>';
    }
    if (st.letzte) {
      html += '<div class="klein">Zuletzt: ' + datumText(st.letzte.datum) +
        (st.letzte.werkstatt ? " bei " + esc(st.letzte.werkstatt) : "") +
        (st.letzte.kmStand !== null ? " · " + kmText(st.letzte.kmStand) + " km" : "") + '</div>' +
        '<div class="klein">Seit letzter Wartung gefahren: ' + kmText(st.seitKm) + ' km</div>';
    } else if (!st.nochNie) {
      html += '<div class="klein">Noch nicht durchgeführt</div>';
    }
    html += '<div class="knopfreihe">' +
      '<button type="button" data-action="termin" data-id="' + esc(art.id) + '">' + (st.termin ? "Termin ändern" : "Termin planen") + '</button>' +
      '<button type="button" class="primaer" data-action="wartung-erledigt" data-id="' + esc(art.id) + '">Erledigt eintragen</button>' +
      '</div></div>';
  });

  // Mängel
  const offen = offeneMaengel();
  const erledigt = daten.maengel.filter(m => m.status === "erledigt")
    .sort((a, b) => (b.erledigtAm || b.datum).localeCompare(a.erledigtAm || a.datum));
  html += '<h2>Mängel <span class="klein">(' + offen.length + ' offen)</span></h2><div class="liste">';
  if (!offen.length) html += '<div class="leer">Keine offenen Mängel.</div>';
  offen.forEach(m => { html += mangelZeile(m); });
  html += '</div><div class="knopfreihe"><button type="button" data-action="mangel-neu">+ Mangel erfassen</button></div>';
  if (erledigt.length) {
    html += '<div class="liste" style="margin-top:12px"><div class="zeile gruppe">' +
      '<button type="button" class="inhalt" data-action="maengel-erledigt-umschalten" aria-expanded="' + erledigteMaengelOffen + '">' +
      '<span class="pfeil">' + (erledigteMaengelOffen ? "▾" : "▸") + '</span>' +
      '<div class="text"><div class="titel">Erledigte Mängel (' + erledigt.length + ')</div></div></button></div>' +
      (erledigteMaengelOffen ? erledigt.map(mangelZeile).join("") : "") + '</div>';
  }

  // Protokoll
  const prot = [...daten.wartungsprotokoll].sort((a, b) => b.datum.localeCompare(a.datum));
  html += '<h2>Wartungsprotokoll</h2><div class="liste">';
  if (!prot.length) html += '<div class="leer">Noch keine Wartung eingetragen.</div>';
  prot.forEach(p => {
    const unten = [p.werkstatt, p.notiz].filter(Boolean).map(esc).join(" · ");
    html += '<div class="zeile">' +
      '<button type="button" class="inhalt" data-action="protokoll-ansehen" data-id="' + p.id + '">' +
      '<div class="text"><div>' + datumText(p.datum) + ' · <strong>' + esc(artName(p.wartungsartId)) + '</strong></div>' +
      (unten ? '<div class="klein">' + unten + '</div>' : "") +
      '</div><span class="zahl" style="padding-right:16px">' + (p.kmStand !== null ? kmText(p.kmStand) + ' km' : "") + '</span></button>' +
      '</div>';
  });
  html += '</div>';

  // Wartungsarten verwalten
  html += '<h2>Wartungsarten</h2><div class="liste">';
  daten.wartungsarten.forEach(a => {
    let regel;
    if (hatZeitfenster(a)) {
      regel = "Zeitfenster: " + fensterText(a) + (a.gueltigAbJahr ? ", ab " + a.gueltigAbJahr : "");
    } else {
      const iv = [a.intervallMonate ? a.intervallMonate + " Monate" : "", a.intervallKm ? kmText(a.intervallKm) + " km" : ""].filter(Boolean).join(" / ");
      regel = iv ? "Intervall: " + iv : "ohne Intervall";
    }
    html += '<div class="zeile"><button type="button" class="inhalt" data-action="art-bearbeiten" data-id="' + esc(a.id) + '">' +
      '<div class="text"><div>' + esc(a.name) + '</div><div class="klein">' + regel + '</div></div>' +
      '<span class="klein" style="padding-right:16px">›</span></button></div>';
  });
  html += '</div><div class="knopfreihe"><button type="button" data-action="art-neu">+ Neue Wartungsart</button></div>';
  return html;
}

function mangelZeile(m) {
  const unten = m.status === "erledigt"
    ? "erledigt" + (m.erledigtAm ? " am " + datumText(m.erledigtAm) : "")
    : "festgestellt am " + datumText(m.datum);
  return '<div class="zeile"><button type="button" class="inhalt" data-action="mangel-ansehen" data-id="' + m.id + '">' +
    '<div class="text"><div>' + esc(m.beschreibung) + '</div><div class="klein">' + unten + '</div></div>' +
    '<span class="klein" style="padding-right:16px">›</span></button></div>';
}

// Geplanter Termin
function terminFormular(artId) {
  const art = daten.wartungsarten.find(a => a.id === artId);
  const t = daten.termine.find(t => t.wartungsartId === artId);
  fensterOeffnen(
    '<h2>Termin: ' + esc(art.name) + '</h2>' +
    '<label for="t-datum">Datum</label><input type="date" id="t-datum" value="' + (t ? t.datum : "") + '">' +
    '<label for="t-werkstatt">Werkstatt</label><input type="text" id="t-werkstatt" value="' + esc(t ? t.werkstatt : "") + '">' +
    '<div class="knopfreihe"><button type="button" data-action="fenster-zu">Abbrechen</button>' +
    '<button type="button" class="primaer" data-action="termin-speichern" data-id="' + esc(artId) + '">Speichern</button></div>' +
    (t ? '<div class="knopfreihe"><button type="button" class="gefahr voll" data-action="termin-loeschen" data-id="' + esc(artId) + '">Termin entfernen</button></div>' : "")
  );
}
function terminSpeichern(artId) {
  const datum = wert("t-datum");
  if (!istGueltigesDatum(datum)) { alert("Bitte ein gültiges Datum wählen."); return; }
  daten.termine = daten.termine.filter(t => t.wartungsartId !== artId);
  daten.termine.push({ wartungsartId: artId, datum, werkstatt: wert("t-werkstatt").trim() });
  if (speichern()) { fensterSchliessen(); zeichnen(); meldung("Termin gespeichert"); }
}
async function terminLoeschen(artId) {
  if (!await frage("Geplanten Termin wirklich entfernen?", "Entfernen", "Abbrechen", true)) return;
  daten.termine = daten.termine.filter(t => t.wartungsartId !== artId);
  if (speichern()) { fensterSchliessen(); zeichnen(); }
}

// Mängel, die mit einem Protokoll-Eintrag verknüpft sind
function maengelZuProtokoll(id) { return daten.maengel.filter(m => m.protokollId === id); }

function protokollAnsicht(id) {
  const p = daten.wartungsprotokoll.find(p => p.id === id);
  if (!p) return;
  const maengel = maengelZuProtokoll(p.id);
  fensterOeffnen(
    '<h2>Wartung</h2>' +
    detailListe([
      ["Datum", wochentag(p.datum) + ", " + datumText(p.datum)],
      ["Wartungsart", esc(artName(p.wartungsartId))],
      ["Werkstatt", esc(p.werkstatt)],
      ["Kilometerstand", p.kmStand === null ? "–" : kmText(p.kmStand) + " km" + (p.kmManuell ? " (von Hand eingetragen)" : " (berechnet)")],
      ["Durchgeführte Arbeiten / Notiz", p.notiz ? '<span class="umbrueche">' + esc(p.notiz) + '</span>' : ""],
      ["Erledigte Mängel", maengel.map(m => "✓ " + esc(m.beschreibung)).join("<br>")]
    ]) +
    '<div class="knopfreihe"><button type="button" data-action="fenster-zu">Schließen</button>' +
    '<button type="button" class="primaer" data-action="protokoll-aendern" data-id="' + p.id + '">Ändern</button></div>'
  );
}

// Zustand des Protokoll-Formulars
let formProtokoll = null; // { id | null, manuell, terminUebernommen }

async function wartungErledigt(artId) {
  const t = daten.termine.find(t => t.wartungsartId === artId);
  let vorgabe = { id: null, datum: heute(), wartungsartId: artId, werkstatt: "", kmStand: null, kmManuell: false, notiz: "" };
  let uebernommen = false;
  if (t) {
    uebernommen = await frage("Für <strong>" + esc(artName(artId)) + "</strong> ist ein Termin am " + datumText(t.datum) +
      (t.werkstatt ? " bei " + esc(t.werkstatt) : "") + " geplant. Diesen Termin ins Protokoll übernehmen?",
      "Übernehmen", "Nein, anderes Datum");
    if (uebernommen) { vorgabe.datum = t.datum; vorgabe.werkstatt = t.werkstatt; }
  }
  protokollFormular(vorgabe, uebernommen);
}

function protokollFormular(p, terminUebernommen) {
  formProtokoll = { id: p.id, manuell: p.kmManuell, terminUebernommen: !!terminUebernommen };
  const optionen = daten.wartungsarten.map(a =>
    '<option value="' + esc(a.id) + '"' + (a.id === p.wartungsartId ? " selected" : "") + '>' + esc(a.name) + '</option>').join("");
  // Zum Abhaken: alle offenen Mängel und die schon mit diesem Eintrag verknüpften
  const verknuepft = p.id ? maengelZuProtokoll(p.id) : [];
  const zumAbhaken = [...verknuepft, ...offeneMaengel()];
  const maengelHtml = zumAbhaken.length
    ? '<label>Erledigte Mängel abhaken</label>' + zumAbhaken.map(m =>
        '<label class="haken"><input type="checkbox" name="p-mangel" value="' + m.id + '"' + (m.protokollId === p.id && p.id ? " checked" : "") + '>' +
        '<span>' + esc(m.beschreibung) + ' <span class="klein">(' + datumText(m.datum) + ')</span></span></label>').join("")
    : "";
  fensterOeffnen(
    '<h2>' + (p.id ? "Wartung bearbeiten" : "Wartung eintragen") + '</h2>' +
    (terminUebernommen ? '<div class="hinweis info">Der geplante Termin wird nach dem Speichern entfernt.</div>' : "") +
    '<label for="p-datum">Datum</label><input type="date" id="p-datum" value="' + p.datum + '" data-change="protokoll-datum">' +
    '<label for="p-art">Wartungsart</label><select id="p-art">' + optionen + '</select>' +
    '<label for="p-werkstatt">Werkstatt</label><input type="text" id="p-werkstatt" value="' + esc(p.werkstatt) + '">' +
    '<label for="p-km">Kilometerstand</label>' +
    '<input type="text" id="p-km" inputmode="decimal" autocomplete="off" data-input="protokoll-km">' +
    '<div class="feldhinweis" id="p-km-hinweis"></div>' +
    '<label for="p-notiz">Durchgeführte Arbeiten / Notiz</label><textarea id="p-notiz">' + esc(p.notiz) + '</textarea>' +
    maengelHtml +
    '<div class="knopfreihe">' +
    (p.id ? '<button type="button" data-action="protokoll-ansehen" data-id="' + p.id + '">Abbrechen</button>'
          : '<button type="button" data-action="fenster-zu">Abbrechen</button>') +
    '<button type="button" class="primaer" data-action="protokoll-speichern">Speichern</button></div>' +
    (p.id ? '<div class="knopfreihe"><button type="button" class="gefahr voll" data-action="protokoll-loeschen" data-id="' + p.id + '">Eintrag löschen</button></div>' : "")
  );
  document.getElementById("p-km").value = p.kmManuell ? kmFeld(p.kmStand) : kmFeld(kmStandAm(p.datum));
  protokollKmHinweis();
}

function protokollKmHinweis() {
  const d = wert("p-datum");
  const berechnet = istGueltigesDatum(d) ? kmStandAm(d) : null;
  const el = document.getElementById("p-km-hinweis");
  if (formProtokoll.manuell) {
    el.innerHTML = "Von Hand eingetragen. Berechnet wären: " + kmText(berechnet) + " km " +
      '<button type="button" class="leise" data-action="protokoll-km-neu">Berechneten Wert verwenden</button>';
  } else if (berechnet === null) {
    el.textContent = "Kann nicht berechnet werden (kein Fahrrad angelegt oder Datum vor dem Startdatum). Du kannst den Wert von Hand eintragen.";
  } else {
    el.textContent = "Automatisch berechnet aus den Einträgen bis einschließlich diesem Datum. Du kannst den Wert überschreiben.";
  }
}
function protokollDatumGeaendert() {
  if (!formProtokoll.manuell) {
    const d = wert("p-datum");
    document.getElementById("p-km").value = istGueltigesDatum(d) ? kmFeld(kmStandAm(d)) : "";
  }
  protokollKmHinweis();
}
function protokollKmEingabe() {
  if (!formProtokoll.manuell) { formProtokoll.manuell = true; protokollKmHinweis(); }
}
function protokollKmNeu() {
  formProtokoll.manuell = false;
  protokollDatumGeaendert();
}

// Mangel wieder öffnen (Verknüpfung und Erledigt-Datum entfernen)
function mangelWiederOeffnen(m) { Object.assign(m, { status: "offen", erledigtAm: null, protokollId: null }); }

function protokollSpeichern() {
  const datum = wert("p-datum");
  if (!istGueltigesDatum(datum)) { alert("Bitte ein gültiges Datum wählen."); return; }
  const kmEingabe = wert("p-km").trim();
  let manuell = formProtokoll.manuell && kmEingabe !== "";
  let kmStand = null;
  if (manuell) {
    kmStand = kmLesen(kmEingabe);
    if (kmStand === null) { alert("Bitte den Kilometerstand als Zahl eingeben, z. B. 1234,5."); return; }
  }
  const artId = wert("p-art");
  const satz = { datum, wartungsartId: artId, werkstatt: wert("p-werkstatt").trim(), kmStand, kmManuell: manuell, notiz: wert("p-notiz").trim() };
  let id = formProtokoll.id;
  if (id) {
    Object.assign(daten.wartungsprotokoll.find(p => p.id === id), satz);
  } else {
    id = neueId();
    daten.wartungsprotokoll.push(Object.assign({ id }, satz));
  }
  // Abgehakte Mängel erledigen und verknüpfen; nicht mehr abgehakte wieder öffnen
  const abgehakt = new Set([...document.querySelectorAll('input[name="p-mangel"]:checked')].map(el => el.value));
  daten.maengel.forEach(m => {
    if (abgehakt.has(m.id)) Object.assign(m, { status: "erledigt", erledigtAm: datum, protokollId: id });
    else if (m.protokollId === id) mangelWiederOeffnen(m);
  });
  if (formProtokoll.terminUebernommen) {
    daten.termine = daten.termine.filter(t => t.wartungsartId !== artId);
  }
  if (speichern()) {
    fensterSchliessen(); zeichnen();
    meldung(abgehakt.size ? "Wartung gespeichert, " + (abgehakt.size === 1 ? "1 Mangel" : abgehakt.size + " Mängel") + " erledigt" : "Wartung gespeichert");
  }
}
async function protokollLoeschen(id) {
  const p = daten.wartungsprotokoll.find(p => p.id === id);
  if (!p) return;
  const verknuepft = maengelZuProtokoll(id);
  const zusatz = verknuepft.length
    ? "<br><br>" + (verknuepft.length === 1 ? "Der verknüpfte Mangel wird" : "Die " + verknuepft.length + " verknüpften Mängel werden") +
      " wieder auf <strong>offen</strong> gesetzt:<br>" + verknuepft.map(m => "• " + esc(m.beschreibung)).join("<br>")
    : "";
  if (!await frage("Wartung „" + esc(artName(p.wartungsartId)) + "“ vom " + datumText(p.datum) + " wirklich löschen?" + zusatz, "Löschen", "Abbrechen", true)) return;
  verknuepft.forEach(mangelWiederOeffnen);
  daten.wartungsprotokoll = daten.wartungsprotokoll.filter(x => x.id !== id);
  if (speichern()) { fensterSchliessen(); zeichnen(); }
}

/* ---------- Mängel ---------- */
function mangelAnsicht(id) {
  const m = daten.maengel.find(m => m.id === id);
  if (!m) return;
  const p = m.protokollId ? daten.wartungsprotokoll.find(p => p.id === m.protokollId) : null;
  fensterOeffnen(
    '<h2>Mangel</h2>' +
    detailListe([
      ["Festgestellt am", datumText(m.datum)],
      ["Beschreibung", '<span class="umbrueche">' + esc(m.beschreibung) + '</span>'],
      ["Status", m.status === "erledigt" ? '<span class="status-gruen">erledigt</span>' : '<span class="status-orange">offen</span>'],
      ["Erledigt am", m.erledigtAm ? datumText(m.erledigtAm) : ""],
      ["Erledigt mit Wartung", p ? '<button type="button" class="leise" style="padding:0;min-height:0" data-action="protokoll-ansehen" data-id="' + p.id + '">' +
        esc(artName(p.wartungsartId)) + " vom " + datumText(p.datum) + '</button>' : ""]
    ]) +
    '<div class="knopfreihe"><button type="button" data-action="fenster-zu">Schließen</button>' +
    '<button type="button" class="primaer" data-action="mangel-aendern" data-id="' + m.id + '">Ändern</button></div>'
  );
}

function mangelFormular(id) {
  const m = id ? daten.maengel.find(m => m.id === id) : { datum: heute(), beschreibung: "", status: "offen", erledigtAm: null, protokollId: null };
  const p = m.protokollId ? daten.wartungsprotokoll.find(p => p.id === m.protokollId) : null;
  fensterOeffnen(

function mangelSpeichern(id) {

  if (!istGueltigesDatum(datum)) { alert("Bitte ein gültiges Datum wählen."); return; }
  if (!beschreibung) { alert("Bitte den Mangel beschreiben."); return; }
  let erledigtAm = null;
  if (status === "erledigt") {

function artFensterGeaendert() {
  document.getElementById("a-fenster-feld").hidden = !(wert("a-von") || wert("a-bis"));
}
function artSpeichern(id) {
  const name = wert("a-name").trim();
  if (!name) { alert("Bitte einen Namen eingeben."); return; }
  const von = wert("a-von") ? Number(wert("a-von")) : null;
  const bis = wert("a-bis") ? Number(wert("a-bis")) : null;
  if ((von === null) !== (bis === null)) { alert("Für das Zeitfenster bitte beide Monate wählen (oder beide leer lassen)."); return; }
  if (von !== null && von > bis) { alert("Das Zeitfenster darf nicht über den Jahreswechsel gehen: „Monat von“ muss vor oder gleich „Monat bis“ sein."); return; }
  let ab = null;
  if (von !== null) {
    const abText = wert("a-ab").trim();
    ab = abText === "" ? null : Number(abText);
    if (ab !== null && !(Number.isInteger(ab) && ab >= 1900 && ab <= 9999)) { alert("„Gültig ab Jahr“ muss eine Jahreszahl sein, z. B. 2027 (oder leer)."); return; }
  }
  const mText = wert("a-monate").trim();
  const monate = mText === "" ? null : Number(mText);
  if (monate !== null && !(Number.isInteger(monate) && monate >= 1)) { alert("Das Intervall in Monaten muss eine ganze Zahl ab 1 sein (oder leer)."); return; }
  const kText = wert("a-km").trim();
  const km = kText === "" ? null : kmLesen(kText);
  if (kText !== "" && !(km > 0)) { alert("Das Intervall in km muss eine Zahl größer 0 sein (oder leer)."); return; }
  const satz = { name, intervallMonate: monate, intervallKm: km, fensterVon: von, fensterBis: bis, gueltigAbJahr: ab };
  if (id) {
    Object.assign(daten.wartungsarten.find(a => a.id === id), satz);
  } else {
    daten.wartungsarten.push(Object.assign({ id: neueId() }, satz));
  }
  if (speichern()) { fensterSchliessen(); zeichnen(); }
}
async function artLoeschen(id) {

   ===================================================================== */

function exportVermerken() {
  try { localStorage.setItem(EXPORT_SCHLUESSEL, heute()); } catch (e) {}
  zeichnen();
}

// Export: zuerst über das Teilen-Menü (iPhone), sonst als Download.
// Wichtig: navigator.share muss direkt nach dem Antippen aufgerufen werden,
// deshalb hier kein "await" vor dem Teilen.
function exportInhalt() {
  return JSON.stringify(Object.assign({ exportiertAm: new Date().toISOString() }, daten), null, 2);
}
function exportieren() {
  const inhalt = exportInhalt();
  const dateiname = "rad-km-" + heute() + ".json";
  let datei = null;
  try { datei = new File([inhalt], dateiname, { type: "application/json" }); } catch (e) {}

  if (datei && navigator.canShare && navigator.canShare({ files: [datei] })) {
    navigator.share({ files: [datei], title: dateiname })
      .then(() => { exportVermerken(); meldung("Export erstellt"); })
      .catch(err => {
        if (err && err.name === "AbortError") return; // vom Nutzer abgebrochen
        herunterladen(inhalt, dateiname);
      });
  } else {
    herunterladen(inhalt, dateiname);
  }
}
function herunterladen(inhalt, dateiname) {
  const url = URL.createObjectURL(new Blob([inhalt], { type: "application/json" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = dateiname;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  exportVermerken();
  meldung("Datei heruntergeladen");
}

function importStarten() {
  const eingabe = document.getElementById("importdatei");
  eingabe.value = "";
  eingabe.click();
}
async function importDateiGewaehlt(datei) {
  if (!datei) return;
  let neu;
  try {
    neu = datenEinlesen(await datei.text());
  } catch (e) {
    alert("Import nicht möglich:\n" + e.message);
    return;
  }
  const zusammenfassung =
    "<strong>" + esc(datei.name) + "</strong><br>" +
    "Fahrrad: " + (neu.fahrrad ? esc(neu.fahrrad.name) : "–") + "<br>" +
    neu.eintraege.length + " Einträge, " + neu.vorlagen.length + " Vorlagen, " +
    neu.wartungsarten.length + " Wartungsarten, " + neu.wartungsprotokoll.length + " Wartungen, " +
    neu.termine.length + " geplante Termine, " + neu.maengel.length + " Mängel" +
    (neu.maengel.length ? " (davon " + neu.maengel.filter(m => m.status === "offen").length + " offen)" : "") + ".<br><br>" +
    "<strong>Alle vorhandenen Daten in der App werden ersetzt.</strong> Fortfahren?";
  if (!await frage(zusammenfassung, "Importieren und ersetzen", "Abbrechen", true)) return;
  daten = neu;
  ladeFehler = null;
  if (speichern()) { zeichnen(); meldung("Import erfolgreich"); }
}

});

  const name = ev.target.dataset && ev.target.dataset.change;
  if (name) AENDERUNGEN[name]();
});
document.addEventListener("input", ev => {
  const name = ev.target.dataset && ev.target.dataset.input;
  if (name) EINGABEN[name]();
});
document.getElementById("importdatei").addEventListener("change", ev => importDateiGewaehlt(ev.target.files[0]));

// Tippen neben das Fenster schließt es
fenster.addEventListener("click", ev => { if (ev.target === fenster) fensterSchliessen(); });

// Beim Zurückkehren in die App (z. B. am nächsten Tag) "heute" neu berechnen
document.addEventListener("visibilitychange", () => { if (!document.hidden && !fenster.open) zeichnen(); });
