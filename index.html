  standort.laeuft = false;
  wetterNeuZeichnen();
}

// ---------- Zeiten ----------

// Zeitpunkt "minuten" nach Mitternacht (Ortszeit) am Tag "datum"; auch an Tagen mit Zeitumstellung
function zeitpunktAm(datum, minuten) {
  const [j, m, t] = datum.split("-").map(Number);
  return new Date(j, m - 1, t, 0, minuten).getTime();
}
function uhrzeit(ms) { const d = new Date(ms); return zweistellig(d.getHours()) + ":" + zweistellig(d.getMinutes()); }
function tagTitel(datum, h) { return datum === h ? "Heute" : datum === plusTage(h, 1) ? "Morgen" : wochentag(datum) + " " + kurzDatum(datum); }
// "20:15 Uhr", "gestern, 20:15 Uhr" bzw. "Fr 23.10., 20:15 Uhr"
function standText(ms, jetzt) {
  const datum = isoAusDate(new Date(ms)), h = isoAusDate(new Date(jetzt));
  const tag = datum === h ? "" : datum === plusTage(h, -1) ? "gestern, " : wochentag(datum) + " " + kurzDatum(datum) + ", ";
  return tag + uhrzeit(ms) + " Uhr";
}

// Angezeigter Tag: heute bis zum Ende der Rückfahrt (Standard 17 Uhr), danach
// morgen. Hin- und Rückfahrt gibt es nur, wenn dieser Tag ein Fahrtag ist, also
// für einen Fahrtag erst ab dem Ende der Rückfahrt am Vortag. Sonst nennt
// "naechster" den nächsten Fahrtag und "empfehlungAb" den Vortag, ab dem es sie gibt.
function wetterTag(jetzt, w = daten.einstellungen.wetter, fahrtage = daten.einstellungen.fahrtage) {
  const d = new Date(jetzt), h = isoAusDate(d);
  const datum = d.getHours() * 60 + d.getMinutes() >= minutenAus(w.rueckfahrt.bis) ? plusTage(h, 1) : h;
  const fahrtag = fahrtage.includes(isoWochentag(datum));
  let naechster = null;
  if (!fahrtag && fahrtage.length) {
    naechster = plusTage(datum, 1);
    while (!fahrtage.includes(isoWochentag(naechster))) naechster = plusTage(naechster, 1);
  }
  return { datum, heute: datum === h, fahrtag, titel: tagTitel(datum, h), naechster, empfehlungAb: naechster && plusTage(naechster, -1) };
}
// "Empfehlung für Mo 02.11. ab So 17:00" bzw. "… ab heute 17:00"
function empfehlungAbText(tag, h, w = daten.einstellungen.wetter) {
  if (!tag.naechster) return null;
  return "Empfehlung für " + wochentag(tag.naechster) + " " + kurzDatum(tag.naechster) + " ab " +
    (tag.empfehlungAb === h ? "heute" : wochentag(tag.empfehlungAb)) + " " + w.rueckfahrt.bis;
}

// ---------- Werte eines Zeitraums ----------

// Erster Index mit zeit[i] >= t (Zeiten aufsteigend)
function ersterIndex(zeit, t) {
  let a = 0, b = zeit.length;
  while (a < b) { const m = (a + b) >> 1; if (zeit[m] < t) a = m + 1; else b = m; }
  return a;
}
// Werte eines Orts für den Zeitraum [von, bis) als Reihen { t, v }.
// Momentwerte (Temperatur, Wind, Wettercode) zählen zu Zeitpunkten von ≤ t < bis.
// Niederschlag und Böen gelten für die 15 Minuten vor t, zählen also für
// von < t ≤ bis; t in der Reihe ist der Beginn dieser 15 Minuten. Die
// stündliche Regenwahrscheinlichkeit gilt für die Stunde vor t.
function ortWerte(d, von, bis) {
  const m = d.m15, s = d.stunde;
  const r = { temperatur: [], gefuehlt: [], code: [], wind: [], niederschlag: [], boeen: [], vorher: [], wahrscheinlichkeit: [], boden: [] };
  const neu = (reihe, t, v) => { if (typeof v === "number") reihe.push({ t, v }); };
  for (let i = ersterIndex(m.zeit, von - NASS_STUNDEN * STUNDE_MS); i < m.zeit.length && m.zeit[i] <= bis; i++) {
    const t = m.zeit[i];
    if (t >= von && t < bis) {
      neu(r.temperatur, t, m.temperatur[i]); neu(r.gefuehlt, t, m.gefuehlt[i]); neu(r.code, t, m.code[i]);
      if (typeof m.wind[i] === "number" && typeof m.richtung[i] === "number") r.wind.push({ v: m.wind[i], r: m.richtung[i] });
    }
    if (t > von && t <= bis) {
      neu(r.niederschlag, Math.max(von, t - VIERTELSTUNDE_MS), m.niederschlag[i]);
      neu(r.boeen, Math.max(von, t - VIERTELSTUNDE_MS), m.boeen[i]);
    }
    if (t > von - NASS_STUNDEN * STUNDE_MS && t <= von) neu(r.vorher, t, m.niederschlag[i]);
  }
  for (let i = ersterIndex(s.zeit, von - STUNDE_MS); i < s.zeit.length && s.zeit[i] < bis + STUNDE_MS; i++) {
    const t = s.zeit[i];
    if (t > von) neu(r.wahrscheinlichkeit, Math.max(von, t - STUNDE_MS), s.wahrscheinlichkeit[i]);
    if (t > von - STUNDE_MS) neu(r.boden, t, s.boden[i]);

}
const summeVon = reihe => reihe.reduce((x, p) => x + p.v, 0);
// Frühester Zeitpunkt, an dem die Bedingung erfüllt ist (null = nie)
function erstesMal(reihe, bedingung) {
  return reihe.reduce((t, p) => bedingung(p.v) && (t === null || p.t < t) ? p.t : t, null);
}

// ---------- Ampel je Fahrt ----------

const zahl0 = new Intl.NumberFormat("de-DE", { maximumFractionDigits: 0 });
const zahl1 = new Intl.NumberFormat("de-DE", { maximumFractionDigits: 1 });
// Negative Zahlen mit echtem Minuszeichen
const minus = text => text.replace("-", "−");
function gradText(t, stellen = 0) {
  const f = 10 ** stellen;
  return minus((stellen ? zahl1 : zahl0).format(Math.round(t * f) / f || 0)) + " °C";
}
function kmhText(v) { return zahl0.format(Math.round(v)) + " km/h"; }
function mmhText(v) { return zahl1.format(Math.round(v * 10) / 10) + " mm/h"; }
function grundText(g) { return g.text + (g.zeit ? " ab " + uhrzeit(g.zeit) : ""); }

// Glätte aus der Vorhersage: gefrierender Regen, oder kalt (Luft ≤ Grenze bzw.
// Boden ≤ 0 °C) und nass (Niederschlag während der Fahrt oder in den Stunden davor)
function glaetteErkennen(orte, g) {
  let erg = null;
  orte.forEach(o => {
    const gefrierend = erstesMal(o.code, v => GEFRIEREND_CODES.includes(v));
    const kaltLuft = erstesMal(o.temperatur, v => v <= g.glaetteTemperatur);
    const kaltBoden = o.boden.some(p => p.v <= 0);
    const nassVorher = summeVon(o.vorher) >= 0.1;
    const regen = erstesMal(o.niederschlag, v => v > 0);
    let fund = null;
    if (gefrierend !== null) fund = { text: "Glätte (gefrierender Regen)", zeit: gefrierend };
    else if ((kaltLuft !== null || kaltBoden) && (nassVorher || regen !== null)) {
      fund = { text: nassVorher ? "Glätte (nasse Straße)" : "Glätte", zeit: nassVorher ? kaltLuft : regen };
    }
    if (fund && (!erg || (fund.zeit ?? 0) < (erg.zeit ?? 0))) erg = fund;
  });
  return erg;
}

// Bewertet eine Fahrt im Zeitraum [von, bis) an allen Orten (es gilt jeweils der
// ungünstigere Wert). Liefert { farbe, gruende, text, werte } oder null, wenn
// für den Zeitraum keine Vorhersage vorliegt.
function fahrtBewerten(orteDaten, warnungen, von, bis, g = daten.einstellungen.wetter.ampel) {
  const orte = orteDaten.map(d => ortWerte(d, von, bis));
  if (orte.some(o => !o.temperatur.length || !o.gefuehlt.length || !o.niederschlag.length)) return null;
  const alle = feld => orte.flatMap(o => o[feld]);
  const groesster = feld => Math.max(...alle(feld).map(p => p.v));
  const werte = {
    temperatur: Math.min(...alle("temperatur").map(p => p.v)),
    gefuehlt: Math.min(...alle("gefuehlt").map(p => p.v)),
    niederschlag: Math.round(Math.max(...orte.map(o => summeVon(o.niederschlag))) * 10) / 10,
    intensitaet: groesster("niederschlag") * 4,
    regenWahrscheinlichkeit: alle("wahrscheinlichkeit").length ? groesster("wahrscheinlichkeit") : null,
    boeen: alle("boeen").length ? groesster("boeen") : 0,
    windProben: alle("wind"),
    windJeOrt: orte.map(o => o.wind)

  const gruende = [];
  const grund = (farbe, art, text, zeit) => gruende.push({ farbe, art, text, zeit: zeit !== null && zeit > von ? zeit : null });

  // Amtliche Warnungen zuerst: Gewitter und Glätte immer rot, sonst ab der Stufe für Rot; Hitze und UV nur zur Info
  const gesehen = new Set();
  warnungen.filter(wn => wn.art !== "gesundheit" && warnungImZeitraum(wn, von, bis)).forEach(wn => {
    if (gesehen.has(wn.ereignis)) return;
    gesehen.add(wn.ereignis);
    const rot = wn.art === "gewitter" || wn.art === "glaette" || wn.stufe >= g.rotWarnstufe;
    grund(rot ? "rot" : "gelb", "warnung", "Warnung " + wn.ereignis + " (Stufe " + wn.stufe + ")", wn.beginn);
  });
  // Rot aus der Vorhersage
  const gewitter = erstesMal(alle("code"), v => GEWITTER_CODES.includes(v));
  if (gewitter !== null) grund("rot", "gewitter", "Gewitter", gewitter);
  const glaette = glaetteErkennen(orte, g);
  if (glaette) grund("rot", "glaette", glaette.text, glaette.zeit);
  if (werte.boeen >= g.rotBoeen) grund("rot", "boeen", "Böen " + kmhText(werte.boeen), erstesMal(alle("boeen"), v => v >= g.rotBoeen));
  if (werte.intensitaet >= g.rotStarkregen) grund("rot", "regen", "Starkregen " + mmhText(werte.intensitaet), erstesMal(alle("niederschlag"), v => v * 4 >= g.rotStarkregen));
  // Gelb
  const regenZeit = erstesMal(alle("niederschlag"), v => v > 0);
  const wahrscheinlich = werte.regenWahrscheinlichkeit !== null && werte.regenWahrscheinlichkeit >= g.gelbRegenWahrscheinlichkeit;
  const regnerisch = werte.intensitaet >= g.gelbNiederschlag && werte.intensitaet < g.rotStarkregen;
  if (wahrscheinlich) {
    grund("gelb", "regen", werte.regenWahrscheinlichkeit + " % Regen", regenZeit ?? erstesMal(alle("wahrscheinlichkeit"), v => v >= g.gelbRegenWahrscheinlichkeit));
  } else if (regnerisch) {
    grund("gelb", "regen", "Regen " + mmhText(werte.intensitaet), erstesMal(alle("niederschlag"), v => v * 4 >= g.gelbNiederschlag));
  }
  if (werte.boeen >= g.gelbBoeen && werte.boeen < g.rotBoeen) grund("gelb", "boeen", "Böen " + kmhText(werte.boeen), erstesMal(alle("boeen"), v => v >= g.gelbBoeen));
  if (werte.temperatur < g.gelbTemperatur) grund("gelb", "frost", "Frost (" + gradText(werte.temperatur, 1) + ")", erstesMal(alle("temperatur"), v => v < g.gelbTemperatur));

  const farbe = gruende.some(x => x.farbe === "rot") ? "rot" : gruende.length ? "gelb" : "gruen";
  // Rote Gründe zuerst, sonst in der Reihenfolge oben (Warnungen, Gewitter, Glätte, Böen, Regen, …)
  gruende.sort((a, b) => (a.farbe === "rot" ? 0 : 1) - (b.farbe === "rot" ? 0 : 1));
  // Grün: Böen stehen in der Zeile zum Wind; in der Begründung nur, wenn sie Gelb oder Rot auslösen
  const ruhig = werte.niederschlag > 0 ? "kaum Regen" : "trocken";
  return { farbe, gruende, werte, text: FARBWORT[farbe] + ": " + (gruende.length ? gruende.slice(0, 3).map(grundText).join(", ") : ruhig) };
}

// Warnungen aller Orte ohne Doppelte (gleiches Ereignis, gleiche Stufe und Zeit), mit den betroffenen Orten
function warnungenZusammen(teil, orte) {
  const m = new Map();
  teil.orte.forEach((o, i) => o.warnungen.forEach(wn => {
    const k = [wn.ereignis, wn.stufe, wn.beginn, wn.ende].join("|");
    if (!m.has(k)) m.set(k, Object.assign({}, wn, { orte: [] }));
    if (!m.get(k).orte.includes(orte[i].titel)) m.get(k).orte.push(orte[i].titel);
  }));
  return [...m.values()].sort((a, b) => b.stufe - a.stufe || (a.beginn ?? 0) - (b.beginn ?? 0));
}
function warnungImZeitraum(wn, von, bis) { return (wn.beginn === null || wn.beginn < bis) && (wn.ende === null || wn.ende > von); }

// ---------- Kleidung ----------

// Teile einer Kleidung ("T-Shirt, warmer Pullover" → ["T-Shirt", "warmer Pullover"])
function teileVon(text) { return String(text || "").split(",").map(t => t.trim()).filter(Boolean); }
// Steht das Teil schon in der Kleidung? ("Regenjacke als Windschutz" enthält "Regenjacke")
function enthaelt(text, teil) { return String(text || "").toLowerCase().includes(teil.toLowerCase()); }
// Empfehlung in einer Zeile, leere Bereiche weggelassen: "leichte Mütze · Socken"
function empfehlungText(bereiche) { return BEREICH_SCHLUESSEL.map(b => bereiche[b]).filter(Boolean).join(" · "); }

// Kleidung je Körperbereich nach der niedrigsten gefühlten Temperatur (Stufe:
// die erste, deren Untergrenze erreicht ist) und der Regenwahrscheinlichkeit
// (Regenzusatz). Bei Regen gilt das Zwiebelprinzip:
// - Kopf und Hals wie in der Stufe; Hände ebenso, außer die Stufe nennt
//   "Hände bei Regen" (gilt, sobald ein Regenzusatz greift).
// - Oberkörper, Beine, Füße: Kommt Regenzeug dazu, das noch nicht in der
//   Kleidung der Stufe steht, wird es angehängt. Besteht der Bereich dabei aus
//   mehreren Teilen, gilt die Kleidung der nächstwärmeren Stufe (eine Schicht
//   weniger); bei einem Teil und in der wärmsten Stufe bleibt er.
// - Regenzeug für Kopf, Hals oder Hände wird nur angehängt.
function kleidungFuer(gefuehlt, wahrscheinlichkeit, k = daten.einstellungen.wetter.kleidung) {
  let i = k.stufen.findIndex(s => s.ab !== null && gefuehlt >= s.ab);
  if (i < 0) i = k.stufen.length - 1;
  const stufe = k.stufen[i], waermer = i > 0 ? k.stufen[i - 1] : null;
  const zusaetze = wahrscheinlichkeit === null ? [] : k.regen.filter(r => wahrscheinlichkeit >= r.ab);
  const mitRegen = zusaetze.length > 0;
  const bereiche = {}, regenBereiche = [];
  BEREICH_SCHLUESSEL.forEach(b => {
    let eigen = stufe.bereiche[b], geaendert = false;
    if (b === "haende" && mitRegen && stufe.haendeBeiRegen) { eigen = stufe.haendeBeiRegen; geaendert = eigen !== stufe.bereiche[b]; }
    const neu = [...new Set(zusaetze.flatMap(r => teileVon(r.bereiche[b])))].filter(t => !enthaelt(eigen, t));
    let text = eigen;
    if (neu.length) {
      const basis = ZWIEBEL_BEREICHE.includes(b) && waermer && teileVon(eigen).length > 1 ? waermer.bereiche[b] : eigen;
      text = teileVon(basis).concat(neu.filter(t => !enthaelt(basis, t))).join(", ");
      geaendert = true;
    }
    bereiche[b] = text;
    if (geaendert) regenBereiche.push(b);
  });
  return { index: i, stufe, mitRegen, bereiche, regenBereiche, text: empfehlungText(bereiche) };
}
// Hinweis, wenn die Rückfahrt andere Kleidung braucht als die Hinfahrt, z. B.
// "Für die Rückfahrt einpacken: Regenhose, Gamaschen; nicht mehr nötig: Schal."
function kleidungsHinweis(hin, rueck) {
  if (!hin || !rueck) return null;
  const dazu = new Set(), weg = new Set();
  BEREICH_SCHLUESSEL.forEach(b => {
    const h = hin.bereiche[b], r = rueck.bereiche[b];
    teileVon(r).filter(t => !enthaelt(h, t)).forEach(t => dazu.add(t));
    teileVon(h).filter(t => !enthaelt(r, t)).forEach(t => weg.add(t));
  });
  const teile = [];
  if (dazu.size) teile.push("einpacken: " + [...dazu].join(", "));
  if (weg.size) teile.push("nicht mehr nötig: " + [...weg].join(", "));
  return teile.length ? "Für die Rückfahrt " + teile.join("; ") + "." : null;
}

// ---------- Wind relativ zur Strecke ----------

// Richtung (Grad, 0 = Nord) von a nach b auf dem Großkreis
function kursZwischen(a, b) {
  const r = x => x * Math.PI / 180;
  const y = Math.sin(r(b.lon - a.lon)) * Math.cos(r(b.lat));
  const x = Math.cos(r(a.lat)) * Math.sin(r(b.lat)) - Math.sin(r(a.lat)) * Math.cos(r(b.lat)) * Math.cos(r(b.lon - a.lon));
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
// Entfernung (km, Luftlinie auf der Kugel) zwischen zwei Orten
function entfernungKm(a, b) {
  const r = x => x * Math.PI / 180;
  const h = Math.sin(r(b.lat - a.lat) / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(r(b.lon - a.lon) / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.min(1, Math.sqrt(h)));
}
const HIMMELSRICHTUNGEN = ["Nord", "Nordost", "Ost", "Südost", "Süd", "Südwest", "West", "Nordwest"];
// Relative Richtung des Winds zur Fahrtrichtung in acht Abschnitten zu je 45°:
// [Grenze (Grad), Name von links, Name von rechts]. Ein Winkel genau auf einer
// Grenze zählt zum Abschnitt weiter vorn (dem ungünstigeren).
const WIND_ABSCHNITTE = [
  [22.5, "Gegenwind", "Gegenwind"],
  [67.5, "schräg von vorn links", "schräg von vorn rechts"],
  [112.5, "von links", "von rechts"],
  [157.5, "schräg von hinten links", "schräg von hinten rechts"],
  [180, "Rückenwind", "Rückenwind"]

// Winkel auf 1/1000 Grad gerundet (damit die Grenzen trotz Rechenungenauigkeit
// eindeutig sind), 0 ≤ x < 360
const winkelRunden = x => (Math.round(x * 1000) / 1000 % 360 + 360) % 360;
// Mittlerer Wind: Geschwindigkeit (Mittel der Werte) und Richtung, aus der er weht
// (Grad, 0 = Nord, Mittel der Windvektoren); null ohne Werte
function windMittel(proben) {
  if (!proben.length) return null;
  let x = 0, y = 0, summe = 0;
  proben.forEach(p => { x += p.v * Math.sin(p.r * Math.PI / 180); y += p.v * Math.cos(p.r * Math.PI / 180); summe += p.v; });
  return { kmh: summe / proben.length, grad: (Math.atan2(x, y) * 180 / Math.PI + 360) % 360 };
}
// Der angezeigte (gerundete) Wert entscheidet: 0 = windstill, unter WIND_SCHWACH schwach
function windStaerke(kmh) {
  const gerundet = Math.round(kmh);

// Vergangene Fahrten zur Arbeit ohne Wetter oder mit dem Wetter aus der Vorhersage (ab Beginn des Rückblicks)
function rueckblickKandidaten(h = heute()) {
  return daten.eintraege.filter(e => mitWetter(e) && e.datum < h && e.datum >= RUECKBLICK_AB && (!e.wetter || e.wetter.quelle === "vorhersage"))
    .sort((a, b) => a.datum.localeCompare(b.datum));
}
// Abschnitte für die Abfragen: aufeinanderfolgende Daten, je höchstens RUECKBLICK_TAGE Tage
function rueckblickAbschnitte(liste) {
  const abschnitte = [];
  liste.forEach(e => {
    const a = abschnitte[abschnitte.length - 1];
    if (a && tageZwischen(a.von, e.datum) < RUECKBLICK_TAGE) { a.bis = e.datum; a.eintraege.push(e); }
    else abschnitte.push({ von: e.datum, bis: e.datum, eintraege: [e] });
  });
  return abschnitte;
}

// Wetter-Kennzahlen je Jahr: nur Fahrten zur Arbeit. km bei Regen = km der Tage,
// an denen auf einer der Fahrten mindestens 0,1 mm fiel; Tage unter 0 °C =
// Tage, an denen auf einer der Fahrten die Temperatur unter 0 °C lag.
function wetterKennzahlen(h = heute()) {
  const arbeit = daten.eintraege.filter(e => mitWetter(e) && e.datum <= h);
  const zaehlen = liste => {
    const mit = liste.filter(e => e.wetter);
    const fahrten = e => [e.wetter.hin, e.wetter.rueck].filter(Boolean);
    const regen = mit.filter(e => fahrten(e).some(f => f.niederschlag >= 0.1));
    const alle = mit.flatMap(fahrten);
    return {
      tage: liste.length, mitWetter: mit.length, kmRegen: runden(regen.reduce((x, e) => x + e.km, 0)), tageRegen: regen.length,
      tageFrost: mit.filter(e => fahrten(e).some(f => f.temperatur < 0)).length,
      ampel: { gruen: alle.filter(f => f.ampel === "gruen").length, gelb: alle.filter(f => f.ampel === "gelb").length, rot: alle.filter(f => f.ampel === "rot").length }
    };
  };
  const jahre = [...new Set(arbeit.map(e => e.datum.slice(0, 4)))].sort().reverse();
  return { jahre: jahre.map(j => Object.assign({ jahr: Number(j) }, zaehlen(arbeit.filter(e => e.datum.slice(0, 4) === j)))), gesamt: zaehlen(arbeit) };
}

/* =====================================================================
   6. KLEINE BAUSTEINE DER OBERFLÄCHE: Fenster, Rückfrage, Meldung
   ===================================================================== */

const fenster = document.getElementById("fenster");
const fensterInhalt = document.getElementById("fensterinhalt");

function fensterOeffnen(html) {
  fensterInhalt.innerHTML = html;
  if (!fenster.open) fenster.showModal();
  fenster.scrollTop = 0;
}
function fensterSchliessen() { if (fenster.open) fenster.close(); }

// Rückfrage mit zwei Schaltflächen. Liefert true (Ja) oder false (Nein/Abbrechen).
function frage(text, jaText = "OK", neinText = "Abbrechen", gefaehrlich = false) {
  const dlg = document.getElementById("frage");
  document.getElementById("frageinhalt").innerHTML =
    '<p style="margin-top:0">' + text + '</p>' +
    '<div class="knopfreihe">' +
    '<button type="button" data-antwort="nein">' + esc(neinText) + '</button>' +
    '<button type="button" data-antwort="ja" class="' + (gefaehrlich ? "gefahr" : "primaer") + '">' + esc(jaText) + '</button>' +
    '</div>';
  return new Promise(fertig => {
    const klick = ev => {
      const b = ev.target.closest("[data-antwort]");
      if (!b) return;
      dlg.removeEventListener("click", klick);
      dlg.close();
      fertig(b.dataset.antwort === "ja");
    };
    dlg.addEventListener("click", klick);
    dlg.addEventListener("cancel", () => { dlg.removeEventListener("click", klick); fertig(false); }, { once: true });
    dlg.showModal();
  });
}

let toastTimer;
// Datenstand (JSON) vor dem letzten Löschen, solange "Rückgängig" angeboten wird
let rueckgaengigStand = null;

// Kurze Meldung unten. { rueckgaengig: true } zeigt daneben "Rückgängig";
// jede andere Meldung beendet ein noch offenes Rückgängig-Angebot.
function meldung(text, optionen = {}) {
  const t = document.getElementById("toast");
  const mitKnopf = !!optionen.rueckgaengig;
  if (!mitKnopf) rueckgaengigStand = null;
  document.getElementById("toast-text").textContent = text;
  document.getElementById("toast-knopf").hidden = !mitKnopf;
  t.classList.toggle("mit-knopf", mitKnopf);
  t.classList.add("sichtbar");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(meldungAus, optionen.dauer || (mitKnopf ? RUECKGAENGIG_MS : 1800));
}
function meldungAus() {
  clearTimeout(toastTimer);
  document.getElementById("toast").classList.remove("sichtbar", "mit-knopf");
  document.getElementById("toast-knopf").hidden = true;
  rueckgaengigStand = null;
}
function rueckgaengigVerwerfen() {
  rueckgaengigStand = null;
  if (!document.getElementById("toast-knopf").hidden) meldungAus();
}

// Änderung mit "Rückgängig" (Löschen, "Keine Fahrt"). Gemerkt wird der ganze
// Datenstand vorher, damit auch Verknüpfungen (z. B. die Mängel eines
// Protokoll-Eintrags) zurückkommen.
// "text" darf eine Funktion sein (Text erst nach der Änderung); "nachher" ersetzt
// das Schließen des Fensters (z. B. Detailansicht neu zeigen).
function mitRueckgaengig(aenderung, text, nachher) {
  const vorher = JSON.stringify(daten);
  aenderung();
  if (!speichern()) return;
  if (nachher) nachher(); else fensterSchliessen();
  zeichnen();
  rueckgaengigStand = vorher;
  meldung(typeof text === "function" ? text() : text, { rueckgaengig: true });
}
function rueckgaengig() {
  if (!rueckgaengigStand) return;
  daten = JSON.parse(rueckgaengigStand);
  if (speichern()) { zeichnen(); meldung("Wiederhergestellt"); }
}

// Datei als Text lesen (ältere Browser ohne File.text() über FileReader)
function dateiLesen(datei) {
  if (typeof datei.text === "function") return datei.text();
  return new Promise((fertig, fehler) => {
    const r = new FileReader();
    r.onload = () => fertig(r.result);
    r.onerror = () => fehler(r.error);
    r.readAsText(datei);
  });
}

function wert(id) { return document.getElementById(id).value; }

let aktiverTab = "uebersicht";

// Aufklapp-Pfeil; dreht sich über aria-expanded der Schaltfläche (siehe CSS)
const CHEVRON = '<svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';

// Detailansicht (nur lesen): Liste aus [Bezeichnung, HTML-Wert]; leere Werte entfallen
function detailListe(felder) {
  return '<dl class="details">' + felder.filter(f => f[1] !== "" && f[1] !== null && f[1] !== undefined)
    .map(f => '<dt>' + f[0] + '</dt><dd>' + f[1] + '</dd>').join("") + '</dl>';
}

/* ---------- Übersicht ---------- */
function bildUebersicht() {
  const h = heute();
  let html = "";

  if (!daten.fahrrad) {
    html += '<div class="hinweis info"><strong>Willkommen!</strong><br>Bitte lege zuerst dein Fahrrad mit Startdatum und Start-Kilometerstand an.' +
      '<br><button type="button" class="primaer" data-action="fahrrad-aendern">Fahrrad anlegen</button></div>';
  }

  // Erinnerung an die Datensicherung
  const le = letzterExport();
  const exportAlter = le ? tageZwischen(le, h) : null;
  if (daten.fahrrad && (le === null || exportAlter > EXPORT_ERINNERUNG_TAGE)) {
    html += '<div class="hinweis warn"><strong>⚠️ Datensicherung fällig</strong><br>' +
      (le === null ? "Du hast noch nie gesichert." : "Letzte Sicherung vor " + tageText(exportAlter) + " (" + datumText(le) + ").") +
      ' Die Daten liegen nur auf diesem Gerät.<br><button type="button" class="primaer" data-action="sichern">Jetzt sichern</button></div>';
  }

  // Kilometerstand, nächste Wartung und offene Mängel
  html += '<div class="karte"><div class="klein">' + esc(daten.fahrrad ? daten.fahrrad.name : "Kilometerstand") + '</div>' +
    '<div class="stand-zahl">' + kmText(aktuellerKmStand()) + ' km</div>';
  const lage = werkstattLage(h);
  const nw = naechsterAuftrag(lage, h);
  if (nw) {
    html += '<div style="margin-top:8px">🔧 ' + esc(nw.art.name) + ': <span class="' + nw.klasse + '">' + esc(nw.text) + '</span>' +
      (nw.erwartet ? ' <span class="klein">(' + caKm(nw.erwartet.km) + ')</span>' : "") +
      (nw.positionen.length ? ' · ' + positionenText(nw.positionen.length) : "") + '</div>';
  } else {
    html += '<div class="klein" style="margin-top:8px">🔧 Keine Wartung fällig</div>';
  }
  // Überfällige Aufgaben ohne Auftrag als Hinweis
  lage.aufgaben.filter(x => !x.offen && x.st.klasse === "status-rot").forEach(x => {
    html += '<div class="status-rot" style="margin-top:4px">⚠️ ' + esc(x.art.name) + ' ' + esc(aufgabeKurz(x.st)) + ' – keinem Auftrag zugeordnet</div>';
  });
  const anzahlMaengel = offeneMaengel().length;
  if (anzahlMaengel) {
    html += '<div class="status-orange" style="margin-top:4px">⚠️ ' + maengelText(anzahlMaengel) + '</div>';
  }
  html += '</div>';

  html += wetterKachel(Date.now());
  html += lueckenHinweis(h);

  // Schnellerfassung
  const eHeute = eintragAm(h);
  html += '<h2>Heute erfassen</h2>';
  if (eHeute) {
    html += '<div class="hinweis info">✓ Heute erfasst: <strong>' + (eHeute.km === 0 ? "keine Fahrt" : kmText(eHeute.km) + ' km') + '</strong>' +
      (eHeute.vorlage ? " (" + esc(eHeute.vorlage) + ")" : "") +
      '<br><button type="button" data-action="eintrag-ansehen" data-id="' + eHeute.id + '">Anzeigen</button></div>';
  }
  html += '<div class="schnell">';
  daten.vorlagen.forEach(v => {
    html += '<button type="button" class="primaer" data-action="vorlage-erfassen" data-id="' + v.id + '">' +
      '<span>' + esc(v.name) + '</span><span class="km">' + kmText(v.km) + ' km</span></button>';
  });
  html += '<button type="button" data-action="eintrag-neu"><span>Andere km</span><span class="km">frei eingeben</span></button>';
  html += '</div>';
  if (!daten.vorlagen.length) {
    html += '<p class="klein">Tipp: Lege unter „Einstellungen → Vorlagen“ deine Standard-Strecken an, dann erfasst du einen Tag mit zwei Klicks.</p>';
  }

  // Summen
  const montag = montagDerWoche(h), sonntag = plusTage(montag, 6);
  html += '<h2>Summen</h2><div class="summen">' +
    kachel("Heute", summe(e => e.datum === h)) +
    kachel("Woche", summe(e => e.datum >= montag && e.datum <= sonntag)) +
    kachel("Monat", summe(e => e.datum.slice(0, 7) === h.slice(0, 7))) +
    kachel("Jahr", summe(e => e.datum.slice(0, 4) === h.slice(0, 4))) +
    '</div>';

  if (daten.fahrrad) html += jahresKarte(h);
  html += '<h2>Datensicherung</h2>' + sicherungsKarte(h);

  // Liste der Einträge, abgeschlossene Zeiträume zusammengefasst
  html += '<h2>Einträge <span class="klein">(' + daten.eintraege.length + ')</span></h2><div class="liste">';
  if (!daten.eintraege.length) html += '<div class="leer">Noch keine Einträge.</div>';
  html += zeilenHtml(gruppieren(daten.eintraege, h), 0);
  html += '</div>';
  return html;
}

// Eingestellte Fahrtage der letzten 14 Tage (und ab der eingestellten Uhrzeit
// heute) ohne Eintrag, je mit "Nachtragen" und "Keine Fahrt". Die Überschrift
// nennt nur die Anzahl, die Tage stehen in den Zeilen (jeder Tag nur einmal).
function lueckenHinweis(h, minuten) {
  const tage = fehlendeFahrtage(h, minuten);
  if (!tage.length) return "";
  const kurz = d => d === h ? "heute" : wochentag(d) + " " + kurzDatum(d);
  return '<div class="hinweis info"><strong>' + (tage.length === 1 ? "1 Fahrtag" : tage.length + " Fahrtage") + ' ohne Eintrag</strong>' +
    tage.map(d => '<div class="luecke"><span>' + kurz(d) + '</span>' +
      '<button type="button" data-action="nachtragen" data-datum="' + d + '">Nachtragen</button>' +
      '<button type="button" data-action="keine-fahrt" data-datum="' + d + '">Keine Fahrt</button></div>').join("") +
    '</div>';
}
// "Keine Fahrt": Eintrag mit 0 km mit einem Tipper (mit "Rückgängig")
function keineFahrt(datum) {
  if (!istGueltigesDatum(datum) || eintragAm(datum)) return;
  mitRueckgaengig(() => daten.eintraege.push({ id: neueId(), datum, km: 0, vorlage: null, notiz: "", typ: "tag", arbeitsweg: false, wetter: null }),
    "Keine Fahrt am " + wochentag(datum) + " " + kurzDatum(datum));
}

function kachel(titel, km) {
  return '<div class="summe"><div class="wert">' + kmText(km) + '</div><div class="titel">' + titel + ' (km)</div></div>';
}

// Grundlage der Prognosen in einem Satz
function grundlageText(g) {
  return '<div class="klein">Grundlage: Ø ' + kmText(g.rate) + ' km pro Tag (' + datumText(g.von) + '–' + datumText(g.bis) + ')</div>';
}
function zuWenigeTageText() {
  return "Für eine Prognose sind noch zu wenige Tage erfasst (möglich ab dem " + datumText(plusTage(daten.fahrrad.startdatum, PROGNOSE_MIN_TAGE)) + ").";
}

// Laufendes Jahr: Jahresziel mit zeitanteiligem Soll, Jahresprognose
function jahresKarte(h) {
  const z = jahreszielStand(h);
  const prognose = jahresPrognose(h);
  let html = '<h2>Jahr ' + z.jahr + '</h2><div class="karte">';
  if (z.ziel) {
    const v = rund10(z.vorsprung);
    html += '<div><strong>' + kmText(z.ist) + '</strong> von ' + kmText(z.ziel) + ' km · ' + Math.round(z.anteil * 100) + ' %</div>' +
      '<div class="balken" role="progressbar" aria-label="Jahresziel" aria-valuemin="0" aria-valuemax="' + z.ziel + '" aria-valuenow="' + runden(z.ist) + '">' +
      '<div class="balken-ist" style="width:' + Math.min(100, z.anteil * 100) + '%"></div>' +
      '<div class="balken-soll" style="left:' + Math.min(100, z.soll / z.ziel * 100) + '%"></div></div>' +
      '<div class="' + (v >= 0 ? "status-gruen" : "status-orange") + '">' +
      (v > 0 ? "ca. " + kmText(v) + " km voraus" : v < 0 ? "ca. " + kmText(-v) + " km im Rückstand" : "genau im Soll") + '</div>' +
      '<div class="klein">Zeitanteiliges Soll bis heute: ' + caKm(z.soll) + '</div>';
  }
  html += '<div style="margin-top:' + (z.ziel ? 10 : 0) + 'px">';
  if (prognose === null) {
    html += '<span class="klein">Jahresprognose: ' + zuWenigeTageText() + '</span>';
  } else {
    html += 'Jahresprognose: <strong>' + caKm(prognose) + '</strong>';
    if (z.ziel) {
      const d = rund10(prognose - z.ziel);
      html += '<div class="klein">' + (d > 0 ? "ca. " + kmText(d) + " km über dem Ziel" : d < 0 ? "ca. " + kmText(-d) + " km unter dem Ziel" : "entspricht dem Ziel") + '</div>';
    }
    html += grundlageText(prognoseGrundlage(h));
  }
  html += '</div><div class="knopfreihe"><button type="button" data-action="prognose">Kilometerstand für ein Datum …</button>' +
    (z.ziel ? "" : '<button type="button" data-action="jahresziel-neu" data-jahr="' + z.jahr + '">Jahresziel festlegen</button>') +
    '</div></div>';
  return html;
}

// Kilometerstand-Prognose für ein frei wählbares Datum
function prognoseFenster() {
  fensterOeffnen('<h2>Kilometerstand für ein Datum</h2>' +
    '<label for="pg-datum">Datum</label>' +
    '<input type="date" id="pg-datum" value="' + heute().slice(0, 4) + '-12-31" data-change="prognose-datum" data-input="prognose-datum">' +
    '<div id="pg-ergebnis" style="margin-top:14px"></div>' +
    '<div class="knopfreihe"><button type="button" data-action="fenster-zu">Schließen</button></div>');
  prognoseAnzeigen();
}
function prognoseAnzeigen() {
  document.getElementById("pg-ergebnis").innerHTML = prognoseErgebnis(wert("pg-datum"), heute());
}
function prognoseErgebnis(d, h) {
  const f = daten.fahrrad;
  if (!f) return "Bitte zuerst das Fahrrad anlegen.";
  if (!istGueltigesDatum(d)) return "Bitte ein Datum wählen.";
  if (d < f.startdatum) return "Das Datum liegt vor dem Startdatum (" + datumText(f.startdatum) + ").";
  if (d <= h) {
    return '<div class="stand-zahl">' + kmText(kmStandAm(d)) + ' km</div>' +
      '<div class="klein">Tatsächlicher Kilometerstand am Ende des ' + datumText(d) + '</div>';
  }
  const g = prognoseGrundlage(h);
  if (!g) return zuWenigeTageText();
  return '<div class="stand-zahl">' + caKm(kmPrognose(d, h)) + '</div>' +
    '<div class="klein">Erwarteter Kilometerstand am Ende des ' + datumText(d) + '</div>' + grundlageText(g);
}

// "heute", "gestern" bzw. "vor 5 Tagen"
function vorText(iso, h) {
  const t = tageZwischen(iso, h);
  return t <= 0 ? "heute" : t === 1 ? "gestern" : "vor " + tageText(t);

// Datensicherung (Startseite und Einstellungen)
function sicherungsKarte(h) {

// Nach einer erfolgreichen Sicherung: Ergebnis und Prüfung der gespeicherten Datei
function sicherungsErgebnisHtml() {
  if (!sicherungsErgebnis) return "";
  return '<div class="hinweis info" style="margin:10px 0 0">✓ <strong>Sicherung ' + sicherungsErgebnis.wie + '</strong> – Inhalt geprüft: ' +

}

// Zeilen der Eintragsliste; aufgeklappte Gruppen zeigen ihre Kinder eingerückt darunter
function zeilenHtml(zeilen, tiefe) {
  const einzug = ' style="padding-left:' + (16 + tiefe * 16) + 'px"';
  return zeilen.map(z => {
    if (z.art === "eintrag") return eintragsZeile(z.eintrag, einzug);
    const offen = offeneGruppen.has(z.schluessel);
    const zeitraum = z.art === "woche" ? kurzDatum(z.von) + "–" + kurzDatum(z.bis) : "";
    const unten = [zeitraum, z.anzahl === 1 ? "1 Eintrag" : z.anzahl + " Einträge"].filter(Boolean).join(" · ");
    return '<div class="zeile gruppe">' +
      '<button type="button" class="inhalt" data-action="gruppe" data-key="' + esc(z.schluessel) + '" aria-expanded="' + offen + '"' + einzug + '>' +
      CHEVRON +
      '<div class="text"><div class="titel">' + esc(z.titel) + '</div><div class="klein">' + unten + '</div></div>' +
      '<span class="zahl" style="padding-right:16px">' + kmText(z.km) + ' km</span></button></div>' +
      (offen ? zeilenHtml(z.kinder, tiefe + 1) : "");
  }).join("");
}

function eintragsZeile(e, einzug) {
  const vorStart = daten.fahrrad && e.datum < daten.fahrrad.startdatum;
  const unten = [e.vorlage, e.notiz].filter(Boolean).map(esc).join(" · ");
  const keine = e.km === 0;
  return '<div class="zeile' + (keine ? " keine-fahrt" : "") + '">' +
    '<button type="button" class="inhalt" data-action="eintrag-ansehen" data-id="' + e.id + '"' + einzug + '>' +
    '<div class="text"><div>' + wochentag(e.datum) + ', ' + datumText(e.datum) +
    (e.typ === "woche" ? '<span class="abzeichen">Woche</span>' : "") + '</div>' +
    (unten ? '<div class="klein">' + unten + '</div>' : "") +
    (vorStart ? '<div class="klein">vor dem Startdatum – zählt nicht zum Kilometerstand</div>' : "") +
    '</div><span class="zahl" style="padding-right:16px">' + (keine ? "keine Fahrt" : kmText(e.km) + ' km') + '</span></button>' +
    '</div>';
}

function gruppeUmschalten(schluessel) {
  if (offeneGruppen.has(schluessel)) offeneGruppen.delete(schluessel);
  else offeneGruppen.add(schluessel);
  zeichnen();
}

/* ---------- Eintrag: Detailansicht und Formular ---------- */

function eintragAnsicht(id, hinweis) {
  const e = daten.eintraege.find(e => e.id === id);
  if (!e) return;
  const vorStart = daten.fahrrad && e.datum < daten.fahrrad.startdatum;
  const stand = kmStandAm(e.datum);
  fensterOeffnen(
    '<h2>Eintrag' + (e.typ === "woche" ? ' <span class="abzeichen">Woche</span>' : "") + '</h2>' +
    (hinweis ? '<div class="hinweis info">' + esc(hinweis) + '</div>' : "") +
    detailListe([
      ["Datum", wochentag(e.datum) + ", " + datumText(e.datum)],
      ["Kilometer", kmText(e.km) + " km" + (e.km === 0 ? " (keine Fahrt)" : "")],
      ["Art", e.typ === "woche" ? "Importierte Wochensumme (Datum = Montag bzw. erster Fahrtag der Woche)" : "Tages-Eintrag"],
      ["Vorlage", esc(e.vorlage || "")],
      ["Arbeitsweg", e.arbeitsweg ? "ja" : ""],
      ["Notiz", esc(e.notiz)],
      ["Kilometerstand am Ende des Tages", vorStart ? "vor dem Startdatum – zählt nicht zum Kilometerstand" : stand === null ? "" : kmText(stand) + " km"]
    ]) +
    eintragWetterHtml(e) +
    '<div class="knopfreihe"><button type="button" data-action="fenster-zu">Schließen</button>' +
    '<button type="button" class="primaer" data-action="eintrag-aendern" data-id="' + e.id + '">Ändern</button></div>'
  );
}
// Gespeichertes Wetter eines Eintrags mit Rückmeldung zur Kleidung je Fahrt
function eintragWetterHtml(e) {
  const w = e.wetter;
  if (!w) return mitWetter(e) ? '<p class="klein">Noch kein Wetter gespeichert. In der Statistik lässt es sich mit „Wetter nachtragen …“ holen.</p>' : "";
  const fahrt = (name, art) => {
    const f = w[art];
    if (!f) return '<div class="eintrag-wetter"><strong>' + name + '</strong> <span class="klein">ohne Wetter</span></div>';
    const rueckmeldung = !f.kleidung ? ""
      : rueckmeldungAn() ? '<div class="klein">Wie war die Kleidung?</div>' + rueckmeldungKnoepfe(e, art, f, true)
      : f.rueckmeldung ? '<div class="klein">Rückmeldung: ' + RUECKMELDUNG_TEXT[f.rueckmeldung] + '</div>' : "";
    return '<div class="eintrag-wetter"><div><strong>' + name + '</strong> ' + ampelHtml(f.ampel) + FARBWORT[f.ampel] + '</div>' +
      '<div class="klein">' + gradText(f.temperatur) + ' (gefühlt ' + gradText(f.gefuehlt) + ') · Regen ' +
      (f.regenWahrscheinlichkeit === null ? "" : f.regenWahrscheinlichkeit + ' %, ') + zahl1.format(f.niederschlag) + ' mm · Wind ' + kmhText(f.wind) + ' · Böen ' + kmhText(f.boeen) + '</div>' +
      (f.kleidung ? '<div>👕 ' + esc(fahrtKleidungText(f)) + '</div>' : "") + rueckmeldung + '</div>';
  };
  return '<h3 style="margin-top:16px">Wetter</h3>' + fahrt("Hinfahrt", "hin") + fahrt("Rückfahrt", "rueck") +
    '<p class="klein">' + (w.quelle === "rueckblick" ? "Aus dem Rückblick" : "Aus der Vorhersage") + ' (Open-Meteo), Stand ' + esc(zeitpunktText(w.stand) || "–") +
    '. Die Ampel berücksichtigt hier nur die Wetterwerte, keine amtlichen Warnungen.</p>';
}

// Zustand des gerade geöffneten Eintrags-Formulars
let formEintrag = null; // { id | null, typ, ursprungsDatum }

// Neuer Eintrag. Gibt es für das Datum schon einen Eintrag, wird dieser angezeigt.
function eintragNeu(vorgabe) {
  const datum = vorgabe.datum || heute();
  const vorhanden = eintragAm(datum);
  if (vorhanden) {
    eintragAnsicht(vorhanden.id, "Für den " + datumText(datum) + " gibt es bereits einen Eintrag. Mit „Ändern“ kannst du ihn bearbeiten.");
  } else {
    eintragsFormular({ id: null, datum, km: vorgabe.km ?? null, vorlage: vorgabe.vorlage || null, notiz: "", typ: "tag", arbeitsweg: !!vorgabe.arbeitsweg }, "");
  }
}

function eintragsFormular(e, hinweis) {
  formEintrag = { id: e.id, typ: e.typ, ursprungsDatum: e.id ? e.datum : null };
  let optionen = '<option value="">– keine –</option>';
  let gefunden = false;
  daten.vorlagen.forEach(v => {
    const sel = v.name === e.vorlage;
    if (sel) gefunden = true;
    optionen += '<option value="' + esc(v.id) + '"' + (sel ? " selected" : "") + '>' + esc(v.name) + ' (' + kmText(v.km) + ' km)</option>';
  });
  // Vorlage wurde gelöscht oder umbenannt: Namen trotzdem behalten
  if (e.vorlage && !gefunden) {
    optionen += '<option value="__alt__" selected>' + esc(e.vorlage) + ' (Vorlage existiert nicht mehr)</option>';
  }
  formEintrag.alteVorlage = e.vorlage;

  fensterOeffnen(
    '<h2>' + (e.id ? "Eintrag bearbeiten" : "Neuer Eintrag") +
    (e.typ === "woche" ? ' <span class="abzeichen">Woche</span>' : "") + '</h2>' +
    (hinweis ? '<div class="hinweis info">' + esc(hinweis) + '</div>' : "") +
    (e.typ === "woche" ? '<div class="klein">Importierte Wochensumme – das Datum ist der Montag bzw. erste Fahrtag der Woche.</div>' : "") +
    '<label for="f-datum">Datum</label>' +
    '<input type="date" id="f-datum" value="' + e.datum + '" data-change="eintrag-datum">' +
    '<div class="feldhinweis warn" id="f-datum-hinweis"></div>' +
    '<label for="f-vorlage">Vorlage (optional)</label>' +
    '<select id="f-vorlage" data-change="eintrag-vorlage">' + optionen + '</select>' +
    (e.typ === "tag" ? '<label class="haken"><input type="checkbox" id="f-arbeitsweg"' + (e.arbeitsweg ? " checked" : "") + '>' +
      '<span>Arbeitsweg <span class="klein">(Fahrt zur Arbeit)</span><br><span class="klein">Die App speichert dann das Wetter der Hin- und Rückfahrt mit, ' +
      'soweit die Vorhersage für Wohn- und Arbeitsort vorliegt.</span></span></label>' : "") +
    '<label for="f-km">Kilometer</label>' +
    '<input type="text" id="f-km" inputmode="decimal" autocomplete="off" placeholder="z. B. 12,5" value="' + kmFeld(e.km) + '">' +
    '<label for="f-notiz">Notiz (optional)</label>' +
    '<input type="text" id="f-notiz" value="' + esc(e.notiz) + '">' +
    '<div class="knopfreihe">' +
    (e.id ? '<button type="button" data-action="eintrag-ansehen" data-id="' + e.id + '">Abbrechen</button>'
          : '<button type="button" data-action="fenster-zu">Abbrechen</button>') +
    '<button type="button" class="primaer" data-action="eintrag-speichern">Speichern</button>' +
    '</div>' +
    (e.id ? '<div class="knopfreihe"><button type="button" class="gefahr voll" data-action="eintrag-loeschen" data-id="' + e.id + '">Eintrag löschen</button></div>' : "")
  );
  datumHinweis();
}

function datumHinweis() {
  const d = wert("f-datum");
  const el = document.getElementById("f-datum-hinweis");
  el.textContent = (daten.fahrrad && d && d < daten.fahrrad.startdatum)
    ? "Dieses Datum liegt vor dem Startdatum (" + datumText(daten.fahrrad.startdatum) + ") und zählt nicht zum Kilometerstand."
    : "";
}

// Datum im Formular geändert: existiert dort schon ein Eintrag, wechseln
function eintragDatumGeaendert() {
  const d = wert("f-datum");
  const vorhanden = istGueltigesDatum(d) ? eintragAm(d) : null;
  if (vorhanden && vorhanden.id !== formEintrag.id) {
    eintragsFormular(vorhanden, "Für den " + datumText(d) + " gibt es bereits einen Eintrag. Du kannst ihn hier bearbeiten.");
    return;
  }
  datumHinweis();
}

function eintragVorlageGeaendert() {
  const v = daten.vorlagen.find(v => v.id === wert("f-vorlage"));
  if (v) {
    document.getElementById("f-km").value = kmFeld(v.km);
    const aw = document.getElementById("f-arbeitsweg");
    if (aw) aw.checked = v.arbeitsweg;
  }
}

async function eintragSpeichern() {
  const datum = wert("f-datum");
  const km = kmLesen(wert("f-km"));
  if (!istGueltigesDatum(datum)) { alert("Bitte ein gültiges Datum wählen."); return; }
  if (km === null) { alert("Bitte die Kilometer als Zahl eingeben, z. B. 12,5."); return; }
  const anderer = eintragAm(datum);
  if (anderer && anderer.id !== formEintrag.id) { alert("Für den " + datumText(datum) + " gibt es bereits einen Eintrag."); return; }

  const vw = wert("f-vorlage");
  const gewaehlt = daten.vorlagen.find(v => v.id === vw) || null;
  const vorlage = vw === "__alt__" ? formEintrag.alteVorlage : (gewaehlt ? gewaehlt.name : null);

  // Warnung: Tages-Eintrag in einer Woche, für die es schon eine Wochensumme gibt
  const neuOderVerschoben = !formEintrag.id || formEintrag.ursprungsDatum !== datum;
  if (formEintrag.typ === "tag" && neuOderVerschoben) {
    const w = wochenEintragInWoche(datum, formEintrag.id);
    if (w) {
      const mo = montagDerWoche(datum);
      const ok = await frage("In der Woche vom " + datumText(mo) + " bis " + datumText(plusTage(mo, 6)) +
        " gibt es bereits einen <strong>Wochen-Eintrag</strong> (" + kmText(w.km) + " km am " + datumText(w.datum) +
        "). Die Kilometer würden dann doppelt zählen.<br><br>Trotzdem speichern?", "Trotzdem speichern", "Abbrechen");
      if (!ok) return;
    }
  }

  const notiz = wert("f-notiz").trim();
  // Das Merkmal "Arbeitsweg" kommt wie km aus der Vorlage und lässt sich ändern
  const aw = document.getElementById("f-arbeitsweg");
  if (formEintrag.id) {
    const e = daten.eintraege.find(e => e.id === formEintrag.id);
    // Das gespeicherte Wetter gehört zum Datum und entfällt, wenn es sich ändert
    if (e.datum !== datum) e.wetter = null;
    Object.assign(e, { datum, km, vorlage, notiz });
    if (aw) e.arbeitsweg = aw.checked;
    eintragWetterSetzen(e);
  } else {
    const e = { id: neueId(), datum, km, vorlage, notiz, typ: "tag", arbeitsweg: !!(aw && aw.checked), wetter: null };
    eintragWetterSetzen(e);
    daten.eintraege.push(e);
  }
  if (speichern()) {
    fensterSchliessen();
    zeichnen();
    const e = eintragAm(datum);
    meldung("Gespeichert: " + kmText(km) + " km" + (e && e.wetter ? ", mit Wetter" : ""));
  }
}

async function eintragLoeschen(id) {
  const e = daten.eintraege.find(e => e.id === id);
  if (!e) return;
  const ok = await frage("Eintrag vom " + datumText(e.datum) + " (" + kmText(e.km) + " km) wirklich löschen?", "Löschen", "Abbrechen", true);
  if (!ok) return;
  mitRueckgaengig(() => { daten.eintraege = daten.eintraege.filter(x => x.id !== id); }, "Eintrag gelöscht");
}

/* ---------- Wetter ---------- */

function ampelHtml(farbe) { return '<span class="ampel ' + farbe + '" aria-hidden="true"></span>'; }
// "● gelb: 70 % Regen ab 16:30, Böen 45 km/h"
function ampelText(b) {
  return ampelHtml(b.farbe) + '<strong>' + FARBWORT[b.farbe] + ':</strong> ' + esc(b.text.slice(FARBWORT[b.farbe].length + 2));
}
// "Heute, Di 27.10." bzw. "Mo 02.11."
function tagUeberschrift(datum, titel) { return titel === "Heute" || titel === "Morgen" ? titel + ", " + wochentag(datum) + " " + kurzDatum(datum) : titel; }
// Werte einer Fahrt (ohne Böen, die stehen in der Zeile zum Wind)
function werteText(w) {
  return gradText(w.temperatur) + " (gefühlt " + gradText(w.gefuehlt) + ") · Regen " +
    (w.regenWahrscheinlichkeit === null ? "" : w.regenWahrscheinlichkeit + " %, ") + zahl1.format(w.niederschlag) + " mm";
}
function tageswerteText(t) {
  return gradText(t.tmin) + " bis " + gradText(t.tmax) + (t.gefuehltMin === null ? "" : " (gefühlt " + gradText(t.gefuehltMin) + " bis " + gradText(t.gefuehltMax) + ")") +
    " · Regen " + (t.regenWahrscheinlichkeit === null ? "" : t.regenWahrscheinlichkeit + " %, ") + zahl1.format(t.niederschlag) + " mm · " +
    (t.wind === null ? "" : "Wind bis " + kmhText(t.wind) + ", ") + "Böen bis " + kmhText(t.boeen) + (t.gewitter ? " · Gewitter möglich" : "");
}
// "heute 10:00 – 18:00 Uhr", "heute 18:00 – morgen 03:00 Uhr"
function zeitraumText(wn, jetzt) {
  const h = isoAusDate(new Date(jetzt));
  const tag = ms => { const d = isoAusDate(new Date(ms)); return d === h ? "heute" : d === plusTage(h, 1) ? "morgen" : d === plusTage(h, -1) ? "gestern" : wochentag(d) + " " + kurzDatum(d); };
  if (wn.beginn === null && wn.ende === null) return "ohne Zeitangabe";
  const von = wn.beginn === null ? "bis jetzt" : tag(wn.beginn) + " " + uhrzeit(wn.beginn);
  if (wn.ende === null) return "ab " + von + " Uhr";
  const gleicherTag = wn.beginn !== null && tag(wn.beginn) === tag(wn.ende);
  return von + " – " + (gleicherTag ? "" : tag(wn.ende) + " ") + uhrzeit(wn.ende) + " Uhr";
}

function bildWetter(jetzt = Date.now()) {
  let a;
  try { a = wetterAnsicht(jetzt); }
  catch (e) { return '<div class="hinweis fehler" style="margin-top:8px">Das Wetter kann nicht angezeigt werden (' + esc(e.message) + ').</div>' + standKnopf(false); }
  if (a.leer) {
    return '<div class="hinweis info" style="margin-top:8px"><strong>Wetter für deinen Arbeitsweg</strong><br>' +
      'Lege Wohnort und Arbeitsort fest. Dann zeigt die App für deine Fahrtage Ampel, Kleidung, amtliche Warnungen, Wind und die beste Abfahrtszeit.' +
      '<div class="knopfreihe"><button type="button" class="primaer" data-action="ort-bearbeiten" data-rolle="wohnort">Wohnort festlegen</button>' +
      '<button type="button" data-action="ort-bearbeiten" data-rolle="arbeitsort">Arbeitsort festlegen</button></div></div>' +
      '<p class="klein">Orte und Fahrzeiten findest du auch unter Einstellungen → Wetter.</p>';
  }
  let html = wetterHinweise(a, jetzt);
  if (!a.weitererOrt) html += rueckmeldungKarte(jetzt);
  const alt = a.quellen.vorhersage.aktuell ? "" : " veraltet";
  let warnungen;
  if (a.weitererOrt) {
    html += '<div class="karte" style="margin-top:8px"><div><strong>📍 ' + esc(a.orte[0].ort.name) + '</strong> <span class="klein">(weiterer Ort aktiv)</span></div>' +
      '<div class="klein">Wetter an diesem Ort, ohne Hin- und Rückfahrt.</div>' +
      '<div class="knopfreihe"><button type="button" data-action="weiterer-ort-aus">Zurück zu Wohn- und Arbeitsort</button></div></div>';
    a.tage.forEach(t => {
      html += '<h2>' + tagUeberschrift(t.datum, t.titel) + '</h2><div class="karte' + alt + '">' +
        (t.werte ? tageswerteText(t.werte) : '<span class="klein">Für diesen Tag liegt noch keine Vorhersage vor.</span>') + '</div>';
    });
    warnungen = [...new Set([...a.tage[0].warnungen, ...a.tage[1].warnungen])];
  } else {
    if (a.jetzt) {
      // Außerhalb der Fahrten: heute, eine Fahrt ab jetzt am Wohnort oder am aktuellen Standort
      const j = a.jetzt;
      html += '<h2 style="margin-top:8px">' + tagUeberschrift(j.heute.datum, "Heute") + (j.heute.fahrtag ? "" : " – kein Fahrtag") + '</h2>' +
        '<div class="karte"><div><strong>📍 ' + esc(j.ort.text) + '</strong></div>' + ortAusserhalbUmschalter(j.wahl, j.heimTitel) + '</div>' +
        (j.hinweis ? '<div class="hinweis warn">' + esc(j.hinweis) + '</div>' : "") +
        fahrtKarte(j.fahrt, alt) +
        (a.empfehlungAb ? '<div class="hinweis info">🕔 ' + esc(a.empfehlungAb) + ' (Hin- und Rückfahrt mit Ampel, Kleidung und Wind)</div>' : "");
    } else {
      html += '<h2 style="margin-top:8px">' + tagUeberschrift(a.tag.datum, a.tag.titel) + '</h2>';
      a.fahrten.forEach(f => { html += fahrtKarte(f, alt); });
      if (a.kleidungsHinweis) html += '<div class="hinweis info">👕 ' + esc(a.kleidungsHinweis) + '</div>';
    }
    warnungen = a.warnungen;
  }
  html += warnungenKarte(warnungen, a, jetzt);
  return html + standKarte(a, jetzt);
}

// Hinweise oben: Quelle nicht erreichbar, nicht aktuell, Ersatzquelle für die Warnungen
function wetterHinweise(a, jetzt) {
  const v = a.quellen.vorhersage, w = a.quellen.warnungen;
  const letzterStand = q => q.vorhanden ? " Angezeigt wird der letzte Stand von " + standText(q.stand, jetzt) + " – <strong>nicht aktuell</strong>." : "";
  let html = "";
  if (a.laeuft && !v.vorhanden) html += '<div class="hinweis info" style="margin-top:8px">Wetter wird geladen …</div>';
  if (v.fehler) {
    html += '<div class="hinweis fehler" style="margin-top:8px"><strong>Vorhersage nicht erreichbar</strong> (Open-Meteo: ' + esc(v.fehler) + ').' +
      (letzterStand(v) || " Es liegt noch keine Vorhersage vor.") + '</div>';
  } else if (v.vorhanden && !v.aktuell) {
    html += '<div class="hinweis warn" style="margin-top:8px"><strong>Nicht aktuell</strong> – Vorhersage Stand: ' + standText(v.stand, jetzt) + '.</div>';
  }
  if (w.fehler) {
    html += '<div class="hinweis fehler"><strong>Amtliche Warnungen nicht erreichbar</strong> (' + esc(w.fehler) + ').' +
      (letzterStand(w) || " Die Ampel berücksichtigt keine amtlichen Warnungen.") + '</div>';
  } else if (w.vorhanden && !w.aktuell) {
    html += '<div class="hinweis warn"><strong>Nicht aktuell</strong> – Warnungen Stand: ' + standText(w.stand, jetzt) + '.</div>';
  } else if (w.vorhanden && w.quelle === "brightsky") {
    html += '<div class="hinweis warn">Der GeoServer des DWD ist nicht erreichbar (' + esc(w.dwdFehler || "Fehler") + '). ' +
      'Die Warnungen kommen deshalb über <strong>Bright Sky</strong> (Ersatzquelle mit den Daten des DWD).</div>';
  }
  return html;
}

// Umschalter "Wohnort / Aktueller Standort" für das Wetter außerhalb der Fahrten (ein Tipp speichert die Einstellung)
function ortAusserhalbUmschalter(wahl, heimTitel = ORT_TITEL.wohnort) {
  const knopf = (wert, text) => '<button type="button" data-action="ort-ausserhalb" data-wert="' + wert + '" aria-pressed="' + (wahl === wert) + '"' +
    (wahl === wert ? ' class="aktiv"' : "") + '>' + text + '</button>';
  return '<div class="umschalter" role="group" aria-label="Wetter außerhalb der Fahrten">' + knopf("wohnort", heimTitel) + knopf("standort", "Aktueller Standort") + '</div>';
}

function fahrtKarte(f, alt) {
  const b = f.bewertung;
  let html = '<div class="karte' + (f.vorbei ? " veraltet" : alt) + '"><h3>' + f.name + ' <span class="klein">' + f.fahrt.von + '–' + f.fahrt.bis +
    (f.vorbei ? " · vorbei" : "") + '</span></h3>';
  if (!b) return html + '<div class="klein">Für diese Zeit liegt noch keine Vorhersage vor.</div></div>';
  html += '<div class="ampelzeile">' + ampelText(b) + '</div>';
  if (f.vorbei) return html + '</div>';
  html += '<div class="klein">' + werteText(b.werte) + '</div>' +
    '<div style="margin-top:6px">👕 Kleidung <span class="klein">(gefühlt ' + gradText(b.werte.gefuehlt) + ')</span></div>' + kleidungBereicheHtml(f.kleidung) +
    (f.wind ? windHtml(f.wind) : "") +
    (f.abfahrt && f.abfahrt.zeigen ? abfahrtHtml(f.abfahrt, f.fahrt.dauer) : "");
  return html + '</div>';
}

// Wind: erste Zeile mit Himmelsrichtung und Böen, darunter eingerückt je Teilstrecke,
// die zählt, eine Zeile mit der Richtung relativ zur Fahrtrichtung
function windHtml(wind) {
  return '<div>🧭 ' + esc(wind.text) + '</div>' +
    (wind.teile.length ? '<div class="wind-teile">' + wind.teile.map(t => '<div>' + esc(t.titel) + ': ' + esc(t.text) + '</div>').join("") + '</div>' : "");
}
// Kleidung je Körperbereich; leere Bereiche entfallen, wegen Regen angepasste sind markiert
function kleidungBereicheHtml(kl) {
  return '<dl class="bereiche">' + BEREICHE.filter(([b]) => kl.bereiche[b]).map(([b, name]) => '<dt>' + name + '</dt><dd>' + esc(kl.bereiche[b]) +
    (kl.regenBereiche.includes(b) ? ' <span title="wegen Regen angepasst">☔</span>' : "") + '</dd>').join("") + '</dl>' +
    (kl.regenBereiche.length ? '<div class="klein">☔ wegen Regen angepasst: Regenzeug dazu, bei mehreren Teilen eine Schicht weniger (Zwiebelprinzip)</div>' : "");
}
// Zeitleiste der Viertelstunden (Farbe der Ampel), die beste Fahrt umrandet, darunter der Satz zur Abfahrt
function abfahrtHtml(ab, dauer) {
  const erste = ab.felder[0].minuten, letzte = ab.felder[ab.felder.length - 1].minuten + 15;
  const imBesten = m => m >= ab.beste.minuten && m < ab.beste.minuten + dauer;
  return '<div class="abfahrt"><div class="zeitleiste" role="img" aria-label="' + esc(ab.text) + '">' +
    ab.felder.map(x => '<span class="slot ' + (x.farbe || "leer") + (imBesten(x.minuten) ? " beste" : "") + '"></span>').join("") + '</div>' +
    '<div class="zeitachse"><span>' + uhrzeitAus(erste) + '</span><span>' + uhrzeitAus(Math.round((erste + letzte) / 30) * 15) + '</span><span>' + uhrzeitAus(letzte) + '</span></div>' +
    '<div>🕒 ' + esc(ab.text) + '</div></div>';
}

function warnungenKarte(liste, a, jetzt) {
  const q = a.quellen.warnungen;
  let html = '<h2>Amtliche Warnungen</h2><div class="karte' + (q.aktuell ? "" : " veraltet") + '">';
  if (!q.vorhanden) return html + '<div class="klein">Zurzeit nicht verfügbar.</div></div>';
  const gebiete = q.gebiete || [];
  if (!liste.length) html += '<div>Keine amtlichen Warnungen' + (a.weitererOrt ? " für heute und morgen" : "") + '.</div>';
  liste.forEach(wn => {
    html += '<div class="warnung stufe-' + wn.stufe + '"><div><strong>' + esc(wn.ereignis) + '</strong> <span class="klein">Stufe ' + wn.stufe +
      (wn.art === "gesundheit" ? " · nur zur Info" : "") + '</span></div>' +
      '<div class="klein">' + esc(zeitraumText(wn, jetzt)) + (a.orte.length > 1 && !a.jetzt ? " · " + wn.orte.join(", ") : "") + '</div>' +
      (wn.text ? '<div class="klein">' + esc(wn.text) + '</div>' : "") + '</div>';
  });
  gebiete.filter(x => x.abgedeckt === false).forEach(x => {
    html += '<div class="klein" style="margin-top:6px">Für ' + esc(x.name) + ' gibt es keine Warnungen des DWD (außerhalb Deutschlands).</div>';
  });
  // Warngebiete (Gemeinden des DWD); liegen beide Orte im selben, steht es nur einmal da
  const namen = [...new Set(gebiete.filter(x => x.gebiet).map(x => x.gebiet))];
  const zellen = namen.map(n => esc(n) + (namen.length > 1 ? " (" + gebiete.filter(x => x.gebiet === n).map(x => x.titel).join(", ") + ")" : ""));
  return html + '<div class="klein" style="margin-top:8px">Quelle: ' + QUELLEN_NAME[q.quelle] + (zellen.length ? " · Warngebiet " + zellen.join(", ") : "") +
    ' · Stand: ' + standText(q.stand, jetzt) + '</div></div>';
}

function standKnopf(laeuft) {
  return '<button type="button" class="voll" data-action="wetter-aktualisieren"' + (laeuft ? " disabled" : "") + '>' + (laeuft ? "Wird geladen …" : "Aktualisieren") + '</button>';
}
function standKarte(a, jetzt) {
  const v = a.quellen.vorhersage, w = a.quellen.warnungen;
  const teil = (name, q) => name + " " + (q.vorhanden ? standText(q.stand, jetzt) + (q.aktuell ? "" : " (nicht aktuell)") : "–");
  return '<p class="klein" style="margin-top:16px">Stand: ' + teil("Vorhersage", v) + ' · ' + teil("Warnungen", w) + '</p>' + standKnopf(a.laeuft) +
    '<p class="klein">Vorhersage: Open-Meteo.com (Modell ICON des Deutschen Wetterdienstes, CC BY 4.0). Amtliche Warnungen: Deutscher Wetterdienst' +
    (w.quelle === "brightsky" ? ", zurzeit über Bright Sky" : "") + '.</p>';
}

// Kachel auf der Übersicht: Ampeln der nächsten Fahrten; Antippen öffnet den Reiter Wetter
function wetterKachel(jetzt) {
  let a, inhalt;
  try { a = wetterAnsicht(jetzt); }
  catch (e) { return '<button type="button" class="karte wetter-kachel" data-action="tab" data-tab="wetter"><strong>🌦️ Wetter</strong> <span class="klein">kann nicht angezeigt werden</span></button>'; }
  if (a.leer) {
    inhalt = '<div><strong>🌦️ Wetter</strong></div><div class="klein">Wohn- und Arbeitsort festlegen, dann zeigt die App hier die Ampel für deine Fahrten.</div>';
  } else if (a.weitererOrt) {
    const t = a.tage[0];
    inhalt = '<div><strong>🌦️ ' + esc(a.orte[0].ort.name) + ', heute</strong></div><div class="klein">' + (t.werte ? tageswerteText(t.werte) : "noch keine Vorhersage") + '</div>';
  } else if (a.jetzt) {
    // Außerhalb der Fahrten: nur Ort und Ampel für eine Fahrt ab jetzt, keine weiteren Werte
    const j = a.jetzt, b = j.fahrt.bewertung;
    inhalt = '<div><strong>🌦️ Jetzt · ' + esc(j.ort.text) + '</strong></div>' +
      '<div>' + (b ? ampelText(b) : '<span class="klein">' + (a.laeuft ? "Wird geladen …" : "Noch keine Vorhersage") + '</span>') + '</div>' +
      (j.kurz ? '<div class="klein status-orange">📍 ' + esc(j.kurz) + '</div>' : "") +
      (a.empfehlungAb ? '<div class="klein">🕔 ' + esc(a.empfehlungAb) + '</div>' : "");
  } else {
    const offen = a.fahrten.filter(f => !f.vorbei);
    inhalt = '<div><strong>🌦️ ' + tagUeberschrift(a.tag.datum, a.tag.titel) + '</strong></div><div class="kachel-ampeln">' +
      offen.map(f => '<span>' + (f.art === "hinfahrt" ? "Hin" : "Rück") + ' ' + (f.bewertung ? ampelHtml(f.bewertung.farbe) + FARBWORT[f.bewertung.farbe] : "–") + '</span>').join("") + '</div>';
    const problem = offen.filter(f => f.bewertung && f.bewertung.farbe !== "gruen").sort((x, y) => (y.bewertung.farbe === "rot") - (x.bewertung.farbe === "rot"))[0];
    if (problem) inhalt += '<div class="klein">' + problem.name + ' ' + FARBWORT[problem.bewertung.farbe] + ': ' + esc(grundText(problem.bewertung.gruende[0])) + '</div>';
    if (!offen.some(f => f.bewertung)) inhalt += '<div class="klein">' + (a.laeuft ? "Wird geladen …" : "Noch keine Vorhersage") + '</div>';
  }
  if (!a.leer) {
    const v = a.quellen.vorhersage;
    if (v.vorhanden && !v.aktuell) inhalt += '<div class="klein status-orange">Nicht aktuell – Stand: ' + standText(v.stand, jetzt) + '</div>';
    if (a.quellen.warnungen.fehler) inhalt += '<div class="klein status-orange">Amtliche Warnungen nicht erreichbar</div>';
  }
  return '<button type="button" class="karte wetter-kachel" data-action="tab" data-tab="wetter">' + inhalt + '</button>';
}

  return '<h2>Wetter</h2><div class="liste">' + ortZeile("wohnort") + w.wegpunkte.map(wegpunktZeile).join("") + ortZeile("arbeitsort") + '</div>' +
    '<div class="knopfreihe"><button type="button" data-action="wegpunkt-neu"' + (w.wegpunkte.length >= MAX_WEGPUNKTE ? " disabled" : "") + '>+ Wegpunkt</button></div>' +
    '<div class="feldhinweis">Bis zu ' + MAX_WEGPUNKTE + ' Wegpunkte zwischen Wohn- und Arbeitsort, in Fahrtrichtung der Hinfahrt. Sie zählen für Wind, Temperatur, Regen und Warnungen, ' +
    'sobald Wohn- und Arbeitsort festgelegt sind.</div>' + teilstreckenHtml +
    '<div class="liste" style="margin-top:12px">' + ortZeile("weitererOrt") + '</div>' +

    '<h3 style="margin-top:16px">Wetter außerhalb der Fahrten</h3>' + ortAusserhalbUmschalter(w.ortAusserhalb) +

    '<p class="klein">Ampel, Kleidung und Wind gelten für die Fahrzeit. Hin- und Rückfahrt eines Fahrtags zeigt der Reiter Wetter ab dem Ende der Rückfahrt am Vortag. ' +
    'Koordinaten (auch die der Wegpunkte) werden mit 4 Nachkommastellen gespeichert (ca. 10 m); an Open-Meteo (Vorhersage, Rückblick) und an den Deutschen Wetterdienst bzw. Bright Sky (Warnungen) ' +
    'gehen sie nur auf 3 Nachkommastellen gerundet (ca. 100 m). ' +

}

function regelZeile(aktion, titel, text) {
  return '<div class="zeile"><button type="button" class="inhalt" data-action="' + aktion + '"><div class="text"><div>' + titel + '</div>' +
    '<div class="klein">' + esc(text) + '</div></div><span class="klein" style="padding-right:16px">›</span></button></div>';
}
function kleidungKurztext(k) {
  const std = standardKleidung();
  return k.stufen.length + " Stufen · Regenzusatz " + (k.regen.length ? "ab " + k.regen.map(r => r.ab + " %").join(" / ") : "keiner") +
    " · Rückmeldung " + (k.rueckmeldung ? "an" : "aus") + (gleicherInhalt([k.stufen, k.regen], [std.stufen, std.regen]) ? " · Standard" : "");
}
function ampelKurztext(g) {
  return "Böen " + zahlFeld(g.gelbBoeen) + " / " + zahlFeld(g.rotBoeen) + " km/h · Niederschlag " + zahlFeld(g.gelbNiederschlag) + " / " + zahlFeld(g.rotStarkregen) +
    " mm/h · Regen ab " + zahlFeld(g.gelbRegenWahrscheinlichkeit) + " %" + (gleicherInhalt(g, standardAmpel()) ? " · Standard" : "");
}

// Zustand des Ort-Formulars; die Koordinaten stehen in den Feldern "Breite" und "Länge"
let formOrt = null; // { rolle, index (nur Wegpunkt; null = neu), treffer }

// Ort des Formulars: Wohnort, Arbeitsort, weiterer Ort oder ein Wegpunkt
function ortVon(rolle, index) {
  const w = daten.einstellungen.wetter;
  return rolle === "wegpunkt" ? (index === null ? null : w.wegpunkte[index] || null) : w[rolle];
}
function ortFormular(rolle, index = null) {
  const o = ortVon(rolle, index);
  const titel = rolle === "wegpunkt" ? (index === null ? "Neuer Wegpunkt" : wegpunktTitel(index)) : ORT_TITEL[rolle];
  formOrt = { rolle, index, treffer: [], titel };
  fensterOeffnen(
    '<h2>' + titel + '</h2>' +
    (rolle === "wegpunkt" ? '<p class="klein" style="margin-top:0">Ein Punkt auf deinem Weg zwischen Wohn- und Arbeitsort. Ein neuer Wegpunkt kommt ans Ende, direkt vor den Arbeitsort; ' +
      'die Reihenfolge änderst du in den Einstellungen mit ▲/▼.</p>' : "") +
    '<label for="o-suche">Ort suchen</label>' +
    '<div class="suchzeile"><input type="search" id="o-suche" enterkeyhint="search" autocomplete="off" placeholder="Name des Orts" data-enter="ort-suchen">' +
    '<button type="button" data-action="ort-suchen">Suchen</button></div>' +
    '<div id="o-treffer"></div>' +
    '<div class="knopfreihe"><button type="button" class="voll" data-action="ort-standort">📍 Aktueller Standort</button></div>' +
    '<label for="o-lat">Koordinaten (Breite und Länge in Grad)</label>' +
    // Ohne Zifferntastatur: auf dem iPhone fehlt dort das Minus (Süd und West)
    '<div class="suchzeile"><input type="text" id="o-lat" autocomplete="off" placeholder="Breite, z. B. 51,1234" aria-label="Breite" data-input="ort-karte" value="' + (o ? koordinateFeld(o.lat) : "") + '">' +
    '<input type="text" id="o-lon" autocomplete="off" placeholder="Länge, z. B. 10,4567" aria-label="Länge" data-input="ort-karte" value="' + (o ? koordinateFeld(o.lon) : "") + '"></div>' +
    '<div class="feldhinweis" id="o-gewaehlt">Aus der Suche, vom Standort oder direkt eingeben (Komma oder Punkt, Süd und West mit Minus).</div>' +
    // Öffnet Apple Karten mit den Werten in den Feldern (auch vor dem Speichern); vorher geht nichts an Apple
    '<div class="knopfreihe"><a class="knopf voll" id="o-karte" target="_blank" rel="noopener noreferrer">🗺️ In Karten zeigen</a></div>' +
    '<label for="o-name">Name (zur Anzeige)</label><input type="text" id="o-name" data-input="ort-karte" value="' + esc(o ? o.name : "") + '">' +
    (rolle === "weitererOrt" ? '<label class="haken"><input type="checkbox" id="o-aktiv"' + (o && o.aktiv ? " checked" : "") + '>' +
      '<span>Aktiv<br><span class="klein">Der Reiter Wetter zeigt dann das Wetter an diesem Ort (ohne Hin- und Rückfahrt).</span></span></label>' : "") +
    '<div class="feldhinweis">Gespeichert werden die Koordinaten mit 4 Nachkommastellen (ca. 10 m); an die Wetterdienste gehen sie nur auf 3 Nachkommastellen gerundet (ca. 100 m). ' +
    'Für die Suche geht nur der eingegebene Name an Open-Meteo. „In Karten zeigen“ öffnet Apple Karten an dieser Stelle; erst dann gehen Koordinaten und Name an Apple.</div>' +
    '<div class="knopfreihe"><button type="button" data-action="fenster-zu">Abbrechen</button>' +
    '<button type="button" class="primaer" data-action="ort-speichern">Speichern</button></div>' +
    (o ? '<div class="knopfreihe"><button type="button" class="gefahr voll" data-action="ort-entfernen">' + (rolle === "wegpunkt" ? "Wegpunkt entfernen" : "Ort entfernen") + '</button></div>' : "")
  );
  ortKarteAktualisieren();
}
// "In Karten zeigen" folgt den Feldern; ohne gültige Koordinaten ist der Knopf gesperrt.
// Ohne Namen trägt die Markierung die Bezeichnung des Orts (z. B. "Wohnort").
function ortKarteAktualisieren() {
  const a = document.getElementById("o-karte");
  if (!a || !formOrt) return;
  const lat = zahlLesen(wert("o-lat")), lon = zahlLesen(wert("o-lon"));
  if (lat !== null && lon !== null && Math.abs(lat) <= 90 && Math.abs(lon) <= 180) {
    a.href = kartenUrl({ name: wert("o-name").trim() || formOrt.titel, lat, lon });
    a.removeAttribute("aria-disabled");
  } else {
    a.removeAttribute("href");
    a.setAttribute("aria-disabled", "true");
  }
}
function ortGewaehltAnzeigen(text) {
  const el = document.getElementById("o-gewaehlt");
  if (el) el.textContent = text;
}
// Koordinaten in die Felder übernehmen (auf 4 Nachkommastellen gerundet)
function ortKoordinatenSetzen(lat, lon, text) {
  document.getElementById("o-lat").value = koordinateFeld(lat);
  document.getElementById("o-lon").value = koordinateFeld(lon);
  ortGewaehltAnzeigen(text);
  ortKarteAktualisieren();
}
async function ortSuchen() {
  const text = wert("o-suche").trim();
  const ziel = document.getElementById("o-treffer");
  if (text.length < 2) { ziel.innerHTML = '<div class="feldhinweis warn">Bitte mindestens 2 Buchstaben eingeben.</div>'; return; }
  ziel.innerHTML = '<div class="feldhinweis">Suche …</div>';
  let treffer;
  try {
    treffer = ortsTrefferLesen(await jsonAbrufen(ortssucheUrl(text)));
  } catch (e) {
    if (document.getElementById("o-treffer")) ziel.innerHTML = '<div class="feldhinweis warn">Ortssuche nicht möglich (' + esc(e.message) + ').</div>';
    return;
  }
  // Fenster inzwischen geschlossen oder ein anderes geöffnet
  if (!formOrt || !document.getElementById("o-treffer")) return;
  formOrt.treffer = treffer;
  ziel.innerHTML = treffer.length
    ? '<div class="liste" style="margin-top:8px">' + treffer.map((t, i) => '<div class="zeile"><button type="button" class="inhalt" data-action="ort-waehlen" data-i="' + i + '">' +
        '<div class="text"><div>' + esc(t.name) + '</div><div class="klein">' + esc(t.zusatz) + '</div></div></button></div>').join("") + '</div>'
    : '<div class="feldhinweis warn">Kein Ort gefunden.</div>';
}
function ortWaehlen(i) {
  const t = formOrt.treffer[i];
  if (!t) return;
  document.getElementById("o-name").value = t.name;
  document.getElementById("o-treffer").innerHTML = "";
  ortKoordinatenSetzen(t.lat, t.lon, "Übernommen aus der Suche: " + t.name + (t.zusatz ? ", " + t.zusatz : "") + ".");
}
function ortStandort() {
  if (!navigator.geolocation) { ortGewaehltAnzeigen("Der Standort ist auf diesem Gerät nicht verfügbar."); return; }
  ortGewaehltAnzeigen("Standort wird bestimmt …");
  navigator.geolocation.getCurrentPosition(pos => {
    if (!formOrt || !document.getElementById("o-name")) return;
    const name = document.getElementById("o-name");
    if (!name.value.trim()) name.value = "Aktueller Standort";
    ortKoordinatenSetzen(pos.coords.latitude, pos.coords.longitude, "Übernommen vom aktuellen Standort (auf 4 Nachkommastellen gerundet).");
  }, err => {
    ortGewaehltAnzeigen("Standort nicht verfügbar" + (err && err.code === 1 ? " (Zugriff nicht erlaubt)." : "."));
  }, { enableHighAccuracy: false, timeout: 15000, maximumAge: 10 * 60 * 1000 });
}
function ortSpeichern() {
  const name = wert("o-name").trim();
  const lat = zahlLesen(wert("o-lat")), lon = zahlLesen(wert("o-lon"));
  if (lat === null || lon === null) { alert("Bitte einen Ort suchen und auswählen, den aktuellen Standort verwenden oder Breite und Länge eingeben, z. B. 51,1234 und 10,4567."); return; }
  if (Math.abs(lat) > 90 || Math.abs(lon) > 180) { alert("Die Breite muss zwischen −90 und 90 liegen, die Länge zwischen −180 und 180."); return; }
  if (!name) { alert("Bitte einen Namen für den Ort eingeben."); return; }
  const ort = { name, lat: koordinateSpeichern(lat), lon: koordinateSpeichern(lon) };
  const w = daten.einstellungen.wetter;
  if (formOrt.rolle === "wegpunkt") {
    if (formOrt.index !== null) w.wegpunkte[formOrt.index] = ort;
    else {
      if (w.wegpunkte.length >= MAX_WEGPUNKTE) { alert("Es sind höchstens " + MAX_WEGPUNKTE + " Wegpunkte möglich."); return; }
      // Neuer Wegpunkt vor dem Arbeitsort: Die letzte Teilstrecke wird geteilt, beide Teile zählen wie bisher
      w.wegpunkte.push(ort);
      w.windTeilstrecken.splice(w.windTeilstrecken.length - 1, 0, w.windTeilstrecken[w.windTeilstrecken.length - 1]);
    }
  } else {
    if (formOrt.rolle === "weitererOrt") ort.aktiv = document.getElementById("o-aktiv").checked;
    w[formOrt.rolle] = ort;
  }
  if (speichern()) { fensterSchliessen(); zeichnen(); meldung(formOrt.rolle === "wegpunkt" ? "Wegpunkt gespeichert" : "Ort gespeichert"); wetterBeiBedarf(); }
}
async function ortEntfernen() {

// Reihenfolge der Wegpunkte; die Schalter der Teilstrecken bleiben an ihrer Stelle

// Kurztext je Bereich für die Liste: "Oberkörper T-Shirt · Beine kurze Hose"

      [esc(bereicheKurz(s.bereiche)) + (s.haendeBeiRegen ? " · bei Regen Hände " + esc(s.haendeBeiRegen) : ""), "Rückmeldungen: " + auswertungText(aus[s.id])])).join("") + '</div>' +

function kleidungStufeSpeichern(iText) {
  const k = daten.einstellungen.wetter.kleidung, n = k.stufen.length;

  // Nach der Grenze sortieren; die Stufe "darunter" bleibt die letzte

function kleidungRegenSpeichern(iText) {
  const k = daten.einstellungen.wetter.kleidung, i = iText === "" ? null : Number(iText);

  if (!BEREICH_SCHLUESSEL.some(b => bereiche[b])) { alert("Bitte das Regenzeug in mindestens einem Bereich eintragen, z. B. Oberkörper „Regenjacke“."); return; }
  const andere = k.regen.filter((r, j) => j !== i);
  if (andere.some(r => r.ab === ab)) { alert("Es gibt schon einen Regenzusatz ab " + zahlFeld(ab) + " %. Trage das Regenzeug dort ein."); return; }

  if (!kleidungPruefen({ stufen: k.stufen, regen, rueckmeldung: k.rueckmeldung })) return;

}
async function kleidungRegenWeg(i) {

}
// Dieselben Regeln wie beim Einlesen einer Sicherung
function kleidungPruefen(neu) {

}

// ---------- Rückmeldung nach einer Fahrt ----------

const RUECKMELDUNG_TEXT = { "zu-warm": "zu warm", "passte": "passte", "zu-kalt": "zu kalt" };
// Rückmeldungen aus allen Einträgen je Kleidungsstufe (id), getrennt auch die
// Fahrten mit Regenkleidung: { id: { anzahl, "zu-warm", passte, "zu-kalt", regen: { … } } }
function rueckmeldungenAuswerten() {
  const leer = () => ({ anzahl: 0, "zu-warm": 0, passte: 0, "zu-kalt": 0 });
  const erg = {};
  daten.eintraege.forEach(e => e.wetter && ["hin", "rueck"].forEach(art => {
    const f = e.wetter[art];
    if (!f || !f.kleidung || !f.rueckmeldung) return;
    const z = erg[f.kleidung] || (erg[f.kleidung] = Object.assign(leer(), { regen: leer() }));
    z.anzahl++; z[f.rueckmeldung]++;
    if (f.regenkleidung) { z.regen.anzahl++; z.regen[f.rueckmeldung]++; }
  }));
  return erg;
}
// "3× zu kalt, 1× passte (bei Regen: 1× zu kalt)"
function auswertungText(z) {
  if (!z || !z.anzahl) return "noch keine";
  const teil = x => ["zu-kalt", "passte", "zu-warm"].filter(u => x[u]).map(u => x[u] + "× " + RUECKMELDUNG_TEXT[u]).join(", ");
  return teil(z) + (z.regen.anzahl ? " (bei Regen: " + teil(z.regen) + ")" : "");
}
// Rückmeldung zu einer Fahrt eines Eintrags (mit "Rückgängig"). Sie wird nur
// gespeichert und ausgewertet; die Grenzen der Stufen bleiben, wie sie sind.
function rueckmeldungGeben(id, fahrt, urteil, ausDetail) {
  const e = daten.eintraege.find(x => x.id === id);
  const fw = e && e.wetter && e.wetter[fahrt];
  if (!fw || !(urteil in RUECKMELDUNG_TEXT) || fw.rueckmeldung === urteil) return;
  mitRueckgaengig(() => { fw.rueckmeldung = urteil; }, () => {
    const k = daten.einstellungen.wetter.kleidung, i = k.stufen.findIndex(s => s.id === fw.kleidung);
    return "Rückmeldung „" + RUECKMELDUNG_TEXT[urteil] + "“ gespeichert" + (i < 0 ? "" : " · Stufe " + stufeBereich(k, i) + ": " + auswertungText(rueckmeldungenAuswerten()[fw.kleidung]));
  }, ausDetail ? () => { const y = fenster.scrollTop; eintragAnsicht(id); fenster.scrollTop = y; } : null);
}
function rueckmeldungKnoepfe(e, fahrt, fw, ausDetail) {
  return '<div class="rueckmeldung" role="group" aria-label="Kleidung bei der ' + (fahrt === "hin" ? "Hinfahrt" : "Rückfahrt") + '">' +
    ["zu-warm", "passte", "zu-kalt"].map(u => '<button type="button" data-action="rueckmeldung" data-id="' + e.id + '" data-fahrt="' + fahrt + '" data-urteil="' + u + '"' +
      (ausDetail ? ' data-detail="1"' : "") + ' aria-pressed="' + (fw.rueckmeldung === u) + '"' + (fw.rueckmeldung === u ? ' class="primaer"' : "") + '>' +
      RUECKMELDUNG_TEXT[u] + '</button>').join("") + '</div>';
}
// Kleidung einer Stufe in einer Zeile (für Fahrten ohne festgehaltene Empfehlung)
function stufeText(id, k = daten.einstellungen.wetter.kleidung) {
  const s = k.stufen.find(x => x.id === id);
  return s ? empfehlungText(s.bereiche) : "(Kleidungsstufe gibt es nicht mehr)";
}
// Die bei einer Fahrt empfohlene Kleidung, wie sie damals empfohlen wurde
function fahrtKleidungText(fw) {
  return fw.empfehlung && empfehlungText(fw.empfehlung) ? empfehlungText(fw.empfehlung) : stufeText(fw.kleidung);
}
// Fahrten von heute und den zwei Tagen davor, die vorbei sind und noch keine
// Rückmeldung haben (nur, wenn die Rückmeldung eingeschaltet ist)
function offeneRueckmeldungen(jetzt) {
  if (!rueckmeldungAn()) return [];
  const h = isoAusDate(new Date(jetzt)), w = daten.einstellungen.wetter;
  const liste = [];
  daten.eintraege.filter(e => e.wetter && e.datum <= h && e.datum >= plusTage(h, -2))
    .sort((a, b) => b.datum.localeCompare(a.datum)).forEach(e => {
      [["hin", "Hinfahrt", w.hinfahrt], ["rueck", "Rückfahrt", w.rueckfahrt]].forEach(([art, name, f]) => {
        const fw = e.wetter[art];
        if (fw && fw.kleidung && !fw.rueckmeldung && zeitpunktAm(e.datum, minutenAus(f.bis)) <= jetzt) liste.push({ e, art, name, fw, h });
      });
    });
  return liste.slice(0, 2);
}
function rueckmeldungKarte(jetzt) {
  const liste = offeneRueckmeldungen(jetzt);
  if (!liste.length) return "";
  return '<div class="karte" style="margin-top:8px"><h3>Wie war die Kleidung?</h3>' + liste.map(x =>
    '<div class="klein" style="margin-top:8px">' + tagTitel(x.e.datum, x.h) + ', ' + x.name + ': ' + esc(fahrtKleidungText(x.fw)) + '</div>' +
    rueckmeldungKnoepfe(x.e, x.art, x.fw, false)).join("") +
    '<div class="feldhinweis">Die Auswertung je Stufe steht unter Einstellungen → Wetter → Kleidung. Die Grenzen ändern sich dadurch nicht.</div></div>';
}

/* ---------- Wartung (Werkstatt: Aufträge, Aufgaben, Mängel) ---------- */

// Kennung eines offenen Auftrags in der Oberfläche: die id eines gespeicherten
// Auftrags oder "neu:<Auftragsart>" für einen vorgemerkten
function auftragKey(o) { return o.auftrag.id || "neu:" + o.art.id; }
function offenerVon(key, lage = werkstattLage()) { return lage.offene.find(o => auftragKey(o) === key) || null; }
// Vorgemerkten Auftrag bei der ersten Änderung speichern; liefert den gespeicherten Auftrag
function auftragFestlegen(key) {
  const vorhanden = daten.auftraege.find(a => a.id === key && a.status === "geplant");
  if (vorhanden) return vorhanden;
  const artId = key.startsWith("neu:") ? key.slice(4) : key.startsWith("anlegen:") ? key.slice(8) : null;
  const art = artVon(artId);
  if (!art || art.typ !== "auftrag") return null;
  // Eine Auftragsart mit Fälligkeit hat höchstens einen geplanten Auftrag
  const geplant = hatFaelligkeit(art) && daten.auftraege.find(a => a.status === "geplant" && a.wartungsartId === artId);
  if (geplant) return geplant;
  const a = { id: neueId(), wartungsartId: artId, status: "geplant", termin: null, werkstatt: "", datum: null, kmStand: null, kmManuell: false,
    notiz: "", positionen: [], ausgeschlossen: [] };
  daten.auftraege.push(a);
  return a;
}
// Auftragsarten ohne Fälligkeit (Reparatur, Eigenleistung): bei Bedarf angelegt
const bedarfsArten = () => auftragsArten().filter(a => !hatFaelligkeit(a));
function bedarfsArt(muster) { return bedarfsArten().find(a => muster.test(a.name)) || bedarfsArten()[0] || null; }
const reparaturArt = () => bedarfsArt(/reparatur/i);
const eigenleistungArt = () => bedarfsArt(/eigenleistung/i);

// Kurze Fälligkeit einer Aufgabe: "überfällig", "bei ca. 5.000 km fällig", "am 20.11.2026 fällig"
function aufgabeKurz(st) {
  if (st.klasse === "status-rot") return st.text.startsWith("heute") ? "heute fällig" : "überfällig";
  if (st.kmGeschaetzt && st.grenzeKm !== null) return "bei " + caKm(st.grenzeKm) + " fällig";
  if (st.datum) return "am " + datumText(st.datum) + " fällig";

}
// Name einer Aufgabe mit Bauteil: "Bremsbeläge wechseln · Bremse vorn"

// Kurzer Name eines offenen Auftrags mit Termin bzw. Fälligkeit

// Vorschlag: "Bremsbeläge wechseln bei ca. 5.000 km fällig – zu diesem Auftrag nehmen?"
function vorschlagHtml(x, o) {

function bildWartung(h = heute()) {
  const lage = werkstattLage(h);

      '</div>';
  });
  html += '</div>';

  // Mängel erfassen (ohne offene Mängel ohne Auftrag) und erledigte Mängel
  const erledigt = daten.maengel.filter(m => m.status === "erledigt")
    .sort((a, b) => (b.erledigtAm || b.datum).localeCompare(a.erledigtAm || a.datum));

  if (!ohne.length) {

      '<div class="knopfreihe"><button type="button" data-action="mangel-neu">+ Mangel erfassen</button></div>';

      CHEVRON +

      (erledigteMaengelOffen ? erledigt.map(m => mangelZeile(m, false)).join("") : "") + '</div>';

        '<span class="klein" style="padding-right:16px">›</span></button></div>').join("") + '</div>';
  });
  html += '<div class="knopfreihe"><button type="button" data-action="art-neu">+ Neue Wartungsart</button></div>';

}

// Regel einer Wartungsart als Text: "Zeitfenster: März–April, ab 2027", "Intervall: 24 Monate oder 5.000 km · Bremse · Standard: nächste Inspektion"
function artRegelText(a) {
  let regel;

    const iv = [a.intervallMonate ? a.intervallMonate + " Monate" : "", a.intervallKm ? kmText(a.intervallKm) + " km" : ""].filter(Boolean).join(" oder ");

  }
  if (a.einmalig) regel = "einmalig · " + regel;
  if (a.typ === "aufgabe") regel += (a.bauteil ? " · " + a.bauteil : "") + " · Standard: " + zuordnungText(a);
  return regel;
}
