}
// Eine Fahrt mit Wetter aus Version 5: empfohlene Kleidung festhalten, wie 4b
// sie angezeigt hat ("Jacke, lange Hose + Regenjacke"), und ob Regenkleidung galt
function fahrtAusVersion5(f, stufen5, regen5) {
  if (!istObjekt(f)) return f;
  const s = typeof f.kleidung === "string" ? stufen5.find(x => istObjekt(x) && x.id === f.kleidung) : null;
  const p = istEndlich(f.regenWahrscheinlichkeit) ? f.regenWahrscheinlichkeit : null;
  const regen = p === null ? [] : regen5.filter(r => istObjekt(r) && istEndlich(r.ab) && p >= r.ab && typeof r.text === "string").map(r => r.text.trim());
  const text = s && typeof s.text === "string" ? s.text.trim() + (regen.length ? " + " + regen.join(", ") : "") : null;
  return Object.assign({}, f, {
    empfehlung: f.empfehlung !== undefined ? f.empfehlung : text ? bereicheAus({ oberkoerper: text }) : null,
    regenkleidung: f.regenkleidung !== undefined ? f.regenkleidung : !!f.kleidung && regen.length > 0
  });
}

function migrieren(roh) {
  if (!roh || typeof roh !== "object" || Array.isArray(roh)) throw new Error("Die Datei enthält keine Rad-km-Daten.");
  if (!Number.isInteger(roh.version) || roh.version < 1) throw new Error("Die Versionsnummer („version“) fehlt oder ist ungültig.");
  if (roh.version > DATEN_VERSION) throw new Error("Die Daten stammen aus einer neueren App-Version (" + roh.version + "). Bitte die App aktualisieren.");
  let d = roh;
  while (d.version < DATEN_VERSION) {
    const schritt = MIGRATIONEN[d.version];
    if (!schritt) throw new Error("Keine Umwandlung für Version " + d.version + " vorhanden.");
    d = schritt(d);
  }
  return d;
}

const istObjekt = v => !!v && typeof v === "object" && !Array.isArray(v);
const istEndlich = v => typeof v === "number" && Number.isFinite(v);

// Prüft die Wetter-Einstellungen (ab Version 4) und gibt eine bereinigte Kopie
// zurück. Fehlende Teile bekommen die Standardwerte; Koordinaten werden auf 4
// Nachkommastellen gerundet.
function wetterPruefen(w, fehler) {
  const std = standardWetter();
  if (w === undefined || w === null) return std;
  if (!istObjekt(w)) fehler("Einstellungen: „wetter“ muss ein Objekt sein.");

  const ortLesen = (o, wo) => {
    if (!istObjekt(o)) fehler(wo + ": muss ein Objekt oder null sein.");
    if (typeof o.name !== "string" || !o.name.trim()) fehler(wo + ": Name fehlt.");
    if (!(istEndlich(o.lat) && Math.abs(o.lat) <= 90)) fehler(wo + ": lat muss eine Zahl von -90 bis 90 sein.");
    if (!(istEndlich(o.lon) && Math.abs(o.lon) <= 180)) fehler(wo + ": lon muss eine Zahl von -180 bis 180 sein.");
    return { name: o.name.trim(), lat: koordinateSpeichern(o.lat), lon: koordinateSpeichern(o.lon) };
  };
  const ort = (feld, name) => {
    const o = w[feld], wo = "Wetter, " + name;
    if (o === undefined || o === null) return null;
    const erg = ortLesen(o, wo);
    if (feld === "weitererOrt") {
      if (o.aktiv !== undefined && o.aktiv !== null && typeof o.aktiv !== "boolean") fehler(wo + " (aktiv): muss true oder false sein.");
      erg.aktiv = o.aktiv === true;
    }
    return erg;
  };

  // Wegpunkte (höchstens 3, vom Wohnort zum Arbeitsort) und je Teilstrecke, ob sie für den Wind zählt
  let wegpunkte = [];
  if (w.wegpunkte !== undefined && w.wegpunkte !== null) {
    if (!Array.isArray(w.wegpunkte)) fehler("Wetter: „wegpunkte“ muss eine Liste sein.");
    if (w.wegpunkte.length > MAX_WEGPUNKTE) fehler("Wetter: Es sind höchstens " + MAX_WEGPUNKTE + " Wegpunkte möglich.");
    wegpunkte = w.wegpunkte.map((o, i) => ortLesen(o, "Wetter, Wegpunkt " + (i + 1)));
  }
  let windTeilstrecken = wegpunkte.map(() => true).concat(true);
  if (w.windTeilstrecken !== undefined && w.windTeilstrecken !== null) {
    const t = w.windTeilstrecken;
    if (!Array.isArray(t) || t.length !== wegpunkte.length + 1 || t.some(x => typeof x !== "boolean")) {
      fehler("Wetter: „windTeilstrecken“ muss eine Liste mit " + (wegpunkte.length + 1) + " Werten true oder false sein (eine Teilstrecke mehr als Wegpunkte).");
    }
    windTeilstrecken = [...t];
  }

  // Fahrzeit: fehlende Felder bekommen den Standardwert; abfahrtAn false = keine übliche Abfahrt
  const fahrt = (feld, name) => {
    const f = w[feld], s = std[feld], wo = "Wetter, " + name;
    if (f === undefined) return s;
    if (!istObjekt(f)) fehler(wo + ": muss ein Objekt sein.");
    const von = f.von === undefined ? s.von : f.von, bis = f.bis === undefined ? s.bis : f.bis;
    if (!istUhrzeit(von) || !istUhrzeit(bis)) fehler(wo + ": von und bis müssen Uhrzeiten im Format HH:MM sein.");
    if (von >= bis) fehler(wo + ": „von“ muss vor „bis“ liegen.");
    const abfahrtAn = f.abfahrtAn === undefined ? s.abfahrtAn : f.abfahrtAn;
    if (typeof abfahrtAn !== "boolean") fehler(wo + ": abfahrtAn muss true oder false sein.");
    const abfahrt = f.abfahrt === undefined ? s.abfahrt : f.abfahrt;
    if (!istUhrzeit(abfahrt)) fehler(wo + ": abfahrt muss eine Uhrzeit im Format HH:MM sein (ohne übliche Abfahrt: abfahrtAn false).");
    const dauer = f.dauer === undefined ? s.dauer : f.dauer;
    if (!(Number.isInteger(dauer) && dauer >= 5 && dauer <= 240)) fehler(wo + ": dauer muss eine ganze Zahl von 5 bis 240 (Minuten) sein.");
    return { von, bis, abfahrtAn, abfahrt, dauer };
  };
  const ortAusserhalb = w.ortAusserhalb === undefined ? std.ortAusserhalb : w.ortAusserhalb;
  if (!ORT_AUSSERHALB.includes(ortAusserhalb)) fehler("Wetter: „ortAusserhalb“ muss „wohnort“ oder „standort“ sein.");

  let ampel = std.ampel;
  if (w.ampel !== undefined) {
    if (!istObjekt(w.ampel)) fehler("Wetter, Ampel: muss ein Objekt sein.");
    const groesser0 = [v => istEndlich(v) && v > 0, "eine Zahl > 0"];
    const regeln = {
      rotBoeen: groesser0, rotStarkregen: groesser0, rotWarnstufe: [v => Number.isInteger(v) && v >= 1 && v <= 4, "eine Warnstufe von 1 bis 4"],
      gelbRegenWahrscheinlichkeit: [v => istEndlich(v) && v >= 0 && v <= 100, "eine Zahl von 0 bis 100"], gelbNiederschlag: groesser0, gelbBoeen: groesser0,
      gelbTemperatur: [istEndlich, "eine Zahl"], glaetteTemperatur: [istEndlich, "eine Zahl"]
    };
    ampel = {};
    Object.keys(std.ampel).forEach(k => {
      const v = w.ampel[k] === undefined ? std.ampel[k] : w.ampel[k];
      if (!regeln[k][0](v)) fehler("Wetter, Ampel: " + k + " muss " + regeln[k][1] + " sein.");
      ampel[k] = v;
    });
    if (!(ampel.gelbBoeen < ampel.rotBoeen)) fehler("Wetter, Ampel: gelbBoeen muss kleiner als rotBoeen sein.");
    if (!(ampel.gelbNiederschlag < ampel.rotStarkregen)) fehler("Wetter, Ampel: gelbNiederschlag muss kleiner als rotStarkregen sein.");
  }

  let kleidung = std.kleidung;
  if (w.kleidung !== undefined) {
    const k = w.kleidung, wo = "Wetter, Kleidung";
    if (!istObjekt(k)) fehler(wo + ": muss ein Objekt sein.");
    let stufen = std.kleidung.stufen;
    if (k.stufen !== undefined) {
      if (!Array.isArray(k.stufen) || k.stufen.length < 2) fehler(wo + ": „stufen“ muss eine Liste mit mindestens zwei Stufen sein.");
      const ids = new Set();
      stufen = k.stufen.map((s, i) => {
        const letzte = i === k.stufen.length - 1, wn = wo + ", Stufe " + (i + 1);
        if (!istObjekt(s)) fehler(wn + ": ist kein Objekt.");
        if (typeof s.id !== "string" || !s.id) fehler(wn + ": id fehlt.");
        if (ids.has(s.id)) fehler(wn + ": id „" + s.id + "“ kommt doppelt vor.");
        ids.add(s.id);
        const ab = s.ab ?? null;
        if (letzte && ab !== null) fehler(wn + ": Die letzte Stufe gilt unterhalb der vorigen und hat kein „ab“ (null).");
        if (!letzte && !istEndlich(ab)) fehler(wn + ": ab muss eine Zahl (°C) sein.");
        const bereiche = bereichePruefen(s.bereiche, wn, fehler);
        const hr = s.haendeBeiRegen ?? null;
        if (hr !== null && typeof hr !== "string") fehler(wn + ": haendeBeiRegen muss ein Text oder null sein.");
        return { id: s.id, ab, bereiche, haendeBeiRegen: hr && hr.trim() ? hr.trim() : null };
      });
      for (let i = 1; i < stufen.length - 1; i++) {
        if (!(stufen[i].ab < stufen[i - 1].ab)) fehler(wo + ": Die Untergrenzen der Stufen müssen von warm nach kalt abnehmen.");
      }
    }
    let regen = std.kleidung.regen;
    if (k.regen !== undefined) {
      if (!Array.isArray(k.regen)) fehler(wo + ": „regen“ muss eine Liste sein.");
      regen = k.regen.map((r, i) => {
        const wn = wo + ", Regen Nr. " + (i + 1);
        if (!istObjekt(r)) fehler(wn + ": ist kein Objekt.");
        if (!(istEndlich(r.ab) && r.ab >= 0 && r.ab <= 100)) fehler(wn + ": ab muss eine Regenwahrscheinlichkeit von 0 bis 100 sein.");
        return { ab: r.ab, bereiche: bereichePruefen(r.bereiche, wn, fehler) };
      });
      regen.forEach((r, i) => { if (i && !(r.ab > regen[i - 1].ab)) fehler(wo + ": Die Regenschwellen müssen aufsteigend sein."); });
    }
    const rueckmeldung = k.rueckmeldung ?? true;
    if (typeof rueckmeldung !== "boolean") fehler(wo + ": rueckmeldung muss true oder false sein.");
    kleidung = { stufen, regen, rueckmeldung };
  }

  return {
    wohnort: ort("wohnort", "Wohnort"), arbeitsort: ort("arbeitsort", "Arbeitsort"), weitererOrt: ort("weitererOrt", "weiterer Ort"),
    wegpunkte, windTeilstrecken, ortAusserhalb, hinfahrt: fahrt("hinfahrt", "Hinfahrt"), rueckfahrt: fahrt("rueckfahrt", "Rückfahrt"), ampel, kleidung
  };
}

// Kleidung je Körperbereich prüfen: sechs Texte (fehlend = ""), mindestens einer ausgefüllt
function bereichePruefen(b, wo, fehler, mindestensEiner = true, feld = "bereiche") {
  if (!istObjekt(b)) fehler(wo + ": „" + feld + "“ muss ein Objekt sein (kopf, hals, haende, oberkoerper, beine, fuesse).");
  const erg = {};
  BEREICH_SCHLUESSEL.forEach(k => {
    const v = b[k] ?? "";
    if (typeof v !== "string") fehler(wo + ": " + k + " muss ein Text sein.");
    erg[k] = v.trim();
  });
  if (mindestensEiner && !BEREICH_SCHLUESSEL.some(k => erg[k])) fehler(wo + ": Mindestens ein Bereich (Kopf, Hals, Hände, Oberkörper, Beine, Füße) muss ausgefüllt sein.");
  return erg;
}

// Wetter der Hin- und Rückfahrt eines Tageseintrags (ab Version 4; null = keins)
const AMPELFARBEN = ["gruen", "gelb", "rot"];
const RUECKMELDUNGEN = ["zu-warm", "passte", "zu-kalt"];
function eintragWetterPruefen(ew, wo, fehler) {
  if (ew === undefined || ew === null) return null;
  if (!istObjekt(ew)) fehler(wo + ": muss ein Objekt oder null sein.");
  if (ew.quelle !== "vorhersage" && ew.quelle !== "rueckblick") fehler(wo + ": quelle muss „vorhersage“ oder „rueckblick“ sein.");
  if (typeof ew.stand !== "string" || isNaN(Date.parse(ew.stand))) fehler(wo + ": stand muss ein Zeitpunkt sein (ISO 8601).");
  const fahrt = (f, name) => {
    if (f === undefined || f === null) return null;
    const wn = wo + ", " + name;
    if (!istObjekt(f)) fehler(wn + ": muss ein Objekt oder null sein.");
    const zahl = (k, min) => { if (!(istEndlich(f[k]) && (min === undefined || f[k] >= min))) fehler(wn + ": " + k + " muss eine Zahl" + (min === undefined ? "" : " ≥ " + min) + " sein."); return f[k]; };
    const w = f.regenWahrscheinlichkeit ?? null;
    if (w !== null && !(istEndlich(w) && w >= 0 && w <= 100)) fehler(wn + ": regenWahrscheinlichkeit muss eine Zahl von 0 bis 100 oder null sein.");
    if (!AMPELFARBEN.includes(f.ampel)) fehler(wn + ": ampel muss „gruen“, „gelb“ oder „rot“ sein.");
    const kleidung = f.kleidung ?? null;
    if (kleidung !== null && (typeof kleidung !== "string" || !kleidung)) fehler(wn + ": kleidung muss die id einer Kleidungsstufe oder null sein.");
    const em = f.empfehlung ?? null;
    const empfehlung = em === null ? null : bereichePruefen(em, wn, fehler, false, "empfehlung");
    const regenkleidung = f.regenkleidung ?? false;
    if (typeof regenkleidung !== "boolean") fehler(wn + ": regenkleidung muss true oder false sein.");
    const rm = f.rueckmeldung ?? null;
    if (rm !== null && !RUECKMELDUNGEN.includes(rm)) fehler(wn + ": rueckmeldung muss „zu-warm“, „passte“, „zu-kalt“ oder null sein.");
    return { temperatur: zahl("temperatur"), gefuehlt: zahl("gefuehlt"), niederschlag: zahl("niederschlag", 0), regenWahrscheinlichkeit: w,
      wind: zahl("wind", 0), boeen: zahl("boeen", 0), ampel: f.ampel, kleidung, empfehlung, regenkleidung, rueckmeldung: rm };
  };
  return { quelle: ew.quelle, stand: ew.stand, hin: fahrt(ew.hin, "hin"), rueck: fahrt(ew.rueck, "rueck") };
}

// Prüft die Daten vollständig und gibt eine bereinigte Kopie zurück.
// Bei einem Fehler wird eine verständliche Meldung geworfen.
function pruefen(d) {
  const fehler = msg => { throw new Error(msg); };
  const istText = v => typeof v === "string";
  const istZahl = v => typeof v === "number" && Number.isFinite(v) && v >= 0;
  const optText = (v, wo) => {
    if (v === undefined || v === null) return "";
    if (!istText(v)) fehler(wo + ": muss ein Text sein.");
    return v;
  };
  // Ja/Nein-Merkmal; fehlt es, gilt "nein"
  const jaNein = (v, wo) => {
    if (v === undefined || v === null) return false;
    if (typeof v !== "boolean") fehler(wo + ": muss true oder false sein.");
    return v;
  };
  const liste = (v, name) => {
    if (v === undefined) return [];
    if (!Array.isArray(v)) fehler("„" + name + "“ muss eine Liste sein.");
    return v;
  };
  const objekte = (v, name) => liste(v, name).map((x, i) => {
    if (!x || typeof x !== "object" || Array.isArray(x)) fehler("„" + name + "“ Nr. " + (i + 1) + " ist kein Objekt.");
    return x;
  });

  const erg = { version: DATEN_VERSION };

  // Fahrrad
  if (d.fahrrad === null || d.fahrrad === undefined) {
    erg.fahrrad = null;
  } else {
    const f = d.fahrrad;
    if (typeof f !== "object" || Array.isArray(f)) fehler("Fahrrad: muss ein Objekt oder null sein.");
    if (!istText(f.name) || !f.name.trim()) fehler("Fahrrad: Name fehlt.");
    if (!istGueltigesDatum(f.startdatum)) fehler("Fahrrad: Startdatum ist ungültig (Format JJJJ-MM-TT).");
    if (!istZahl(f.startKm)) fehler("Fahrrad: Start-Kilometerstand muss eine Zahl ≥ 0 sein.");
    erg.fahrrad = {
      name: f.name.trim(),
      startdatum: f.startdatum,
      startKm: runden(f.startKm),
      rahmennummer: optText(f.rahmennummer, "Fahrrad (rahmennummer)").trim(),
      beschreibung: optText(f.beschreibung, "Fahrrad (beschreibung)").trim()
    };
  }

  // Einstellungen (fehlen sie, gelten die Standardwerte). Die Reihenfolge der
  // Listen bleibt unverändert; die App speichert sie aufsteigend sortiert.
  const es = d.einstellungen ?? {};
  if (typeof es !== "object" || Array.isArray(es)) fehler("„einstellungen“ muss ein Objekt sein.");
  let fahrtage = [...STANDARD_FAHRTAGE];
  if (es.fahrtage !== undefined) {
    if (!Array.isArray(es.fahrtage)) fehler("Einstellungen: „fahrtage“ muss eine Liste sein.");
    es.fahrtage.forEach(t => { if (!(Number.isInteger(t) && t >= 1 && t <= 7)) fehler("Einstellungen: Fahrtage müssen Zahlen von 1 (Montag) bis 7 (Sonntag) sein."); });
    if (new Set(es.fahrtage).size !== es.fahrtage.length) fehler("Einstellungen: ein Fahrtag kommt doppelt vor.");
    fahrtage = [...es.fahrtage];
  }
  const zielJahre = new Set();
  const jahresziele = objekte(es.jahresziele, "jahresziele").map((z, i) => {
    const wo = "Jahresziel Nr. " + (i + 1);
    if (!(Number.isInteger(z.jahr) && z.jahr >= 1900 && z.jahr <= 9999)) fehler(wo + ": jahr muss eine Jahreszahl sein.");
    if (zielJahre.has(z.jahr)) fehler(wo + ": Für " + z.jahr + " gibt es mehr als ein Jahresziel.");
    zielJahre.add(z.jahr);
    if (!(istZahl(z.km) && z.km > 0)) fehler(wo + " (" + z.jahr + "): km muss eine Zahl > 0 sein.");
    return { jahr: z.jahr, km: runden(z.km) };
  });
  // Hinweis auf einen fehlenden Eintrag am selben Tag: Schalter und Uhrzeit (ab Version 7 immer eine Uhrzeit)
  const hinweisHeuteAn = es.hinweisHeuteAn === undefined ? true : es.hinweisHeuteAn;
  if (typeof hinweisHeuteAn !== "boolean") fehler("Einstellungen: „hinweisHeuteAn“ muss true oder false sein.");
  const hinweisHeuteAb = es.hinweisHeuteAb === undefined ? STANDARD_HINWEIS_HEUTE_AB : es.hinweisHeuteAb;
  if (!istUhrzeit(hinweisHeuteAb)) fehler("Einstellungen: „hinweisHeuteAb“ muss eine Uhrzeit im Format HH:MM sein (ohne Hinweis am selben Tag: hinweisHeuteAn false).");
  erg.einstellungen = { fahrtage, jahresziele, hinweisHeuteAn, hinweisHeuteAb, wetter: wetterPruefen(es.wetter, fehler) };

  // Vorlagen
  erg.vorlagen = objekte(d.vorlagen, "vorlagen").map((v, i) => {
    const wo = "Vorlage Nr. " + (i + 1);
    if (!istText(v.name) || !v.name.trim()) fehler(wo + ": Name fehlt.");
    if (!istZahl(v.km)) fehler(wo + " („" + v.name + "“): km muss eine Zahl ≥ 0 sein.");
    return { id: istText(v.id) && v.id ? v.id : neueId(), name: v.name.trim(), km: runden(v.km), arbeitsweg: jaNein(v.arbeitsweg, wo + " (arbeitsweg)") };
  });

  // Einträge
  const daten = new Set();
  erg.eintraege = objekte(d.eintraege, "eintraege").map((e, i) => {
    const wo = "Eintrag Nr. " + (i + 1);
    if (!istGueltigesDatum(e.datum)) fehler(wo + ": Datum ist ungültig (Format JJJJ-MM-TT).");
    if (daten.has(e.datum)) fehler("Doppeltes Datum " + datumText(e.datum) + ": pro Tag ist nur ein Eintrag erlaubt.");
    daten.add(e.datum);
    if (!istZahl(e.km)) fehler("Eintrag vom " + datumText(e.datum) + ": km muss eine Zahl ≥ 0 sein.");
    const typ = e.typ === undefined ? "tag" : e.typ;
    if (typ !== "tag" && typ !== "woche") fehler("Eintrag vom " + datumText(e.datum) + ": typ muss „tag“ oder „woche“ sein.");
    const vorlage = optText(e.vorlage, "Eintrag vom " + datumText(e.datum) + " (vorlage)");
    const wetter = eintragWetterPruefen(e.wetter, "Eintrag vom " + datumText(e.datum) + " (wetter)", fehler);
    if (wetter && typ === "woche") fehler("Eintrag vom " + datumText(e.datum) + ": Eine Wochensumme hat kein Wetter (wetter: null).");
    return {
      id: istText(e.id) && e.id ? e.id : neueId(),
      datum: e.datum,
      km: runden(e.km),
      vorlage: vorlage || null,
      notiz: optText(e.notiz, "Eintrag vom " + datumText(e.datum) + " (notiz)"),
      typ: typ,
      arbeitsweg: jaNein(e.arbeitsweg, "Eintrag vom " + datumText(e.datum) + " (arbeitsweg)"),
      wetter
    };
  });

  // Wartungsarten: Aufträge (mit Zeitfenster, Intervall, einmalig oder ohne
  // Fälligkeit) und Aufgaben (Intervall, Bauteil, Standard-Zuordnung)
  const artIds = new Set();
  const istMonat = v => Number.isInteger(v) && v >= 1 && v <= 12;
  erg.wartungsarten = d.wartungsarten === undefined ? standardWartungsarten() : objekte(d.wartungsarten, "wartungsarten").map((a, i) => {
    const wo = "Wartungsart Nr. " + (i + 1);
    if (!istText(a.id) || !a.id) fehler(wo + ": id fehlt.");
    if (artIds.has(a.id)) fehler(wo + ": id „" + a.id + "“ kommt doppelt vor.");
    artIds.add(a.id);
    if (!istText(a.name) || !a.name.trim()) fehler(wo + ": Name fehlt.");
    const wn = wo + " („" + a.name + "“)";
    if (a.typ !== "auftrag" && a.typ !== "aufgabe") fehler(wn + ": typ muss „auftrag“ oder „aufgabe“ sein.");
    const aufgabe = a.typ === "aufgabe";
    const im = a.intervallMonate ?? null;
    if (im !== null && !(Number.isInteger(im) && im >= 1)) fehler(wn + ": intervallMonate muss eine ganze Zahl ≥ 1 oder null sein.");
    const ik = a.intervallKm ?? null;
    if (ik !== null && !(istZahl(ik) && ik > 0)) fehler(wn + ": intervallKm muss eine Zahl > 0 oder null sein.");
    const von = a.fensterVon ?? null, bis = a.fensterBis ?? null;
    if ((von === null) !== (bis === null)) fehler(wn + ": fensterVon und fensterBis müssen beide gesetzt oder beide null sein.");
    if (von !== null && !(istMonat(von) && istMonat(bis))) fehler(wn + ": fensterVon und fensterBis müssen Monate von 1 bis 12 sein.");
    if (von !== null && von > bis) fehler(wn + ": Das Zeitfenster darf nicht über den Jahreswechsel gehen (fensterVon ≤ fensterBis).");
    if (von !== null && aufgabe) fehler(wn + ": Eine Aufgabe kann kein Zeitfenster haben.");
    const ab = a.gueltigAbJahr ?? null;
    if (ab !== null && !(Number.isInteger(ab) && ab >= 1900 && ab <= 9999)) fehler(wn + ": gueltigAbJahr muss eine Jahreszahl oder null sein.");
    if (ab !== null && von === null) fehler(wn + ": gueltigAbJahr ist nur mit Zeitfenster erlaubt.");
    const einmalig = jaNein(a.einmalig, wn + " (einmalig)");
    if (einmalig && von !== null) fehler(wn + ": Eine einmalige Wartung kann kein jährliches Zeitfenster haben.");
    if (einmalig && aufgabe) fehler(wn + ": Eine Aufgabe kann nicht einmalig sein.");
    const bauteil = optText(a.bauteil, wn + " (bauteil)").trim() || null;
    if (bauteil !== null && !aufgabe) fehler(wn + ": Ein Bauteil gibt es nur bei Aufgaben.");
    const zu = a.zuordnung ?? null;
    if (aufgabe ? !istText(zu) || !zu : zu !== null) fehler(wn + ": zuordnung muss bei Aufgaben „" + NAECHSTE_INSPEKTION + "“ oder die id eines Auftrags sein, bei Aufträgen null.");
    return {
      id: a.id, name: a.name.trim(), typ: a.typ, intervallMonate: im, intervallKm: ik === null ? null : runden(ik),
      fensterVon: von, fensterBis: bis, gueltigAbJahr: ab, einmalig, bauteil, zuordnung: zu
    };
  });
  const artVon = id => erg.wartungsarten.find(a => a.id === id) || null;
  erg.wartungsarten.forEach((a, i) => {
    if (a.typ === "aufgabe" && a.zuordnung !== NAECHSTE_INSPEKTION && !(artVon(a.zuordnung) && artVon(a.zuordnung).typ === "auftrag")) {
      fehler("Wartungsart Nr. " + (i + 1) + " („" + a.name + "“): zuordnung „" + a.zuordnung + "“ ist kein Auftrag.");
    }
  });

  // Mängel
  const mangelIds = new Set();
  erg.maengel = objekte(d.maengel, "maengel").map((m, i) => {
    const wo = "Mangel Nr. " + (i + 1);
    if (!istGueltigesDatum(m.datum)) fehler(wo + ": Datum ist ungültig (Format JJJJ-MM-TT).");
    if (!istText(m.beschreibung) || !m.beschreibung.trim()) fehler(wo + " (" + datumText(m.datum) + "): Beschreibung fehlt.");
    const status = m.status === undefined ? "offen" : m.status;
    if (status !== "offen" && status !== "erledigt") fehler(wo + " (" + datumText(m.datum) + "): status muss „offen“ oder „erledigt“ sein.");
    const am = m.erledigtAm ?? null;
    if (am !== null && !istGueltigesDatum(am)) fehler(wo + " (" + datumText(m.datum) + "): erledigtAm ist ungültig (Format JJJJ-MM-TT).");
    const id = istText(m.id) && m.id ? m.id : neueId();
    if (mangelIds.has(id)) fehler(wo + ": id „" + id + "“ kommt doppelt vor.");
    mangelIds.add(id);
    return {
      id,
      datum: m.datum,
      beschreibung: m.beschreibung.trim(),
      status,
      // Bei offenen Mängeln gibt es kein Erledigt-Datum
      erledigtAm: status === "erledigt" ? am : null
    };
  });
  const mangelVon = id => erg.maengel.find(m => m.id === id) || null;

  // Aufträge: geplant (Termin, Positionen offen) oder erledigt (Datum,
  // Kilometerstand, Positionen erledigt bzw. nicht gemacht)
  const auftragIds = new Set(), posIds = new Set();
  const geplanteArten = new Set(), geplanteAufgaben = new Set(), geplanteMaengel = new Set(), erledigteMaengel = new Set();
  erg.auftraege = objekte(d.auftraege, "auftraege").map((x, i) => {
    let wo = "Auftrag Nr. " + (i + 1);
    const art = artVon(x.wartungsartId);
    if (!art || art.typ !== "auftrag") fehler(wo + ": wartungsartId „" + x.wartungsartId + "“ ist kein Auftrag.");
    wo += " („" + art.name + "“)";
    const id = istText(x.id) && x.id ? x.id : neueId();
    if (auftragIds.has(id)) fehler(wo + ": id „" + id + "“ kommt doppelt vor.");
    auftragIds.add(id);
    if (x.status !== "geplant" && x.status !== "erledigt") fehler(wo + ": status muss „geplant“ oder „erledigt“ sein.");
    const erledigt = x.status === "erledigt";
    const termin = x.termin ?? null;
    if (termin !== null && (erledigt || !istGueltigesDatum(termin))) fehler(wo + ": termin muss bei geplanten Aufträgen ein Datum (JJJJ-MM-TT) oder null sein, bei erledigten null.");
    const datum = x.datum ?? null;
    if (erledigt ? !istGueltigesDatum(datum) : datum !== null) fehler(wo + ": datum muss bei erledigten Aufträgen ein gültiges Datum (JJJJ-MM-TT) sein, bei geplanten null.");
    if (erledigt) wo += " vom " + datumText(datum);
    const ks = x.kmStand ?? null;
    if (ks !== null && (!erledigt || !istZahl(ks))) fehler(wo + ": kmStand muss eine Zahl ≥ 0 oder null sein (nur bei erledigten Aufträgen).");
    let manuell = x.kmManuell;
    if (manuell === undefined) manuell = ks !== null; // fehlt die Angabe, gilt ein vorhandener Wert als von Hand eingetragen
    if (typeof manuell !== "boolean") fehler(wo + ": kmManuell muss true oder false sein.");
    if (!erledigt) {
      if (hatFaelligkeit(art) && geplanteArten.has(art.id)) fehler(wo + ": Für einen Auftrag mit Intervall, Zeitfenster oder einmalig ist nur ein geplanter Auftrag erlaubt.");
      geplanteArten.add(art.id);
    }
    const aufgabenHier = new Set(), maengelHier = new Set();
    const positionen = liste(x.positionen, "positionen").map((p, j) => {
      const wp = wo + ", Position Nr. " + (j + 1);
      if (!istObjekt(p)) fehler(wp + ": ist kein Objekt.");
      const pid = istText(p.id) && p.id ? p.id : neueId();
      if (posIds.has(pid)) fehler(wp + ": id „" + pid + "“ kommt doppelt vor.");
      posIds.add(pid);
      const status = p.status;
      if (erledigt ? status !== "erledigt" && status !== "nicht-gemacht" : status !== "offen") {
        fehler(wp + ": status muss " + (erledigt ? "„erledigt“ oder „nicht-gemacht“" : "„offen“") + " sein.");
      }
      const notiz = optText(p.notiz, wp + " (notiz)");
      if (p.art === "aufgabe") {
        const a = artVon(p.wartungsartId);
        if (!a || a.typ !== "aufgabe") fehler(wp + ": wartungsartId „" + p.wartungsartId + "“ ist keine Aufgabe.");
        if (aufgabenHier.has(a.id)) fehler(wp + ": Die Aufgabe „" + a.name + "“ steht doppelt im Auftrag.");
        aufgabenHier.add(a.id);
        if (!erledigt) {
          if (geplanteAufgaben.has(a.id)) fehler(wp + ": Die Aufgabe „" + a.name + "“ steht schon in einem anderen geplanten Auftrag.");
          geplanteAufgaben.add(a.id);
        }
        return { id: pid, art: "aufgabe", wartungsartId: a.id, status, notiz };
      }
      if (p.art === "mangel") {
        const m = mangelVon(p.mangelId);
        if (!m) fehler(wp + ": unbekannte mangelId „" + p.mangelId + "“.");
        if (maengelHier.has(m.id)) fehler(wp + ": Der Mangel „" + m.beschreibung + "“ steht doppelt im Auftrag.");
        maengelHier.add(m.id);
        if (!erledigt) {
          if (m.status !== "offen") fehler(wp + ": Der Mangel „" + m.beschreibung + "“ ist erledigt und kann nicht in einem geplanten Auftrag stehen.");
          if (geplanteMaengel.has(m.id)) fehler(wp + ": Der Mangel „" + m.beschreibung + "“ steht schon in einem anderen geplanten Auftrag.");
          geplanteMaengel.add(m.id);
        } else if (status === "erledigt") {
          if (m.status !== "erledigt") fehler(wp + ": Der Mangel „" + m.beschreibung + "“ ist als erledigt eingetragen, aber noch offen.");
          if (erledigteMaengel.has(m.id)) fehler(wp + ": Der Mangel „" + m.beschreibung + "“ ist schon mit einem anderen Auftrag erledigt.");
          erledigteMaengel.add(m.id);
        }
        return { id: pid, art: "mangel", mangelId: m.id, status, notiz };
      }
      fehler(wp + ": art muss „aufgabe“ oder „mangel“ sein.");
    });
    const ausgeschlossen = liste(x.ausgeschlossen, "ausgeschlossen").map(aid => {
      const a = artVon(aid);
      if (erledigt || !a || a.typ !== "aufgabe" || aufgabenHier.has(aid)) fehler(wo + ": ausgeschlossen darf nur bei geplanten Aufträgen Aufgaben enthalten, die nicht im Auftrag stehen.");
      return aid;
    });
    if (new Set(ausgeschlossen).size !== ausgeschlossen.length) fehler(wo + ": ausgeschlossen enthält eine Aufgabe doppelt.");
    return {
      id, wartungsartId: art.id, status: x.status, termin, werkstatt: optText(x.werkstatt, wo + " (werkstatt)"),
      datum, kmStand: ks === null ? null : runden(ks), kmManuell: manuell && ks !== null, notiz: optText(x.notiz, wo + " (notiz)"),
      positionen, ausgeschlossen
    };
  });

  return erg;
}

// JSON-Text (aus dem Speicher oder einer Datei) → geprüfte Daten der aktuellen Version
function datenEinlesen(text) {
  let roh;
  try { roh = JSON.parse(text); } catch (e) { throw new Error("Die Datei ist keine gültige JSON-Datei."); }
  return pruefen(migrieren(roh));
}

// Die Daten der App – alles, was angezeigt wird, kommt von hier.
let daten = leereDaten();
let ladeFehler = null;

function laden() {
  let text;
  try {
    text = localStorage.getItem(SPEICHER_SCHLUESSEL);
  } catch (e) {
    ladeFehler = "Der Speicher des Browsers ist nicht verfügbar (privater Modus?). Daten können nicht gespeichert werden.";
    return;
  }
  if (!text) return; // erster Start
  try {
    daten = datenEinlesen(text);
    // Nach der Umwandlung auf Version 8 die Wartungsarten prüfen lassen
    if (JSON.parse(text).version < 8) pruefungVormerken(true);
  } catch (e) {
    // Defekte Daten nicht überschreiben, sondern beiseitelegen
    try { localStorage.setItem(SPEICHER_SCHLUESSEL + "-defekt-" + Date.now(), text); } catch (_) {}
    ladeFehler = "Die gespeicherten Daten konnten nicht gelesen werden (" + e.message + "). Eine Kopie wurde beiseitegelegt. Bitte eine Sicherung importieren.";
    daten = leereDaten();
  }
}

function speichern() {
  // Jede Änderung beendet ein offenes "Rückgängig" (es würde sie sonst überschreiben)
  rueckgaengigVerwerfen();
  aktualisiereAuftragKm();
  try {
    localStorage.setItem(SPEICHER_SCHLUESSEL, JSON.stringify(daten));
    return true;
  } catch (e) {
    alert("Speichern fehlgeschlagen: " + e.message);
    return false;
  }
}

// Hinweis „Bitte Wartungsarten prüfen“ (nach der Umwandlung auf Version 8)
function pruefungVorgemerkt() {
  try { return localStorage.getItem(PRUEF_SCHLUESSEL) === "ja"; } catch (e) { return false; }
}
function pruefungVormerken(an) {
  try { if (an) localStorage.setItem(PRUEF_SCHLUESSEL, "ja"); else localStorage.removeItem(PRUEF_SCHLUESSEL); } catch (e) {}
}

function letzterExport() {
  try { return localStorage.getItem(EXPORT_SCHLUESSEL); } catch (e) { return null; }
}

/* =====================================================================
   4. BERECHNUNGEN
   ===================================================================== */

function eintragAm(iso) { return daten.eintraege.find(e => e.datum === iso) || null; }

function summe(filter) {
  return runden(daten.eintraege.filter(filter).reduce((s, e) => s + e.km, 0));
}

// Kilometerstand am Ende des Tages "iso". null, wenn kein Fahrrad angelegt
// ist oder das Datum vor dem Startdatum liegt.
function kmStandAm(iso) {
  const f = daten.fahrrad;
  if (!f || iso < f.startdatum) return null;
  return runden(f.startKm + summe(e => e.datum >= f.startdatum && e.datum <= iso));
}

// Aktueller Kilometerstand = Start + alle Einträge ab dem Startdatum
function aktuellerKmStand() {
  const f = daten.fahrrad;
  if (!f) return null;
  return runden(f.startKm + summe(e => e.datum >= f.startdatum));
}

// ---------- Prognosen ----------
// Grundlage aller Prognosen: durchschnittliche km pro Kalendertag der letzten
// 365 Tage bis gestern; liegt das Startdatum später, ab dem Startdatum.
// Einträge vor dem Startdatum zählen nicht. null = zu wenige Tage.
function prognoseGrundlage(h = heute()) {
  const f = daten.fahrrad;
  if (!f) return null;
  const bis = plusTage(h, -1);
  const von = f.startdatum > plusTage(bis, -364) ? f.startdatum : plusTage(bis, -364);
  const tage = tageZwischen(von, bis) + 1;
  if (tage < PROGNOSE_MIN_TAGE) return null;
  const km = summe(e => e.datum >= von && e.datum <= bis);
  return { von, bis, tage, km, rate: km / tage };
}

// Erwarteter Kilometerstand am Ende des Tages "datum" (nach "h"):
// Kilometerstand heute + Rate × Tage bis dahin. null ohne Grundlage.
function kmPrognose(datum, h = heute()) {
  const g = prognoseGrundlage(h);
  const stand = kmStandAm(h);
  if (!g || stand === null || datum <= h) return null;
  return stand + g.rate * tageZwischen(h, datum);
}

// Jahresprognose: km des laufenden Jahres bis heute + Rate × restliche Tage
function jahresPrognose(h = heute()) {
  const g = prognoseGrundlage(h);
  if (!g) return null;
  const jahr = h.slice(0, 4);
  return summe(e => e.datum.slice(0, 4) === jahr && e.datum <= h) + g.rate * tageZwischen(h, jahr + "-12-31");
}

// Jahresziel des laufenden Jahres: Fortschritt und zeitanteiliges Soll bis heute
function jahreszielStand(h = heute()) {
  const jahr = Number(h.slice(0, 4));
  const ziel = daten.einstellungen.jahresziele.find(z => z.jahr === jahr);
  const ist = summe(e => e.datum.slice(0, 4) === String(jahr) && e.datum <= h);
  if (!ziel) return { jahr, ziel: null, ist };
  const tageImJahr = tageZwischen(jahr + "-01-01", (jahr + 1) + "-01-01");
  const soll = ziel.km * (tageZwischen(jahr + "-01-01", h) + 1) / tageImJahr;
  return { jahr, ziel: ziel.km, ist, soll, vorsprung: ist - soll, anteil: ist / ziel.km };
}

// ---------- Fahrtage und Statistik ----------
// Radtag = Tages-Eintrag mit mehr als 0 km. Wochensummen zählen nicht, weil
// unbekannt ist, an welchen Tagen gefahren wurde.
function istRadtag(e) { return e.typ === "tag" && e.km > 0; }

// Minuten seit Mitternacht (Ortszeit)
function minutenJetzt(d = new Date()) { return d.getHours() * 60 + d.getMinutes(); }

// Eingestellte Fahrtage der letzten 14 Tage (bis gestern) ohne Eintrag, ab dem
// Startdatum; der heutige Tag ab der Uhrzeit "hinweisHeuteAb" (Standard 18:00),
// wenn der Schalter "Hinweis schon am selben Tag" (hinweisHeuteAn) an ist.
// "minuten" ist die Uhrzeit am Stichtag; ohne Angabe die aktuelle, wenn der
// Stichtag heute ist, sonst 0:00. Ein Eintrag mit 0 km ("keine Fahrt") und eine
// Wochensumme in derselben Woche gelten als erfasst.
function fehlendeFahrtage(h = heute(), minuten = h === heute() ? minutenJetzt() : 0) {
  const f = daten.fahrrad;
  if (!f) return [];
  const fahrtage = new Set(daten.einstellungen.fahrtage);
  const wochen = new Set(daten.eintraege.filter(e => e.typ === "woche").map(e => montagDerWoche(e.datum)));
  const es = daten.einstellungen;
  const bis = es.hinweisHeuteAn && minuten >= minutenAus(es.hinweisHeuteAb) ? h : plusTage(h, -1);
  const tage = [];
  for (let d = plusTage(h, -14); d <= bis; d = plusTage(d, 1)) {
    if (d >= f.startdatum && fahrtage.has(isoWochentag(d)) && !eintragAm(d) && !wochen.has(montagDerWoche(d))) tage.push(d);
  }
  return tage;
}

// Längste Serie aufeinanderfolgender Fahrtage mit Fahrt (Radtag) von "von" bis
// "bis". Nur die eingestellten Fahrtage zählen; andere Wochentage unterbrechen
// die Serie nicht und verlängern sie nicht.
function laengsteSerie(von, bis) {
  const fahrtage = new Set(daten.einstellungen.fahrtage);
  const gefahren = new Set(daten.eintraege.filter(istRadtag).map(e => e.datum));
  let laengste = 0, lauf = 0;
  if (!fahrtage.size) return 0;
  for (let d = von; d <= bis; d = plusTage(d, 1)) {
    if (!fahrtage.has(isoWochentag(d))) continue;
    lauf = gefahren.has(d) ? lauf + 1 : 0;
    if (lauf > laengste) laengste = lauf;
  }
  return laengste;
}

// km je Monat eines Jahres (alle Einträge einschließlich Wochensummen); Index 0 = Januar
function monatsSummen(jahr) {
  const s = Array(12).fill(0);
  daten.eintraege.forEach(e => { if (e.datum.slice(0, 4) === String(jahr)) s[Number(e.datum.slice(5, 7)) - 1] += e.km; });
  return s.map(runden);
}

// Kennzahlen eines Zeitraums bis zum Stichtag: km (alle Einträge), Radtage,
// Durchschnitt pro Radtag, Arbeitstage (Radtage mit Merkmal Arbeitsweg),
// längste Serie und die nicht als Radtage gezählten Wochensummen
function kennzahlen(liste, von, bis) {
  const radtage = liste.filter(istRadtag);
  const wochen = liste.filter(e => e.typ === "woche");
  return {
    km: runden(liste.reduce((s, e) => s + e.km, 0)),
    radtage: radtage.length,
    schnitt: radtage.length ? radtage.reduce((s, e) => s + e.km, 0) / radtage.length : null,
    arbeitstage: radtage.filter(e => e.arbeitsweg).length,
    serie: laengsteSerie(von, bis),
    wochensummen: wochen.length,
    wochenKm: runden(wochen.reduce((s, e) => s + e.km, 0))
  };
}
// Je Kalenderjahr (neueste zuerst) und gesamt; Einträge nach dem Stichtag zählen nicht
function jahresKennzahlen(h = heute()) {
  const bisher = daten.eintraege.filter(e => e.datum <= h);
  const jahre = [...new Set(bisher.map(e => e.datum.slice(0, 4)))].sort().reverse();
  const erstes = bisher.reduce((m, e) => e.datum < m ? e.datum : m, h);
  return {
    jahre: jahre.map(j => Object.assign({ jahr: Number(j) },
      kennzahlen(bisher.filter(e => e.datum.slice(0, 4) === j), j + "-01-01", j + "-12-31" < h ? j + "-12-31" : h))),
    gesamt: kennzahlen(bisher, erstes, h)
  };
}

// Nicht von Hand überschriebene Kilometerstände erledigter Aufträge neu berechnen
function aktualisiereAuftragKm() {
  daten.auftraege.forEach(a => {
    if (a.status === "erledigt" && !a.kmManuell) a.kmStand = kmStandAm(a.datum);
  });
}

function wochenEintragInWoche(iso, ausserId) {
  const montag = montagDerWoche(iso);
  return daten.eintraege.find(e => e.typ === "woche" && e.id !== ausserId && montagDerWoche(e.datum) === montag) || null;
}

function artName(id) {
  const a = daten.wartungsarten.find(a => a.id === id);
  return a ? a.name : "(unbekannt)";
}

function hatZeitfenster(art) { return art.fensterVon !== null && art.fensterVon !== undefined; }
// Erster bzw. letzter Tag des Zeitfensters einer Wartungsart im Jahr "jahr"
function fensterBeginn(art, jahr) { return monatsanfang(jahr, art.fensterVon); }
function fensterEnde(art, jahr) { return monatsende(jahr, art.fensterBis); }
// "Oktober–November" bzw. "Mai"
function fensterText(art) {
  return art.fensterVon === art.fensterBis ? MONATE[art.fensterVon - 1] : MONATE[art.fensterVon - 1] + "–" + MONATE[art.fensterBis - 1];
}

// Fälligkeit einer Wartungsart mit jährlichem Zeitfenster.
//   durchfuehrungen: Datumswerte aus dem Wartungsprotokoll für diese Art
//   startdatum: Startdatum des Fahrrads oder null
//   h: Stichtag ("heute")
// Regeln: Pro Jahr ist die Wartung im Fenster fällig. Zählt ein Fenster und
// gibt es ab seinem Beginn keine Durchführung, ist die Wartung ab dem Tag nach
// dem Fensterende überfällig – auch über den Jahreswechsel, bis sie
// durchgeführt wird. Eine Durchführung nach dem Fensterende ist eine
// Nachholung. Eine Durchführung vor dem Fenster zählt nicht für dieses Fenster.
// Ein Fenster zählt ab "gueltigAbJahr" und nur, wenn es nicht vor dem
// Startdatum des Fahrrads endet (ohne Fahrrad: ab dem laufenden Jahr).
function saisonStatus(art, durchfuehrungen, startdatum, h) {
  const jahr = Number(h.slice(0, 4));
  const ab = art.gueltigAbJahr ?? null;
  if (ab !== null && jahr < ab) {
    return { text: "noch nicht fällig (gültig ab " + ab + ")", klasse: "", datum: null };
  }
  const bisher = durchfuehrungen.filter(d => d <= h).sort();
  const letzte = bisher.length ? bisher[bisher.length - 1] : null;
  const zaehlt = j => (ab === null || j >= ab) && (startdatum ? fensterEnde(art, j) >= startdatum : j >= jahr);
  const imFenster = j => bisher.some(d => d >= fensterBeginn(art, j) && d <= fensterEnde(art, j));

  // Ältestes versäumtes Fenster suchen
  const erstesJahr = ab !== null ? ab : startdatum ? Number(startdatum.slice(0, 4)) : jahr;
  for (let j = erstesJahr; j <= jahr; j++) {
    const ende = fensterEnde(art, j);
    if (zaehlt(j) && ende < h && (letzte === null || letzte < fensterBeginn(art, j))) {
      return { text: "überfällig seit " + datumText(ende), klasse: "status-rot", datum: ende };
    }
  }

  const beginn = fensterBeginn(art, jahr), ende = fensterEnde(art, jahr), naechster = fensterBeginn(art, jahr + 1);
  if (h < beginn) {
    // Vor dem Fenster: Wurde das Vorjahr erst nach dem Fenster nachgeholt, das anzeigen
    if (letzte && zaehlt(jahr - 1) && letzte > fensterEnde(art, jahr - 1) && !imFenster(jahr - 1)) {
      return { text: "erledigt (nachgeholt), nächste ab " + datumText(beginn), klasse: "status-gruen", datum: beginn };
    }
    return { text: "fällig ab " + kurzDatum(beginn), klasse: tageZwischen(h, beginn) <= 30 ? "status-orange" : "status-gruen", datum: beginn };
  }
  if (letzte && letzte >= beginn) {
    return { text: (imFenster(jahr) ? "erledigt" : "erledigt (nachgeholt)") + ", nächste ab " + datumText(naechster), klasse: "status-gruen", datum: naechster };
  }
  if (h <= ende) return { text: "fällig bis " + kurzDatum(ende), klasse: "status-orange", datum: ende };
  // Fenster dieses Jahres zählt nicht (z. B. Fahrrad erst danach angelegt)
  return { text: "fällig ab " + datumText(naechster), klasse: "status-gruen", datum: naechster };
}

// Gefahrene km seit der Durchführung "letzte" bis einschließlich "h"; ohne
// Durchführung seit dem Startdatum. null, wenn es sich nicht berechnen lässt.
function kmSeit(letzte, h) {
  const stand = kmStandAm(h);
  if (letzte) {
    if (letzte.kmStand !== null && stand !== null) return runden(stand - letzte.kmStand);
    return summe(e => e.datum > letzte.datum && e.datum <= h);
  }
  const f = daten.fahrrad;
  return f && stand !== null ? runden(stand - f.startKm) : null;
}

// Tag, an dem seit der Durchführung (bzw. dem Startdatum) "intervallKm" erreicht
// wurden. "seit" = km bis heute; der Unterschied zur Summe der Einträge stammt
// aus einem von Hand eingetragenen Kilometerstand und wird vorab angerechnet.
function kmGrenzeErreichtAm(letzte, intervallKm, seit, h) {
  const basis = letzte ? letzte.datum : daten.fahrrad.startdatum;
  const liste = daten.eintraege
    .filter(e => (letzte ? e.datum > basis : e.datum >= basis) && e.datum <= h)
    .sort((a, b) => a.datum.localeCompare(b.datum));
  let kum = seit - liste.reduce((s, e) => s + e.km, 0);
  if (runden(kum) >= intervallKm) return basis;
  for (const e of liste) {
    kum += e.km;
    if (runden(kum) >= intervallKm) return e.datum;
  }
  return h;
}

// Fälligkeit nach Intervall in Monaten und/oder km (ohne Zeitfenster). Fällig
// ist, was zuerst erreicht wird. Grundlage ist die letzte Durchführung, ohne
// Durchführung das Startdatum mit dem Start-Kilometerstand. Den Tag, an dem
// die km-Grenze erreicht wird, schätzt die Prognose (kmGeschaetzt).
function intervallStatus(art, letzte, h) {
  const st = { text: "", klasse: "", datum: null, nochNie: false, restKm: null, grenzeKm: null, abStart: false, kmGeschaetzt: false };
  if (!art.intervallMonate && !art.intervallKm) return Object.assign(st, { text: "ohne Intervall" });
  const f = daten.fahrrad;
  if (!letzte && !f) return Object.assign(st, { text: "noch nicht durchgeführt", klasse: "status-orange", nochNie: true });
  const basis = letzte ? letzte.datum : f.startdatum;
  st.abStart = !letzte;

  const nachMonaten = art.intervallMonate ? plusMonate(basis, art.intervallMonate) : null;
  let nachKm = null, geschaetzt = false;
  if (art.intervallKm) {
    const seit = kmSeit(letzte, h);
    if (seit !== null) {
      st.restKm = runden(art.intervallKm - seit);
      const stand = kmStandAm(h);
      st.grenzeKm = stand === null ? null : runden(stand + st.restKm);
      if (st.restKm <= 0) {
        nachKm = kmGrenzeErreichtAm(letzte, art.intervallKm, seit, h);
      } else {
        const g = prognoseGrundlage(h);
        if (g && g.rate > 0) { nachKm = plusTage(h, Math.ceil(st.restKm / g.rate)); geschaetzt = true; }
      }
    }
  }

  if (nachKm !== null && (nachMonaten === null || nachKm < nachMonaten)) {
    st.datum = nachKm;
    st.kmGeschaetzt = geschaetzt;
    if (geschaetzt) {
      st.text = "fällig ca. im " + monatJahrText(nachKm) + (st.grenzeKm !== null ? " bei " + caKm(st.grenzeKm) : "");
      st.klasse = tageZwischen(h, nachKm) <= 30 ? "status-orange" : "status-gruen";
    } else {
      const grenze = st.grenzeKm !== null ? " (" + kmText(st.grenzeKm) + " km)" : "";
      st.text = nachKm === h ? "heute fällig (km-Grenze" + grenze + " erreicht)"
        : st.restKm < 0 ? "überfällig: km-Grenze" + grenze + " um " + kmText(-st.restKm) + " km überschritten"
        : "überfällig: km-Grenze" + grenze + " erreicht";
      st.klasse = "status-rot";
    }
    return st;
  }
  if (nachMonaten === null) {
    // Nur km-Intervall, aber keine Schätzung möglich (zu wenige Daten oder keine Fahrten)
    st.text = st.grenzeKm !== null ? "fällig bei " + caKm(st.grenzeKm) : "fällig nach " + kmText(art.intervallKm) + " km";
    st.klasse = "status-gruen";
    return st;
  }
  const t = tageZwischen(h, nachMonaten);
  st.datum = nachMonaten;
  if (t > 0) Object.assign(st, { text: "fällig in " + tageText(t) + " (" + datumText(nachMonaten) + ")", klasse: t <= 30 ? "status-orange" : "status-gruen" });
  else if (t === 0) Object.assign(st, { text: "heute fällig", klasse: "status-rot" });
  else Object.assign(st, { text: "überfällig seit " + tageText(-t) + " (" + datumText(nachMonaten) + ")", klasse: "status-rot" });
  return st;
}

// ---------- Werkstatt: Aufträge, Aufgaben, Positionen ----------

function artVon(id) { return daten.wartungsarten.find(a => a.id === id) || null; }
const istAufgabe = art => !!art && art.typ === "aufgabe";
// Inspektion = Auftrag mit Fälligkeit (Intervall, Zeitfenster oder einmalig), z. B. nicht die Reparatur
const istInspektion = art => !!art && art.typ === "auftrag" && hatFaelligkeit(art);
const aufgabenArten = () => daten.wartungsarten.filter(istAufgabe);
const auftragsArten = () => daten.wartungsarten.filter(a => a.typ === "auftrag");

// Erledigte Aufträge einer Auftragsart, der neueste zuerst
function erledigteAuftraege(artId) {
  return daten.auftraege.filter(a => a.status === "erledigt" && a.wartungsartId === artId).sort((a, b) => b.datum.localeCompare(a.datum));
}
// Letzte Erledigung einer Aufgabe: { datum, kmStand, werkstatt, auftrag } oder null
function letzteErledigung(aufgabeId) {
  let letzte = null;
  daten.auftraege.forEach(a => {
    if (a.status === "erledigt" && a.positionen.some(p => p.art === "aufgabe" && p.wartungsartId === aufgabeId && p.status === "erledigt") &&
      (!letzte || a.datum > letzte.datum)) letzte = { datum: a.datum, kmStand: a.kmStand, werkstatt: a.werkstatt, auftrag: a };
  });
  return letzte;
}
// Anzahl der Positionen als Text: "1 Position", "3 Positionen"
function positionenText(n) { return n === 1 ? "1 Position" : n + " Positionen"; }
// "3 erledigte Aufträge, 1 geplanter Auftrag"
function auftraegeText(liste) {
  const e = liste.filter(a => a.status === "erledigt").length, g = liste.length - e;
  return (e === 1 ? "1 erledigter Auftrag" : e + " erledigte Aufträge") + ", " + (g === 1 ? "1 geplanter Auftrag" : g + " geplante Aufträge");
}

// Fälligkeit einer Auftragsart nach ihren erledigten Aufträgen (ohne Termin).
// Mit Zeitfenster gilt das Fenster; ein km-Intervall gibt dann nur einen Hinweis
// (kmHinweis), wenn die km-Grenze vor dem maßgeblichen Datum erreicht wird.
// Einmalige Aufträge sind nach der ersten Erledigung erledigt.
function auftragsartStatus(art, h = heute()) {
  const erledigte = erledigteAuftraege(art.id).filter(a => a.datum <= h);
  const letzte = erledigte[0] || null;
  if (art.einmalig && letzte) {
    const erste = erledigte[erledigte.length - 1];
    return { erledigt: true, letzte, erste, datum: null, text: "erledigt am " + datumText(erste.datum), klasse: "status-gruen", nochNie: false,
      restKm: null, abStart: false, kmGeschaetzt: false, kmHinweis: null, seitKm: null };
  }
  if (!hatFaelligkeit(art)) {
    return { erledigt: false, letzte, datum: null, text: "ohne Intervall", klasse: "", nochNie: false, restKm: null, abStart: false, kmGeschaetzt: false,
      kmHinweis: null, seitKm: letzte ? kmSeit(letzte, h) : null };
  }
  let st;
  if (hatZeitfenster(art)) {
    st = Object.assign({ nochNie: false, restKm: null, abStart: false, kmGeschaetzt: false },
      saisonStatus(art, erledigte.map(a => a.datum), daten.fahrrad ? daten.fahrrad.startdatum : null, h));
    st.kmHinweis = null;
    if (art.intervallKm) {
      const km = intervallStatus(Object.assign({}, art, { intervallMonate: null }), letzte, h);
      if (km.datum && km.datum < regelZiel(art, Object.assign({}, st, { erledigt: false }), h)) {
        st.kmHinweis = km.restKm <= 0
          ? "km-Grenze" + (km.grenzeKm !== null ? " (" + kmText(km.grenzeKm) + " km)" : "") + " schon erreicht"
          : "km-Grenze (" + (km.grenzeKm !== null ? caKm(km.grenzeKm) : kmText(art.intervallKm) + " km") + ") voraussichtlich schon im " + monatJahrText(km.datum) + " erreicht";
      }
    }
  } else {
    st = Object.assign({ kmHinweis: null }, intervallStatus(art, letzte, h));
  }
  return Object.assign(st, { erledigt: false, letzte, seitKm: letzte ? kmSeit(letzte, h) : null });
}

// Fälligkeit einer Aufgabe ab ihrer letzten Erledigung (Datum und Kilometerstand
// des Auftrags), ohne Erledigung ab Startdatum und Start-Kilometerstand
function aufgabeStatus(art, h = heute()) {
  const l = letzteErledigung(art.id);
  const letzte = l && l.datum <= h ? l : null;
  const st = intervallStatus(art, letzte, h);
  return Object.assign(st, { letzte, seitKm: letzte ? kmSeit(letzte, h) : null });
}

// Text zum Termin eines geplanten Auftrags
function terminText(termin, werkstatt, h) {
  const t = tageZwischen(h, termin);
  return "Termin am " + datumText(termin) + (werkstatt ? " bei " + werkstatt : "") +
    (t > 0 ? " (in " + tageText(t) + ")" : t === 0 ? " (heute)" : " (vor " + tageText(-t) + ", noch nicht als erledigt eingetragen)");
}

// Ziel einer Fälligkeit für die Positionen: Ende des Zeitfensters bzw.
// Fälligkeitsdatum; liegt es vor heute oder fehlt es, gilt heute.
function regelZiel(art, regel, h) {
  if (!regel || regel.erledigt) return h;
  if (hatZeitfenster(art)) {
    const jahr = regel.datum ? Number(regel.datum.slice(0, 4)) : art.gueltigAbJahr;
    if (regel.datum && regel.datum < h) return h;
    return jahr ? fensterEnde(art, jahr) : h;
  }
  return regel.datum && regel.datum > h ? regel.datum : h;
}

// Lage der Werkstatt am Tag h: offene Aufträge (gespeicherte und vorgemerkte)
// mit Fälligkeit, Zieldatum und Positionen, Aufgaben mit Fälligkeit und Auftrag,
// Vorschläge und Mängel ohne Auftrag. Rechnet nur, verändert nichts.
//   Vorgemerkter Auftrag: Hat eine Auftragsart mit Fälligkeit keinen geplanten
//   Auftrag, gilt der nächste als offen (ohne Termin); gespeichert wird er erst
//   bei der ersten Änderung.
//   Standard-Zuordnung (nur berechnet): Eine Aufgabe, die in keinem geplanten
//   Auftrag steht, gehört zum Auftrag ihrer Zuordnung („nächste Inspektion“ = der
//   früheste offene Auftrag einer Inspektion), wenn sie bis zu dessen Zieldatum
//   fällig wird und dort nicht entfernt wurde.
function werkstattLage(h = heute()) {
  const offene = [];
  daten.auftraege.filter(a => a.status === "geplant").forEach(a => offene.push(offenerAuftrag(a, artVon(a.wartungsartId), false, h)));
  auftragsArten().forEach(art => {
    if (!hatFaelligkeit(art) || offene.some(o => o.art.id === art.id)) return;
    const regel = auftragsartStatus(art, h);
    if (regel.erledigt) return;
    offene.push(offenerAuftrag({ id: null, wartungsartId: art.id, status: "geplant", termin: null, werkstatt: "", datum: null, kmStand: null,
      kmManuell: false, notiz: "", positionen: [], ausgeschlossen: [] }, art, true, h, regel));
  });
  // Reihenfolge: überfällig, mit Datum, ohne Datum (km ohne Schätzung), ohne Fälligkeit
  const reihenfolge = new Map(daten.wartungsarten.map((a, i) => [a.id, i]));
  offene.sort((a, b) => a.gruppe - b.gruppe || (a.gruppe <= 2 ? a.datum.localeCompare(b.datum) : 0) ||
    reihenfolge.get(a.art.id) - reihenfolge.get(b.art.id));

  // Aufgaben mit Fälligkeit
  const aufgaben = aufgabenArten().map((art, i) => ({ art, i, st: aufgabeStatus(art, h), offen: null, berechnet: false }));
  const aufgabeVon = id => aufgaben.find(x => x.art.id === id);
  const faelligBis = (x, ziel) => !!x.st.datum && x.st.datum <= ziel;
  // Ausdrücklich zugeordnet
  offene.forEach(o => o.auftrag.positionen.forEach(p => {
    if (p.art === "aufgabe" && aufgabeVon(p.wartungsartId)) Object.assign(aufgabeVon(p.wartungsartId), { offen: o, berechnet: false });
  }));
  // Nach der Standard-Zuordnung (Kandidaten nach Zieldatum)
  const nachZiel = [...offene].sort((a, b) => a.ziel.localeCompare(b.ziel) || offene.indexOf(a) - offene.indexOf(b));
  aufgaben.forEach(x => {
    if (x.offen) return;
    const passt = o => (x.art.zuordnung === NAECHSTE_INSPEKTION ? istInspektion(o.art) : o.art.id === x.art.zuordnung) &&
      !o.auftrag.ausgeschlossen.includes(x.art.id) && faelligBis(x, o.ziel);
    const o = nachZiel.find(passt);
    if (o) Object.assign(x, { offen: o, berechnet: true });
  });
  aufgaben.sort((a, b) => (a.st.datum ? 0 : 1) - (b.st.datum ? 0 : 1) || (a.st.datum && b.st.datum ? a.st.datum.localeCompare(b.st.datum) : 0) || a.i - b.i);

  // Positionen und Vorschläge je offenem Auftrag
  offene.forEach(o => {
    o.positionen = o.auftrag.positionen.map(p => Object.assign({}, p, { berechnet: false }))
      .concat(aufgaben.filter(x => x.offen === o && x.berechnet)
        .map(x => ({ id: null, art: "aufgabe", wartungsartId: x.art.id, status: "offen", notiz: "", berechnet: true })));
    o.vorschlaege = aufgaben.filter(x => x.offen !== o && faelligBis(x, o.ziel) && !o.auftrag.ausgeschlossen.includes(x.art.id) &&
      (!x.offen || (x.berechnet && x.offen.ziel > o.ziel)));
  });

  const imAuftrag = new Set(offene.flatMap(o => o.auftrag.positionen.filter(p => p.art === "mangel").map(p => p.mangelId)));
  return {
    offene,
    aufgaben,
    aufgabeVon,
    maengelOhneAuftrag: offeneMaengel().filter(m => !imAuftrag.has(m.id)),
    mangelAuftrag: id => offene.find(o => o.auftrag.positionen.some(p => p.art === "mangel" && p.mangelId === id)) || null
  };
}

// Offener Auftrag mit Fälligkeit: "datum" ist das maßgebliche Datum (Termin,
// sonst Fälligkeit), "ziel" das Zieldatum für Positionen und Vorschläge (Termin,
// sonst Ende des Zeitfensters bzw. Fälligkeit; frühestens heute). "erwartet" =
// erwarteter Kilometerstand zum Termin bzw. zur Fälligkeit.
function offenerAuftrag(auftrag, art, vorgemerkt, h, regel = hatFaelligkeit(art) ? auftragsartStatus(art, h) : null) {
  const o = { auftrag, art, vorgemerkt, regel, termin: auftrag.termin, datum: null, text: "", klasse: "" };
  if (auftrag.termin) {
    o.datum = auftrag.termin;
    o.text = terminText(auftrag.termin, auftrag.werkstatt, h);
    o.klasse = auftrag.termin < h ? "status-orange" : "status-gruen";
  } else if (regel) {
    Object.assign(o, { datum: regel.datum, text: regel.text, klasse: regel.klasse });
  } else {
    o.text = "noch kein Termin";
  }
  const zielTermin = auftrag.termin && auftrag.termin > h ? auftrag.termin : auftrag.termin ? h : null;
  o.ziel = zielTermin || regelZiel(art, regel, h);
  o.gruppe = o.datum ? (o.datum < h ? 1 : 2) : regel && !regel.erledigt && (art.intervallMonate || art.intervallKm) && !hatZeitfenster(art) ? 3 : 4;
  // Steht der km-Wert schon im Text ("fällig ca. im Mai 2027 bei ca. 7.500 km"), entfällt er hier
  const zielKm = auftrag.termin ? auftrag.termin : regel && regel.kmGeschaetzt ? null : o.datum;
  const km = zielKm && zielKm > h ? kmPrognose(zielKm, h) : null;
  o.erwartet = km === null ? null : { datum: zielKm, km };
  return o;
}

// Nächster fälliger Auftrag für die Übersicht: der erste überfällige bzw. anstehende
function naechsterAuftrag(lage, h = heute()) {
  return lage.offene.find(o => o.gruppe <= 3) || null;
}

function offeneMaengel() {
  return daten.maengel.filter(m => m.status === "offen").sort((a, b) => b.datum.localeCompare(a.datum));
}
function maengelText(n) { return n === 1 ? "1 offener Mangel" : n + " offene Mängel"; }

// ---------- Zusammenfassung der Einträge (nur Anzeige) ----------
// Eine Woche (Mo–So) ist ab dem folgenden Montag abgeschlossen. Ein Monat bzw.
// ein Jahr ist abgeschlossen, wenn die Woche abgeschlossen ist, die seinen
// letzten Tag enthält. Summen zählen nach Kalenderdatum; eine Woche über
// einen Monatswechsel erscheint in jedem Monat als Teilwoche.
function abgeschlossenBis(letzterTag, stichtag) {
  return stichtag >= plusTage(montagDerWoche(letzterTag), 7);
}

// Liefert die Zeilen der obersten Ebene, neueste zuerst. Jede Gruppe hat
//   { art: "jahr" | "monat" | "woche", schluessel, titel, von, bis, km, anzahl, kinder }
// und jede Eintragszeile { art: "eintrag", schluessel, eintrag }.
function gruppieren(eintraege, stichtag) {
  const absteigend = (a, b) => b.localeCompare(a);
  const nachSchluessel = (liste, f) => {
    const m = new Map();
    liste.forEach(e => { const k = f(e); if (!m.has(k)) m.set(k, []); m.get(k).push(e); });
    return [...m.keys()].sort(absteigend).map(k => [k, m.get(k)]);
  };
  const eintragsZeilen = liste => [...liste].sort((a, b) => absteigend(a.datum, b.datum))
    .map(e => ({ art: "eintrag", schluessel: "e" + e.id, eintrag: e }));
  const gruppe = (art, schluessel, titel, von, bis, liste, kinder) => ({
    art, schluessel, titel, von, bis, kinder,
    km: runden(liste.reduce((s, e) => s + e.km, 0)), anzahl: liste.length
  });

  // Wochen innerhalb eines Monats (am Monatsrand als Teilwoche)
  const wochenDesMonats = (ym, liste) => {
    const [j, m] = ym.split("-").map(Number);
    const anfang = monatsanfang(j, m), ende = monatsende(j, m);
    return nachSchluessel(liste, e => montagDerWoche(e.datum)).map(([montag, wl]) => {
      const sonntag = plusTage(montag, 6);
      const teil = montag < anfang || sonntag > ende;
      const von = montag < anfang ? anfang : montag, bis = sonntag > ende ? ende : sonntag;
      return { montag, liste: wl, knoten: () => gruppe("woche", "w" + ym + "|" + montag,
        "KW " + kalenderwoche(montag) + (teil ? " (Teil)" : ""), von, bis, wl, eintragsZeilen(wl)) };
    });
  };
  const monatsKnoten = (ym, liste) => {
    const [j, m] = ym.split("-").map(Number);
    return gruppe("monat", "m" + ym, MONATE[m - 1] + " " + j, monatsanfang(j, m), monatsende(j, m), liste,
      wochenDesMonats(ym, liste).map(w => w.knoten()));
  };

  const zeilen = [];
  nachSchluessel(eintraege, e => e.datum.slice(0, 4)).forEach(([jahr, jl]) => {
    const monate = nachSchluessel(jl, e => e.datum.slice(0, 7));
    if (abgeschlossenBis(jahr + "-12-31", stichtag)) {
      zeilen.push(gruppe("jahr", "j" + jahr, jahr, jahr + "-01-01", jahr + "-12-31", jl, monate.map(([ym, ml]) => monatsKnoten(ym, ml))));
      return;
    }
    monate.forEach(([ym, ml]) => {
      const [j, m] = ym.split("-").map(Number);
      if (abgeschlossenBis(monatsende(j, m), stichtag)) { zeilen.push(monatsKnoten(ym, ml)); return; }
      wochenDesMonats(ym, ml).forEach(w => {
        if (abgeschlossenBis(plusTage(w.montag, 6), stichtag)) zeilen.push(w.knoten());
        else zeilen.push(...eintragsZeilen(w.liste));
      });
    });
  });
  return zeilen;
}

/* =====================================================================
   5. WETTER: Abruf, Zwischenspeicher, Ampel, Kleidung, Abfahrt, Wind
   Vorhersage von Open-Meteo (Modell ICON des Deutschen Wetterdienstes, in
   Deutschland im 15-Minuten-Raster). Amtliche Warnungen vom GeoServer des
   DWD, bei dessen Ausfall über Bright Sky (dieselben Warnungen des DWD).
   Gesendet werden nur die auf 3 Nachkommastellen gerundeten Koordinaten. Die geladenen Daten
   liegen in einem eigenen Zwischenspeicher; der Abruf verändert die Daten
   der App nie. Zeitpunkte sind Millisekunden, Fahrzeiten gelten in Ortszeit.
   ===================================================================== */

const OPEN_METEO_URL = "https://api.open-meteo.com/v1/forecast";
const ORTSSUCHE_URL = "https://geocoding-api.open-meteo.com/v1/search";
const DWD_URL = "https://maps.dwd.de/geoserver/dwd/ows";
const BRIGHT_SKY_URL = "https://api.brightsky.dev/alerts";
const RUECKBLICK_URL = "https://historical-forecast-api.open-meteo.com/v1/forecast";
// Apple Karten: nur beim Antippen von "In Karten zeigen", keine eingebettete Karte
const KARTEN_URL = "https://maps.apple.com/";
// Der Rückblick reicht etwa bis 2022 zurück; abgefragt wird in Abschnitten von höchstens so vielen Tagen
const RUECKBLICK_AB = "2022-01-01";
const RUECKBLICK_TAGE = 31;
const WERTE_15_MIN = ["temperature_2m", "apparent_temperature", "precipitation", "weather_code", "wind_speed_10m", "wind_direction_10m", "wind_gusts_10m"];
const WERTE_STUENDLICH = ["precipitation_probability", "soil_temperature_0cm"];
const DWD_FELDER = ["IDENTIFIER", "STATUS", "MSGTYPE", "CATEGORY", "EVENT", "EC_GROUP", "SEVERITY", "ONSET", "EXPIRES", "HEADLINE", "DESCRIPTION", "NAME"];
const MINUTE_MS = 60 * 1000, VIERTELSTUNDE_MS = 15 * MINUTE_MS, STUNDE_MS = 60 * MINUTE_MS;
// Neu laden, wenn Vorhersage bzw. Warnungen älter sind; noch ältere gelten als nicht aktuell
const VORHERSAGE_NEU_MS = 15 * MINUTE_MS;
const WARNUNGEN_NEU_MS = 10 * MINUTE_MS;
const NICHT_AKTUELL_MS = 2 * STUNDE_MS;
const ABRUF_ZEITLIMIT_MS = 10000;
// Wettercodes (WMO): Gewitter; gefrierender Sprühregen bzw. Regen
const GEWITTER_CODES = [95, 96, 99];
const GEFRIEREND_CODES = [56, 57, 66, 67];
// "Nasse Straße" für die Glätte: Niederschlag in so vielen Stunden vor der Fahrt
const NASS_STUNDEN = 6;
// Darunter (km/h) gilt der Wind als schwach
const WIND_SCHWACH = 10;
// Spontane Runde außerhalb der Fahrten: Abfahrten von jetzt bis so viele Minuten später
const JETZT_ABFAHRT_MIN = 60;
// Aktueller Standort: eine Ortung darf so alt sein; neu abgerufen wird das Wetter
// erst, wenn sich der Standort um mehr als so viele km geändert hat (oder es zu alt ist)
const STANDORT_ALTER_MS = 5 * MINUTE_MS;
const STANDORT_NEU_KM = 1;
const STANDORT_ZEITLIMIT_MS = 15000;
const WARNSTUFEN = { minor: 1, moderate: 2, severe: 3, extreme: 4 };
const FARBWORT = { gruen: "grün", gelb: "gelb", rot: "rot" };
const ORT_TITEL = { wohnort: "Wohnort", arbeitsort: "Arbeitsort", weitererOrt: "Weiterer Ort" };
const QUELLEN_NAME = { dwd: "Deutscher Wetterdienst", brightsky: "Bright Sky (Ersatz, Daten des DWD)" };

// ---------- Orte und Adressen ----------

// Orte, für die das Wetter geladen wird: der weitere Ort, wenn er aktiv ist, sonst die Strecke
function wetterOrte(w = daten.einstellungen.wetter) {
  if (w.weitererOrt && w.weitererOrt.aktiv) return [{ rolle: "weitererOrt", titel: ORT_TITEL.weitererOrt, ort: w.weitererOrt }];
  return streckenOrte(w);
}
// Orte der Fahrten zur Arbeit: Wohnort, Wegpunkte, Arbeitsort. Wegpunkte zählen
// nur, wenn Wohn- und Arbeitsort festgelegt sind.
function streckenOrte(w = daten.einstellungen.wetter) {
  const orte = [];
  if (w.wohnort) orte.push({ rolle: "wohnort", titel: ORT_TITEL.wohnort, ort: w.wohnort });
  if (w.wohnort && w.arbeitsort) w.wegpunkte.forEach((o, i) => orte.push({ rolle: "wegpunkt", titel: wegpunktTitel(i), ort: o }));
  if (w.arbeitsort) orte.push({ rolle: "arbeitsort", titel: ORT_TITEL.arbeitsort, ort: w.arbeitsort });
  return orte;
}
function wegpunktTitel(i) { return "Wegpunkt " + (i + 1); }
// Teilstrecken Wohnort → Wegpunkte → Arbeitsort: Länge (km, Luftlinie), Richtung
// hin und zurück, ob sie für den Wind zählt, und die Nummern ihrer beiden Orte
// in streckenOrte (dieselbe Reihenfolge wie in der Vorhersage). [] ohne Strecke.
function teilstrecken(w = daten.einstellungen.wetter) {
  const orte = streckenOrte(w);
  if (!w.wohnort || !w.arbeitsort) return [];
  return orte.slice(1).map((b, i) => {
    const a = orte[i];
    return { von: a, bis: b, a: i, b: i + 1, laenge: entfernungKm(a.ort, b.ort), kursHin: kursZwischen(a.ort, b.ort), kursRueck: kursZwischen(b.ort, a.ort),
      wind: w.windTeilstrecken[i] !== false };
  });
}
// "Wohnort → Brücke"
function teilstreckeTitel(t, rueck) { return rueck ? t.bis.ort.name + " → " + t.von.ort.name : t.von.ort.name + " → " + t.bis.ort.name; }
// Koordinate für die Adressen der Wetterdienste: immer auf 3 Stellen gerundet, "51.100".
// Auch die Schlüssel des Zwischenspeichers nutzen sie.
function koordinate(x) { return koordinateSenden(x).toFixed(3); }
function ortSchluessel(o) { return koordinate(o.lat) + "," + koordinate(o.lon); }
// Anzeige und Eingabefeld mit 4 Stellen: "51,1000"
function koordinateFeld(x) { return koordinateSpeichern(x).toFixed(4).replace(".", ","); }
// Anzeige: "51,1000 / 10,2000"
function koordinatenText(o) { return koordinateFeld(o.lat) + " / " + koordinateFeld(o.lon); }

function wetterParameter(orte) {
  return "?latitude=" + orte.map(o => koordinate(o.lat)).join(",") + "&longitude=" + orte.map(o => koordinate(o.lon)).join(",") +
    "&models=icon_seamless&minutely_15=" + WERTE_15_MIN.join(",") + "&hourly=" + WERTE_STUENDLICH.join(",") + "&timeformat=unixtime&timezone=auto";
}
function vorhersageUrl(orte) { return OPEN_METEO_URL + wetterParameter(orte) + "&past_days=1&forecast_days=8"; }
// Rückblick: archivierte Vorhersagen (die ersten Stunden jedes Laufs), gleiches Format, Tage "von" bis "bis"
function rueckblickUrl(orte, von, bis) { return RUECKBLICK_URL + wetterParameter(orte) + "&start_date=" + von + "&end_date=" + bis; }
// GeoServer des DWD (WFS): Objekte der Ebene, deren Fläche den Punkt enthält (Reihenfolge lat lon)
function dwdUrl(ebene, felder, geometrie, o) {
  return DWD_URL + "?service=WFS&version=2.0.0&request=GetFeature&typeName=dwd:" + ebene + "&outputFormat=application/json" +
    "&propertyName=" + felder.join(",") + "&CQL_FILTER=" + encodeURIComponent("CONTAINS(" + geometrie + ",POINT(" + koordinate(o.lat) + " " + koordinate(o.lon) + "))");
}
function brightSkyUrl(o) { return BRIGHT_SKY_URL + "?lat=" + koordinate(o.lat) + "&lon=" + koordinate(o.lon); }
// Apple Karten an dieser Stelle: Koordinaten mit 4 Nachkommastellen, der Name als
// Beschriftung der Markierung (q gilt als Beschriftung, wenn ll gesetzt ist)
function kartenUrl(o) {
  return KARTEN_URL + "?ll=" + koordinateSpeichern(o.lat).toFixed(4) + "," + koordinateSpeichern(o.lon).toFixed(4) + "&q=" + encodeURIComponent(o.name);
}
function ortssucheUrl(text) { return ORTSSUCHE_URL + "?name=" + encodeURIComponent(text) + "&count=8&language=de&format=json"; }

// Holt JSON. Wirft einen Fehler mit kurzer Begründung (keine Verbindung, Zeitüberschreitung, Fehler 503 …).
async function jsonAbrufen(url) {
  const abbruch = typeof AbortController === "function" ? new AbortController() : null;
  const timer = abbruch && setTimeout(() => abbruch.abort(), ABRUF_ZEITLIMIT_MS);
  try {
    let antwort;
    try {
      antwort = await fetch(url, { credentials: "omit", signal: abbruch ? abbruch.signal : undefined });
    } catch (e) {
      throw new Error(e && e.name === "AbortError" ? "keine Antwort (Zeitüberschreitung)" : "keine Verbindung");
    }
    let inhalt = null;
    try { inhalt = await antwort.json(); } catch (e) { /* kein JSON */ }
    if (!antwort.ok) {
      const f = new Error("Fehler " + antwort.status);
      f.status = antwort.status;
      throw f;
    }
    if (inhalt === null || typeof inhalt !== "object") throw new Error("unerwartete Antwort");
    return inhalt;
  } finally {
    clearTimeout(timer);
  }
}

// ---------- Antworten der Dienste lesen ----------

// Open-Meteo → je Ort { m15: {zeit, temperatur, …}, stunde: {zeit, wahrscheinlichkeit, boden} }
function vorhersageLesen(antwort, anzahl) {
  const liste = Array.isArray(antwort) ? antwort : [antwort];
  if (liste.length !== anzahl) throw new Error("unerwartete Antwort");
  return liste.map(o => {
    const m = o && o.minutely_15, s = o && o.hourly;
    if (!m || !s || !Array.isArray(m.time) || !Array.isArray(s.time)) throw new Error("unerwartete Antwort");
    const spalte = (q, name) => Array.isArray(q[name]) && q[name].length === q.time.length ? q[name] : q.time.map(() => null);
    return {
      m15: {
        zeit: m.time.map(t => t * 1000), temperatur: spalte(m, "temperature_2m"), gefuehlt: spalte(m, "apparent_temperature"),
        niederschlag: spalte(m, "precipitation"), code: spalte(m, "weather_code"), wind: spalte(m, "wind_speed_10m"),
        richtung: spalte(m, "wind_direction_10m"), boeen: spalte(m, "wind_gusts_10m")
      },
      stunde: { zeit: s.time.map(t => t * 1000), wahrscheinlichkeit: spalte(s, "precipitation_probability"), boden: spalte(s, "soil_temperature_0cm") }
    };
  });
}

// Art einer Warnung nach Ereignis ("STARKES GEWITTER") und Gruppe ("THUNDERSTORM;WIND")
function warnungsArt(text) {
  const t = text.toUpperCase();
  if (/GEWITTER|THUNDERSTORM/.test(t)) return "gewitter";
  if (/GLÄTTE|GLATTEIS|GLAZE/.test(t)) return "glaette";
  if (/HITZE|HEAT|(^|[^A-ZÄÖÜ])UV([^A-ZÄÖÜ]|$)/.test(t)) return "gesundheit";
  return "sonst";
}
// Einheitliche Warnung aus DWD oder Bright Sky; Stufe 1–4 aus minor … extreme
function warnungAus(r) {
  const zeit = t => { const ms = t ? Date.parse(t) : NaN; return isNaN(ms) ? null : ms; };
  const ereignis = String(r.ereignis || "WARNUNG").trim();
  return {
    id: String(r.id || ""), ereignis, stufe: WARNSTUFEN[String(r.schwere || "").toLowerCase()] || 1,
    beginn: zeit(r.beginn), ende: zeit(r.ende), titel: String(r.titel || ""), text: String(r.text || ""),
    art: String(r.kategorie || "").toLowerCase() === "health" ? "gesundheit" : warnungsArt(ereignis + " " + (r.gruppe || ""))
  };
}
// GeoServer des DWD → { abgedeckt, gebiet, warnungen }. Ohne Warnung ist offen, ob der Ort im Warngebiet liegt (abgedeckt null).
function dwdWarnungenLesen(antwort) {
  if (!antwort || !Array.isArray(antwort.features)) throw new Error("unerwartete Antwort");
  const p = antwort.features.map(f => (f && f.properties) || {});
  return {
    abgedeckt: p.length ? true : null,
    gebiet: p.length && p[0].NAME ? String(p[0].NAME) : null,
    warnungen: p.filter(x => String(x.STATUS).toLowerCase() === "actual" && String(x.MSGTYPE).toLowerCase() !== "cancel")
      .map(x => warnungAus({ id: x.IDENTIFIER, ereignis: x.EVENT, gruppe: x.EC_GROUP, kategorie: x.CATEGORY, schwere: x.SEVERITY,
        beginn: x.ONSET, ende: x.EXPIRES, titel: x.HEADLINE, text: x.DESCRIPTION }))
  };
}
function brightSkyLesen(antwort) {
  if (!antwort || !Array.isArray(antwort.alerts)) throw new Error("unerwartete Antwort");
  return {
    abgedeckt: true,
    gebiet: antwort.location && antwort.location.name ? String(antwort.location.name) : null,
    warnungen: antwort.alerts.filter(a => a && String(a.status).toLowerCase() === "actual")
      .map(a => warnungAus({ id: a.alert_id, ereignis: a.event_de, kategorie: a.category, schwere: a.severity,
        beginn: a.onset, ende: a.expires, titel: a.headline_de, text: a.description_de }))
  };
}
// Ortssuche → Treffer, Koordinaten sofort auf 4 Nachkommastellen gerundet
function ortsTrefferLesen(antwort) {
  return (antwort && Array.isArray(antwort.results) ? antwort.results : [])
    .filter(r => r && r.name && istEndlich(r.latitude) && istEndlich(r.longitude))
    .map(r => ({ name: String(r.name), zusatz: [r.admin1, r.country].filter(Boolean).join(", "), lat: koordinateSpeichern(r.latitude), lon: koordinateSpeichern(r.longitude) }));
}

// ---------- Laden und Zwischenspeicher ----------

// vorhersage / warnungen: { schluessel (Koordinaten der Orte), stand, orte, … }; gebiete: Warngebiet je Ort.
// Ändert sich der Aufbau, WETTER_SPEICHER_VERSION erhöhen: ein alter Zwischenspeicher wird dann verworfen.
const WETTER_SPEICHER_VERSION = 1;
let wetter = { vorhersage: null, warnungen: null, gebiete: {} };
// Fehler des letzten Abrufs (nur solange die App geöffnet ist)
const wetterStatus = { laeuft: false, fehlerVorhersage: null, fehlerWarnungen: null };

function wetterSpeicherLaden() {
  try {
    const c = JSON.parse(localStorage.getItem(WETTER_SCHLUESSEL) || "null");
    if (istObjekt(c) && c.version === WETTER_SPEICHER_VERSION) {
      wetter = { vorhersage: c.vorhersage || null, warnungen: c.warnungen || null, gebiete: istObjekt(c.gebiete) ? c.gebiete : {} };
    }
  } catch (e) { /* kein oder unlesbarer Zwischenspeicher: wird neu geladen */ }
}
function wetterSpeicherSchreiben() {
  try { localStorage.setItem(WETTER_SCHLUESSEL, JSON.stringify(Object.assign({ version: WETTER_SPEICHER_VERSION }, wetter))); }
  catch (e) { /* Speicher voll: dann ohne Zwischenspeicher */ }
}

// Amtliche Warnungen aller Orte: vom DWD, bei einem Fehler von Bright Sky.
// "gebiete" merkt sich je Ort, ob er im Warngebiet liegt (für den aktuellen
// Standort ein eigener, nicht gespeicherter Speicher).
async function warnungenLaden(orte, gebiete = wetter.gebiete) {
  try {
    return { quelle: "dwd", orte: await Promise.all(orte.map(o => dwdWarnungenOrt(o, gebiete))) };
  } catch (e) {
    try {
      return { quelle: "brightsky", dwdFehler: e.message, orte: await Promise.all(orte.map(brightSkyWarnungenOrt)) };
    } catch (e2) {
      throw new Error("DWD: " + e.message + "; Bright Sky: " + e2.message);
    }
  }
}
async function dwdWarnungenOrt(o, gebiete = wetter.gebiete) {
  const erg = dwdWarnungenLesen(await jsonAbrufen(dwdUrl("Warnungen_Gemeinden", DWD_FELDER, "THE_GEOM", o)));
  if (erg.abgedeckt) return erg;
  // Keine Warnung: einmal je Ort nachsehen, ob er im Warngebiet des DWD liegt (z. B. Urlaub im Ausland)
  const k = ortSchluessel(o);
  if (!gebiete[k]) {
    const g = await jsonAbrufen(dwdUrl("Warngebiete_Gemeinden", ["WARNCELLID", "NAME"], "SHAPE", o));
    if (!Array.isArray(g.features)) throw new Error("unerwartete Antwort");
    const p = g.features.length ? g.features[0].properties || {} : null;
    gebiete[k] = { abgedeckt: !!p, gebiet: p && p.NAME ? String(p.NAME) : null };
  }
  return Object.assign({ warnungen: [] }, gebiete[k]);
}
async function brightSkyWarnungenOrt(o) {
  try {
    return brightSkyLesen(await jsonAbrufen(brightSkyUrl(o)));
  } catch (e) {
    // 404: Ort liegt nicht im Warngebiet des DWD
    if (e.status === 404) return { abgedeckt: false, gebiet: null, warnungen: [] };
    throw e;
  }
}

// Lädt Vorhersage und Warnungen neu, wenn sie fehlen, zu alt sind, zu anderen
// Orten gehören oder der letzte Versuch fehlschlug. Verändert nur den
// Zwischenspeicher, nie die Daten der App.
async function wetterAktualisieren(erzwingen = false, jetzt = Date.now()) {
  const orte = wetterOrte().map(x => x.ort);
  if (!orte.length || wetterStatus.laeuft) return;
  const schluessel = orte.map(ortSchluessel).join(";");
  const faellig = (teil, fehler, ms) => erzwingen || !!fehler || !teil || teil.schluessel !== schluessel || !(jetzt - teil.stand < ms);
  const vorhersage = faellig(wetter.vorhersage, wetterStatus.fehlerVorhersage, VORHERSAGE_NEU_MS);
  const warnungen = faellig(wetter.warnungen, wetterStatus.fehlerWarnungen, WARNUNGEN_NEU_MS);
  if (!vorhersage && !warnungen) return;
  wetterStatus.laeuft = true;
  if (erzwingen) wetterNeuZeichnen();
  await Promise.all([
    vorhersage && jsonAbrufen(vorhersageUrl(orte)).then(a => {
      wetter.vorhersage = { schluessel, stand: jetzt, orte: vorhersageLesen(a, orte.length) };
      wetterStatus.fehlerVorhersage = null;
    }).catch(e => { wetterStatus.fehlerVorhersage = e.message; }),
    warnungen && warnungenLaden(orte).then(w => {
      wetter.warnungen = Object.assign({ schluessel, stand: jetzt }, w);
      wetterStatus.fehlerWarnungen = null;
    }).catch(e => { wetterStatus.fehlerWarnungen = e.message; })
  ]);
  wetterStatus.laeuft = false;
  wetterSpeicherSchreiben();
  wetterNeuZeichnen();
  // Orte während des Abrufs geändert: für die neuen Orte gleich nachladen
  if (wetterOrte().map(x => ortSchluessel(x.ort)).join(";") !== schluessel) await wetterAktualisieren(erzwingen, Date.now());
}
// Nach dem Laden neu zeichnen, aber kein geöffnetes Formular stören
function wetterNeuZeichnen() {
  if (!fenster.open && (aktiverTab === "wetter" || aktiverTab === "uebersicht")) zeichnen();
}
// Beim Start, beim Wechsel in Übersicht oder Wetter und beim Zurückkehren in die App
// (im Testmodus nicht: die Tests rufen wetterAktualisieren selbst auf). Den Standort
// nur, wenn die Ansicht "Jetzt" mit dem aktuellen Standort gerade angezeigt wird.
function wetterBeiBedarf() { if (!TESTMODUS) { wetterAktualisieren(); standortBeiBedarf(); } }

// ---------- Aktueller Standort (Wetter außerhalb der Fahrten) ----------

// Nur im Arbeitsspeicher: weder in den Daten noch im Zwischenspeicher. Die
// Koordinaten werden sofort auf 3 Nachkommastellen gerundet (so gehen sie an
// Open-Meteo und den DWD). "abgelehnt": keine Freigabe – dann fragt die App in
// dieser Sitzung erst beim Umschalten oder bei "Aktualisieren" wieder.
const standort = {
  ort: null, zeit: 0, ortung: false, fehler: null, abgelehnt: false,
  vorhersage: null, warnungen: null, gebiete: {}, laeuft: false, fehlerVorhersage: null, fehlerWarnungen: null
};
// Ist gerade die Ansicht "Jetzt" dran (außerhalb der Fahrten, kein weiterer Ort aktiv)?
function jetztZustand(jetzt = Date.now(), w = daten.einstellungen.wetter) {
  const orte = wetterOrte(w);
  return orte.length > 0 && orte[0].rolle !== "weitererOrt" && !wetterTag(jetzt, w).fahrtag;
}
// … und wird sie mit dem aktuellen Standort in der Übersicht oder im Reiter Wetter angezeigt?
function jetztMitStandortSichtbar(jetzt = Date.now()) {
  return (aktiverTab === "uebersicht" || aktiverTab === "wetter") && daten.einstellungen.wetter.ortAusserhalb === "standort" && jetztZustand(jetzt);
}
function standortBeiBedarf(erzwingen = false, jetzt = Date.now()) {
  return jetztMitStandortSichtbar(jetzt) ? standortBestimmen(erzwingen) : Promise.resolve();
}
// Standort über die Geolocation-API bestimmen (das iPhone fragt beim ersten Mal nach

function standortBestimmen(erzwingen = false, jetzt = null) {
  const zeit = () => jetzt ?? Date.now();

  if (!erzwingen && standort.ort && !standort.fehler && zeit() - standort.zeit < STANDORT_ALTER_MS) return standortWetterLaden(false, zeit());

  if (!geo) { Object.assign(standort, { fehler: "auf diesem Gerät nicht verfügbar", abgelehnt: false }); wetterNeuZeichnen(); return Promise.resolve(); }
  standort.ortung = true;
  wetterNeuZeichnen();
  return new Promise(fertig => {
    geo.getCurrentPosition(pos => {
      const neu = { lat: koordinateSenden(pos.coords.latitude), lon: koordinateSenden(pos.coords.longitude) };
      // Kaum bewegt: dieselbe Stelle, kein neuer Abruf nötig
      if (!standort.ort || entfernungKm(standort.ort, neu) > STANDORT_NEU_KM) {
        Object.assign(standort, { ort: neu, vorhersage: null, warnungen: null, fehlerVorhersage: null, fehlerWarnungen: null });
      }

// Vorhersage und Warnungen am Standort (ein Ort), neu, wenn sie fehlen, zu alt

async function standortWetterLaden(erzwingen = false, jetzt = Date.now()) {
  const o = standort.ort;
  if (!o || standort.laeuft) return;
  const schluessel = ortSchluessel(o);
  const faellig = (teil, fehler, ms) => erzwingen || !!fehler || !teil || teil.schluessel !== schluessel || !(jetzt - teil.stand < ms);
  const vorhersage = faellig(standort.vorhersage, standort.fehlerVorhersage, VORHERSAGE_NEU_MS);
  const warnungen = faellig(standort.warnungen, standort.fehlerWarnungen, WARNUNGEN_NEU_MS);
  if (!vorhersage && !warnungen) { wetterNeuZeichnen(); return; }
  standort.laeuft = true;
  wetterNeuZeichnen();
  await Promise.all([
    vorhersage && jsonAbrufen(vorhersageUrl([o])).then(a => {
      standort.vorhersage = { schluessel, stand: jetzt, orte: vorhersageLesen(a, 1) };
      standort.fehlerVorhersage = null;
    }).catch(e => { standort.fehlerVorhersage = e.message; }),
    warnungen && warnungenLaden([o], standort.gebiete).then(w => {
      standort.warnungen = Object.assign({ schluessel, stand: jetzt }, w);
      standort.fehlerWarnungen = null;
    }).catch(e => { standort.fehlerWarnungen = e.message; })
