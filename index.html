<style>
/* =====================================================================
   AUSSEHEN (CSS)
   Farben stehen als Variablen oben. Für den Dunkelmodus werden nur die
   Variablen ausgetauscht – das Betriebssystem entscheidet, welcher gilt.
   ===================================================================== */
:root {
  --bg: #f2f2f7;
  --karte: #ffffff;
  --text: #1c1c1e;
  --text2: #6e6e73;
  --linie: #d8d8dd;
  --akzent: #16805c;
  --akzent-text: #ffffff;
  --akzent-hell: #e3f3ec;
  --rot: #c62828;
  --rot-hell: #fdecea;
  --orange: #b25e00;
  --orange-hell: #fff3e0;
  --feld: #ffffff;
  --schatten: 0 1px 3px rgba(0,0,0,.08);
  /* Diagramm: laufendes Jahr hervorgehoben, Vorjahr zurückgenommen (geprüft auf Farbsehschwächen) */
  --diagramm-jahr: #16805c;
  --diagramm-vorjahr: #8e8e93;
  /* Aktiver Reiter: dunkleres Grün, Kontrast mind. 4,5:1 auf Weiß */
  --reiter-aktiv: #0f6b4c;
  /* Ampel der Fahrten (immer mit Farbwort daneben) und Stufen der amtlichen Warnungen */
  --ampel-gruen: #1e9e6a;
  --ampel-gelb: #e5b000;
  --ampel-rot: #d32f2f;
  --warnstufe-1: #e5c100;
  --warnstufe-2: #f08c00;
  --warnstufe-3: #d32f2f;
  --warnstufe-4: #8e24aa;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --karte: #1c1c1e;
    --text: #f2f2f7;
    --text2: #a1a1a6;
    --linie: #3a3a3c;
    --akzent: #34c38f;
    --akzent-text: #04261a;
    --akzent-hell: #12352a;
    --rot: #ff6b6b;
    --rot-hell: #3b1414;
    --orange: #ffb547;
    --orange-hell: #3a2a0f;
    --feld: #2c2c2e;
    --schatten: none;
    --diagramm-jahr: #34c38f;
    --diagramm-vorjahr: #6e6e73;
    --reiter-aktiv: #34c38f;
    --ampel-gruen: #34c38f;
    --ampel-gelb: #ffd60a;
    --ampel-rot: #ff5c5c;
    --warnstufe-1: #ffd60a;
    --warnstufe-2: #ff9f0a;
    --warnstufe-3: #ff5c5c;
    --warnstufe-4: #c77dff;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

header {
  position: sticky; top: 0; z-index: 5;
  background: var(--bg);
  padding: calc(env(safe-area-inset-top) + 10px) 16px 8px;
}
header h1 { margin: 0; font-size: 28px; }

main {
  padding: 0 16px calc(env(safe-area-inset-bottom) + 96px);
  max-width: 640px; margin: 0 auto;
}

h2 { font-size: 20px; margin: 24px 0 8px; }
h3 { font-size: 17px; margin: 0 0 4px; }

.karte {
  background: var(--karte);
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 12px;
  box-shadow: var(--schatten);
}
.klein { font-size: 15px; color: var(--text2); }
.zentriert { text-align: center; }

/* Große Kilometerstand-Anzeige */
.stand-zahl { font-size: 40px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }

/* Hinweise / Warnungen */
.hinweis { border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
.hinweis.warn { background: var(--orange-hell); color: var(--orange); }
.hinweis.fehler { background: var(--rot-hell); color: var(--rot); }
.hinweis.info { background: var(--akzent-hell); color: var(--text); }
.hinweis button { margin-top: 10px; }
.hinweis button:not(.primaer) { background: var(--karte); }

.status-rot { color: var(--rot); font-weight: 600; }
.status-orange { color: var(--orange); font-weight: 600; }
.status-gruen { color: var(--akzent); font-weight: 600; }

/* Schaltflächen */
button, .knopf {
  font: inherit;
  min-height: 48px;
  padding: 10px 16px;
  border-radius: 12px;
  border: none;
  background: var(--akzent-hell);
  color: var(--text);
  font-weight: 600;
  cursor: pointer;
  touch-action: manipulation;
}
button.primaer { background: var(--akzent); color: var(--akzent-text); }
button.gefahr { background: var(--rot-hell); color: var(--rot); }
button.leise { background: transparent; color: var(--akzent); }
button.voll { width: 100%; }
button:active { opacity: .7; }
button:disabled { opacity: .4; }
.knopfreihe { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.knopfreihe > button, .knopfreihe > .knopf { flex: 1 1 auto; }
/* Link, der wie eine Schaltfläche aussieht ("In Karten zeigen") */
a.knopf { display: flex; align-items: center; justify-content: center; box-sizing: border-box; text-decoration: none; text-align: center; }
a.knopf.voll { width: 100%; }
a.knopf:active { opacity: .7; }
a.knopf[aria-disabled="true"] { opacity: .4; pointer-events: none; }

/* Vorlagen-Schnellerfassung */
.schnell { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.schnell button { min-height: 72px; text-align: left; display: flex; flex-direction: column; justify-content: center; }
.schnell .km { font-weight: 400; font-size: 15px; opacity: .85; }

/* Summen-Kacheln */
.summen { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.summe { background: var(--karte); border-radius: 12px; padding: 10px 6px; text-align: center; box-shadow: var(--schatten); }
.summe .wert { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.summe .titel { font-size: 13px; color: var(--text2); }

/* Listen */
.liste { background: var(--karte); border-radius: 14px; overflow: hidden; box-shadow: var(--schatten); }
.zeile { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--linie); }
.zeile:last-child { border-bottom: none; }
.zeile .inhalt {
  flex: 1; min-width: 0;
  background: none; border-radius: 0; text-align: left; font-weight: 400;
  padding: 10px 0 10px 16px; display: flex; gap: 10px; align-items: center;
}
.zeile .inhalt .text { flex: 1; min-width: 0; }
.zeile .inhalt .text > div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.zeile .inhalt .text > div.umbrechen { white-space: normal; }
.zeile .zahl { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.zeile .symbol { background: none; min-width: 48px; padding: 0; color: var(--text2); font-size: 20px; }
.zeile .pfeile { display: flex; }
.leer { padding: 16px; color: var(--text2); text-align: center; }

.zeile.gruppe .inhalt .titel { font-weight: 600; }
/* Aufklapp-Pfeil: › zu, ⌄ (gedreht) offen; in der Textfarbe für guten Kontrast */
.chevron {
  width: 22px; height: 22px; flex: none;
  fill: none; stroke: currentColor; stroke-width: 2.75; stroke-linecap: round; stroke-linejoin: round;
  color: var(--text); transition: transform .15s ease;
}
[aria-expanded="true"] > .chevron { transform: rotate(90deg); }

/* Fortschritt zum Jahresziel; der Strich markiert das zeitanteilige Soll */
.balken { position: relative; height: 12px; border-radius: 99px; background: var(--linie); margin: 8px 0; overflow: hidden; }
.balken-ist { height: 100%; border-radius: 99px; background: var(--akzent); }
.balken-soll { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1px; background: var(--text); }

/* Einträge mit 0 km ("keine Fahrt") dezent */
.zeile.keine-fahrt .inhalt { color: var(--text2); }
.zeile.keine-fahrt .zahl { font-weight: 400; }

/* Fahrtage ohne Eintrag (Startseite) */
.luecke { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.luecke span { flex: 1; font-weight: 600; }
.hinweis .luecke button { margin-top: 0; min-height: 44px; padding: 8px 12px; }

/* Auswahl der Fahrtage (Einstellungen) */
.fahrtage { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
label.fahrtag { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--text); font-size: 15px; }
.fahrtag input { width: 26px; height: 26px; min-height: 26px; margin: 0; -webkit-appearance: checkbox; appearance: auto; }

/* Statistik: Diagramm, Legende, Tabellen */
.legende { display: flex; gap: 16px; font-size: 15px; color: var(--text2); margin-bottom: 6px; }
.legende span { display: inline-flex; align-items: center; gap: 6px; }
.farbe { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
.farbe.jahr, .diagramm .jahr { background: var(--diagramm-jahr); fill: var(--diagramm-jahr); }
.farbe.vorjahr, .diagramm .vorjahr { background: var(--diagramm-vorjahr); fill: var(--diagramm-vorjahr); }
.diagramm { display: block; width: 100%; height: auto; }
.diagramm .gitter { stroke: var(--linie); stroke-width: 1; }
.diagramm text { fill: var(--text2); font-size: 11px; font-variant-numeric: tabular-nums; }
.diagramm .gewaehlt { fill: var(--akzent-hell); }
.diagramm .treffer { fill: transparent; cursor: pointer; }
.monatswert { min-height: 44px; margin-top: 6px; }
.tabelle { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
.tabelle th { font-weight: 600; color: var(--text2); font-size: 13px; text-align: right; padding: 4px 3px; vertical-align: bottom; }
.tabelle td { text-align: right; padding: 7px 3px; border-top: 1px solid var(--linie); }
.tabelle th:first-child, .tabelle td:first-child { text-align: left; }
.tabelle tr.summe-zeile td { font-weight: 700; }
.aufklappen { background: none; border-radius: 0; width: 100%; padding: 10px 0 0; display: flex; gap: 8px; align-items: center; font-weight: 600; }

/* Wetter: Ampel, Kachel, Zeitleiste der Abfahrt, Warnungen */
.ampel { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: -2px; margin-right: 5px; flex: none; }
.ampel.gruen, .slot.gruen { background: var(--ampel-gruen); }
.ampel.gelb, .slot.gelb { background: var(--ampel-gelb); }
.ampel.rot, .slot.rot { background: var(--ampel-rot); }
.ampelzeile { margin: 4px 0 2px; }
/* Wind je Teilstrecke unter der Zeile 🧭, eingerückt */
.wind-teile { padding-left: 1.6em; }
/* Nicht aktuelle oder vergangene Daten zurückgenommen */
.veraltet .ampel, .veraltet .slot { opacity: .45; }
.veraltet > :not(h3) { color: var(--text2); }
.wetter-kachel { display: block; width: 100%; text-align: left; font-weight: 400; color: var(--text); }
.wetter-kachel:not(.primaer) { background: var(--karte); }
.kachel-ampeln { display: flex; gap: 18px; margin: 4px 0 2px; font-weight: 600; }
.zeitleiste { display: flex; gap: 2px; margin-top: 10px; }
.zeitleiste .slot { flex: 1; height: 16px; border-radius: 3px; }
.slot.leer { background: var(--linie); }
.slot.beste { box-shadow: inset 0 0 0 2px var(--text); }
.zeitachse { display: flex; justify-content: space-between; font-size: 12px; color: var(--text2); font-variant-numeric: tabular-nums; margin-bottom: 4px; }
.warnung { border-left: 4px solid var(--warnstufe-1); padding: 4px 0 4px 10px; margin: 10px 0; }
.warnung.stufe-2 { border-color: var(--warnstufe-2); }
.warnung.stufe-3 { border-color: var(--warnstufe-3); }
.warnung.stufe-4 { border-color: var(--warnstufe-4); }
/* Rückmeldung zur Kleidung, gespeichertes Wetter im Eintrag, Regeln in den Einstellungen, Ampelverteilung */
.rueckmeldung { display: flex; gap: 6px; margin: 6px 0 4px; }
.rueckmeldung button { flex: 1; min-height: 44px; padding: 6px 4px; }
.eintrag-wetter { border-top: 1px solid var(--linie); padding: 8px 0; }
/* Kleidung je Körperbereich im Reiter Wetter */
.bereiche { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 2px 0 6px; }
.bereiche dt { color: var(--text2); font-size: 15px; }
.bereiche dd { margin: 0; }
/* Umschalter "Wohnort / Aktueller Standort" (Wetter außerhalb der Fahrten) */
.umschalter { display: flex; margin-top: 10px; border: 1px solid var(--linie); border-radius: 12px; overflow: hidden; }
.umschalter button { flex: 1 1 0; min-height: 44px; border-radius: 0; background: transparent; color: var(--text); font-weight: 500; font-size: 15px; padding: 8px 6px; }
.umschalter button + button { border-left: 1px solid var(--linie); }
.umschalter button.aktiv { background: var(--akzent); color: var(--akzent-text); font-weight: 600; }
input.kurzfeld { max-width: 140px; }
.verteilung-zeile { display: flex; align-items: center; gap: 8px; margin: 6px 0; flex-wrap: wrap; }
.verteilung-titel { width: 52px; font-size: 15px; }
.verteilung { flex: 1 1 120px; display: flex; gap: 2px; height: 12px; border-radius: 6px; overflow: hidden; }
.verteilung .gruen { background: var(--ampel-gruen); }
.verteilung .gelb { background: var(--ampel-gelb); }
.verteilung .rot { background: var(--ampel-rot); }
.suchzeile { display: flex; gap: 8px; }
.suchzeile input { flex: 1; min-width: 0; }
.suchzeile button { flex: none; }

/* Detailansicht (nur lesen) */
.details { margin: 0; }
.details dt { font-size: 15px; color: var(--text2); margin-top: 12px; }
.details dd { margin: 2px 0 0; overflow-wrap: anywhere; }
.umbrueche { white-space: pre-wrap; }

/* Werkstatt: Positionen und Vorschläge eines Auftrags, Mängel mit Knöpfen */
.positionen { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--linie); }
.position { margin: 6px 0; overflow-wrap: anywhere; }
.position-zeile { border-bottom: 1px solid var(--linie); padding: 4px 0 10px; }
.position-zeile .knopfreihe { margin-top: 4px; }
.position-zeile .knopfreihe button, .zeile.mit-knoepfen .knopfreihe button { min-height: 40px; padding: 6px 10px; font-size: 15px; }
.vorschlag { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--akzent-hell); overflow-wrap: anywhere; }
.vorschlag button { display: block; margin-top: 8px; min-height: 40px; padding: 6px 12px; background: var(--karte); }
.zeile.mit-knoepfen { flex-direction: column; align-items: stretch; gap: 0; }
.zeile.mit-knoepfen .knopfreihe { margin: 0 12px 10px; }
/* Mängel und Positionen zum Abhaken im Formular „Erledigt eintragen“ */
.haken { display: flex; gap: 10px; align-items: flex-start; margin: 8px 0; color: var(--text); font-size: 17px; }
.haken input { width: 24px; min-height: 24px; height: 24px; margin: 0; flex: none; -webkit-appearance: checkbox; appearance: auto; }

.abzeichen {
  display: inline-block; font-size: 12px; font-weight: 700;
  padding: 2px 8px; border-radius: 99px;
  background: var(--orange-hell); color: var(--orange);
  vertical-align: middle; margin-left: 4px;
}

/* Formulare */
label { display: block; font-size: 15px; color: var(--text2); margin: 14px 0 4px; }
input, select, textarea {
  font: inherit; font-size: 17px; /* ≥16px verhindert das automatische Zoomen auf dem iPhone */
  width: 100%;
  min-height: 48px;
  padding: 10px 12px;
  border: 1px solid var(--linie);
  border-radius: 10px;
  background: var(--feld);
  color: var(--text);
  -webkit-appearance: none; appearance: none;
}
input[type="date"], input[type="time"] { display: block; }
input:disabled { opacity: .45; }
input::-webkit-date-and-time-value { text-align: left; }
select {
  background-image: linear-gradient(45deg, transparent 50%, var(--text2) 50%), linear-gradient(135deg, var(--text2) 50%, transparent 50%);
  background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%;
  background-size: 6px 6px; background-repeat: no-repeat;
  padding-right: 36px;
}
textarea { min-height: 80px; resize: vertical; }
.feldhinweis { font-size: 14px; color: var(--text2); margin-top: 4px; }
.feldhinweis.warn { color: var(--orange); }

/* Fenster (Dialoge) */
dialog {
  border: none; padding: 0;
  width: calc(100% - 16px); max-width: 560px;
  max-height: calc(100% - env(safe-area-inset-top) - 24px);
  margin: calc(env(safe-area-inset-top) + 12px) auto auto;
  border-radius: 16px;
  background: var(--karte); color: var(--text);
  overflow: auto;
}
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog .fensterinhalt { padding: 18px 16px 16px; }
dialog h2 { margin-top: 0; }

/* Untere Navigationsleiste */
nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: flex;
  background: var(--karte);
  border-top: 1px solid var(--linie);
  padding-bottom: env(safe-area-inset-bottom);
}
/* Reiter: aktiv grün und fett, sonst grau; in keinem Zustand eine Hintergrundfläche */
nav button, nav button:active, nav button:focus {
  flex: 1; background: transparent; border-radius: 0;
  min-height: 60px; padding: 6px 2px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 12px; font-weight: 500; color: var(--text2);
}
nav button:focus:not(:focus-visible) { outline: none; }
nav button .ico { font-size: 22px; line-height: 1; }
nav button.aktiv { color: var(--reiter-aktiv); font-weight: 700; }

/* Kurze Bestätigung unten ("Gespeichert"), nach dem Löschen mit "Rückgängig" */
#toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom) + 76px);
  width: max-content; max-width: calc(100% - 32px);
  display: flex; align-items: center; gap: 12px;
  background: var(--text); color: var(--bg);
  padding: 10px 18px; border-radius: 24px; font-weight: 600;
  opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20;
}
#toast.sichtbar { opacity: .95; }
#toast.sichtbar.mit-knopf { opacity: 1; pointer-events: auto; padding-right: 8px; }
#toast button { min-height: 40px; padding: 6px 14px; flex: none; background: var(--bg); color: var(--text); }
</style>
</head>
<body>

<header><h1 id="seitentitel">Übersicht</h1></header>
<main id="inhalt"></main>

<nav>
  <button type="button" data-action="tab" data-tab="uebersicht"><span class="ico">🚲</span>Übersicht</button>
  <button type="button" data-action="tab" data-tab="wetter"><span class="ico">🌦️</span>Wetter</button>
  <button type="button" data-action="tab" data-tab="wartung"><span class="ico">🔧</span>Wartung</button>
  <button type="button" data-action="tab" data-tab="statistik"><span class="ico">📊</span>Statistik</button>
  <button type="button" data-action="tab" data-tab="einstellungen"><span class="ico">⚙️</span>Einstellungen</button>
</nav>

<dialog id="fenster"><div class="fensterinhalt" id="fensterinhalt"></div></dialog>
<dialog id="frage"><div class="fensterinhalt" id="frageinhalt"></div></dialog>
<div id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button type="button" id="toast-knopf" data-action="rueckgaengig" hidden>Rückgängig</button></div>
<input type="file" id="importdatei" accept="application/json,.json" hidden>
<input type="file" id="pruefdatei" accept="application/json,.json" hidden>

<script>
"use strict";

/* =====================================================================
   1. GRUNDEINSTELLUNGEN
   ===================================================================== */

// Testmodus (Aufruf mit "?test", nur für tests/test.html): eigene
// Speicherplätze, damit die Tests die echten Daten nie berühren.
const TESTMODUS = new URLSearchParams(location.search).has("test");
// Unter diesem Namen liegen alle Daten im localStorage des Browsers.
const SPEICHER_SCHLUESSEL = TESTMODUS ? "radkm-test-daten" : "radkm-daten";
// Datum des letzten Exports (separat, damit ein Import es nicht verändert).
const EXPORT_SCHLUESSEL = TESTMODUS ? "radkm-test-letzter-export" : "radkm-letzter-export";
// Zuletzt geladene Wetterdaten (Zwischenspeicher, kein Teil der Daten und der Sicherung)
const WETTER_SCHLUESSEL = TESTMODUS ? "radkm-test-wetter" : "radkm-wetter";
// Version der App (wird in den Einstellungen und in der Sicherung angezeigt)
const APP_VERSION = "5a";
// Aktuelle Version des Datenmodells. Bei Änderungen am Aufbau erhöhen
// und unten in MIGRATIONEN eine Umwandlung ergänzen.
const DATEN_VERSION = 8;
const EXPORT_ERINNERUNG_TAGE = 30;
// Prognosen erst, wenn seit dem Startdatum so viele Tage vergangen sind
const PROGNOSE_MIN_TAGE = 7;
// So lange (ms) wird nach dem Löschen "Rückgängig" angeboten
const RUECKGAENGIG_MS = 12000;
// Übliche Fahrtage bei einer Neuinstallation: 1 = Montag … 7 = Sonntag
const STANDARD_FAHRTAGE = [1, 2, 5];
// Standard-Zuordnung einer Aufgabe: der nächste offene Auftrag einer Inspektion
const NAECHSTE_INSPEKTION = "naechste-inspektion";
// Merkt sich, dass die Wartungsarten nach der Umwandlung auf Version 8 noch
// geprüft werden sollen (kein Teil der Daten und der Sicherung)
const PRUEF_SCHLUESSEL = TESTMODUS ? "radkm-test-wartungsarten-pruefen" : "radkm-wartungsarten-pruefen";
// Ab dieser Uhrzeit weist die Übersicht schon am selben Tag auf einen fehlenden Eintrag hin
// (Schalter "Hinweis schon am selben Tag", Standard an)
const STANDARD_HINWEIS_HEUTE_AB = "18:00";
// Wetter außerhalb der Fahrten: am Wohnort oder am aktuellen Standort
const ORT_AUSSERHALB = ["wohnort", "standort"];
// Körperbereiche der Kleidung: [Schlüssel in den Daten, Bezeichnung]
const BEREICHE = [["kopf", "Kopf"], ["hals", "Hals"], ["haende", "Hände"], ["oberkoerper", "Oberkörper"], ["beine", "Beine"], ["fuesse", "Füße"]];
const BEREICH_SCHLUESSEL = BEREICHE.map(b => b[0]);
const BEREICH_NAME = Object.fromEntries(BEREICHE);
// Bei Regen gilt in diesen Bereichen das Zwiebelprinzip (eine Schicht weniger unter dem Regenzeug)
const ZWIEBEL_BEREICHE = ["oberkoerper", "beine", "fuesse"];
// Höchstens so viele Wegpunkte zwischen Wohn- und Arbeitsort
const MAX_WEGPUNKTE = 3;

/* =====================================================================
   2. HILFSFUNKTIONEN: Datum, Zahlen, Text
   Datumswerte werden intern immer als Text "JJJJ-MM-TT" gespeichert.
   ===================================================================== */

function zweistellig(n) { return String(n).padStart(2, "0"); }

function isoAusDate(d) {
  return d.getFullYear() + "-" + zweistellig(d.getMonth() + 1) + "-" + zweistellig(d.getDate());
}
function heute() { return isoAusDate(new Date()); }

// "JJJJ-MM-TT" → Date (lokal, 12 Uhr mittags, um Sommerzeit-Probleme zu vermeiden)
function dateAusIso(iso) {
  const [j, m, t] = iso.split("-").map(Number);
  return new Date(j, m - 1, t, 12);
}
function istGueltigesDatum(iso) {
  if (typeof iso !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return false;
  return isoAusDate(dateAusIso(iso)) === iso;
}
// "2026-10-10" → "10.10.2026"
function datumText(iso) {
  if (!iso) return "–";
  const [j, m, t] = iso.split("-");
  return t + "." + m + "." + j;
}
const WOCHENTAGE = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
function wochentag(iso) { return WOCHENTAGE[dateAusIso(iso).getDay()]; }
// Wochentag nach ISO 8601: 1 = Montag … 7 = Sonntag (wie in den Einstellungen "fahrtage")
function isoWochentag(iso) { return (dateAusIso(iso).getDay() + 6) % 7 + 1; }

function plusTage(iso, tage) {
  const d = dateAusIso(iso);
  d.setDate(d.getDate() + tage);
  return isoAusDate(d);
}
// Montag der Woche, in der das Datum liegt
function montagDerWoche(iso) {
  const tag = dateAusIso(iso).getDay(); // 0 = Sonntag
  return plusTage(iso, -((tag + 6) % 7));
}
// Monate addieren; 31.01. + 1 Monat → 28./29.02.
function plusMonate(iso, monate) {
  const [j, m, t] = iso.split("-").map(Number);
  const ziel = new Date(j, m - 1 + monate, 1, 12);
  const letzterTag = new Date(ziel.getFullYear(), ziel.getMonth() + 1, 0).getDate();
  ziel.setDate(Math.min(t, letzterTag));
  return isoAusDate(ziel);
}
// "2026-10-10" → "10.10."
function kurzDatum(iso) { return datumText(iso).slice(0, 6); }
const MONATE = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
// Erster bzw. letzter Tag eines Monats (monat = 1 … 12)
function monatsanfang(jahr, monat) { return jahr + "-" + zweistellig(monat) + "-01"; }
function monatsende(jahr, monat) {
  return jahr + "-" + zweistellig(monat) + "-" + zweistellig(new Date(jahr, monat, 0).getDate());
}
// Kalenderwoche nach ISO 8601: Die Woche gehört zu dem Jahr, in dem ihr Donnerstag liegt.
function kalenderwoche(iso) {
  const donnerstag = plusTage(montagDerWoche(iso), 3);
  return Math.floor(tageZwischen(donnerstag.slice(0, 4) + "-01-01", donnerstag) / 7) + 1;
}

// Anzahl Tage von a nach b (positiv, wenn b später ist)
function tageZwischen(a, b) {
  const [j1, m1, t1] = a.split("-").map(Number);
  const [j2, m2, t2] = b.split("-").map(Number);
  return Math.round((Date.UTC(j2, m2 - 1, t2) - Date.UTC(j1, m1 - 1, t1)) / 86400000);
}
function tageText(n) { return n === 1 ? "1 Tag" : n + " Tagen"; }

// Kilometer runden (2 Nachkommastellen), um Rechenungenauigkeiten zu vermeiden
function runden(n) { return Math.round(n * 100) / 100; }
// Prognosen: auf 10 km gerundet und immer mit "ca."
function rund10(n) { return Math.round(n / 10) * 10; }
function caKm(n) { return "ca. " + kmText(rund10(n)) + " km"; }
// "2027-05-14" → "Mai 2027"
function monatJahrText(iso) { return MONATE[Number(iso.slice(5, 7)) - 1] + " " + iso.slice(0, 4); }

const zahlFormat = new Intl.NumberFormat("de-DE", { maximumFractionDigits: 2 });
// 1234.5 → "1.234,5"
function kmText(n) { return n === null || n === undefined ? "–" : zahlFormat.format(runden(n)); }
// 12.5 → "12,5" (für Eingabefelder, ohne Tausenderpunkt)
function kmFeld(n) { return n === null || n === undefined ? "" : String(runden(n)).replace(".", ","); }
// Eingabe → Zahl. Erlaubt "12,5" und "12.5"; "1.234,5" wird zu 1234.5.
// Gibt null zurück, wenn die Eingabe keine gültige Zahl ≥ 0 ist.
function kmLesen(text) {
  let s = String(text).trim().replace(/\s/g, "");
  if (s === "") return null;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  if (!/^\d+(\.\d+)?$/.test(s)) return null;
  return runden(Number(s));
}

// Koordinaten der Orte und Wegpunkte werden mit 4 Nachkommastellen (ca. 10 m)
// gespeichert; Teilstrecken (Länge, Richtung, Wind) rechnen damit.
function koordinateSpeichern(x) { return Math.round(x * 10000) / 10000; }
// An die Wetterdienste (Vorhersage, Rückblick, Warnungen) gehen sie nur auf 3
// Nachkommastellen gerundet (ca. 100 m).
function koordinateSenden(x) { return Math.round(x * 1000) / 1000; }
// Uhrzeit im Format "HH:MM"
function istUhrzeit(t) { return typeof t === "string" && /^([01]\d|2[0-3]):[0-5]\d$/.test(t); }
function minutenAus(t) { return Number(t.slice(0, 2)) * 60 + Number(t.slice(3, 5)); }
function uhrzeitAus(minuten) {
  const m = ((minuten % 1440) + 1440) % 1440;
  return zweistellig(Math.floor(m / 60)) + ":" + zweistellig(m % 60);
}

// Zahl mit Komma oder Punkt, auch negativ ("-2,5" oder "−2,5"); null, wenn keine Zahl
function zahlLesen(text) {
  const s = String(text ?? "").trim().replace(/\s/g, "").replace("−", "-").replace(",", ".");
  return /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : null;
}
// 51.1 → "51,1" (für Eingabefelder, ohne Tausenderpunkt)
function zahlFeld(n) { return n === null || n === undefined ? "" : String(n).replace(".", ","); }

// Text sicher in HTML einsetzen (verhindert, dass z. B. "<" die Seite zerstört)
function esc(text) {
  return String(text ?? "").replace(/[&<>"']/g, z => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[z]));
}
function neueId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

/* =====================================================================
   3. DATENMODELL: Laden, Prüfen, Umwandeln, Speichern
   ===================================================================== */

// Die Standard-Wartungsarten bei einer Neuinstallation (ab Version 8): Aufträge,
// keine Aufgaben (die sind je Fahrrad zu verschieden).
function standardWartungsarten() {
  const auftrag = (id, name, intervallMonate, intervallKm, von, bis, einmalig = false) => ({
    id, name, typ: "auftrag", intervallMonate, intervallKm, fensterVon: von, fensterBis: bis, gueltigAbJahr: null, einmalig, bauteil: null, zuordnung: null
  });
  return [
    auftrag("erstinspektion", "Erstinspektion", 3, 300, null, null, true),
    auftrag("kleine-inspektion", "Kleine Inspektion", null, null, 3, 4),
    auftrag("grosse-inspektion", "Große Inspektion", 12, null, 10, 11),
    auftrag("reparatur", "Reparatur", null, null, null, null),
    auftrag("eigenleistung", "Eigenleistung", null, null, null, null)
  ];
}
// Die Standard-Wartungsarten bis Version 7: mit jährlichem Zeitfenster
// (mitFenster), ohne für die Umwandlung von Version-1-Daten.
function wartungsartenVersion7(mitFenster = true) {
  const art = (id, name, intervallMonate, von, bis) => ({
    id, name, intervallMonate, intervallKm: null,
    fensterVon: mitFenster ? von : null, fensterBis: mitFenster ? bis : null, gueltigAbJahr: null, einmalig: false
  });
  return [
    art("grosse-inspektion", "Große Inspektion", 12, 10, 11),
    art("kleine-inspektion", "Kleine Inspektion", null, 3, 4),
    art("reparatur", "Reparatur", null, null, null)
  ];
}
function standardEinstellungen() {
  return { fahrtage: [...STANDARD_FAHRTAGE], jahresziele: [], hinweisHeuteAn: true, hinweisHeuteAb: STANDARD_HINWEIS_HEUTE_AB, wetter: standardWetter() };
}
// Grenzen der Ampel je Fahrt (Vorschlagswerte)
function standardAmpel() {
  return { rotBoeen: 60, rotStarkregen: 5, rotWarnstufe: 2, gelbRegenWahrscheinlichkeit: 50, gelbNiederschlag: 0.5,
    gelbBoeen: 40, gelbTemperatur: 0, glaetteTemperatur: 1 };
}
// Kleidung je Körperbereich ("" = nichts), aus einem Objekt mit beliebigen Bereichen
function bereicheAus(b = {}) {
  return Object.fromEntries(BEREICH_SCHLUESSEL.map(k => [k, b[k] || ""]));
}
// Kleidung nach gefühlter Temperatur, von warm nach kalt, je Körperbereich. Eine
// Stufe gilt ab ihrer Untergrenze "ab"; die letzte Stufe gilt darunter.
// "haendeBeiRegen" ersetzt die Hände, sobald ein Regenzusatz greift. Der

// Wetter: Orte, Wegpunkte (Wohnort → Arbeitsort) und je Teilstrecke, ob sie
// für den Wind zählt, Ort für das Wetter außerhalb der Fahrten, Fahrzeiten
// (Zeitraum, Schalter und Uhrzeit der üblichen Abfahrt, Dauer in Minuten), Ampel, Kleidung
function standardWetter() {
  const v4 = wetterVersion4();
  return {
    wohnort: null, arbeitsort: null, weitererOrt: null, wegpunkte: [], windTeilstrecken: [true], ortAusserhalb: "wohnort",
    hinfahrt: fahrzeitMitSchalter(v4.hinfahrt, true), rueckfahrt: fahrzeitMitSchalter(v4.rueckfahrt, true), ampel: v4.ampel, kleidung: standardKleidung()

// Fahrzeit ab Version 7: { von, bis, abfahrtAn, abfahrt, dauer }; abfahrt ist immer eine Uhrzeit
function fahrzeitMitSchalter(f, abfahrtAn, abfahrt = f.abfahrt) {
  return { von: f.von, bis: f.bis, abfahrtAn, abfahrt, dauer: f.dauer };
}
// Übliche Abfahrt einer Fahrzeit oder null, wenn der Schalter aus ist
function ueblicheAbfahrt(f) { return f.abfahrtAn ? f.abfahrt : null; }
// Wetter-Einstellungen, wie die Umwandlung 3 → 4 sie anlegt (Aufbau von Version 4)
function wetterVersion4() {
  return {
    wohnort: null, arbeitsort: null, weitererOrt: null,
    hinfahrt: { von: "06:00", bis: "07:00", abfahrt: "06:00", dauer: 60 },
    rueckfahrt: { von: "16:00", bis: "17:00", abfahrt: "16:00", dauer: 60 },
    ampel: standardAmpel(),
    kleidung: JSON.parse(JSON.stringify(KLEIDUNG_VERSION_4))

}
function leereDaten() {
  return {
    version: DATEN_VERSION,
    fahrrad: null,
    einstellungen: standardEinstellungen(),
    vorlagen: [],
    eintraege: [],
    wartungsarten: standardWartungsarten(),
    auftraege: [],
    maengel: []

// Ergänzt in jedem Objekt einer Liste fehlende Felder; vorhandene bleiben unverändert
function felderErgaenzen(liste, felder) {
  return Array.isArray(liste)
    ? liste.map(x => x && typeof x === "object" && !Array.isArray(x) ? Object.assign({}, felder, x) : x)
    : liste;
}

// Umwandlungen für ältere Datenversionen. Jede Funktion hebt die Daten um
// genau eine Version an und lässt alle vorhandenen Angaben unverändert.
const MIGRATIONEN = {
  // Version 1 → 2: Rahmennummer und Beschreibung beim Fahrrad, Zeitfenster
  // bei den Wartungsarten (bleiben leer), neue Mängelliste.
  1: alt => {
    const d = Object.assign({}, alt, { version: 2 });
    if (d.fahrrad && typeof d.fahrrad === "object") {
      d.fahrrad = Object.assign({ rahmennummer: "", beschreibung: "" }, d.fahrrad);
    }
    // In Version 1 bedeutete eine fehlende Liste: die Standard-Wartungsarten (ohne Zeitfenster)
    const arten = d.wartungsarten === undefined ? wartungsartenVersion7(false) : d.wartungsarten;
    d.wartungsarten = Array.isArray(arten)
      ? arten.map(a => a && typeof a === "object" ? Object.assign({ fensterVon: null, fensterBis: null, gueltigAbJahr: null }, a) : a)
      : arten;
    if (d.maengel === undefined) d.maengel = [];
    return d;
  },
  // Version 2 → 3: Einstellungen (Fahrtage, Jahresziele), Merkmal "Arbeitsweg"
  // bei Vorlagen und Einträgen, "einmalig" bei Wartungsarten – alle aus.
  2: alt => {
    const d = Object.assign({}, alt, { version: 3 });
    if (d.einstellungen === undefined) d.einstellungen = { fahrtage: [...STANDARD_FAHRTAGE], jahresziele: [] };
    d.vorlagen = felderErgaenzen(d.vorlagen, { arbeitsweg: false });
    d.eintraege = felderErgaenzen(d.eintraege, { arbeitsweg: false });
    d.wartungsarten = felderErgaenzen(d.wartungsarten, { einmalig: false });
    return d;
  },
  // Version 3 → 4: Wetter in den Einstellungen (noch ohne Orte, Fahrzeiten,
  // Ampel- und Kleidungsregeln mit Standardwerten), Wetter je Eintrag (leer).
  // (Jede Umwandlung legt die Standardwerte ihrer Zielversion an, nicht die aktuellen.)
  3: alt => {
    const d = Object.assign({}, alt, { version: 4 });
    const es = d.einstellungen;
    if (es === undefined) d.einstellungen = { fahrtage: [...STANDARD_FAHRTAGE], jahresziele: [], wetter: wetterVersion4() };
    else if (es && typeof es === "object" && !Array.isArray(es) && es.wetter === undefined) d.einstellungen = Object.assign({}, es, { wetter: wetterVersion4() });
    d.eintraege = felderErgaenzen(d.eintraege, { wetter: null });
    return d;
  },
  // Version 4 → 5: Uhrzeit für den Hinweis auf einen fehlenden Eintrag am selben
  // Tag (18:00). Die Kleidungsstufen waren in Version 4 nicht änderbar; sind es
  // noch genau die alten Standardwerte, kommen die neuen. Alles andere bleibt.
  4: alt => {
    const d = Object.assign({}, alt, { version: 5 });
    if (istObjekt(d.einstellungen)) {
      const es = Object.assign({}, d.einstellungen);
      if (es.hinweisHeuteAb === undefined) es.hinweisHeuteAb = STANDARD_HINWEIS_HEUTE_AB;
      if (istObjekt(es.wetter) && gleicherInhalt(es.wetter.kleidung, KLEIDUNG_VERSION_4)) es.wetter = Object.assign({}, es.wetter, { kleidung: JSON.parse(JSON.stringify(KLEIDUNG_VERSION_5)) });
      d.einstellungen = es;
    }
    return d;
  },
  // Version 5 → 6: Kleidung nach Körperbereichen, Rückmeldung ohne Verschiebung
  // der Grenzen, Wegpunkte. Bei jeder Fahrt mit Wetter wird festgehalten, was
  // 4b empfohlen hat (Text der Stufe und Regenzusatz, im Feld Oberkörper).
  5: alt => {
    const d = Object.assign({}, alt, { version: 6 });
    const es = istObjekt(d.einstellungen) ? d.einstellungen : null;
    const w = es && istObjekt(es.wetter) ? es.wetter : null;
    const k = w && istObjekt(w.kleidung) ? w.kleidung : null;
    const stufen5 = k && Array.isArray(k.stufen) ? k.stufen : KLEIDUNG_VERSION_5.stufen;

    if (Array.isArray(d.eintraege)) d.eintraege = d.eintraege.map(e => istObjekt(e) && istObjekt(e.wetter)

      : e);
    if (w) {

// Ist eine Wartungsart aus Version 7 ein Auftrag? Mit Zeitfenster, einmalig oder
// mit „Inspektion“, „Reparatur“ bzw. „Eigenleistung“ im Namen; sonst eine Aufgabe.
function istAuftragVersion7(a) {
  return (a.fensterVon ?? null) !== null || a.einmalig === true || /inspektion|reparatur|eigenleistung/i.test(typeof a.name === "string" ? a.name : "");
}
// Hat eine Wartungsart eine Fälligkeit (Intervall, Zeitfenster oder einmalig)?
function hatFaelligkeit(a) {
  return (a.fensterVon ?? null) !== null || !!a.intervallMonate || !!a.intervallKm || a.einmalig === true;
}

// Umwandlung der Wartung aus Version 7. Alle Kennungen werden aus den alten
// abgeleitet, damit eine umgewandelte Sicherung gleich bleibt.
//   - Wartungsarten: Auftrag oder Aufgabe (istAuftragVersion7). Aufgaben bekommen
//     kein Bauteil und die Standard-Zuordnung „nächste Inspektion“. Fehlen
//     „Reparatur“ oder „Eigenleistung“ (Aufträge ohne Fälligkeit), kommen sie dazu.
//   - Protokoll eines Auftrags → erledigter Auftrag (id des Protokolleintrags).
//   - Protokoll einer Aufgabe → erledigte Position im erledigten Auftrag vom
//     selben Datum, sonst in einer erledigten Reparatur dieses Datums. Damit die
//     Fälligkeit gleich bleibt, nur bei gleichem Kilometerstand (beide berechnet
//     oder beide gleich von Hand eingetragen); sonst eine eigene Reparatur. Eine
//     abweichende Werkstatt steht in der Notiz der Position.
//   - Mängel mit protokollId → erledigte Position im daraus entstandenen Auftrag.
//   - Termin eines Auftrags → geplanter Auftrag. Termin einer Aufgabe → Position
//     im geplanten Inspektions-Auftrag mit demselben Termin, sonst in einem neuen
//     geplanten Auftrag der Inspektion, in deren Zeitfenster der Termin liegt,
//     sonst in einer geplanten Reparatur mit diesem Termin.
function wartungAusVersion7(alt) {
  const fehler = msg => { throw new Error(msg); };
  const liste = (v, name) => {
    if (v === undefined) return [];
    if (!Array.isArray(v)) fehler("„" + name + "“ muss eine Liste sein.");
    return v.map((x, i) => istObjekt(x) ? x : fehler("„" + name + "“ Nr. " + (i + 1) + " ist kein Objekt."));
  };
  const arten7 = alt.wartungsarten === undefined ? wartungsartenVersion7(true) : alt.wartungsarten;
  if (!Array.isArray(arten7)) return { wartungsarten: arten7, auftraege: [] }; // meldet die Prüfung
  const protokoll = liste(alt.wartungsprotokoll, "wartungsprotokoll");
  const termine = liste(alt.termine, "termine");
  const maengel = alt.maengel === undefined ? [] : alt.maengel;

  // Wartungsarten einordnen
  const ids = new Set(arten7.filter(istObjekt).map(a => a.id));
  const arten = arten7.map(a => {
    if (!istObjekt(a)) return a;
    return istAuftragVersion7(a)
      ? Object.assign({}, a, { typ: "auftrag", bauteil: null, zuordnung: null })
      : Object.assign({}, a, { typ: "aufgabe", bauteil: null, zuordnung: NAECHSTE_INSPEKTION });
  });
  const artVon = id => arten.find(a => istObjekt(a) && a.id === id) || null;
  const ohneFaelligkeit = (muster) => arten.find(a => istObjekt(a) && a.typ === "auftrag" && muster.test(a.name || "") && !hatFaelligkeit(a));
  const ergaenzen = (basis, name) => {
    let id = basis, n = 2;
    while (ids.has(id)) id = basis + "-" + n++;
    ids.add(id);
    const a = { id, name, typ: "auftrag", intervallMonate: null, intervallKm: null, fensterVon: null, fensterBis: null, gueltigAbJahr: null,
      einmalig: false, bauteil: null, zuordnung: null };
    arten.push(a);
    return a;
  };
  const reparatur = ohneFaelligkeit(/reparatur/i) || ergaenzen("reparatur", "Reparatur");
  if (!ohneFaelligkeit(/eigenleistung/i)) ergaenzen("eigenleistung", "Eigenleistung");
  const istInspektion = a => istObjekt(a) && a.typ === "auftrag" && hatFaelligkeit(a);

  // Mängel: fehlende Kennungen ergänzen, protokollId entfällt
  const mangelListe = Array.isArray(maengel) ? maengel.map(m => istObjekt(m) && !(typeof m.id === "string" && m.id) ? Object.assign({}, m, { id: neueId() }) : m) : maengel;

  // Protokoll prüfen (die übrigen Felder prüft die Prüfung der Aufträge)
  const protIds = new Set();
  const eintraege = protokoll.map((p, i) => {
    const wo = "Wartungsprotokoll Nr. " + (i + 1);
    if (!istGueltigesDatum(p.datum)) fehler(wo + ": Datum ist ungültig (Format JJJJ-MM-TT).");
    if (!artVon(p.wartungsartId)) fehler(wo + " (" + datumText(p.datum) + "): unbekannte wartungsartId „" + p.wartungsartId + "“.");
    const id = typeof p.id === "string" && p.id ? p.id : neueId();
    if (protIds.has(id)) fehler(wo + ": id „" + id + "“ kommt doppelt vor.");
    protIds.add(id);
    const ks = p.kmStand ?? null;
    const manuell = p.kmManuell === undefined ? ks !== null : p.kmManuell;
    return Object.assign({}, p, { id, kmStand: ks, kmManuell: manuell, art: artVon(p.wartungsartId) });
  });
  if (Array.isArray(mangelListe)) mangelListe.forEach((m, i) => {
    if (!istObjekt(m)) return;
    const pid = m.protokollId ?? null;
    if (pid !== null && !protIds.has(pid)) fehler("Mangel Nr. " + (i + 1) + (istGueltigesDatum(m.datum) ? " (" + datumText(m.datum) + ")" : "") + ": unbekannte protokollId „" + pid + "“.");
  });

  const auftraege = [];
  const neuerAuftrag = (id, art, felder) => {
    const a = Object.assign({ id, wartungsartId: art.id, status: "erledigt", termin: null, werkstatt: "", datum: null, kmStand: null, kmManuell: false,
      notiz: "", positionen: [], ausgeschlossen: [] }, felder);
    auftraege.push(a);
    return a;
  };
  // Erledigte Mängel eines Protokolleintrags als Positionen
  const maengelDazu = (auftrag, pid) => {
    if (!Array.isArray(mangelListe)) return;
    mangelListe.filter(m => istObjekt(m) && m.protokollId === pid && m.status === "erledigt")
      .forEach(m => auftrag.positionen.push({ id: "pos-" + m.id, art: "mangel", mangelId: m.id, status: "erledigt", notiz: "" }));
  };
  // Aufträge zuerst, damit Aufgaben vom selben Datum dazukommen
  const ausAuftraegen = [];
  eintraege.filter(p => p.art.typ === "auftrag").forEach(p => {
    const a = neuerAuftrag(p.id, p.art, { werkstatt: p.werkstatt, datum: p.datum, kmStand: p.kmStand, kmManuell: p.kmManuell, notiz: p.notiz });
    ausAuftraegen.push(a);
    maengelDazu(a, p.id);
  });
  const reparaturen = []; // erledigte Reparaturen aus Aufgaben
  const gleicherKm = (a, p) => a.datum === p.datum && a.kmManuell === p.kmManuell && (!p.kmManuell || a.kmStand === p.kmStand);
  eintraege.filter(p => p.art.typ === "aufgabe").forEach(p => {
    let ziel = ausAuftraegen.find(a => gleicherKm(a, p)) || reparaturen.find(a => gleicherKm(a, p)) || null;
    const zusatz = [];
    if (!ziel) {
      ziel = neuerAuftrag(p.id, reparatur, { werkstatt: p.werkstatt, datum: p.datum, kmStand: p.kmStand, kmManuell: p.kmManuell, notiz: "" });
      reparaturen.push(ziel);
    } else {
      const w = typeof p.werkstatt === "string" ? p.werkstatt.trim() : "";
      if (w && w !== (typeof ziel.werkstatt === "string" ? ziel.werkstatt.trim() : "")) zusatz.push("Werkstatt: " + w);
    }
    const notiz = typeof p.notiz === "string" ? p.notiz : "";
    ziel.positionen.push({ id: "pos-" + p.id, art: "aufgabe", wartungsartId: p.art.id, status: "erledigt",
      notiz: [notiz, ...zusatz].filter(Boolean).join("\n") });
    maengelDazu(ziel, p.id);
  });

  // Termine
  const terminArten = new Set();
  const geplante = [];
  termine.forEach((t, i) => {
    const wo = "Termin Nr. " + (i + 1);
    const art = artVon(t.wartungsartId);
    if (!art) fehler(wo + ": unbekannte wartungsartId „" + t.wartungsartId + "“.");
    if (terminArten.has(t.wartungsartId)) fehler(wo + ": pro Wartungsart ist nur ein geplanter Termin erlaubt.");
    terminArten.add(t.wartungsartId);
    if (!istGueltigesDatum(t.datum)) fehler(wo + ": Datum ist ungültig (Format JJJJ-MM-TT).");
    geplante.push({ t, art });
  });
  const geplant = (id, art, t) => neuerAuftrag(id, art, { status: "geplant", termin: t.datum, werkstatt: t.werkstatt });
  geplante.filter(x => x.art.typ === "auftrag").forEach(x => geplant("termin-" + x.art.id, x.art, x.t));
  geplante.filter(x => x.art.typ === "aufgabe").forEach(({ t, art }) => {
    const offen = auftraege.filter(a => a.status === "geplant");
    let ziel = offen.find(a => a.termin === t.datum && istInspektion(artVon(a.wartungsartId)));
    if (!ziel) {
      const jahr = Number(t.datum.slice(0, 4));
      const fenster = arten.find(a => istInspektion(a) && (a.fensterVon ?? null) !== null && Number.isInteger(a.fensterVon) && Number.isInteger(a.fensterBis) &&
        t.datum >= monatsanfang(jahr, a.fensterVon) && t.datum <= monatsende(jahr, a.fensterBis) && !offen.some(o => o.wartungsartId === a.id));
      ziel = geplant("termin-" + (fenster || art).id, fenster || reparatur, t);
    }
    ziel.positionen.push({ id: "pos-termin-" + art.id, art: "aufgabe", wartungsartId: art.id, status: "offen", notiz: "" });
  });

  // Erledigte Aufträge in der Reihenfolge des Protokolls, danach die geplanten
  const stelle = new Map(eintraege.map((p, i) => [p.id, i]));
  auftraege.sort((a, b) => (a.status === "geplant") - (b.status === "geplant") ||
    (a.status === "erledigt" ? stelle.get(a.id) - stelle.get(b.id) : 0));
  const ohneVerknuepfung = Array.isArray(mangelListe)
    ? mangelListe.map(m => { if (!istObjekt(m)) return m; const { protokollId, ...rest } = m; return rest; })
    : mangelListe;
  return { wartungsarten: arten, auftraege, maengel: ohneVerknuepfung };
}

// Kleidungsregeln aus Version 5: Sind die Stufen (ohne die Verschiebungen aus
// Rückmeldungen) noch die Standardwerte aus 4b, kommen die neuen Standardstufen;
// die Verschiebungen gehörten zur alten Kleidung und entfallen. Sonst bleibt
// jede Stufe mit ihrer id; ihr Text kommt nach Oberkörper, die Verschiebung in
// die Grenze (die wirksame Grenze bleibt gleich). Beim Regenzusatz ebenso.
function kleidungAusVersion5(k) {
  const std = standardKleidung();
  const ohneKorrektur = liste => liste.map(s => istObjekt(s) ? { id: s.id, ab: s.ab, text: s.text } : s);
  const neu = {};
  if (k.stufen !== undefined) {
    if (Array.isArray(k.stufen) && gleicherInhalt(ohneKorrektur(k.stufen), ohneKorrektur(KLEIDUNG_VERSION_5.stufen))) neu.stufen = std.stufen;
    else if (Array.isArray(k.stufen)) neu.stufen = k.stufen.map((s, i) => {
      if (!istObjekt(s)) return s;

      if (!(Number.isInteger(korrektur) && Math.abs(korrektur) <= 5)) throw new Error("Wetter, Kleidung, Stufe " + (i + 1) + ": korrektur muss eine ganze Zahl von -5 bis 5 sein.");
      return { id: s.id, ab: istEndlich(s.ab) ? s.ab + korrektur : s.ab, bereiche: { oberkoerper: s.text }, haendeBeiRegen: null };
    });
    else neu.stufen = k.stufen;
  }
  if (k.regen !== undefined) {
    if (Array.isArray(k.regen) && gleicherInhalt(k.regen, KLEIDUNG_VERSION_5.regen)) neu.regen = std.regen;
    else if (Array.isArray(k.regen)) neu.regen = k.regen.map(r => istObjekt(r) ? { ab: r.ab, bereiche: { oberkoerper: r.text } } : r);
    else neu.regen = k.regen;
  }
