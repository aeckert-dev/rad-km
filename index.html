    (mitKnoepfen ? '<div class="knopfreihe">' +
      '<button type="button" data-action="mangel-zuordnen" data-id="' + m.id + '">Zu Auftrag …</button>' +
      (rep ? '<button type="button" data-action="mangel-auftrag-neu" data-id="' + m.id + '" data-art="' + esc(rep.id) + '">' + esc(rep.name) + ' anlegen</button>' : "") +
      '</div>' : "") + '</div>';
}

// ---------- Offener Auftrag: Ansicht mit Positionen ----------
function auftragAnsicht(key) {
  const erledigt = daten.auftraege.find(a => a.id === key && a.status === "erledigt");
  if (erledigt) { erledigterAuftragAnsicht(erledigt); return; }
  const lage = werkstattLage();
  const o = offenerVon(key, lage);
  if (!o) { fensterSchliessen(); return; }
  const k = esc(key);
  const andere = lage.offene.filter(x => x !== o);
  const zeilen = o.positionen.map(p => {
    const pk = p.art === "aufgabe" ? "aufgabe:" + p.wartungsartId : "mangel:" + p.mangelId;
    return '<div class="position-zeile">' + positionHtml(p, lage) + '<div class="knopfreihe">' +
      (andere.length ? '<button type="button" data-action="position-verschieben" data-key="' + k + '" data-pos="' + esc(pk) + '">Verschieben …</button>' : "") +
      '<button type="button" data-action="position-entfernen" data-key="' + k + '" data-pos="' + esc(pk) + '">Entfernen</button></div></div>';
  }).join("");
  const imAuftrag = new Set(o.positionen.map(p => p.art === "aufgabe" ? p.wartungsartId : p.mangelId));
  const aufgabenWahl = lage.aufgaben.filter(x => !imAuftrag.has(x.art.id));
  const maengelWahl = offeneMaengel().filter(m => !imAuftrag.has(m.id));
  fensterOeffnen(
    '<h2>' + esc(o.art.name) + '</h2>' +
    '<div class="' + o.klasse + '">' + esc(o.text) + '</div>' +
    (o.regel && o.termin && o.regel.datum ? '<div class="klein">Ohne Termin: ' + esc(o.regel.text) + '</div>' : "") +
    (o.auftrag.notiz ? '<div class="klein umbrueche">' + esc(o.auftrag.notiz) + '</div>' : "") +
    '<h3>Positionen</h3>' + (zeilen || '<div class="klein">Noch keine Positionen.</div>') +
    o.vorschlaege.map(x => vorschlagHtml(x, o)).join("") +
    (aufgabenWahl.length ? '<label for="ap-aufgabe">Aufgabe hinzufügen</label><div class="suchzeile"><select id="ap-aufgabe">' +
      aufgabenWahl.map(x => '<option value="' + esc(x.art.id) + '">' + esc(x.art.name) + ' – ' + esc(aufgabeKurz(x.st)) +
        (x.offen ? " (jetzt: " + esc(x.offen.art.name) + ")" : "") + '</option>').join("") +
      '</select><button type="button" data-action="position-aufgabe-dazu" data-key="' + k + '">Hinzufügen</button></div>' : "") +
    (maengelWahl.length ? '<label for="ap-mangel">Mangel hinzufügen</label><div class="suchzeile"><select id="ap-mangel">' +
      maengelWahl.map(m => { const in_ = lage.mangelAuftrag(m.id); return '<option value="' + esc(m.id) + '">' + esc(m.beschreibung) +
        (in_ ? " (jetzt: " + esc(in_.art.name) + ")" : "") + '</option>'; }).join("") +
      '</select><button type="button" data-action="position-mangel-dazu" data-key="' + k + '">Hinzufügen</button></div>' : "") +
    '<div class="knopfreihe"><button type="button" data-action="fenster-zu">Schließen</button>' +
    '<button type="button" data-action="auftrag-termin" data-key="' + k + '">' + (o.termin ? "Termin ändern" : "Termin planen") + '</button>' +
    '<button type="button" class="primaer" data-action="auftrag-erledigen" data-key="' + k + '">Erledigt eintragen</button></div>' +
    (o.auftrag.id ? '<div class="knopfreihe"><button type="button" class="gefahr voll" data-action="auftrag-loeschen" data-key="' + k + '">Auftrag löschen</button></div>' : "")
  );
}

// Aufgabe in einen offenen Auftrag nehmen (aus einem anderen geplanten Auftrag verschoben)
function aufgabeZuAuftrag(key, aufgabeId) {
  if (!istAufgabe(artVon(aufgabeId))) return null;
  const ziel = auftragFestlegen(key);
  if (!ziel) return null;
  daten.auftraege.filter(a => a.status === "geplant" && a !== ziel).forEach(a => {
    a.positionen = a.positionen.filter(p => !(p.art === "aufgabe" && p.wartungsartId === aufgabeId));
  });
  ziel.ausgeschlossen = ziel.ausgeschlossen.filter(id => id !== aufgabeId);
  if (!ziel.positionen.some(p => p.art === "aufgabe" && p.wartungsartId === aufgabeId)) {
    ziel.positionen.push({ id: neueId(), art: "aufgabe", wartungsartId: aufgabeId, status: "offen", notiz: "" });
  }
  return ziel;
}
// Mangel in einen offenen Auftrag nehmen (aus einem anderen geplanten Auftrag verschoben)
function mangelZuAuftrag(key, mangelId) {
  if (!daten.maengel.some(m => m.id === mangelId && m.status === "offen")) return null;
  const ziel = auftragFestlegen(key);
  if (!ziel) return null;
  daten.auftraege.filter(a => a.status === "geplant" && a !== ziel).forEach(a => {
    a.positionen = a.positionen.filter(p => !(p.art === "mangel" && p.mangelId === mangelId));
  });
  if (!ziel.positionen.some(p => p.art === "mangel" && p.mangelId === mangelId)) {
    ziel.positionen.push({ id: neueId(), art: "mangel", mangelId, status: "offen", notiz: "" });
  }
  return ziel;
}
// Position aus einem offenen Auftrag entfernen. Eine Aufgabe wird dort
// ausgeschlossen, damit die Standard-Zuordnung sie nicht wieder hineinnimmt.
function positionEntfernen(key, pos) {
  const [art, id] = [pos.slice(0, pos.indexOf(":")), pos.slice(pos.indexOf(":") + 1)];
  const a = auftragFestlegen(key);
  if (!a) return null;
  a.positionen = a.positionen.filter(p => !(p.art === art && (art === "aufgabe" ? p.wartungsartId : p.mangelId) === id));
  if (art === "aufgabe" && !a.ausgeschlossen.includes(id)) a.ausgeschlossen.push(id);
  return a;
}
// Nach einer Änderung an einem offenen Auftrag: speichern und die Ansicht neu zeigen
function auftragGeaendert(a, text) {
  if (!speichern()) return;
  zeichnen();
  if (a && fenster.open) auftragAnsicht(a.id);
  if (text) meldung(text);
}

// Auswahl eines Ziel-Auftrags (Verschieben, Mangel zuordnen, Aufgabe zuordnen)
function zielAuswahl(titel, text, ziele, aktion, daten_) {
  fensterOeffnen('<h2>' + titel + '</h2><p>' + text + '</p>' +
    (ziele.length ? '<div class="liste">' + ziele.map(o => '<div class="zeile"><button type="button" class="inhalt" data-action="' + aktion + '" data-ziel="' +
      esc(auftragKey(o)) + '"' + Object.entries(daten_).map(([k, v]) => ' data-' + k + '="' + esc(v) + '"').join("") + '>' +
      '<div class="text"><div>' + esc(o.art.name) + '</div><div class="klein umbrechen">' + esc(o.text) + ' · ' + positionenText(o.positionen.length) + '</div></div>' +
      '<span class="klein" style="padding-right:16px">›</span></button></div>').join("") + '</div>' : '<p class="klein">Kein anderer offener Auftrag.</p>') +
    '<div class="knopfreihe"><button type="button" data-action="fenster-zu">Abbrechen</button></div>');
}
function positionVerschiebenWahl(key, pos) {
  const lage = werkstattLage();
  zielAuswahl("Position verschieben", "In welchen Auftrag?", lage.offene.filter(o => auftragKey(o) !== key), "position-verschieben-ziel", { key, pos });
}
function positionVerschieben(key, pos, zielKey) {
  const [art, id] = [pos.slice(0, pos.indexOf(":")), pos.slice(pos.indexOf(":") + 1)];
  positionEntfernen(key, pos);
  const ziel = art === "aufgabe" ? aufgabeZuAuftrag(zielKey, id) : mangelZuAuftrag(zielKey, id);
  auftragGeaendert(ziel, "Position verschoben");
}

// ---------- Termin eines offenen Auftrags ----------
function auftragTerminFormular(key) {
  const neu = key.startsWith("anlegen:");
  const o = neu ? null : offenerVon(key);
  const art = neu ? artVon(key.slice(8)) : o && o.art;
  if (!art) return;
  const a = o ? o.auftrag : { termin: null, werkstatt: "", notiz: "" };
  fensterOeffnen(
    '<h2>' + (neu ? "Neuer Auftrag: " : "Termin: ") + esc(art.name) + '</h2>' +
    '<label for="t-datum">Termin' + (neu ? " (optional)" : "") + '</label><input type="date" id="t-datum" value="' + (a.termin || "") + '">' +
    '<label for="t-werkstatt">Werkstatt</label><input type="text" id="t-werkstatt" value="' + esc(a.werkstatt) + '">' +
    '<label for="t-notiz">Notiz</label><textarea id="t-notiz">' + esc(a.notiz) + '</textarea>' +
    '<div class="knopfreihe"><button type="button" data-action="fenster-zu">Abbrechen</button>' +
    '<button type="button" class="primaer" data-action="auftrag-termin-speichern" data-key="' + esc(key) + '">' + (neu ? "Anlegen" : "Speichern") + '</button></div>' +
    (a.termin ? '<div class="knopfreihe"><button type="button" class="gefahr voll" data-action="auftrag-termin-entfernen" data-key="' + esc(key) + '">Termin entfernen</button></div>' : "")
  );
}
function auftragTerminSpeichern(key) {
  const datum = wert("t-datum");
  if (datum !== "" && !istGueltigesDatum(datum)) { alert("Bitte ein gültiges Datum wählen."); return; }
  if (!key.startsWith("anlegen:") && datum === "") { alert("Bitte ein Datum wählen. Ohne Termin: „Termin entfernen“."); return; }
  const a = auftragFestlegen(key);
  if (!a) return;
  Object.assign(a, { termin: datum || null, werkstatt: wert("t-werkstatt").trim(), notiz: wert("t-notiz").trim() });
  if (!speichern()) return;
  zeichnen();
  if (key.startsWith("anlegen:")) { auftragAnsicht(a.id); meldung(artName(a.wartungsartId) + " angelegt"); }
  else { fensterSchliessen(); meldung("Termin gespeichert"); }
}
async function auftragTerminEntfernen(key) {
  if (!await frage("Termin wirklich entfernen?", "Entfernen", "Abbrechen", true)) return;
  const a = auftragFestlegen(key);
  if (!a) return;
  a.termin = null;
  if (speichern()) { fensterSchliessen(); zeichnen(); }
}
async function auftragLoeschen(key) {
  const a = daten.auftraege.find(x => x.id === key && x.status === "geplant");
  if (!a) return;
  const m = a.positionen.filter(p => p.art === "mangel").length;
  if (!await frage("Geplanten Auftrag „" + esc(artName(a.wartungsartId)) + "“ wirklich löschen?" +
    (m ? "<br><br>" + (m === 1 ? "Der Mangel steht" : "Die " + m + " Mängel stehen") + " danach wieder ohne Auftrag oben im Reiter Wartung." : ""),
    "Löschen", "Abbrechen", true)) return;
  mitRueckgaengig(() => { daten.auftraege = daten.auftraege.filter(x => x !== a); }, "Auftrag gelöscht");
}

// ---------- Erledigt eintragen (Abschluss) und erledigte Aufträge ----------

// Zustand des Abschluss-Formulars: { key (offener Auftrag) | id (erledigter Auftrag) |
// artId + aufgabeId (Eigenleistung zu einer Aufgabe), manuell, positionen }.
// "positionen" ist genau der beim Öffnen angezeigte Stand (auch die nach der
// Standard-Zuordnung berechneten); so wird er gespeichert.
let formAuftrag = null;

function auftragErledigen(key) {
  const o = offenerVon(key);
  if (!o) return;
  const t = o.termin;
  abschlussFormular({ key, art: o.art, datum: t && t <= heute() ? t : heute(), werkstatt: o.auftrag.werkstatt, kmStand: null, kmManuell: false,
    notiz: o.auftrag.notiz, positionen: o.positionen.map(p => ({ id: p.id, art: p.art, wartungsartId: p.wartungsartId, mangelId: p.mangelId, notiz: p.notiz, status: "erledigt" })) });
}
// "Erledigt eintragen" an einer Aufgabe: eine erledigte Eigenleistung mit dieser Position
function aufgabeErledigen(aufgabeId) {
  const art = eigenleistungArt();
  if (!art) { alert("Bitte zuerst eine Wartungsart „Eigenleistung“ (Auftrag ohne Intervall) anlegen."); return; }
  abschlussFormular({ artId: art.id, art, datum: heute(), werkstatt: "", kmStand: null, kmManuell: false, notiz: "",
    positionen: [{ id: null, art: "aufgabe", wartungsartId: aufgabeId, notiz: "", status: "erledigt" }] });
}
function erledigterAuftragAendern(id) {
  const a = daten.auftraege.find(a => a.id === id && a.status === "erledigt");
  if (!a) return;
  abschlussFormular({ id, art: artVon(a.wartungsartId), datum: a.datum, werkstatt: a.werkstatt, kmStand: a.kmStand, kmManuell: a.kmManuell, notiz: a.notiz,
    positionen: a.positionen.map(p => Object.assign({}, p)) });
}

function abschlussFormular(f) {
  formAuftrag = { key: f.key || null, id: f.id || null, artId: f.artId || null, manuell: f.kmManuell, positionen: f.positionen };
  const name = p => p.art === "aufgabe" ? esc(artName(p.wartungsartId))
    : esc((daten.maengel.find(m => m.id === p.mangelId) || { beschreibung: "(unbekannt)" }).beschreibung);
  const imAuftrag = new Set(f.positionen.filter(p => p.art === "mangel").map(p => p.mangelId));
  // Mangel, der schon mit einem anderen Auftrag erledigt wurde, lässt sich hier nicht abhaken
  const gesperrt = p => p.art === "mangel" && p.status !== "erledigt" &&
    (daten.maengel.find(m => m.id === p.mangelId) || {}).status === "erledigt";
  const weitere = offeneMaengel().filter(m => !imAuftrag.has(m.id));
  fensterOeffnen(
    '<h2>' + (f.id ? "Auftrag bearbeiten: " : "Erledigt: ") + esc(f.art.name) + '</h2>' +
    '<label for="p-datum">Datum</label><input type="date" id="p-datum" value="' + f.datum + '" data-change="protokoll-datum">' +
    '<label for="p-werkstatt">Werkstatt</label><input type="text" id="p-werkstatt" value="' + esc(f.werkstatt) + '">' +
    '<label for="p-km">Kilometerstand</label>' +
    '<input type="text" id="p-km" inputmode="decimal" autocomplete="off" data-input="protokoll-km">' +
    '<div class="feldhinweis" id="p-km-hinweis"></div>' +
    '<label for="p-notiz">Durchgeführte Arbeiten / Notiz</label><textarea id="p-notiz">' + esc(f.notiz) + '</textarea>' +
    (f.positionen.length ? '<label>Positionen: erledigt abhaken (nicht abgehakt = nicht gemacht)</label>' + f.positionen.map((p, i) =>
      '<label class="haken"><input type="checkbox" name="p-position" value="' + i + '"' + (p.status === "erledigt" ? " checked" : "") + (gesperrt(p) ? " disabled" : "") + '>' +
      '<span>' + (p.art === "aufgabe" ? "🔧 " : "⚠️ ") + name(p) + (p.notiz ? ' <span class="klein">(' + esc(p.notiz) + ')</span>' : "") + '</span></label>').join("")
      : '<div class="feldhinweis">Keine Positionen.</div>') +
    (weitere.length ? '<label>Weitere offene Mängel, die dabei erledigt wurden</label>' + weitere.map(m =>
      '<label class="haken"><input type="checkbox" name="p-mangel" value="' + m.id + '">' +
      '<span>' + esc(m.beschreibung) + ' <span class="klein">(' + datumText(m.datum) + ')</span></span></label>').join("") : "") +
    '<div class="knopfreihe">' +
    (f.id ? '<button type="button" data-action="auftrag-ansehen" data-key="' + esc(f.id) + '">Abbrechen</button>'
          : '<button type="button" data-action="fenster-zu">Abbrechen</button>') +
    '<button type="button" class="primaer" data-action="abschluss-speichern">Speichern</button></div>' +
    (f.id ? '<div class="knopfreihe"><button type="button" class="gefahr voll" data-action="erledigt-loeschen" data-id="' + esc(f.id) + '">Auftrag löschen</button></div>' : "")
  );
  document.getElementById("p-km").value = f.kmManuell ? kmFeld(f.kmStand) : kmFeld(kmStandAm(f.datum));
  protokollKmHinweis();
}

function protokollKmHinweis() {
  const d = wert("p-datum");
  const berechnet = istGueltigesDatum(d) ? kmStandAm(d) : null;
  const el = document.getElementById("p-km-hinweis");
  if (formAuftrag.manuell) {
    el.innerHTML = "Von Hand eingetragen. Berechnet wären: " + kmText(berechnet) + " km " +
      '<button type="button" class="leise" data-action="protokoll-km-neu">Berechneten Wert verwenden</button>';
  } else if (berechnet === null) {
    el.textContent = "Kann nicht berechnet werden (kein Fahrrad angelegt oder Datum vor dem Startdatum). Du kannst den Wert von Hand eintragen.";
  } else {
    el.textContent = "Automatisch berechnet aus den Einträgen bis einschließlich diesem Datum. Du kannst den Wert überschreiben.";
  }
}
function protokollDatumGeaendert() {
  if (!formAuftrag.manuell) {
    const d = wert("p-datum");
    document.getElementById("p-km").value = istGueltigesDatum(d) ? kmFeld(kmStandAm(d)) : "";
  }
  protokollKmHinweis();
}
function protokollKmEingabe() {
  if (!formAuftrag.manuell) { formAuftrag.manuell = true; protokollKmHinweis(); }
}
function protokollKmNeu() {
  formAuftrag.manuell = false;
  protokollDatumGeaendert();
}

// Mangel als erledigt bzw. wieder offen markieren
function mangelErledigen(id, datum) { Object.assign(daten.maengel.find(m => m.id === id), { status: "erledigt", erledigtAm: datum }); }
function mangelWiederOeffnen(id) { Object.assign(daten.maengel.find(m => m.id === id), { status: "offen", erledigtAm: null }); }

function abschlussSpeichern() {
  const datum = wert("p-datum");
  if (!istGueltigesDatum(datum)) { alert("Bitte ein gültiges Datum wählen."); return; }
  const kmEingabe = wert("p-km").trim();
  const manuell = formAuftrag.manuell && kmEingabe !== "";
  let kmStand = null;
  if (manuell) {
    kmStand = kmLesen(kmEingabe);
    if (kmStand === null) { alert("Bitte den Kilometerstand als Zahl eingeben, z. B. 1234,5."); return; }
  }
  const abgehakt = new Set([...document.querySelectorAll('input[name="p-position"]:checked')].map(el => Number(el.value)));
  const weitere = [...document.querySelectorAll('input[name="p-mangel"]:checked')].map(el => el.value);
  const vorher = formAuftrag.id ? daten.auftraege.find(a => a.id === formAuftrag.id) : null;
  const vorherErledigt = new Set(vorher ? vorher.positionen.filter(p => p.art === "mangel" && p.status === "erledigt").map(p => p.mangelId) : []);
  const positionen = formAuftrag.positionen.map((p, i) => {
    const pos = { id: p.id || neueId(), art: p.art, status: abgehakt.has(i) ? "erledigt" : "nicht-gemacht", notiz: p.notiz || "" };
    if (p.art === "aufgabe") pos.wartungsartId = p.wartungsartId; else pos.mangelId = p.mangelId;
    return pos;
  }).concat(weitere.map(id => ({ id: neueId(), art: "mangel", mangelId: id, status: "erledigt", notiz: "" })));
  const satz = { status: "erledigt", termin: null, werkstatt: wert("p-werkstatt").trim(), datum, kmStand, kmManuell: manuell,
    notiz: wert("p-notiz").trim(), positionen, ausgeschlossen: [] };

  let auftrag;
  if (vorher) {
    auftrag = Object.assign(vorher, satz);
  } else if (formAuftrag.key && daten.auftraege.some(a => a.id === formAuftrag.key && a.status === "geplant")) {
    auftrag = Object.assign(daten.auftraege.find(a => a.id === formAuftrag.key), satz);
  } else {
    const artId = formAuftrag.artId || formAuftrag.key.slice(4);
    auftrag = Object.assign({ id: neueId(), wartungsartId: artId }, satz);
    daten.auftraege.push(auftrag);
  }
  // Mängel: erledigte Positionen schließen, abgewählte wieder öffnen
  positionen.filter(p => p.art === "mangel").forEach(p => {
    if (p.status === "erledigt") mangelErledigen(p.mangelId, datum);
    else if (vorherErledigt.has(p.mangelId)) mangelWiederOeffnen(p.mangelId);
  });
  // Erledigte Aufgaben und Mängel stehen in keinem anderen geplanten Auftrag mehr
  const fertig = new Set(positionen.filter(p => p.status === "erledigt").map(p => p.art + ":" + (p.wartungsartId || p.mangelId)));
  daten.auftraege.filter(a => a.status === "geplant").forEach(a => {
    a.positionen = a.positionen.filter(p => !fertig.has(p.art + ":" + (p.wartungsartId || p.mangelId)));
  });
  if (speichern()) {
    fensterSchliessen(); zeichnen();
    const n = positionen.filter(p => p.status === "erledigt").length;
    meldung(vorher ? "Auftrag gespeichert" : "Erledigt eingetragen" + (n ? ", " + positionenText(n) + " erledigt" : ""));
  }
}

function erledigterAuftragAnsicht(a) {
  const pos = st => a.positionen.filter(p => p.status === st).map(p => {
    const name = p.art === "aufgabe" ? artName(p.wartungsartId) : (daten.maengel.find(m => m.id === p.mangelId) || { beschreibung: "(unbekannt)" }).beschreibung;
    return (st === "erledigt" ? "✓ " : "– ") + (p.art === "mangel" ? "Mangel: " : "") + esc(name) + (p.notiz ? ' <span class="klein umbrueche">(' + esc(p.notiz) + ')</span>' : "");
  }).join("<br>");
  fensterOeffnen(
    '<h2>' + esc(artName(a.wartungsartId)) + '</h2>' +
    detailListe([
      ["Datum", wochentag(a.datum) + ", " + datumText(a.datum)],
      ["Werkstatt", esc(a.werkstatt)],
      ["Kilometerstand", a.kmStand === null ? "–" : kmText(a.kmStand) + " km" + (a.kmManuell ? " (von Hand eingetragen)" : " (berechnet)")],

function mangelSpeichern(id) {
  const datum = wert("m-datum");
  const beschreibung = wert("m-text").trim();
  const status = wert("m-status");
  if (!istGueltigesDatum(datum)) { alert("Bitte ein gültiges Datum wählen."); return; }
  if (!beschreibung) { alert("Bitte den Mangel beschreiben."); return; }
  let erledigtAm = null;
  if (status === "erledigt") {
    erledigtAm = wert("m-am");
    if (!istGueltigesDatum(erledigtAm)) { alert("Bitte ein gültiges Erledigt-Datum wählen."); return; }
  }
  const m = id ? daten.maengel.find(m => m.id === id) : null;
  if (m) {
    Object.assign(m, { datum, beschreibung, status, erledigtAm });
    daten.auftraege.forEach(a => {
      // Von Hand erledigt: aus geplanten Aufträgen entfernen; wieder geöffnet: dort „nicht gemacht“
      if (status === "erledigt" && a.status === "geplant") a.positionen = a.positionen.filter(p => !(p.art === "mangel" && p.mangelId === id));
      if (status === "offen" && a.status === "erledigt") a.positionen.forEach(p => { if (p.art === "mangel" && p.mangelId === id) p.status = "nicht-gemacht"; });
    });
  } else {
    daten.maengel.push({ id: neueId(), datum, beschreibung, status, erledigtAm });
  }
  if (speichern()) { fensterSchliessen(); zeichnen(); meldung("Mangel gespeichert"); }
}

}

function artSpeichern(id) {
  const name = wert("a-name").trim();
  if (!name) { alert("Bitte einen Namen eingeben."); return; }
  const typ = wert("a-typ");
  const aufgabe = typ === "aufgabe";
  const von = !aufgabe && wert("a-von") ? Number(wert("a-von")) : null;
  const bis = !aufgabe && wert("a-bis") ? Number(wert("a-bis")) : null;
  const einmalig = !aufgabe && document.getElementById("a-einmalig").checked;
  if ((von === null) !== (bis === null)) { alert("Für das Zeitfenster bitte beide Monate wählen (oder beide leer lassen)."); return; }
  if (einmalig && von !== null) { alert("Eine einmalige Wartung kann kein jährliches Zeitfenster haben. Bitte das Zeitfenster leeren oder „Einmalig“ abwählen."); return; }
  if (von !== null && von > bis) { alert("Das Zeitfenster darf nicht über den Jahreswechsel gehen: „Monat von“ muss vor oder gleich „Monat bis“ sein."); return; }
  let ab = null;
  if (von !== null) {
    const abText = wert("a-ab").trim();
    ab = abText === "" ? null : Number(abText);
    if (ab !== null && !(Number.isInteger(ab) && ab >= 1900 && ab <= 9999)) { alert("„Gültig ab Jahr“ muss eine Jahreszahl sein, z. B. 2027 (oder leer)."); return; }
  }
  const mText = wert("a-monate").trim();
  const monate = mText === "" ? null : Number(mText);
  if (monate !== null && !(Number.isInteger(monate) && monate >= 1)) { alert("Das Intervall in Monaten muss eine ganze Zahl ab 1 sein (oder leer)."); return; }
  const kText = wert("a-km").trim();
  const km = kText === "" ? null : kmLesen(kText);
  if (kText !== "" && !(km > 0)) { alert("Das Intervall in km muss eine Zahl größer 0 sein (oder leer)."); return; }
  const vorher = id ? daten.wartungsarten.find(a => a.id === id) : null;
  if (vorher && vorher.typ !== typ) {
    const verwendet = artVerwendung(id);
    if (verwendet) { alert("Die Art lässt sich nicht ändern, weil die Wartungsart " + verwendet + " wird."); return; }
    const ziele = daten.wartungsarten.filter(a => a.zuordnung === id);
    if (ziele.length) {
      alert("Die Art lässt sich nicht ändern, weil „" + name + "“ Standard-Zuordnung dieser Aufgaben ist: " + ziele.map(a => a.name).join(", ") + ". Bitte dort zuerst eine andere Zuordnung wählen.");
      return;
    }
  }
  const satz = { name, typ, intervallMonate: monate, intervallKm: km, fensterVon: von, fensterBis: bis, gueltigAbJahr: ab, einmalig,
    bauteil: aufgabe ? wert("a-bauteil").trim() || null : null, zuordnung: aufgabe ? wert("a-zuordnung") : null };
  // Ein Auftrag mit Fälligkeit hat höchstens einen geplanten Auftrag
  if (vorher && hatFaelligkeit(satz) && daten.auftraege.filter(a => a.status === "geplant" && a.wartungsartId === id).length > 1) {
    alert("Es gibt mehrere geplante Aufträge dieser Art. Ein Intervall, Zeitfenster oder „einmalig“ ist erst möglich, wenn höchstens einer geplant ist.");
    return;
  }
  if (vorher) {
    Object.assign(vorher, satz);
    if (!aufgabe) daten.auftraege.forEach(a => { a.ausgeschlossen = a.ausgeschlossen.filter(x => x !== id); });
  } else {
    daten.wartungsarten.push(Object.assign({ id: neueId() }, satz));
  }
  if (!speichern()) return;
  zeichnen();
  if (artAusPruefung) pruefungAnsicht(); else fensterSchliessen();
}
async function artLoeschen(id) {
  const verwendet = artVerwendung(id);
  if (verwendet) {
    alert("Diese Wartungsart wird " + verwendet + " und kann deshalb nicht gelöscht werden. Du kannst sie aber umbenennen.");
    return;
  }
  const ziele = daten.wartungsarten.filter(a => a.zuordnung === id);
  if (!await frage("Wartungsart „" + esc(artName(id)) + "“ wirklich löschen?" +
    (ziele.length ? "<br><br>Diese Aufgaben bekommen die Standard-Zuordnung „nächste Inspektion“: " + ziele.map(a => esc(a.name)).join(", ") : ""),
    "Löschen", "Abbrechen", true)) return;
  daten.wartungsarten = daten.wartungsarten.filter(a => a.id !== id);
  ziele.forEach(a => { a.zuordnung = NAECHSTE_INSPEKTION; });
  daten.auftraege.forEach(a => { a.ausgeschlossen = a.ausgeschlossen.filter(x => x !== id); });
  if (speichern()) { zeichnen(); if (artAusPruefung) pruefungAnsicht(); else fensterSchliessen(); }
}

  }).join("");

    'an denen auf einer der Fahrten mindestens 0,1 mm Niederschlag fiel. <strong>Tage unter 0 °C:</strong> auf einer der Fahrten. ' +
    '<strong>Ampel:</strong> je Fahrt aus den Wetterwerten, ohne amtliche Warnungen.</p>' +

    '(ab 2022, für die aktuellen Wohn- und Arbeitsorte und Wegpunkte). Vorher fragt die App nach.</p></div>';
}

let rueckblickLaeuft = false;
// "Wetter nachtragen": Rückblick für vergangene Fahrten zur Arbeit, mit Rückfrage und "Rückgängig".
// Empfohlene Kleidung und Rückmeldung bleiben (die Auswertung der Rückmeldungen beruht darauf).
async function wetterNachtragen(jetzt = Date.now()) {
  if (rueckblickLaeuft) return;
  const orte = arbeitswegOrte();
  if (!orte.length) { alert("Bitte zuerst unter Einstellungen → Wetter Wohn- und Arbeitsort festlegen."); return; }
  const h = isoAusDate(new Date(jetzt));
  const liste = rueckblickKandidaten(h);
  if (!liste.length) { meldung("Alle vergangenen Fahrten zur Arbeit haben schon Wetter aus dem Rückblick"); return; }
  const n = liste.length;
  const zeitraum = (von, bis) => von === bis ? datumText(von) : datumText(von) + "–" + datumText(bis);
  // Datum je Eintrag jetzt merken: wird ein Eintrag während des Abrufs geändert, bleibt er, wie er ist
  const plan = rueckblickAbschnitte(liste).map(ab => ({ von: ab.von, bis: ab.bis, eintraege: ab.eintraege.map(e => ({ id: e.id, datum: e.datum })) }));
  if (!await frage("Für " + (n === 1 ? "1 Fahrtag" : n + " Fahrtage") + " zur Arbeit (" + zeitraum(liste[0].datum, liste[n - 1].datum) + ") " +
    "das Wetter aus dem Rückblick holen?<br><br>Dazu gehen die gerundeten Koordinaten von Wohn- und Arbeitsort" + (orte.length > 2 ? " und der Wegpunkte" : "") + " an Open-Meteo. " +
    "Wetter aus der Vorhersage wird ersetzt; empfohlene Kleidung und Rückmeldungen bleiben.", "Wetter nachtragen", "Abbrechen")) return;
  rueckblickLaeuft = true;
  zeichnen();
  const ergebnisse = new Map();
  let fehler = null;
  try {
    for (const ab of plan) {
      meldung("Rückblick " + zeitraum(ab.von, ab.bis) + " …", { dauer: 30000 });
      let orteDaten;
      try { orteDaten = vorhersageLesen(await jsonAbrufen(rueckblickUrl(orte, ab.von, ab.bis)), orte.length); }
      catch (e) { fehler = e.message; break; }
      ab.eintraege.forEach(e => ergebnisse.set(e.id, { datum: e.datum, wetter: fahrtenWetter(orteDaten, e.datum, "rueckblick", jetzt) }));
    }
  } finally {
    rueckblickLaeuft = false;
  }
  const gefunden = [...ergebnisse.values()].filter(x => x.wetter).length, ohne = ergebnisse.size - gefunden;
  if (!gefunden) {
    meldungAus();
    zeichnen();
    alert("Kein Wetter nachgetragen. " + (fehler ? "Der Rückblick ist nicht erreichbar (" + fehler + ")." : "Für diese Tage liefert der Rückblick keine Daten.") + " Deine Daten sind unverändert.");
    return;
  }
  mitRueckgaengig(() => {
    ergebnisse.forEach(({ datum, wetter: neu }, id) => {
      // Inzwischen geänderte Einträge (anderes Datum, kein Arbeitsweg mehr) bleiben, wie sie sind
      const e = daten.eintraege.find(x => x.id === id);
      if (!neu || !e || e.datum !== datum || !mitWetter(e)) return;
      ["hin", "rueck"].forEach(art => {
        const alt = e.wetter && e.wetter[art];
        if (alt && !neu[art]) neu[art] = alt;
        else if (alt && alt.kleidung) Object.assign(neu[art], { kleidung: alt.kleidung, empfehlung: alt.empfehlung, regenkleidung: alt.regenkleidung, rueckmeldung: alt.rueckmeldung });
      });
      e.wetter = neu;
    });
  }, "Wetter für " + (gefunden === 1 ? "1 Fahrtag" : gefunden + " Fahrtage") + " nachgetragen" + (ohne ? ", " + ohne + " ohne Daten" : "") +
    (fehler ? " (Rückblick abgebrochen: " + fehler + ")" : ""));
}

// Säulendiagramm (SVG): km pro Monat im Jahr "jahr" neben dem Vorjahr. Im
// laufenden Jahr bleiben die kommenden Monate leer. Antippen eines Monats
// zeigt seine Werte; die Tabelle darunter enthält alle Werte.
function monatsDiagramm(jahr, h, gewaehlt) {
  const akt = monatsSummen(jahr), vor = monatsSummen(jahr - 1);
  const bis = h.slice(0, 4) === String(jahr) ? Number(h.slice(5, 7)) : 12;
  const werte = [...vor, ...akt.slice(0, bis)];
  const legende = '<div class="legende"><span><span class="farbe jahr"></span>' + jahr + '</span>' +
    '<span><span class="farbe vorjahr"></span>' + (jahr - 1) + '</span></div>';
  if (!werte.some(v => v > 0)) return legende + '<div class="leer">Für ' + (jahr - 1) + ' und ' + jahr + ' gibt es noch keine Einträge.</div>';

  // Achse in runden Schritten (1, 2, 5 × 10ⁿ), etwa drei Gitterlinien
  const max = Math.max(...werte);
  const roh = max / 3, p = Math.pow(10, Math.floor(Math.log10(roh)));
  const schritt = [1, 2, 5, 10].map(f => f * p).find(s => s >= roh);
  const oben = Math.ceil(max / schritt) * schritt;
  // Maße im Koordinatensystem des SVG (wird auf die Kartenbreite skaliert)
  const B = 340, H = 190, L = 34, R = 2, O = 8, U = 22;
  const spalte = (B - L - R) / 12, balken = 9, luecke = 2;
  const r1 = n => Math.round(n * 10) / 10;
  const y = km => r1(O + (H - O - U) * (1 - km / oben));
  // Säule mit 4px-Rundung oben, gerade an der Grundlinie
  const saeule = (x, km, klasse) => {
    if (!(km > 0)) return "";
    const y0 = y(0), y1 = y(km), r = Math.min(4, y0 - y1);
    return '<path class="' + klasse + '" d="M' + r1(x) + ',' + y0 + 'V' + r1(y1 + r) + 'Q' + r1(x) + ',' + y1 + ' ' + r1(x + r) + ',' + y1 +
      'H' + r1(x + balken - r) + 'Q' + r1(x + balken) + ',' + y1 + ' ' + r1(x + balken) + ',' + r1(y1 + r) + 'V' + y0 + 'Z"/>';
  };

  let svg = '<svg class="diagramm" viewBox="0 0 ' + B + ' ' + H + '" role="img" aria-label="km pro Monat ' + jahr + ' und ' + (jahr - 1) + '">';
  svg += '<rect class="gewaehlt" x="' + r1(L + gewaehlt * spalte) + '" y="0" width="' + r1(spalte) + '" height="' + (H - U + 4) + '" rx="4"/>';
  for (let v = 0; v <= oben; v += schritt) {
    svg += '<line class="gitter" x1="' + L + '" x2="' + (B - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>' +
      '<text x="' + (L - 5) + '" y="' + r1(y(v) + 4) + '" text-anchor="end">' + kmText(v) + '</text>';
  }
  for (let i = 0; i < 12; i++) {
    const mitte = L + (i + 0.5) * spalte;
    svg += saeule(mitte - luecke / 2 - balken, vor[i], "vorjahr") + (i < bis ? saeule(mitte + luecke / 2, akt[i], "jahr") : "") +
      '<text x="' + r1(mitte) + '" y="' + (H - 6) + '" text-anchor="middle"' + (i === gewaehlt ? ' style="fill:var(--text);font-weight:700"' : "") + '>' +
      MONATE_KURZ[i] + '</text>' +
      '<rect class="treffer" x="' + r1(L + i * spalte) + '" y="0" width="' + r1(spalte) + '" height="' + H + '" data-action="statistik-monat" data-monat="' + i + '"' +
      ' role="button" aria-label="' + MONATE[i] + '"/>';
  }
  svg += '</svg>';

  // Werte des angetippten Monats: Wert vorn, Jahr dahinter
  const wert = (km, j, klasse) => '<span class="farbe ' + klasse + '"></span> <strong>' + (km === null ? "–" : kmText(km) + " km") + '</strong> ' + j;
  const jetzt = gewaehlt < bis ? akt[gewaehlt] : null;
  const diff = jetzt === null ? "" : runden(jetzt - vor[gewaehlt]);
  const monatswert = '<div class="monatswert"><strong>' + MONATE[gewaehlt] + '</strong><br>' +
    wert(jetzt, jahr, "jahr") + ' · ' + wert(vor[gewaehlt], jahr - 1, "vorjahr") +
    (diff === "" ? "" : ' <span class="klein">(' + (diff > 0 ? "+" : diff < 0 ? "−" : "±") + kmText(Math.abs(diff)) + ' km)</span>') + '</div>';

  // Dieselben Werte als Tabelle (aufklappbar)
  const summe = liste => runden(liste.reduce((s, v) => s + v, 0));
  const tabelle = '<button type="button" class="aufklappen" data-action="statistik-tabelle" aria-expanded="' + statistikTabelleOffen + '">' +
    CHEVRON + 'Werte als Tabelle</button>' +
    (statistikTabelleOffen ? '<table class="tabelle"><thead><tr><th>Monat</th><th>' + jahr + '</th><th>' + (jahr - 1) + '</th></tr></thead><tbody>' +
      MONATE.map((m, i) => '<tr><td>' + m + '</td><td>' + (i < bis ? kmText(akt[i]) : "–") + '</td><td>' + kmText(vor[i]) + '</td></tr>').join("") +
      '<tr class="summe-zeile"><td>Summe</td><td>' + kmText(summe(akt)) + '</td><td>' + kmText(summe(vor)) + '</td></tr></tbody></table>' : "");
  return legende + svg + monatswert + tabelle;
}

/* ---------- Vorlagen (Bereich in den Einstellungen) ---------- */
function vorlagenBereich() {

    'Änderungen an Vorlagen verändern bereits erfasste Einträge nicht; nur beim Merkmal „Arbeitsweg“ fragt die App, ob sie bisherige Einträge anpassen soll.</p>' +
    '<div class="liste">';
  if (!daten.vorlagen.length) html += '<div class="leer">Noch keine Vorlagen.</div>';
  daten.vorlagen.forEach((v, i) => {
    html += '<div class="zeile">' +
      '<button type="button" class="inhalt" data-action="vorlage-bearbeiten" data-id="' + v.id + '">' +
      '<div class="text"><div>' + esc(v.name) + '</div>' + (v.arbeitsweg ? '<div class="klein">Arbeitsweg</div>' : "") + '</div>' +
      '<span class="zahl">' + kmText(v.km) + ' km</span></button>' +
      '<div class="pfeile">' +
      '<button type="button" class="symbol" data-action="vorlage-hoch" data-id="' + v.id + '" aria-label="Nach oben"' + (i === 0 ? " disabled" : "") + '>▲</button>' +
      '<button type="button" class="symbol" data-action="vorlage-runter" data-id="' + v.id + '" aria-label="Nach unten"' + (i === daten.vorlagen.length - 1 ? " disabled" : "") + '>▼</button>' +
      '</div></div>';
  });
  html += '</div><div class="knopfreihe"><button type="button" class="primaer" data-action="vorlage-neu">+ Neue Vorlage</button></div>';
  return html;
}
function vorlageFormular(id) {
  const v = id ? daten.vorlagen.find(v => v.id === id) : { name: "", km: null, arbeitsweg: false };
  fensterOeffnen(
    '<h2>' + (id ? "Vorlage bearbeiten" : "Neue Vorlage") + '</h2>' +
    '<label for="v-name">Name</label><input type="text" id="v-name" placeholder="z. B. Arbeit hin und zurück" value="' + esc(v.name) + '">' +
    '<label for="v-km">Kilometer (Gesamt für den Tag)</label>' +
    '<input type="text" id="v-km" inputmode="decimal" placeholder="z. B. 12,5" value="' + kmFeld(v.km) + '">' +
    '<label class="haken"><input type="checkbox" id="v-arbeitsweg"' + (v.arbeitsweg ? " checked" : "") + '>' +
    '<span>Arbeitsweg<br><span class="klein">Fahrten mit dieser Vorlage zählen in der Statistik als Arbeitstage mit dem Rad.</span></span></label>' +
    '<div class="knopfreihe"><button type="button" data-action="fenster-zu">Abbrechen</button>' +
    '<button type="button" class="primaer" data-action="vorlage-speichern" data-id="' + (id || "") + '">Speichern</button></div>' +
    (id ? '<div class="knopfreihe"><button type="button" class="gefahr voll" data-action="vorlage-loeschen" data-id="' + id + '">Vorlage löschen</button></div>' : "")
  );
}
async function vorlageSpeichern(id) {
  const name = wert("v-name").trim();
  const km = kmLesen(wert("v-km"));
  const arbeitsweg = document.getElementById("v-arbeitsweg").checked;
  if (!name) { alert("Bitte einen Namen eingeben."); return; }
  if (km === null) { alert("Bitte die Kilometer als Zahl eingeben, z. B. 12,5."); return; }
  // Merkmal "Arbeitsweg" geändert: Auch bisherige Einträge mit dieser Vorlage
  // (gleicher Name wie bisher) anpassen? Ohne Zustimmung bleiben sie unverändert.
  const alt = id ? daten.vorlagen.find(v => v.id === id) : null;
  const bisherName = alt ? alt.name : name;
  const betroffen = (alt ? alt.arbeitsweg !== arbeitsweg : arbeitsweg)
    ? daten.eintraege.filter(e => e.vorlage === bisherName && e.arbeitsweg !== arbeitsweg) : [];
  let auchBisherige = false;
  if (betroffen.length) {
    const n = betroffen.length;
    auchBisherige = await frage((n === 1 ? "Den bisherigen Eintrag" : "Die " + n + " bisherigen Einträge") + " mit der Vorlage „" + esc(bisherName) + "“ " +
      (arbeitsweg ? "ebenfalls als Arbeitsweg zählen?" : "ebenfalls nicht mehr als Arbeitsweg zählen?"),
      n === 1 ? "Ja" : "Ja, alle " + n, "Nein, nur neue Einträge");
  }
  if (alt) Object.assign(alt, { name, km, arbeitsweg });
  else daten.vorlagen.push({ id: neueId(), name, km, arbeitsweg });
  if (auchBisherige) betroffen.forEach(e => { e.arbeitsweg = arbeitsweg; });
  if (speichern()) {
    fensterSchliessen(); zeichnen();
    meldung(auchBisherige ? "Vorlage gespeichert, " + (betroffen.length === 1 ? "1 Eintrag" : betroffen.length + " Einträge") + " angepasst" : "Vorlage gespeichert");
  }
}
async function vorlageLoeschen(id) {
  const v = daten.vorlagen.find(v => v.id === id);
  if (!await frage("Vorlage „" + esc(v.name) + "“ wirklich löschen? Bereits erfasste Einträge bleiben unverändert.", "Löschen", "Abbrechen", true)) return;
  mitRueckgaengig(() => { daten.vorlagen = daten.vorlagen.filter(x => x.id !== id); }, "Vorlage gelöscht");
}
function vorlageVerschieben(id, richtung) {
  const i = daten.vorlagen.findIndex(v => v.id === id);
  const j = i + richtung;
  if (j < 0 || j >= daten.vorlagen.length) return;
  [daten.vorlagen[i], daten.vorlagen[j]] = [daten.vorlagen[j], daten.vorlagen[i]];
  if (speichern()) zeichnen();
}

/* ---------- Einstellungen ---------- */
function bildEinstellungen() {
  const f = daten.fahrrad;
  const le = letzterExport();

      '<div class="knopfreihe"><button type="button" class="primaer" data-action="fahrrad-aendern">Ändern</button></div>';
  } else {
    html += '<p style="margin-top:0">Noch kein Fahrrad angelegt.</p>' +
      '<button type="button" class="primaer voll" data-action="fahrrad-aendern">Fahrrad anlegen</button>';
  }

  // Übliche Fahrtage (1 = Montag … 7 = Sonntag)
  const fahrtage = daten.einstellungen.fahrtage;
  html += '<h2>Fahrtage</h2><div class="karte"><div class="fahrtage">' +
    [1, 2, 3, 4, 5, 6, 7].map(t => '<label class="fahrtag"><input type="checkbox" value="' + t + '" data-change="fahrtag"' +
      (fahrtage.includes(t) ? " checked" : "") + '><span>' + WOCHENTAGE[t % 7] + '</span></label>').join("") +
    '</div><div class="feldhinweis">Deine üblichen Fahrtage. Die Übersicht weist auf Fahrtage der letzten 14 Tage ohne Eintrag hin, ' +
    'die Statistik zählt damit die längste Serie, und der Reiter Wetter zeigt dafür Hin- und Rückfahrt.</div>' +
    // Schalter und Uhrzeit (das Uhrzeitfeld lässt sich auf dem iPhone nicht leeren)
    '<label class="haken"><input type="checkbox" id="e-hinweis-an" data-change="hinweis-heute-an"' + (daten.einstellungen.hinweisHeuteAn ? " checked" : "") + '>' +

    '<input type="time" id="e-hinweis-ab" value="' + daten.einstellungen.hinweisHeuteAb + '" data-change="hinweis-heute-ab"' + (daten.einstellungen.hinweisHeuteAn ? "" : " disabled") + '>' +
    '<div class="feldhinweis">An: Fehlt an einem Fahrtag der Eintrag, weist die Übersicht ab dieser Uhrzeit schon am selben Tag darauf hin. Aus: erst ab dem nächsten Tag.</div></div>';

  html += wetterEinstellungen();

  // Jahresziele
  const ziele = [...daten.einstellungen.jahresziele].sort((a, b) => b.jahr - a.jahr);
  html += '<h2>Jahresziele</h2><div class="liste">';
  if (!ziele.length) html += '<div class="leer">Noch kein Jahresziel.</div>';
  ziele.forEach(z => {
    html += '<div class="zeile"><button type="button" class="inhalt" data-action="jahresziel-bearbeiten" data-jahr="' + z.jahr + '">' +
      '<div class="text"><div>' + z.jahr + '</div></div><span class="zahl" style="padding-right:16px">' + kmText(z.km) + ' km</span></button></div>';
  });
  html += '</div><div class="knopfreihe"><button type="button" data-action="jahresziel-neu">+ Jahresziel</button></div>';

  html += '<h2>Datensicherung</h2><div class="karte">' +
    '<p style="margin-top:0">Deine Daten liegen nur auf diesem Gerät im Speicher des Browsers. Sichere sie regelmäßig als Datei, z. B. in „Dateien“ oder iCloud. ' +
    'Vor dem Teilen prüft die App die Datei.</p>' +
    '<p class="klein">Letzte Sicherung: ' + (le ? datumText(le) : "noch nie") + '</p>' +
    '<button type="button" class="primaer voll" data-action="sichern">Jetzt sichern</button>' +
    sicherungsErgebnisHtml() +
    '<div style="height:10px"></div>' +
    '<button type="button" class="voll" data-action="sicherung-pruefen">Sicherung prüfen …</button>' +
    '<p class="klein">Liest eine gespeicherte Sicherung und vergleicht sie mit dem aktuellen Stand. Dabei wird nichts verändert.</p>' +
    '<button type="button" class="voll" data-action="import">Daten importieren …</button>' +
    '<p class="klein">Beim Import werden alle vorhandenen Daten ersetzt. Vorher wird nachgefragt.</p></div>' +

    '<h2>Über Rad-km</h2><div class="karte">' +
    detailListe([["App-Version", APP_VERSION], ["Datenversion", String(DATEN_VERSION)]]) + '</div>';
  return html;
}

// Schalter "Hinweis schon am selben Tag": sofort speichern; die Uhrzeit ist nur bei "an" bedienbar
function hinweisHeuteAnGeaendert(an) {

function fahrtageGeaendert() {

function jahreszielSpeichern(altesJahr) {
  const jahr = Number(wert("z-jahr").trim());
  const km = kmLesen(wert("z-km"));
  if (!(Number.isInteger(jahr) && jahr >= 1900 && jahr <= 9999)) { alert("Bitte eine Jahreszahl eingeben, z. B. 2027."); return; }

  if (ziele.some(z => z.jahr === jahr)) { alert("Für " + jahr + " gibt es schon ein Jahresziel. Bitte dieses ändern."); return; }

  daten.einstellungen.jahresziele = ziele.sort((a, b) => a.jahr - b.jahr);

  daten.einstellungen.jahresziele = daten.einstellungen.jahresziele.filter(z => z.jahr !== jahr);

}

/* =====================================================================
   8. DATENSICHERUNG: Export, Prüfung, Import
   Nichts in diesem Abschnitt verändert die Daten der App – außer dem
   Import nach ausdrücklicher Bestätigung. Eine erfolgreiche Sicherung
   setzt nur das Datum der letzten Sicherung (eigener Speicherplatz).
   ===================================================================== */

function exportVermerken() {
  try { localStorage.setItem(EXPORT_SCHLUESSEL, heute()); } catch (e) {}
}

// Kurzinfo am Anfang der Exportdatei
function kurzinfoFuer(d, zeitpunkt) {
  const f = d.fahrrad;
  return {
    zeitpunkt,
    appVersion: APP_VERSION,
    eintraege: d.eintraege.length,
    kmSumme: runden(d.eintraege.reduce((s, e) => s + e.km, 0)),
    kmStand: f ? runden(f.startKm + d.eintraege.filter(e => e.datum >= f.startdatum).reduce((s, e) => s + e.km, 0)) : null,
    wartungen: d.auftraege.filter(a => a.status === "erledigt").length,
    maengel: d.maengel.length
  };
}
// "412 Einträge, 7.380,4 km"
function inhaltText(ki) {
  return (ki.eintraege === 1 ? "1 Eintrag" : ki.eintraege + " Einträge") + ", " + kmText(ki.kmSumme) + " km";
}

function exportInhalt(zeitpunkt = new Date().toISOString()) {
  const { version, ...rest } = daten;
  return JSON.stringify(Object.assign({ version: DATEN_VERSION, kurzinfo: kurzinfoFuer(daten, zeitpunkt) }, rest), null, 2);
}

// ---------- Vergleich einer Sicherung mit dem aktuellen Stand ----------

// Gleicher Inhalt, unabhängig von der Reihenfolge der Felder
function kanonisch(x) {
  if (Array.isArray(x)) return x.map(kanonisch);
  if (x && typeof x === "object") return Object.keys(x).sort().reduce((o, k) => { o[k] = kanonisch(x[k]); return o; }, {});
  return x;
}
function gleicherInhalt(a, b) { return JSON.stringify(kanonisch(a)) === JSON.stringify(kanonisch(b)); }

// Je Liste: fehlen = nur im aktuellen Stand (neuer als die Sicherung),
// nurSicherung = nur in der Sicherung, geaendert = in beiden, aber verschieden.
// Einträge werden über das Datum zugeordnet, alles andere über die Kennung.
// Berechnete Kilometerstände erledigter Aufträge zählen nicht als Unterschied.
function datenVergleichen(sicherung, aktuell) {
  const liste = (alt, neu, schluessel, inhalt = x => x) => {
    const a = new Map(alt.map(x => [schluessel(x), x])), n = new Map(neu.map(x => [schluessel(x), x]));
    return {
      fehlen: [...n.keys()].filter(k => !a.has(k)),
      nurSicherung: [...a.keys()].filter(k => !n.has(k)),
      geaendert: [...n.keys()].filter(k => a.has(k) && !gleicherInhalt(inhalt(a.get(k)), inhalt(n.get(k))))
    };
  };
  const nachId = x => x.id;
  const ohneId = ({ id, ...rest }) => rest;
  const ohneBerechnetenKm = a => Object.assign({}, a, { kmStand: a.kmManuell ? a.kmStand : null });
  const gemeinsameReihenfolge = (x, y) => x.map(nachId).filter(id => y.some(v => v.id === id));
  const vorlagen = liste(sicherung.vorlagen, aktuell.vorlagen, nachId);
  vorlagen.reihenfolge = !gleicherInhalt(gemeinsameReihenfolge(sicherung.vorlagen, aktuell.vorlagen), gemeinsameReihenfolge(aktuell.vorlagen, sicherung.vorlagen));
  return {
    eintraege: liste(sicherung.eintraege, aktuell.eintraege, e => e.datum, ohneId),
    vorlagen,
    wartungsarten: liste(sicherung.wartungsarten, aktuell.wartungsarten, nachId),
    auftraege: liste(sicherung.auftraege, aktuell.auftraege, nachId, ohneBerechnetenKm),
    maengel: liste(sicherung.maengel, aktuell.maengel, nachId),
    fahrrad: !gleicherInhalt(sicherung.fahrrad, aktuell.fahrrad),
    einstellungen: !gleicherInhalt(sicherung.einstellungen, aktuell.einstellungen)
  };
}

// Datumswerte als kurze Bereiche: "25.–27.10., 30.10.–02.11."; das Jahr nur,
// wenn es nicht das laufende ist. Mehr als "max" Bereiche werden mit "…" gekürzt.
function datumsBereiche(liste, h, max = 4) {
  const bereiche = [];
  [...liste].sort().forEach(d => {
    const b = bereiche[bereiche.length - 1];
    if (b && plusTage(b[1], 1) === d) b[1] = d; else bereiche.push([d, d]);
  });
  const jahr = h.slice(0, 4);
  const text = ([von, bis]) => {
    const mitJahr = von.slice(0, 4) !== jahr || bis.slice(0, 4) !== jahr;
    const t = iso => mitJahr ? datumText(iso) : kurzDatum(iso);
    if (von === bis) return t(von);
    if (von.slice(0, 7) === bis.slice(0, 7)) return von.slice(8) + ".–" + t(bis);
    if (von.slice(0, 4) === bis.slice(0, 4)) return kurzDatum(von) + "–" + t(bis);
    return t(von) + "–" + t(bis);
  };
  const teile = bereiche.slice(0, max).map(text);
  if (bereiche.length > max) teile.push("…");
  return teile.join(", ");
}

const VERGLEICH_BEZEICHNUNG = {
  eintraege: ["Eintrag", "Einträge"],
  auftraege: ["Auftrag", "Aufträge"],
  maengel: ["Mangel", "Mängel"],
  vorlagen: ["Vorlage", "Vorlagen"],
  wartungsarten: ["Wartungsart", "Wartungsarten"]
};
// Unterschiede als Text: "fehlen" (nur Neues seit der Sicherung) und "sonst"
function unterschiedTexte(v, h) {
  const fehlen = [], sonst = [];
  Object.keys(VERGLEICH_BEZEICHNUNG).forEach(k => {
    const [einzahl, mehrzahl] = VERGLEICH_BEZEICHNUNG[k];
    const anzahl = n => n + " " + (n === 1 ? einzahl : mehrzahl);
    const tage = liste => k === "eintraege" ? " (" + datumsBereiche(liste, h) + ")" : "";
    const x = v[k];
    if (x.fehlen.length) fehlen.push(anzahl(x.fehlen.length) + (x.fehlen.length === 1 ? " fehlt" : " fehlen") + tage(x.fehlen));
    if (x.nurSicherung.length) sonst.push(anzahl(x.nurSicherung.length) + " nur in der Sicherung" + tage(x.nurSicherung));
    if (x.geaendert.length) sonst.push(anzahl(x.geaendert.length) + " geändert" + tage(x.geaendert));
  });
  if (v.vorlagen.reihenfolge) sonst.push("Reihenfolge der Vorlagen geändert");
  if (v.fahrrad) sonst.push("Angaben zum Fahrrad geändert");
  if (v.einstellungen) sonst.push("Einstellungen geändert");
  return { fehlen, sonst };
}

// Wertet den Text einer Sicherung aus: Prüfung mit denselben Regeln wie beim
// Import, Vergleich mit "aktuell" und Abgleich der Kurzinfo. Verändert nichts.
//   status: "identisch" | "aelter" | "abweichend" | "defekt"
//   kurzinfoPasst: true / false, null = Datei ohne Kurzinfo (ältere Sicherung)
//   identischStreng: Inhalt einschließlich aller Kennungen gleich
function sicherungAuswerten(text, aktuell, h = heute()) {
  let gelesen, roh;
  try {
    gelesen = datenEinlesen(text);
    roh = JSON.parse(text);
  } catch (e) {
    return { status: "defekt", titel: "Datei beschädigt bzw. keine Rad-km-Sicherung", details: [e.message], kurzinfo: null, kurzinfoPasst: null, identischStreng: false };
  }
  const ki = roh.kurzinfo && typeof roh.kurzinfo === "object" && !Array.isArray(roh.kurzinfo) ? roh.kurzinfo : null;
  const soll = kurzinfoFuer(gelesen, null);
  // Bis Version 7 zählte "wartungen" die Einträge im Wartungsprotokoll
  if (roh.version < 8) soll.wartungen = Array.isArray(roh.wartungsprotokoll) ? roh.wartungsprotokoll.length : 0;
  const kurzinfoPasst = roh.kurzinfo === undefined ? null
    : !!ki && ["eintraege", "kmSumme", "kmStand", "wartungen", "maengel"].every(k => ki[k] === soll[k]);
  const erg = { gelesen, kurzinfo: ki, kurzinfoPasst, inhalt: soll, details: [], identischStreng: gleicherInhalt(gelesen, aktuell) };
  const u = unterschiedTexte(datenVergleichen(gelesen, aktuell), h);
  if (!u.fehlen.length && !u.sonst.length) {
    erg.status = "identisch"; erg.titel = "Identisch mit dem aktuellen Stand";
  } else if (!u.sonst.length) {
    erg.status = "aelter"; erg.titel = "Sicherung ist älter: " + u.fehlen.join(", ");
  } else {
    erg.status = "abweichend"; erg.titel = "Sicherung weicht vom aktuellen Stand ab"; erg.details = [...u.fehlen, ...u.sonst];
  }
  return erg;
}

// ---------- Sichern ----------

let sicherungLaeuft = false;
// Ergebnis der letzten erfolgreichen Sicherung (nur solange die App geöffnet ist)
let sicherungsErgebnis = null;
// Bereits geprüfte Sicherung, falls das Teilen-Menü einen zweiten Tipper braucht
let geprueftZumTeilen = null;

// "rad-km-2026-10-25-1403.json" – mit Uhrzeit, damit mehrere Sicherungen am selben Tag eindeutig sind
function sicherungsDateiname(jetzt) {
  return "rad-km-" + isoAusDate(jetzt) + "-" + zweistellig(jetzt.getHours()) + zweistellig(jetzt.getMinutes()) + ".json";
}

// Erzeugt die Exportdatei und prüft sie, bevor sie geteilt wird: Die Datei
// wird wieder eingelesen, mit den Import-Regeln geprüft und mit dem aktuellen
// Stand verglichen. Wirft einen Fehler, wenn etwas nicht stimmt.
async function sicherungVorbereiten() {
  const dateiname = sicherungsDateiname(new Date());
  const inhalt = exportInhalt();
  let datei;
  try { datei = new File([inhalt], dateiname, { type: "application/json" }); }
  catch (e) { datei = new Blob([inhalt], { type: "application/json" }); }
  let text;
  try { text = await dateiLesen(datei); }
  catch (e) { throw new Error("Die Exportdatei konnte nicht wieder gelesen werden."); }
  const erg = sicherungAuswerten(text, daten);
  if (erg.status === "defekt") throw new Error("Die Exportdatei ist fehlerhaft: " + erg.details.join(" "));
  if (!erg.identischStreng) {
    const was = erg.status === "aelter" ? [erg.titel] : erg.details;
    throw new Error("Die Exportdatei stimmt nicht mit dem aktuellen Stand überein" + (was.length ? ": " + was.join(", ") + "." : " (interne Kennungen)."));
  }
  if (erg.kurzinfoPasst !== true) throw new Error("Die Kurzinfo der Exportdatei passt nicht zum Inhalt.");
  return { datei, dateiname, inhalt, kurzinfo: erg.kurzinfo };
}

// "Jetzt sichern": prüfen, dann teilen (iPhone) oder herunterladen
async function jetztSichern() {
  if (sicherungLaeuft) return;
  sicherungLaeuft = true;
  try {
    let s;
    try {
      s = await sicherungVorbereiten();
    } catch (e) {
      alert("Die Sicherung wurde nicht erstellt, weil die Prüfung der Exportdatei fehlgeschlagen ist:\n" + e.message +
        "\n\nDeine Daten in der App sind unverändert.");
      return;
    }
    await sicherungTeilen(s);
  } finally {
    sicherungLaeuft = false;
  }
}

// Teilen-Menü bzw. Download einer geprüften Sicherung. Erst nach dem Abschluss
// wird das Datum der letzten Sicherung gesetzt; die Daten bleiben unberührt.
// navigator.share wird ohne vorheriges "await" aufgerufen (iPhone).
async function sicherungTeilen(s) {
  if (navigator.canShare && navigator.canShare({ files: [s.datei] })) {
    try {
      // Nur die Datei: Mit Titel oder Text legt "In Dateien sichern" zusätzlich eine Textdatei an
      await navigator.share({ files: [s.datei] });
    } catch (err) {
      if (err && err.name === "AbortError") { meldung("Sicherung abgebrochen"); return; }
      // Das iPhone öffnet das Teilen-Menü nur direkt nach einem Tipper
      if (err && err.name === "NotAllowedError" && !s.zweiterVersuch) { teilenNachfragen(s); return; }
      herunterladen(s.inhalt, s.dateiname);
      sicherungFertig(s, "heruntergeladen");
      return;
    }
    sicherungFertig(s, "übergeben");
  } else {
    herunterladen(s.inhalt, s.dateiname);
    sicherungFertig(s, "heruntergeladen");
  }
}
function teilenNachfragen(s) {
  geprueftZumTeilen = Object.assign({}, s, { zweiterVersuch: true });
  fensterOeffnen('<h2>Sicherung geprüft</h2>' +
    '<p>Die Exportdatei ist geprüft: ' + inhaltText(s.kurzinfo) + '. Tippe auf „Teilen …“, um sie z. B. in „Dateien“ zu speichern.</p>' +
    '<div class="knopfreihe"><button type="button" data-action="fenster-zu">Abbrechen</button>' +
    '<button type="button" class="primaer" data-action="sicherung-teilen">Teilen …</button></div>');
}
function sicherungFertig(s, wie) {
  exportVermerken();
  sicherungsErgebnis = { wie, kurzinfo: s.kurzinfo };
  zeichnen();
  meldung("Sicherung " + wie + " – Inhalt geprüft: " + inhaltText(s.kurzinfo), { dauer: 4000 });
}
function herunterladen(inhalt, dateiname) {
  const url = URL.createObjectURL(new Blob([inhalt], { type: "application/json" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = dateiname;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

// ---------- Sicherung prüfen (liest nur, überschreibt nichts) ----------

function sicherungPruefenStarten() {
  const eingabe = document.getElementById("pruefdatei");
  eingabe.value = "";
  eingabe.click();
}
async function pruefDateiGewaehlt(datei) {
  if (!datei) return;
  let erg;
  try {
    erg = sicherungAuswerten(await dateiLesen(datei), daten);
  } catch (e) {
    erg = { status: "defekt", titel: "Datei beschädigt bzw. keine Rad-km-Sicherung", details: ["Die Datei konnte nicht gelesen werden."] };
  }
  pruefErgebnisAnzeigen(datei.name, erg);
}
function zeitpunktText(iso) {
  const d = typeof iso === "string" ? new Date(iso) : null;
  if (!d || isNaN(d)) return null;
  return datumText(isoAusDate(d)) + ", " + zweistellig(d.getHours()) + ":" + zweistellig(d.getMinutes()) + " Uhr";
}
function pruefErgebnisAnzeigen(name, erg) {
  const klasse = { identisch: "status-gruen", aelter: "status-orange", abweichend: "status-orange", defekt: "status-rot" }[erg.status];
  const zeichen = { identisch: "✓", aelter: "⚠️", abweichend: "⚠️", defekt: "✗" }[erg.status];
  let html = '<h2>Sicherung prüfen</h2><p class="klein" style="overflow-wrap:anywhere">' + esc(name) + '</p>' +
    '<p class="' + klasse + '">' + zeichen + " " + esc(erg.titel) + '</p>' +
    (erg.details.length ? '<ul>' + erg.details.map(d => '<li>' + esc(d) + '</li>').join("") + '</ul>' : "");
  if (erg.status !== "defekt") {
    const i = erg.inhalt;
    const wann = erg.kurzinfo && zeitpunktText(erg.kurzinfo.zeitpunkt);
    html += detailListe([
      ["Gesichert am", wann ? esc(wann) + (erg.kurzinfo.appVersion ? " (App-Version " + esc(erg.kurzinfo.appVersion) + ")" : "") : "unbekannt (Sicherung ohne Kurzinfo)"],
      ["Inhalt der Sicherung", inhaltText(i) + ", " + (i.wartungen === 1 ? "1 Wartung" : i.wartungen + " Wartungen") + ", " +
        (i.maengel === 1 ? "1 Mangel" : i.maengel + " Mängel") + (i.kmStand !== null ? "<br>Kilometerstand " + kmText(i.kmStand) + " km" : "")]
    ]);
    if (erg.kurzinfoPasst === false) {
      html += '<p class="status-orange">⚠️ Die Kurzinfo passt nicht zum Inhalt – die Datei wurde nachträglich verändert oder ist unvollständig.</p>';
    }
  }
  html += '<p class="klein">Die Datei wurde nur gelesen. In der App wurde nichts verändert.</p>' +
    '<div class="knopfreihe"><button type="button" class="primaer" data-action="fenster-zu">Schließen</button></div>';
  fensterOeffnen(html);
}

// ---------- Import ----------

function importStarten() {
  const eingabe = document.getElementById("importdatei");
  eingabe.value = "";
  eingabe.click();
}
async function importDateiGewaehlt(datei) {
  if (!datei) return;
  let neu, roh;
  try {
    const text = await dateiLesen(datei);
    neu = datenEinlesen(text);
    roh = JSON.parse(text);
  } catch (e) {
    alert("Import nicht möglich:\n" + e.message);
    return;
  }
  const wann = roh.kurzinfo && zeitpunktText(roh.kurzinfo.zeitpunkt);
  const ziele = neu.einstellungen.jahresziele.length;
  const zusammenfassung =
    "<strong>" + esc(datei.name) + "</strong><br>" +
    (wann ? "Gesichert am " + esc(wann) + "<br>" : "") +
    "Fahrrad: " + (neu.fahrrad ? esc(neu.fahrrad.name) : "–") + "<br>" +
    neu.eintraege.length + " Einträge, " + neu.vorlagen.length + " Vorlagen, " +
    neu.wartungsarten.length + " Wartungsarten, " + auftraegeText(neu.auftraege) + ", " + neu.maengel.length + " Mängel" +
    (neu.maengel.length ? " (davon " + neu.maengel.filter(m => m.status === "offen").length + " offen)" : "") +
    (ziele ? ", " + (ziele === 1 ? "1 Jahresziel" : ziele + " Jahresziele") : "") + ".<br><br>" +
    "<strong>Alle vorhandenen Daten in der App werden ersetzt.</strong> Fortfahren?";
  if (!await frage(zusammenfassung, "Importieren und ersetzen", "Abbrechen", true)) return;
  daten = neu;
  ladeFehler = null;
  sicherungsErgebnis = null;
  if (roh.version < 8) pruefungVormerken(true);
  if (speichern()) { zeichnen(); meldung("Import erfolgreich"); }
}

/* =====================================================================
   10. OFFLINE UND NEUE VERSIONEN
   Der Service Worker (sw.js) hält die App für den Start ohne Netz bereit und
   meldet neue Versionen. Er speichert nur die App, nie die Daten.
   ===================================================================== */

let neueVersion = false;
let letzteUpdatePruefung = 0;
const UPDATE_PRUEFEN_MS = 10 * 60 * 1000;
const swVerfuegbar = () => !TESTMODUS && "serviceWorker" in navigator;

function serviceWorkerStarten() {
  if (!swVerfuegbar()) return;
  navigator.serviceWorker.addEventListener("message", ev => swNachricht(ev.data));
  navigator.serviceWorker.register("sw.js").then(() => updatePruefen(), () => {});
}
// Fragt den Service Worker nach einer neuen Version (beim Start und beim
// Zurückkehren in die App, höchstens alle 10 Minuten)
function updatePruefen() {
  if (!swVerfuegbar() || Date.now() - letzteUpdatePruefung < UPDATE_PRUEFEN_MS) return;
  letzteUpdatePruefung = Date.now();
  navigator.serviceWorker.ready.then(reg => { if (reg.active) reg.active.postMessage({ typ: "update-pruefen" }); });
}
function swNachricht(nachricht) {
  const typ = nachricht && nachricht.typ;
  if (typ === "neue-version" && !neueVersion) { neueVersion = true; zeichnen(); }
  if (typ === "aktiviert") location.reload();
}
// "Neu laden": neue Version übernehmen, dann neu laden. Alle Daten sind
// schon gespeichert, der localStorage bleibt unverändert.
function neuLaden() {
  if (!swVerfuegbar()) { location.reload(); return; }
  navigator.serviceWorker.ready.then(reg => {
    if (reg.active) reg.active.postMessage({ typ: "aktivieren" });
    setTimeout(() => location.reload(), 3000); // falls keine Antwort kommt
  });
}
